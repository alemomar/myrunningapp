<!-- Faux Supabase installé AVANT lecture.js : il note chaque appel, y compris toute tentative d'écriture. -->
<script>
window.__appels = [];
(function () {
  const note = (x) => window.__appels.push(x);
  function constructeur(table) {
    const b = {
      select(c) { note(`lecture ${table} (${c})`); return b; }, order() { return b; }, maybeSingle() { note(`un seul ${table}`); return b; },
      eq() { return b; }, then(ok) { return Promise.resolve({ data: [], error: null }).then(ok); },
    };
    ["insert", "update", "upsert", "delete"].forEach((m) => { b[m] = () => { note(`ÉCRITURE ${m} ${table}`); return b; }; });
    return b;
  }
  const client = {
    from: (t) => constructeur(t),
    rpc: (f) => { note(`ÉCRITURE rpc ${f}`); return Promise.resolve({}); },
    auth: {
      signInWithPassword: (x) => { note(`connexion ${x.email}`); return Promise.resolve({ data: { session: { user: { email: x.email } } }, error: null }); },
      signOut: (o) => { note(`déconnexion ${JSON.stringify(o || {})}`); return Promise.resolve({}); },
      getSession: () => Promise.resolve({ data: { session: null } }),
    },
  };
  window.supabase = { createClient: () => { note("client créé"); return client; } };
})();
</script>
<script src="../config.js"></script>
<script src="../logic.js?v=113"></script>
<script src="reglages.js?v=11"></script>
<script src="lecture.js?v=1"></script>
<script src="calculs.js?v=14"></script>
<script src="conseil.js?v=3"></script>
<script>
(async () => {
  const res = [];
  const ok = (cond, nom) => res.push({ ok: !!cond, nom });
  const JOUR = 86400000, NOW = Date.parse("2026-10-26T12:00:00");
  const iso = (ts) => new Date(ts).toISOString();

  /* ---------- 1 · Lecture seule ---------- */
  ok(Object.isFrozen(Lecture), "Lecture : objet figé (on ne peut rien lui ajouter)");
  ok(JSON.stringify(Object.keys(Lecture).sort()) === JSON.stringify(["connexion", "deconnexion", "lire", "session", "tables"]),
    "Lecture : n'expose que connexion, déconnexion, session, lire et la liste des tables");
  ok(["insert", "update", "upsert", "delete", "rpc", "from", "client", "storage", "functions"].every((k) => !(k in Lecture)), "Lecture : aucune fonction d'écriture ni accès au client");
  await Lecture.lire("runs", "id,start_date", { trierPar: "start_date" });
  await Lecture.lire("profiles", "pseudo", { unSeul: true });
  const refus = await Lecture.lire("planned_sessions", "*");
  ok(refus.error && /non lisible/.test(refus.error.message), "Lecture : une autre table que runs et profiles est refusée");
  const rendu = await Lecture.lire("runs", "id");
  ok(rendu && !("then" in rendu) && !("insert" in rendu) && !("update" in rendu), "Lecture : renvoie des données, jamais une requête qu'on pourrait prolonger");
  await Lecture.connexion("test@exemple.fr", "x");
  await Lecture.deconnexion();
  await Lecture.session();
  ok(window.__appels.every((a) => !/^ÉCRITURE/.test(a)), "Aucun appel d'écriture parmi " + window.__appels.length + " appels : " + window.__appels.join(" · "));
  ok(window.__appels.includes('déconnexion {"scope":"local"}'), "Déconnexion limitée à ce téléphone (scope local), jamais tous les appareils");
  // Recherche dans tout le code du prototype : aucune fonction d'écriture de Supabase, et seul lecture.js crée le client.
  const fichiers = ["index.html", "reglages.js", "lecture.js", "calculs.js", "app.js", "conseil.js", "composants.js"];
  const textes = await Promise.all(fichiers.map((f) => fetch(f + "?t=" + Date.now()).then((r) => r.text())));
  const ecriture = /\.(insert|update|upsert|delete|rpc)\s*\(|functions\.invoke|storage\.from|resetPassword|updateUser/;
  fichiers.forEach((f, i) => ok(!ecriture.test(textes[i].replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "")), `${f} : aucune instruction d'écriture`));
  fichiers.forEach((f, i) => { if (f !== "lecture.js") ok(!/createClient|window\.supabase/.test(textes[i].replace(/<script src=[^>]+><\/script>/g, "")), `${f} : ne crée pas de client Supabase`); });
  ok(/storageKey:\s*"mra-proto-auth"/.test(textes[2]), "Connexion rangée à part de celle de l'app (clé mra-proto-auth)");

  /* ---------- 2 · Calculs ---------- */
  const serie = (dur, pas, f) => { const a = []; for (let t = pas; t <= dur; t += pas) a.push(f(t)); return a; };
  const sortie = (o) => Calc.versSortie({ id: o.id, start_date: iso(o.ts), type: o.type || "EF", apple_type: "Running", distance_km: o.km, duration_sec: Math.round(o.km * o.pace),
    avg_hr: o.fc || null, peak_hr: o.fcMax || null, avg_cadence: o.cad || null, pain_ratings: o.rpe != null ? { rpe: o.rpe } : null, include_in_stats: true,
    hr_series: o.hrPas ? serie(Math.round(o.km * o.pace), o.hrPas, (t) => ({ t, hr: o.fc })) : null, pace_series: o.paceSerie || null });
  // Cœur fiable
  ok(Calc.coeurFiable(sortie({ id: "a", ts: NOW, km: 8, pace: 365, fc: 150, hrPas: 5 })), "Cœur fiable : une mesure toutes les 5 s");
  ok(!Calc.coeurFiable(sortie({ id: "b", ts: NOW, km: 8, pace: 365, fc: 150, hrPas: 60 })), "Cœur pas fiable : une mesure par minute");
  // Verdict avec cœur
  const hab = [1, 2, 3].map((i) => sortie({ id: "h" + i, ts: NOW - i * 7 * JOUR, km: 8, pace: 365, fc: 151, hrPas: 5 }));
  const v1 = Calc.verdict(sortie({ id: "x1", ts: NOW, km: 8.2, pace: 365, fc: 146, hrPas: 5 }), hab, {});
  ok(v1.cle === "facile" && /5 battements de moins/.test(v1.phrase) && v1.base === "coeur", "Verdict cœur : 5 battements sous l'habitude → plus facile (" + v1.phrase + ")");
  ok(Calc.verdict(sortie({ id: "x2", ts: NOW, km: 8, pace: 365, fc: 155, hrPas: 5 }), hab, {}).cle === "dure", "Verdict cœur : 4 battements au-dessus → plus dure");
  ok(Calc.verdict(sortie({ id: "x3", ts: NOW, km: 8, pace: 368, fc: 150, hrPas: 5 }), hab, {}).cle === "moyenne", "Verdict cœur : 1 battement d'écart → dans ta moyenne");
  ok(Calc.verdict(sortie({ id: "x4", ts: NOW, km: 8, pace: 365, fc: 150, hrPas: 5 }), [hab[0]], {}).cle === "moyenne", "Bilan : une seule sortie comparable suffit (toujours un bilan)");
  const prem = Calc.verdict(sortie({ id: "x6", ts: NOW, km: 8, pace: 365, fc: 150, hrPas: 5 }), [], {});
  ok(prem.cle === "premiere" && /point de départ/.test(prem.phrase), "Bilan : rien à comparer sur 12 semaines → « Ta première sortie de ce type »");
  ok(Calc.verdict(sortie({ id: "x7", ts: NOW, km: 8, pace: 365, fc: 146, hrPas: 5 }), [sortie({ id: "x8", ts: NOW - 9 * 7 * JOUR, km: 8, pace: 365, fc: 151, hrPas: 5 })], {}).cle === "facile", "Bilan : la fenêtre s'élargit à 12 semaines s'il le faut");
  const vieille = sortie({ id: "v", ts: NOW - 50 * JOUR, km: 8, pace: 365, fc: 151, hrPas: 5 });
  ok(Calc.habitude(sortie({ id: "x5", ts: NOW, km: 8, pace: 365 }), [...hab, vieille], REGLAGES).length === 3, "Habitude : 6 semaines seulement, sortie du jour exclue");
  // Verdict sans cœur fiable
  const habR = [1, 2, 3].map((i) => sortie({ id: "r" + i, ts: NOW - i * 7 * JOUR, km: 8, pace: 370, rpe: 5 }));
  ok(Calc.verdict(sortie({ id: "y1", ts: NOW, km: 8, pace: 372, rpe: 3 }), habR, {}).cle === "facile", "Verdict ressenti : même allure, 2 points de moins → plus facile");
  ok(Calc.verdict(sortie({ id: "y2", ts: NOW, km: 8, pace: 372, rpe: 7 }), habR, {}).cle === "dure", "Verdict ressenti : même allure, 2 points de plus → plus dure");
  ok(Calc.verdict(sortie({ id: "y3", ts: NOW, km: 8, pace: 372 }), habR, { y3: 3 }).cle === "facile", "Verdict ressenti : le ressenti noté dans le prototype compte");
  const habA = [1, 2, 3].map((i) => sortie({ id: "z" + i, ts: NOW - i * 7 * JOUR, km: 8, pace: 370 }));
  ok(Calc.verdict(sortie({ id: "y4", ts: NOW, km: 8, pace: 355 }), habA, {}).cle === "rapide", "Verdict allure seule : 15 s/km plus vite → plus rapide que d'habitude");
  ok(Calc.verdict(sortie({ id: "y5", ts: NOW, km: 8, pace: 385 }), habA, {}).cle === "lente", "Verdict allure seule : 15 s/km plus lent → plus lente que d'habitude");
  const part = Calc.verdict(sortie({ id: "y6", ts: NOW, km: 8, pace: 372, fc: 150, hrPas: 120, rpe: 3 }), habR, {});
  ok(part.base === "ressenti" && /partielles/.test(part.note || ""), "Cœur partiel : verdict sur l'allure et le ressenti, avec la phrase « Données cardio partielles »");
  // Zones d'allure
  const profil = { program_settings: { refDistanceKm: 10, refTimeSec: 3000, refDate: "2026-09-15", refSource: "chrono" } };
  const z = Calc.zonesAllure(profil, [], NOW);
  ok(z && z.bornes.every((b, i) => i === 0 || b < z.bornes[i - 1]) && /chrono/.test(z.source), "Zones : 5 zones de la plus lente à la plus rapide, tirées du chrono (" + z.bornes.map((b) => fmtKmPace(b)).join(" · ") + ")");
  ok(Calc.zoneDe(z.bornes[0] + 5, z) === 0 && Calc.zoneDe(z.bornes[3] - 5, z) === 4, "Zones : une allure très lente = Récupération, très rapide = Rapide");
  // Découpage : 1 km d'échauffement, 4 km faciles, 1,5 km au tempo, 1,2 km faciles
  const allures = [[1000, z.bornes[0] + 15], [4000, (z.bornes[0] + z.bornes[1]) / 2], [1500, (z.bornes[1] + z.bornes[2]) / 2], [1200, (z.bornes[0] + z.bornes[1]) / 2]];
  const ps = []; let t = 0;
  allures.forEach(([m, p]) => { const dur = m * p / 1000; for (let u = 5; u <= dur; u += 5) ps.push({ t: Math.round(t + u), pace: Math.round(p) }); t += dur; });
  const kmTot = allures.reduce((a, x) => a + x[0], 0) / 1000;
  const sd = Calc.versSortie({ id: "d", start_date: iso(NOW), type: "EF", distance_km: kmTot, duration_sec: Math.round(t), pace_series: ps, include_in_stats: true });
  const dec = Calc.decoupage(sd, z);
  ok(dec && dec.segments.length === 4, "Découpage : 4 segments (" + (dec ? dec.texte : "aucun") + ")");
  ok(dec && dec.segments[0].role === "echauffement" && dec.segments[3].role === null, "Découpage : échauffement au début ; une EF qui finit facile garde « faciles »");
  ok(dec && /reste classée « facile »/.test(dec.commentaire) && /au 6e km/.test(dec.commentaire), "Découpage : une EF avec des km rapides reste une EF, km rapides signalés (" + (dec ? dec.commentaire : "") + ")");
  ok(dec && Math.abs(dec.soutenuM - 1500) < 120, "Découpage : environ 1,5 km en soutenu");
  ok(Calc.libelleType({ type: "Seuil" }, { tempsParZone: [0, 0, 100, 300, 0] }) === "Seuil" && Calc.libelleType({ type: "Seuil" }, { tempsParZone: [0, 0, 300, 100, 0] }) === "Tempo", "Type : séance « Seuil » de l'app classée Tempo ou Seuil selon la zone dominante");
  ok(Calc.decoupage(sortie({ id: "n", ts: NOW, km: 8, pace: 365 }), z) === null, "Découpage : rien sans allure détaillée");
  // Évolution sur cette distance
  const anciennes = [sortie({ id: "e1", ts: NOW - 8 * 7 * JOUR, km: 8, pace: 380 }), sortie({ id: "e2", ts: NOW - 9 * 7 * JOUR, km: 8.4, pace: 380 }), sortie({ id: "e3", ts: NOW - 2 * 7 * JOUR, km: 8, pace: 300 })];
  const ev = Calc.evolution(sortie({ id: "e", ts: NOW, km: 8.2, pace: 364 }), anciennes);
  ok(ev.ecart === 16 && ev.n === 2 && /16 s\/km plus vite/.test(ev.texte), "Évolution : 16 s/km plus vite qu'il y a 2 mois, sur les sorties de 6 à 10 semaines (" + ev.texte + ")");
  ok(Calc.evolution(sortie({ id: "f", ts: NOW, km: 21, pace: 364 }), anciennes).ecart === null, "Évolution : rien sans sortie de distance proche");
  // Ressenti face à la mesure
  ok(/les deux disent que tu progresses/.test(Calc.ressentiFaceMesure({ id: "q", rpe: 2 }, { cle: "facile", base: "coeur" }, {})), "Ressenti face à la mesure : facile + cœur plus bas → « les deux disent que tu progresses »");
  ok(/6\/10 et un cœur plus haut que d'habitude : les deux parlent de fatigue/.test(Calc.ressentiFaceMesure({ id: "q2", rpe: 6, type: "EF" }, { cle: "dure", base: "coeur" }, {})), "Ressenti face à la mesure (V2) : 6/10 « Soutenu » sur une sortie facile plus dure → fatigue, jamais « cœur dans ta moyenne »");
  // Ta semaine (lundi 26/10 : la semaine commence aujourd'hui)
  const sem = Calc.semaine([sortie({ id: "s1", ts: NOW - 2 * JOUR, km: 8, pace: 365 }), sortie({ id: "s2", ts: NOW - 1 * 3600000, km: 5, pace: 365 })], NOW, null);
  ok(sem.cette.n === 1 && sem.derniere.n === 1, "Ta semaine : la semaine commence le lundi");
  // Repère
  const rp = Calc.repere([sortie({ id: "p1", ts: NOW - 3 * JOUR, km: 8, pace: 365, fc: 150, hrPas: 5 })], NOW);
  ok(rp.etat === "bientot" && rp.manque === 2, "Repère : « bientôt » tant qu'il n'y a pas 3 sorties faciles sur 4 semaines");
  const fac = [3, 8, 15].map((d, i) => sortie({ id: "pa" + i, ts: NOW - d * JOUR, km: 8, pace: 360, fc: 150, hrPas: 5 }))
    .concat([95, 100, 110].map((d, i) => sortie({ id: "pb" + i, ts: NOW - d * JOUR, km: 8, pace: 370, fc: 150, hrPas: 5 })));
  const rp2 = Calc.repere(fac, NOW);
  ok(rp2.etat === "valeur" && rp2.valeur === 360 && rp2.ecart === 10, "Repère : allure à effort égal 6'00, 10 s de mieux qu'il y a 3 mois");

  // Bilan sur les passages à la même allure (toutes sorties confondues)
  const serieSortie = (id, ts, type, blocs) => { const ps = [], hs = []; let t = 0, m = 0;
    blocs.forEach(([mb, p, hr]) => { const dur = mb * p / 1000; for (let u = 5; u <= dur; u += 5) { ps.push({ t: Math.round(t + u), pace: Math.round(p) }); hs.push({ t: Math.round(t + u), hr }); } t += dur; m += mb; });
    return Calc.versSortie({ id, start_date: iso(ts), type, apple_type: "Running", distance_km: m / 1000, duration_sec: Math.round(t), avg_hr: 155, peak_hr: 175, include_in_stats: true, pace_series: ps, hr_series: hs }); };
  const pSeuil = (z.bornes[2] + z.bornes[3]) / 2, pEndu = (z.bornes[0] + z.bornes[1]) / 2;
  const sA = serieSortie("sa", NOW - 5 * JOUR, "Seuil", [[1500, pEndu, 140], [4000, pSeuil, 168], [1000, pEndu, 145]]);
  const sB = serieSortie("sb", NOW, "Seuil", [[1500, pEndu, 140], [4000, pSeuil, 165], [1000, pEndu, 145]]);
  const vB = Calc.verdict(sB, [sA, sB], {}, null, z);
  ok(vB.cle === "facile" && vB.zone === 3 && /Au seuil/.test(vB.phrase) && /3 battements de moins/.test(vB.phrase), "Bilan : passages au seuil comparés à ceux d'une autre sortie (" + vB.phrase + ")");
  const sC = serieSortie("sc", NOW - 3 * JOUR, "EF", [[2000, pSeuil, 169], [5000, pEndu, 142]]);
  ok(Calc.verdict(sB, [sC, sB], {}, null, z).cle === "facile", "Bilan : les passages au seuil d'une sortie facile comptent aussi");
  // Allures par effort (cœur en zone 2 = EF)
  const defs = hrZoneDefs(188, 58);
  const ef1 = serieSortie("ef1", NOW - 4 * JOUR, "EF", [[8000, 400, 145]]), ef2 = serieSortie("ef2", NOW - 11 * JOUR, "EF", [[8000, 404, 145]]);
  const ape = Calc.alluresParEffort([ef1, ef2], NOW, 3, z, defs);
  ok(ape[0].nom === "Facile" && Math.abs(ape[0].maintenant - 402) <= 2 && ape[1].maintenant === null, "Allures par effort : allure tenue cœur en zone 2 (Facile), rien en zone 3");
  ok(Calc.serie([sortie({ id: "w1", ts: NOW - 3600000, km: 5, pace: 365 }), sortie({ id: "w2", ts: NOW - 4 * JOUR, km: 5, pace: 365 }), sortie({ id: "w3", ts: NOW - 10 * JOUR, km: 5, pace: 365 })], NOW) === 3, "Série : 3 semaines d'affilée avec au moins une sortie");
  const decS = Calc.decoupage(sB, z);
  ok(decS && decS.segments.length === 3 && decS.segments[1].cat === "soutenu", "Découpage : 3 catégories au plus, passages soutenus voisins regroupés (" + (decS ? decS.texte : "") + ")");

  // Retours du 27/10 (2) : niveau Fractionné, comparaison selon la période, régularité par semaine
  const fr1 = Calc.versSortie({ id: "fr1", start_date: iso(NOW - 6 * JOUR), type: "Fractionné", apple_type: "Running", distance_km: 6, duration_sec: 2000, include_in_stats: true, frac_work_manual: 270 });
  const ape2 = Calc.alluresParEffort([ef1, ef2, fr1], NOW, 3, z, defs);
  ok(ape2.length === 4 && ape2[3].cle === "frac" && ape2[3].maintenant === 270, "Ton niveau : 4 allures, dont le Fractionné (allure de travail des blocs)");
  ok(Calc.alluresParEffort([ef1, ef2], NOW, 3, z, null)[0].maintenant === null, "Ton niveau : sans FC max, pas d'allure EF / Tempo / Seuil (le Fractionné reste possible)");
  const sps = Calc.sortiesParSemaine([ef1, ef2, sortie({ id: "sp3", ts: NOW - 2 * 3600000, km: 5, pace: 365 }), sortie({ id: "sp4", ts: NOW - 3 * 3600000, km: 5, pace: 365 })], NOW, 12);
  ok(sps.length === 12 && sps[11].n === 2 && sps[10].n === 1 && sps[9].n === 1, "Régularité : nombre de sorties de chaque semaine");
  const pts6 = [3, 8, 15].map((d, i) => sortie({ id: "q" + i, ts: NOW - d * JOUR, km: 8, pace: 360, fc: 150, hrPas: 5 })).concat([185, 190, 195].map((d, i) => sortie({ id: "q6" + i, ts: NOW - d * JOUR, km: 8, pace: 380, fc: 150, hrPas: 5 })));
  ok(Calc.repere(pts6, NOW, null, 183).ecart === 20 && Calc.repere(pts6, NOW).ecart === null, "Repère : la comparaison suit la période choisie (6 mois : 20 s de mieux)");

  // Accueil du 27/10 : types de sorties sur 4 semaines, ton mois, semaines en couleurs
  const ty = Calc.typesSur([sortie({ id: "t1", ts: NOW - 3 * JOUR, km: 8, pace: 420 }), sortie({ id: "t2", ts: NOW - 10 * JOUR, km: 6, pace: 420, type: "Fractionné" }), sortie({ id: "t3", ts: NOW - 40 * JOUR, km: 8, pace: 420 })], NOW, 28, z);
  ok(ty["Sortie facile"] === 1 && ty["Fractionné"] === 1 && Object.keys(ty).length === 2, "Ton niveau : types de sorties des 4 dernières semaines seulement");
  const mo = Calc.mois([ef1, ef2, sortie({ id: "mo3", ts: Date.parse("2026-09-20T08:00:00"), km: 10, pace: 420 })], NOW, 188, 58);
  ok(mo.ce.n === 2 && Math.abs(mo.ce.km - 16) < 0.01 && mo.avant.n === 1 && mo.pctFacile === 100 && /zones 1 et 2/.test(mo.phrase), "Ton mois : volume face au mois dernier et part du temps en zones 1 et 2 (" + mo.phrase + ")");
  const spt = Calc.semainesParType([ef1, serieSortie("st2", NOW - 2 * 3600000, "Fractionné", [[3000, 300, 175]])], NOW, 12, z);
  ok(spt.length === 12 && spt[11].parType["Fractionné"] === 3 && spt[11 - 1].parType["Sortie facile"] === 8, "Régularité en couleurs : km par type et par semaine");

  // Progression (étape 3)
  const vol = Calc.volumeParMois([sortie({ id: "m1", ts: NOW - 2 * JOUR, km: 8, pace: 365 }), sortie({ id: "m2", ts: Date.parse("2026-09-10T08:00:00"), km: 10, pace: 365 })], NOW, 3);
  ok(vol.length === 3 && vol[2].km === 8 && vol[1].km === 10 && vol[0].km === 0, "Volume par mois : 3 mois, mois en cours en dernier");
  const rg = Calc.regularite([sortie({ id: "g1", ts: NOW - 1 * 3600000, km: 5, pace: 365 }), sortie({ id: "g2", ts: NOW - 15 * JOUR, km: 5, pace: 365 })], NOW, 12);
  ok(rg.semaines.length === 12 && rg.avec === 2 && rg.semaines[11] === true, "Régularité : 12 semaines, 2 avec au moins une sortie");
  const rec = Calc.records([sortie({ id: "k1", ts: NOW - 5 * JOUR, km: 10.02, pace: 330 }), sortie({ id: "k2", ts: NOW - 9 * JOUR, km: 10, pace: 345 }), sortie({ id: "k3", ts: NOW - 20 * JOUR, km: 15.2, pace: 380 })]);
  ok(rec.find((x) => x.cle === "10k").id === "k1" && rec.find((x) => x.cle === "longue").valeur === "15,2 km" && rec.find((x) => x.cle === "5k").valeur === null, "Records : meilleur 10 km, plus longue sortie, 5 km « à venir »");
  ok(Calc.cap({ goals: { principal: { objectifPrincipal: "Préparer une course", distanceCourse: "10km", dateCible: "2027-03-14" } } }) === "10 km le 14/03/2027", "Ton cap : la course visée et sa date");

  /* ---------- 3 · V2 (maquettes Claude Design du 27/10) ---------- */
  ok(Calc.libelleType({ type: "Long" }) === "Longue" && Calc.libelleType({ type: "Course" }) === "Compétition" && Calc.libelleType({ type: "EF", typeV2: "Tempo" }) === "Tempo", "V2 · vocabulaire : Longue, Compétition, type corrigé à la main en priorité");
  const f1 = Calc.frise3(sd, z), f2 = Calc.frise3(sB, z);
  ok(f1 && f1.morceaux.length === 1 && f1.morceaux[0].cat === "facile", "V2 · frise : une sortie facile reste d'un seul bloc, aucun km rapide signalé");
  ok(f2 && f2.morceaux.map((m) => m.cat).join(",") === "calme,soutenu,calme" && f2.morceaux[0].mot === "d'échauffement", "V2 · frise : 3 morceaux au plus (échauffement, soutenu, retour au calme)");
  const zsF = { secs: [120, 2460, 360, 60, 0], tot: 3000, defs }, vrF = Calc.verdictRepartition("Sortie facile", zsF);
  ok(vrF.ton === "presque" && /7 min/.test(vrF.phrase) && /Ralentis dès 149 bpm/.test(vrF.phrase), "V2 · répartition : sortie facile, 7 min au-dessus de la zone 2 → « Presque » (" + vrF.titre + " " + vrF.phrase + ")");
  const vrS = Calc.verdictRepartition("Seuil", { secs: [300, 1200, 300, 1560, 0], tot: 3360, defs });
  ok(vrS.ton === "bon" && /Bonne répartition pour un seuil/.test(vrS.titre), "V2 · répartition : seuil à 46 % en zone 4, facile autour → « Bonne répartition »");
  ok(Calc.ressentiCran(6).mot === "Soutenu" && /quelques mots/.test(Calc.ressentiCran(8).phrase) && Calc.ressentiCran(null) === null, "V2 · ressenti : chaque cran a son sens (6 Soutenu, 8 Dur)");
  ok(rec.find((x) => x.cle === "15k").valeur && rec.find((x) => x.cle === "semi").manque === 6 && rec.find((x) => x.cle === "longue").label === "Max", "V2 · records : 15 km ajouté, « encore 6 km » pour le semi, distance max");
  const rb = Calc.recordsBattus(sortie({ id: "k0", ts: NOW, km: 10, pace: 320 }), [sortie({ id: "k1", ts: NOW - 5 * JOUR, km: 10.02, pace: 330 })]);
  ok(rb.length === 1 && rb[0].cle === "10k" && rb[0].temps === 3200 && rb[0].ancien === 3300, "V2 · record battu : 10 km en 53:20 contre 55:00");
  ok(v1.pourquoi === "À la même allure, ton cœur battait moins vite." && /^Comparé à 3 sorties/.test(v1.compare) && v1.tuiles[1].delta === -5, "V2 · bilan : une phrase de pourquoi, la base en petit, l'écart de cœur dans la tuile");
  ok(prem.titre === "Ta première sortie facile" && /point de départ/.test(prem.pourquoi), "V2 · bilan : « Ta première sortie facile », point de départ");
  const ar = Calc.allureRegularite([sortie({ id: "r1", ts: NOW - 1 * JOUR, km: 6, pace: 400 }), sortie({ id: "r2", ts: NOW - 2 * JOUR, km: 6, pace: 400 }), sortie({ id: "r3", ts: NOW - 9 * JOUR, km: 6, pace: 412 })], NOW);
  ok(ar.deux === 400 && ar.une === 412 && ar.gain === 12, "V2 · allure × régularité : les semaines à 2 sorties, 12 s/km plus vite");
  const sfz = Calc.sortiesFacilesZones([ef1, ef2], NOW, 188, 58);
  ok(sfz.length === 2 && sfz.every((x) => x.vraiment && x.pct > 95), "V2 · tes sorties faciles : cœur en zone 2 → vraiment faciles");
  ok(Calc.lisser([{ ts: NOW - 20 * JOUR, v: 10 }, { ts: NOW - 2 * JOUR, v: 20 }], NOW - 28 * JOUR, NOW).slice(-1)[0].v === 15, "V2 · courbe : tendance lissée sur 4 semaines");
  const niv = Calc.alluresParEffort([4, 11, 95, 100].map((j, i) => serieSortie("nv" + i, NOW - j * JOUR, "EF", [[8000, j < 50 ? 400 : 410, 145]])), NOW, 3, z, defs, null, 3)[0];
  ok(Math.abs(niv.maintenant - 400) <= 2 && Math.abs(niv.avant - 410) <= 2 && niv.ecart === niv.avant - niv.maintenant, "Ton niveau actuel (28/10) : l'allure d'il y a 3 mois → celle des 4 dernières semaines (" + fmtKmPace(niv.avant) + " → " + fmtKmPace(niv.maintenant) + ")");

  // Ton conseil (C3 à C10)
  const ctxC = (courses, now) => ({ courses, nowTs: now || NOW, fmax: 188, frepos: 58, defs, objectif: null, niveau: [], bilan: () => ({ cle: "moyenne" }) });
  const mixte = (id, j) => serieSortie(id, NOW - j * JOUR, "EF", [[3000, 400, 145], [3000, 370, 155]]);
  const cC5 = [serieSortie("c1", NOW - 2 * JOUR, "EF", [[6000, 400, 145]]), mixte("c2", 5), mixte("c3", 9)];
  ok(Conseil.evaluer(ctxC(cC5.slice(0, 2)), {}).attente.manque === 1, "Conseil : moins de 3 sorties → « Encore 1 sortie et on te fait ton premier conseil »");
  const r1 = Conseil.evaluer(ctxC(cC5), {});
  ok(r1.zones && r1.zones.regle === "C5" && r1.zones.titre === "Cours davantage en zone 2" && r1.zones.objectif === 20 && /149 bpm/.test(r1.zones.detail), "Conseil C5 : zones 3 à 5 au-dessus de 20 % → « Cours davantage en zone 2 », objectif 20 % (" + Math.round(r1.zones.valeur) + " %)");
  const r2 = Conseil.evaluer(ctxC(cC5, NOW + 3 * JOUR), r1.stock);
  ok(r2.zones.debut === NOW && r2.zones.depart === r1.zones.depart && r2.zones.resteJours === 11, "Conseil : gardé tel quel d'une ouverture à l'autre (même début, même chiffre de départ)");
  const r3 = Conseil.evaluer(ctxC(cC5, NOW + 15 * JOUR), r2.stock);
  ok(r3.zones.prolonge === true && !r3.zones.resultat, "Conseil : objectif pas atteint à la fin → « on continue 1 semaine »");
  const r4 = Conseil.evaluer(ctxC(cC5, NOW + 22 * JOUR), r3.stock);
  ok(r4.zones.resultat === "pasEncore", "Conseil : toujours pas atteint après la semaine de plus → « Pas encore » (" + Math.round(r4.zones.valeur) + " %)");
  const r5 = Conseil.evaluer(ctxC(cC5, NOW + 23 * JOUR), r4.stock);
  ok(r5.zones && r5.zones.debut === NOW + 23 * JOUR && !r5.zones.resultat, "Conseil : le lendemain du message de fin, un nouveau conseil prend sa place (" + (r5.zones && r5.zones.regle) + ")");
  const faciles = [1, 2, 3].map((j) => serieSortie("f" + j, NOW - j * JOUR, "EF", [[6000, 400, 145]]));
  const fait = Conseil.evaluer(ctxC(faciles), { zones: { volet: "zones", regle: "C5", mesure: "soutenu", sens: "max", unite: "%", objectif: 20, debut: NOW - 20 * JOUR, fin: NOW - 1, prolonge: false, resultat: null, titre: "Cours davantage en zone 2" } });
  ok(fait.zones.resultat === "fait" && fait.zones.valeur === 0, "Conseil : objectif atteint à la fin → « C'est fait »");
  ok(Conseil.evaluer(ctxC(faciles), {}).zones.regle === "Z", "Conseil Zones par défaut : bon équilibre → « Garde ton équilibre »");
  const base3 = [1, 8, 15].map((j) => serieSortie("b" + j, NOW - j * JOUR, "EF", [[6000, 400, 145]]));
  const rB = Conseil.evaluer(ctxC(base3), {});
  ok(rB.zones.regle === "C9" && rB.allure.regle === "C10", "Conseil C9 : 80 % ou plus en facile 3 semaines d'affilée → « Glisse 10 à 15 min en zone 3 » ; Allure par défaut C10");
  ok(Conseil.evaluer(ctxC(faciles), {}).allure.titre === "Cours 2 fois par semaine", "Conseil C6 : moins de 3 semaines sur 4 avec une sortie → « Cours 2 fois par semaine »");
  ok(Conseil.evaluer(ctxC([12, 13, 14].map((j) => serieSortie("p" + j, NOW - j * JOUR, "EF", [[6000, 400, 145]]))), {}).allure.titre === "Reprends doucement", "Conseil C6 : 10 jours sans sortie → « Reprends doucement »");
  const vite = [1, 8, 15].map((j) => serieSortie("v" + j, NOW - j * JOUR, "EF", [[1000, 330, 145], [5000, 400, 145]]));
  const rV = Conseil.evaluer(ctxC(vite), {});
  ok(rV.allure.regle === "C7" && rV.allure.titre === "Pars plus lentement" && rV.allure.objectif % 5 === 0 && rV.allure.unite === "allure", "Conseil C7 : 1er km bien plus rapide sur 2 des 3 dernières → « Pars plus lentement » (objectif " + fmtKmPace(rV.allure.objectif) + ")");
  const rObj = Conseil.evaluer({ ...ctxC(base3), objectif: { label: "10 km en 55 min", allure: 330 } }, {});
  ok(rObj.allure.regle === "C3" && /10 km en 55 min/.test(rObj.allure.detail) && rObj.allure.objectif === 15, "Conseil C3 : objectif de course renseigné → 15 min en zone 3 par semaine, sans estimation de chrono");
  const eff = Conseil.effet(r1.zones, ctxC(cC5), cC5[0]);
  ok(eff && eff.avant != null && eff.apres != null && eff.avant !== eff.apres, "Conseil : ce que la sortie a changé (" + Math.round(eff.avant) + " % → " + Math.round(eff.apres) + " %)");
  const sansCoeur = [1, 8, 15].map((j) => sortie({ id: "g" + j, ts: NOW - j * JOUR, km: 6, pace: 400 }));
  const rP = Conseil.evaluer(ctxC(sansCoeur), {});
  ok(rP.partiel && !rP.zones && rP.allure, "Conseil : cœur partiel → volet Allure seul");

  const nOk = res.filter((r) => r.ok).length, nKo = res.length - nOk;
  document.getElementById("bilan").innerHTML = `<b class="${nKo ? "ko" : "ok"}">${nOk} passés, ${nKo} échoués</b>`;
  document.getElementById("liste").innerHTML = res.map((r) => `<li class="${r.ok ? "ok" : "ko"}">${r.ok ? "✓" : "✗"} ${r.nom.replace(/</g, "&lt;")}</li>`).join("");
})().catch((e) => { document.getElementById("bilan").innerHTML = `<b class="ko">Erreur : ${String(e && e.message || e)}</b>`; });
</script>
