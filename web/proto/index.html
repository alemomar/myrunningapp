<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MRA Proto</title>
<!-- Prototype « refonte progression » (26/10/2026) : séparé de l'app, en lecture seule, aucun lien depuis l'app. -->
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-proto.png">
<link rel="icon" type="image/png" href="icone-proto.png">
<meta name="theme-color" content="#0C0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MRA Proto">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(../fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(../fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(../fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(../fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(../fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(../fonts/barlow-condensed-700.woff2) format("woff2")}
/* Jetons de l'app (docs/design/tokens.css), thème sombre. */
:root{--bg:#0C0D0F;--surface:#17191C;--sunken:#0F1113;--control:#22252A;--line:#26292E;--text:#F2F3F0;--text-2:#C9CCD0;--text-3:#A3A7AD;
  --muted:#8B8F96;--faint:#5A6068;--accent:#C6F432;--accent-soft:rgba(198,244,50,.12);--attention:#B688FE;--attention-soft:rgba(182,136,254,.16);
  --coral:#FF645F;--cond:"Barlow Condensed","Barlow",system-ui,sans-serif;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Barlow",system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bandeau-proto{position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 6px) 16px 6px;background:var(--attention);color:#141019;
  font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center}
#app{max-width:480px;margin:0 auto;padding:18px 16px calc(110px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.sur{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-family:var(--cond);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1.1}
h2{margin:0;font-family:var(--cond);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1.15}
.tete{display:flex;flex-direction:column;gap:2px;padding:4px 2px}
.carte{background:var(--surface);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;width:100%}
button.carte:active{opacity:.85}
.carte-tete{display:flex;align-items:center;justify-content:space-between;gap:10px}
.com{font-size:13.5px;color:var(--text-3);line-height:1.45}
.com-sep{border-top:1px solid var(--line);padding-top:10px}
.tuiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tuiles.deux{grid-template-columns:repeat(2,1fr)}
.tuile{background:var(--sunken);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tuile .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tuile .v{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.tuile .v small{font-size:14px;color:var(--text-3);font-weight:600;margin-left:3px}
.tuile .h{font-size:12.5px;color:var(--muted)}
.verdict-ligne{display:flex;align-items:center;gap:10px}
.pastille{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pastille.haut{background:var(--accent-soft);color:var(--accent)}
.pastille.egal{background:var(--control);color:var(--text)}
.pastille.bas{background:var(--attention-soft);color:var(--attention)}
.pastille.aucun{background:var(--control);color:var(--muted)}
.pastille.grande{width:44px;height:44px}
.verdict-ligne .t{font-size:16px;font-weight:600;line-height:1.3}
.verdict-titre{font-family:var(--cond);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.05}
.frise{display:flex;gap:3px;height:14px}
.frise i{display:block;border-radius:4px;min-width:4px}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text-2)}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.puce{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--sunken);font-size:13px;color:var(--text-2)}
.puce i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.btn-primaire{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:999px;background:var(--accent);color:#0C0D0F;font-weight:700;font-size:16px;text-align:center}
.btn-second{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:999px;background:var(--control);font-weight:600;text-align:center}
.lien-discret{color:var(--text-3);text-decoration:underline;font-size:13.5px}
.barre-zone{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:10px}
.barre-zone .n{font-weight:600;font-size:14px;line-height:1.2}
.barre-zone .n small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.piste{height:10px;border-radius:5px;background:var(--control);overflow:hidden}
.piste i{display:block;height:100%;border-radius:5px}
.barre-zone .v{font-family:var(--cond);font-weight:700;font-size:17px;text-align:right}
.km{display:grid;grid-template-columns:60px 1fr 44px;white-space:nowrap;align-items:center;gap:10px;font-size:13.5px;color:var(--text-2)}
.km .piste{height:12px;background:transparent}
.km .piste i{background:#3A3E44}
.km.rapide .piste i{background:var(--accent)} .km.rapide{color:var(--text);font-weight:700}
.km .p{text-align:right;font-variant-numeric:tabular-nums}
.message{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--text);font-size:14px}
.message.neutre{background:var(--sunken);color:var(--text-2)}
.message svg{flex:none;margin-top:2px}
.sec-titre{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 2px 0}
.chiffres3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chiffres3 .v{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1}
.chiffres3 .l{font-size:13px;color:var(--text-3)}
.compare{font-size:12.5px;color:var(--muted)}
.compare b{color:var(--text-2);font-weight:600}
.repart{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--control)}
.repart i{display:block;height:100%}
.repere{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.repere .v{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1}
.badge{padding:4px 10px;border-radius:999px;font-family:var(--cond);font-weight:700;font-size:16px}
.badge.haut{background:var(--accent-soft);color:var(--accent)} .badge.bas{background:var(--attention-soft);color:var(--attention)} .badge.egal{background:var(--control);color:var(--text-2)}
.curseur-zone{display:flex;flex-direction:column;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.curseur-val{display:flex;align-items:baseline;gap:8px}
.curseur-val .v{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1}
.reperes{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.reperes span:nth-child(2){text-align:center}.reperes span:last-child{text-align:right}
.fermer,.retour{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.haut-ecran{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bas-fixe{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%);z-index:20}
.bas-fixe>*{max-width:448px;margin:0 auto}
nav.onglets{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(448px,calc(100% - 32px));z-index:20;
  background:rgba(23,25,28,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr)}
nav.onglets button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;color:var(--muted);border-radius:999px;text-align:center}
nav.onglets button.actif{color:var(--text);font-weight:700}
.vide{color:var(--text-3);text-align:center;padding:30px 10px}
.pastille.nouveau{background:var(--control);color:var(--accent)}
.ou-ligne{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.ou-ligne:first-of-type{border-top:0}
.ou-ic{flex:none;width:36px;height:36px;border-radius:12px;background:var(--sunken);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ou-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ou-v{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-family:var(--cond);font-weight:700;font-size:28px;line-height:1.05}
.ou-v small{font-size:15px;color:var(--text-3);font-weight:600}
.ou-v .badge{font-size:14px;align-self:center}
.voir{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:14.5px}
.segments.petits{width:min(260px,100%);align-self:flex-start;grid-template-columns:repeat(3,1fr)}
.segments.petits button{padding:7px 0;font-size:13px}
.effort{display:flex;flex-direction:column;gap:6px}
.effort.sep{border-top:1px solid var(--line);padding-top:12px}
.kvs{display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-child{border-top:0}
.kv span{display:inline-flex;align-items:center;gap:8px;color:var(--text-2)}
.kv b{font-weight:600;text-align:right}
.pt{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%}
.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:var(--surface)}
.segments button{padding:10px 0;border-radius:999px;text-align:center;color:var(--text-3);font-weight:600;font-size:14px}
.segments button.actif{background:var(--text);color:#0C0D0F}
.ligne{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ligne[role=link]{cursor:pointer}
.ligne .pt{flex:none;width:9px;height:9px;border-radius:50%}
.ligne .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ligne .m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .m span{font-size:13px;color:var(--muted)}
.ligne .al{font-family:var(--cond);font-weight:700;font-size:18px}
.ligne .pv{font-size:12.5px;color:var(--muted)}
.champ{display:flex;flex-direction:column;gap:6px}
.champ label{font-size:13px;color:var(--text-3)}
.champ input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--sunken);color:var(--text);font:inherit;font-size:16px}
.erreur{color:var(--attention);font-size:14px}
svg text{font-family:"Barlow",system-ui,sans-serif}
.cache{display:none!important}
</style>
</head>
<body>
<div class="bandeau-proto" role="note">Prototype · lecture seule</div>
<main id="app" aria-live="polite"><p class="vide">Chargement…</p></main>
<nav class="onglets cache" id="onglets" aria-label="Onglets"></nav>
<div class="bas-fixe cache" id="basFixe"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../logic.js?v=113"></script>
<script src="reglages.js?v=7"></script>
<script src="lecture.js?v=1"></script>
<script src="calculs.js?v=7"></script>
<script src="app.js?v=4"></script>
</body>
</html>
