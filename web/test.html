<script>
// Smoke tests des fonctions de calcul pures (logic.js). Ouvrir ce fichier
// directement dans un navigateur — aucun outil/build nécessaire.
// Objectif : éviter de redécouvrir un bug (comme les zones cardio ou
// l'allure Work) seulement une fois de vraies données en jeu.

let pass = 0, fail = 0;
const out = document.getElementById("results");
// Hasard reproductible (graine fixe) pour les séries « bruitées » : un test ne peut plus échouer une fois sur N au gré du tirage.
let seedAlea = 20261006;
const alea = () => { seedAlea = (seedAlea * 16807) % 2147483647; return (seedAlea - 1) / 2147483646; };
(async function(){

function assertEqual(name, actual, expected){
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  if(ok) pass++; else fail++;
  const div = document.createElement("div");
  div.className = "case";
  div.innerHTML = `<span class="${ok?'pass':'fail'}">${ok?'✓':'✗'}</span> ${name}` +
    (ok ? "" : `<br><small>attendu: ${JSON.stringify(expected)} — obtenu: ${JSON.stringify(actual)}</small>`);
  out.appendChild(div);
}

function assertClose(name, actual, expected, tolerance){
  const ok = Math.abs(actual - expected) <= tolerance;
  if(ok) pass++; else fail++;
  const div = document.createElement("div");
  div.className = "case";
  div.innerHTML = `<span class="${ok?'pass':'fail'}">${ok?'✓':'✗'}</span> ${name}` +
    (ok ? "" : `<br><small>attendu: ~${expected} (±${tolerance}) — obtenu: ${actual}</small>`);
  out.appendChild(div);
}

// --- linearRegression ---
{
  const {slope, intercept} = linearRegression([{x:0,y:0},{x:1,y:2},{x:2,y:4}]);
  assertClose("linearRegression : droite parfaite y=2x", slope, 2, 0.001);
  assertClose("linearRegression : intercept proche de 0", intercept, 0, 0.001);
}

// --- hrZoneDefs (Karvonen) ---
{
  const defs = hrZoneDefs(191, 60);
  assertEqual("hrZoneDefs : bornes avec FC repos (191/60)", defs.map(d=>d.max), [139, 152, 165, 178, 999]);
  const defsNoRest = hrZoneDefs(191, 0);
  assertEqual("hrZoneDefs : bornes sans FC repos = %FC max brut", defsNoRest.map(d=>d.max), [115, 134, 153, 172, 999]);
}

// --- programIntensityGuidance ---
{
  assertEqual("programIntensityGuidance : Fractionné -> allure seule (même avec FC connue)", programIntensityGuidance("interval", 191, 60), {mode:"allure"});
  assertEqual("programIntensityGuidance : Répétition -> allure seule", programIntensityGuidance("repetition", 191, 60), {mode:"allure"});
  assertEqual("programIntensityGuidance : EF avec FC connue -> ressenti + plafond (haut zone 2)", programIntensityGuidance("easy", 191, 60), {mode:"ressenti_plafond", hrCeiling:152});
  assertEqual("programIntensityGuidance : Marathon avec FC connue -> ressenti + plafond aussi", programIntensityGuidance("marathon", 191, 60), {mode:"ressenti_plafond", hrCeiling:152});
  assertEqual("programIntensityGuidance : Seuil avec FC connue -> allure + zone 3-4", programIntensityGuidance("threshold", 191, 60), {mode:"allure_zone", hrRangeMin:153, hrRangeMax:178});
  assertEqual("programIntensityGuidance : EF sans FC connue -> ressenti seul", programIntensityGuidance("easy", null, 60), {mode:"ressenti"});
  assertEqual("programIntensityGuidance : Seuil sans FC connue -> repli sur allure seule", programIntensityGuidance("threshold", null, 60), {mode:"allure"});
}

// --- computeHrZoneSeconds ---
{
  // 60s à 100bpm (zone 1) puis 60s à 180bpm (zone 5), FC max 191 / repos 60
  const series = [{t:0,hr:100},{t:60,hr:100},{t:60,hr:180},{t:120,hr:180}];
  const {secs} = computeHrZoneSeconds(series, 191, 60);
  assertEqual("computeHrZoneSeconds : répartition zone 1 / zone 5", secs, [60,0,0,0,60]);

  // Ne doit JAMAIS ignorer un grand écart entre deux mesures (vérifié le
  // 29/09/2026 contre un vrai export Apple Santé : Apple ne le fait pas
  // non plus). Un ancien filtre ignorait tout écart >60s ("pauses") — il
  // faisait perdre l'écrasante majorité d'une séance à échantillonnage
  // épars mais réel (22 mesures sur 30min), donnant une répartition
  // trompeuse alors que la donnée était en fait suffisante.
  const bigGap = [{t:0,hr:100},{t:600,hr:100}]; // 10 minutes d'écart, zone 1
  assertEqual("computeHrZoneSeconds : grand écart (10min) toujours comptabilisé", computeHrZoneSeconds(bigGap, 191, 60).secs, [600,0,0,0,0]);

  // Reproduit le vrai cas de la testeuse (22 mesures réelles, 30/05/2026,
  // écarts en secondes) : le total doit correspondre à ce qu'Apple affiche
  // nativement pour cette même séance (27:16 = 1636s, à 1s près ici).
  const realSparseSession = [0,158,548,553,561,563,571,573,578,584,590,592,600,603,610,614,875,961,966,970,973,1637].map((t,i)=>({t, hr: i%2===0?145:170}));
  const totalCovered = computeHrZoneSeconds(realSparseSession, 191, 60).secs.reduce((a,b)=>a+b,0);
  assertEqual("computeHrZoneSeconds : séance éparse réelle -> couvre bien 1637s (~27min), pas juste 78s", totalCovered, 1637);
}

// --- detectHrSurges / looksLikeFractionne ---
{
  // Vrai fractionné : 7 cycles nets de ±45bpm sur 33min (reproduit une vraie séance)
  function mkIntervalSeries(cyclePeriod, amplitude, totalDur){
    const pts=[];
    for(let t=0;t<=totalDur;t+=15){
      const phase=(t%cyclePeriod)/cyclePeriod;
      pts.push({t, hr: Math.round(155 + Math.sin(phase*2*Math.PI-Math.PI/2)*amplitude)});
    }
    return pts;
  }
  const realFractionne = mkIntervalSeries(250, 25, 2000); // ~8 cycles, amplitude 50bpm
  assertEqual("looksLikeFractionne : vrai fractionné détecté", looksLikeFractionne(realFractionne), true);

  // EF régulier : montée en warmup + léger bruit, pas de structure répétée
  function mkEfSeries(totalDur){
    const pts=[];
    for(let t=0;t<=totalDur;t+=15){
      let hr = t<480 ? 100+(145-100)*(t/480) : 145+Math.sin(t/180)*6;
      hr += (alea()*6-3);
      pts.push({t, hr: Math.round(hr)});
    }
    return pts;
  }
  const ef = mkEfSeries(2950);
  assertEqual("looksLikeFractionne : EF régulier non détecté (pas de faux positif)", looksLikeFractionne(ef), false);

  // Séance trop courte pour juger d'une structure
  assertEqual("looksLikeFractionne : séance <5min toujours false", looksLikeFractionne(mkIntervalSeries(60, 40, 200)), false);
}

// --- looksLikeSeuil ---
{
  // 30min à 90% FC max (zone 4-5) : franchement du Seuil
  const seuilSeries = [];
  for(let t=0;t<=1800;t+=15) seuilSeries.push({t, hr:172});
  assertEqual("looksLikeSeuil : séance à 90% FC max détectée", looksLikeSeuil(seuilSeries, 191, 60), true);

  // 30min à 65% FC max (zone 2) : EF classique, pas de Seuil
  const efSeries = [];
  for(let t=0;t<=1800;t+=15) efSeries.push({t, hr:145});
  assertEqual("looksLikeSeuil : EF classique non détecté", looksLikeSeuil(efSeries, 191, 60), false);
}

// --- detectPaceIntervals / computeIntervalPaces ---
{
  // Reproduit la capture réelle : 7 cycles de 1min Work (~260-280 sec/km) /
  // 1min Récup (~535-585 sec/km), plus un cooldown lent en fin de séance
  // (le genre de valeur qui faisait dérailler l'ancien seuil min/max).
  function mkIntervalPaceSeries(cycles, cooldownPace, cooldownDurSec=180){
    const pts=[];
    let t=0;
    for(let i=0;i<cycles;i++){
      for(let s=0;s<60;s+=5) pts.push({t:t+s, pace: Math.round(260+alea()*20)});
      t+=60;
      for(let s=0;s<60;s+=5) pts.push({t:t+s, pace: Math.round(535+alea()*50)});
      t+=60;
    }
    if(cooldownPace){
      for(let s=0;s<cooldownDurSec;s+=5) pts.push({t:t+s, pace: cooldownPace});
    }
    return pts;
  }
  // Tolérances généreuses : c'est une heuristique sur données bruitées, pas
  // un calcul exact — l'objectif est d'être dans le bon ordre de grandeur,
  // de détecter la majorité des intervalles, et surtout de ne JAMAIS se
  // faire polluer par le cooldown (l'ancien bug donnait ~400+ pour "Work").
  const short = mkIntervalPaceSeries(7, 900, 180); // cooldown 3min
  const resultShort = computeIntervalPaces(short);
  assertClose("computeIntervalPaces : allure Work correcte (cooldown court)", resultShort.work, 270, 20);
  assertClose("computeIntervalPaces : allure Récup correcte (cooldown court)", resultShort.recovery, 560, 55);
  assertEqual("computeIntervalPaces : au moins 6 des 7 intervalles Work détectés", resultShort.workCount>=6, true);

  // Cas décrit par l'utilisateur : le résultat ne doit PAS dépendre de la
  // durée du cooldown (3min vs 12min, ~2km de récup) — preuve qu'il est bien
  // neutralisé plutôt que juste "moins pris en compte".
  const long = mkIntervalPaceSeries(7, 900, 720); // cooldown 12min (~2km)
  const resultLong = computeIntervalPaces(long);
  assertClose("computeIntervalPaces : allure Work stable, cooldown 3min ou 12min", resultLong.work, resultShort.work, 3);
  assertClose("computeIntervalPaces : allure Récup stable, cooldown 3min ou 12min", resultLong.recovery, resultShort.recovery, 30);

  const withoutCooldown = mkIntervalPaceSeries(7, null);
  const resultNone = computeIntervalPaces(withoutCooldown);
  assertClose("computeIntervalPaces : cohérent avec/sans cooldown (Work)", resultNone.work, 270, 15);
}

// --- computeWorkAvgHr : FC moyenne pendant les phases Work uniquement ---
{
  // Mêmes cycles 60s Work / 60s Récup que ci-dessus, mais avec une FC nettement
  // plus haute pendant le Work (~165bpm) que pendant la Récup (~140bpm) — la
  // FC Work ne doit pas être diluée par la FC (plus basse) de la récup.
  function mkIntervalSeriesWithHr(cycles){
    const pace=[], hr=[];
    let t=0;
    for(let i=0;i<cycles;i++){
      for(let s=0;s<60;s+=5){ pace.push({t:t+s, pace: Math.round(260+alea()*20)}); hr.push({t:t+s, hr: Math.round(165+alea()*4)}); }
      t+=60;
      for(let s=0;s<60;s+=5){ pace.push({t:t+s, pace: Math.round(535+alea()*50)}); hr.push({t:t+s, hr: Math.round(140+alea()*4)}); }
      t+=60;
    }
    return {pace, hr};
  }
  const {pace, hr} = mkIntervalSeriesWithHr(7);
  const workHr = computeWorkAvgHr(pace, hr);
  assertClose("computeWorkAvgHr : FC Work proche de 165bpm, pas diluée par la récup (~140bpm)", workHr, 165, 6);

  assertEqual("computeWorkAvgHr : sans hrSeries -> null", computeWorkAvgHr(pace, null), null);
  assertEqual("computeWorkAvgHr : sans paceSeries -> null", computeWorkAvgHr(null, hr), null);
}

// --- computeIntervalPaces sur une vraie séance (10/08) ---
// Fixture capturée depuis pace_series en base pour une séance fractionné
// réelle : 8 cycles Work/Récup nets, suivis d'un palier "Seuil" soutenu puis
// d'un cooldown — exactement le cas qui a fait échouer plusieurs versions
// précédentes de l'algo (allure Work fausse, comptage d'intervalles délirant).
// C'est le test le plus important du fichier : s'il casse, ne pas relâcher
// tant qu'il n'est pas vert.
try {
  const real = await fetch('real_pace_series.json').then(r=>r.json());
  const result = computeIntervalPaces(real);
  assertClose("computeIntervalPaces (vraie séance 10/08) : allure Work ≈ 4'20''/km attendue", result.work, 260, 25);
  assertEqual("computeIntervalPaces (vraie séance 10/08) : 8 intervalles Work (palier Seuil + cooldown exclus)", result.workCount, 8);
  assertEqual("computeIntervalPaces (vraie séance 10/08) : 8 intervalles Récup", result.recoveryCount, 8);
} catch(e) {
  assertEqual("computeIntervalPaces (vraie séance 10/08) : fixture chargée", "erreur: "+e.message, "pas d'erreur");
}

// --- computeIntervalPaces sur les 5 premières séances Fractionné réelles ---
// Signalé par l'utilisateur : Work/Récup quasi identiques sur le graph pour
// les séances les plus anciennes (07 mai, 27 mai, 16 juin...). Diagnostic sur
// les vraies pace_series de ces séances : 4 des 5 ont un échantillonnage
// bien trop épars (1 point toutes les ~5min, contre 2-3s pour la séance du
// 10/08) pour résoudre des cycles Work/Récup d'~1min — l'algo doit les
// exclure (retourner null) plutôt que produire un résultat trompeur. Seule
// la 5e séance a un échantillonnage dense et donne un résultat exploitable.
try {
  const early = await fetch('real_pace_series_early.json').then(r=>r.json());
  const [sparse1, sparse2, sparse3, mixed, dense] = early.map(computeIntervalPaces);
  assertEqual("séances anciennes éparses : pas assez de données -> null (1/4)", sparse1, null);
  assertEqual("séances anciennes éparses : pas assez de données -> null (2/4)", sparse2, null);
  assertEqual("séances anciennes éparses : pas assez de données -> null (3/4)", sparse3, null);
  assertEqual("séances anciennes éparses : pas assez de données -> null (4/4, échantillonnage mixte)", mixed, null);
  assertEqual("séance dense (5/5) : résultat exploitable", dense !== null, true);
  if(dense) assertEqual("séance dense (5/5) : écart Work/Récup net (pas quasi identique)", dense.recovery - dense.work > 50, true);
} catch(e) {
  assertEqual("séances anciennes réelles : fixture chargée", "erreur: "+e.message, "pas d'erreur");
}

// --- computeIntervalPaces sur une vraie séance avec échauffement (29/05) ---
// Bug réel signalé par l'utilisateur : Work/Récup quasi identiques sur le
// graph pour cette séance. Cause : 10min d'échauffement AVANT les
// intervalles génèrent du bruit GPS classé en petits faux segments
// Work/Récup ; l'ancienne version de trimToConsistentRun prenait CES
// segments comme référence de régularité et coupait la vraie plage
// fractionné avant de l'atteindre. Référence terrain (app Fitness, capture
// "Intervals") : 4 cycles de 4min Work (~5'02"-5'32"/km, moyenne ~5'09") et
// 2min Récup (~9'51"-10'06"/km, moyenne ~9'58"), puis 15min de cooldown à
// 7'01"/km qui ne doit PAS être compté comme Récup.
try {
  const real2905 = await fetch('real_pace_series_2905.json').then(r=>r.json());
  const result2905 = computeIntervalPaces(real2905);
  assertClose("computeIntervalPaces (vraie séance 29/05, avec échauffement) : allure Work ≈ 5'09''/km attendue", result2905.work, 309, 30);
  assertClose("computeIntervalPaces (vraie séance 29/05) : allure Récup ≈ 9'58''/km attendue", result2905.recovery, 598, 40);
  assertEqual("computeIntervalPaces (vraie séance 29/05) : écart Work/Récup net (pas quasi identique, l'ancien bug)", result2905.recovery - result2905.work > 150, true);
} catch(e) {
  assertEqual("computeIntervalPaces (vraie séance 29/05) : fixture chargée", "erreur: "+e.message, "pas d'erreur");
}

// --- computeIntervalPaces sur une vraie séance à cycles très courts (07/05) ---
// Bug réel signalé par l'utilisateur : allure Work fausse (calculée à
// 5'30''/km au lieu de ~4'34''/km attendu). Cause : sur cette séance à
// cycles 1min Work / 1min Récup, la plage retenue par findConsistentRun
// incluait un segment en tout début et un en toute fin dont la DURÉE
// ressemblait aux vrais intervalles mais dont l'ALLURE (~430 sec/km) n'avait
// rien à voir avec le vrai Work (~250-300 sec/km) — une bascule progressive
// vers le cooldown, de durée coïncidemment proche. Référence terrain (app
// Fitness) : Work ~4'34''/km (~274s), Récup ~10'03''/km (~603s).
try {
  const real0705 = await fetch('real_pace_series_0705.json').then(r=>r.json());
  const result0705 = computeIntervalPaces(real0705);
  assertClose("computeIntervalPaces (vraie séance 07/05, cycles 1min/1min) : allure Work proche de 4'34''/km attendue", result0705.work, 274, 35);
  assertClose("computeIntervalPaces (vraie séance 07/05) : allure Récup proche de 10'03''/km attendue", result0705.recovery, 603, 40);
  assertEqual("computeIntervalPaces (vraie séance 07/05) : pas de segment de bord contaminé par le cooldown (Work < 300s/km)", result0705.work < 300, true);
} catch(e) {
  assertEqual("computeIntervalPaces (vraie séance 07/05) : fixture chargée", "erreur: "+e.message, "pas d'erreur");
}

// --- computeIntervalPaces sur une vraie séance avec récups trop brèves pour
// survivre au filtrage (16/06) ---
// Bug réel : une exigence d'alternance stricte (essai précédent, pour
// corriger le 07/05) coupait cette séance à seulement 3 segments retenus sur
// ~25min de structure ~75-80s Work/Récup par ailleurs propre, dès qu'une
// récup entre deux Work manquait (trop courte/bruitée pour le filtre de 20s
// min). Le nouveau correctif (allure vérifiée en continu, sans exiger
// l'alternance) doit récupérer significativement plus de segments tout en
// gardant une allure Work nettement sous 400s/km (zone Récup) et un net
// écart Work/Récup.
try {
  const real1606 = await fetch('real_pace_series_1606.json').then(r=>r.json());
  const result1606 = computeIntervalPaces(real1606);
  assertEqual("computeIntervalPaces (vraie séance 16/06, récups parfois filtrées) : au moins 6 segments retenus (vs 3 avec l'alternance stricte)", result1606.workCount + result1606.recoveryCount >= 6, true);
  assertEqual("computeIntervalPaces (vraie séance 16/06) : allure Work plausible (<350s/km)", result1606.work < 350, true);
  assertEqual("computeIntervalPaces (vraie séance 16/06) : écart Work/Récup net", result1606.recovery - result1606.work > 200, true);
} catch(e) {
  assertEqual("computeIntervalPaces (vraie séance 16/06) : fixture chargée", "erreur: "+e.message, "pas d'erreur");
}

// --- getIntervalPaces : override manuel (exception) ---
// Certaines séances ont un pace_series trop épars pour l'algo (source
// interne à l'app Fitness bien plus fine que ce que HealthKit expose) —
// on permet alors une saisie manuelle qui prend le pas sur le calcul.
{
  const manual = getIntervalPaces({fracWorkManual: 372, fracRecoveryManual: 679, paceSeries: null});
  assertEqual("getIntervalPaces : override manuel prioritaire (Work)", manual.work, 372);
  assertEqual("getIntervalPaces : override manuel prioritaire (Récup)", manual.recovery, 679);
  assertEqual("getIntervalPaces : override manuel marqué comme tel", manual.manual, true);

  const auto = getIntervalPaces({fracWorkManual: null, fracRecoveryManual: null, paceSeries: null});
  assertEqual("getIntervalPaces : sans override ni pace_series -> null", auto, null);
}

// --- Moteur Programme : VDOT / zones d'allure ---
{
  // 10K en 45:00 -> VDOT ~44-45 attendu (référence connue, cohérente avec
  // les calculateurs VDOT publics).
  const vdot = computeVdot(10, 45*60);
  assertClose("computeVdot : 10K en 45:00 -> VDOT ~45", vdot, 45, 2);

  // Round-trip vo2AtVelocity / velocityForVo2 : l'inverse doit redonner la
  // vitesse de départ (vérifie que la résolution du polynôme est correcte).
  const v0 = 300; // m/min
  assertClose("velocityForVo2 : round-trip avec vo2AtVelocity", velocityForVo2(vo2AtVelocity(v0)), v0, 0.01);

  // Zones d'allure : doivent être strictement croissantes en vitesse (donc
  // décroissantes en sec/km) de easy -> repetition, quel que soit le VDOT.
  const zones = paceZonesFromVdot(vdot);
  assertEqual("paceZonesFromVdot : ordre easy > marathon > threshold > interval > repetition (sec/km)",
    zones.easy > zones.marathon && zones.marathon > zones.threshold && zones.threshold > zones.interval && zones.interval > zones.repetition,
    true);
}

// --- resolveRunnerProfile : « Ton niveau » seulement (S8, D76) ---
{
  const T = "2026-10-05";
  const goalsWithPb = { principal: { objectifPrincipal:"Préparer une course", distanceCourse:"10km", pbExistant:"Oui", pbSec:2700 } };
  assertEqual("resolveRunnerProfile : un record d'Objectifs ne calcule plus les allures", resolveRunnerProfile(goalsWithPb, null, T), null);
  const chrono = resolveRunnerProfile(goalsWithPb, {refDistanceKm:10, refTimeSec:2820, refDate:"2026-09-15"}, T);
  assertEqual("resolveRunnerProfile : chrono de « Ton niveau » prioritaire sur le record (source, distance, temps)", [chrono.source, chrono.distanceKm, chrono.timeSec], ["level_chrono", 10, 2820]);
  assertEqual("resolveRunnerProfile : chrono récent, pas à rafraîchir", [chrono.stale, chrono.undated, chrono.approx], [false, false, false]);
  const test = resolveRunnerProfile({}, {refDistanceKm:4.2, refTimeSec:1200, refDate:"2026-09-20", refSource:"test"}, T);
  assertEqual("resolveRunnerProfile : test guidé", test.source, "level_test");
  assertEqual("resolveRunnerProfile : de plus de 6 mois, on s'en sert encore mais il est à rafraîchir", [resolveRunnerProfile({}, {refDistanceKm:10, refTimeSec:2820, refDate:"2026-03-01"}, T).stale, resolveRunnerProfile({}, {refDistanceKm:10, refTimeSec:2820, refDate:"2026-03-01"}, T)!==null], [true, true]);
  assertEqual("resolveRunnerProfile : pile 6 mois, encore récent", resolveRunnerProfile({}, {refDistanceKm:10, refTimeSec:2820, refDate:"2026-04-05"}, T).stale, false);
  assertEqual("resolveRunnerProfile : un jour de plus, périmé", resolveRunnerProfile({}, {refDistanceKm:10, refTimeSec:2820, refDate:"2026-04-04"}, T).stale, true);
  const undated = resolveRunnerProfile({}, {refDistanceKm:5, refTimeSec:1500}, T);
  assertEqual("resolveRunnerProfile : compte existant sans date : utilisé, signalé « sans date » (question de reprise)", [undated.source, undated.undated, undated.stale], ["level_chrono", true, false]);
  const vmaGoals = { principal: { objectifPrincipal:"Améliorer mon allure", vmaConnue:"Oui", vma:15, vmaDate:"2026-08-15" } };
  assertEqual("resolveRunnerProfile : VMA datée de moins de 6 mois, seulement sans « Ton niveau »", [resolveRunnerProfile(vmaGoals, null, T).source, resolveRunnerProfile(vmaGoals, {refDistanceKm:5, refTimeSec:1500, refDate:"2026-09-01"}, T).source], ["goal_vma", "level_chrono"]);
  assertEqual("resolveRunnerProfile : VMA sans date ou de plus de 6 mois : pas utilisée", [
    resolveRunnerProfile({ principal: { objectifPrincipal:"Améliorer mon allure", vmaConnue:"Oui", vma:15 } }, null, T),
    resolveRunnerProfile({ principal: { objectifPrincipal:"Améliorer mon allure", vmaConnue:"Oui", vma:15, vmaDate:"2026-02-15" } }, null, T)], [null, null]);
  assertEqual("resolveRunnerProfile : null si aucune source disponible", resolveRunnerProfile({}, null, T), null);
}

// --- shouldShowDetailedRatingForm (4.5.b) ---
{
  assertEqual("shouldShowDetailedRatingForm : bonne note, pas de gêne -> court", shouldShowDetailedRatingForm(5, false), false);
  assertEqual("shouldShowDetailedRatingForm : note moyenne (3), pas de gêne -> court", shouldShowDetailedRatingForm(3, false), false);

// --- ACWR (Gabbett 2016) ---
{
  const target = new Date(2026,0,28);
  // Charge constante 300/jour sur 28 jours -> aigu(7j)=2100, chronique(28j/4)=2100 -> ACWR=1
  const flatSeries = Array.from({length:28}, (_,i) => ({date:new Date(2026,0,i+1), load:300}));
  const flat = acwrAt(flatSeries, target);
  assertClose("acwrAt : charge constante -> ACWR ~1", flat.acwr, 1, 0.01);

  // Pic soudain sur les 7 derniers jours (charge x3) -> ACWR nettement >1.3
  const spikeSeries = flatSeries.map((d,i) => i>=21 ? {...d, load:900} : d);
  const spike = acwrAt(spikeSeries, target);
  assertEqual("acwrAt : pic récent -> ACWR > 1.3 (zone à risque)", spike.acwr > 1.3, true);

  assertEqual("acwrAt : pas de charge chronique -> acwr null", acwrAt([], target).acwr, null);
}

// --- findRescheduleDay (4.3.d, garde-fous de réorganisation) ---
{
  // Semaine : Fractionné (intense) mardi(1), Long/easy vendredi(4). EF raté
  // à recaser -> pas intense, n'importe quel jour libre convient.
  const week1 = [{dayIndex:1, pace_zone:"interval"}, {dayIndex:4, pace_zone:"easy"}];
  assertEqual("findRescheduleDay : EF (non intense) -> premier jour libre, même collé à l'intense", findRescheduleDay({pace_zone:"easy"}, week1, [0,1,2,3,4,5,6], false), 0);

  // Même semaine, mais c'est le Fractionné de mardi(1) qui est raté (intense)
  // -> doit éviter lundi(0) et mercredi(2), collés à mardi ; vendredi(4) est
  // easy donc sans contrainte, mais déjà occupé -> premier jour sûr = jeudi(3).
  assertEqual("findRescheduleDay : séance intense évite les jours collés à mardi(1)", findRescheduleDay({pace_zone:"interval"}, week1, [0,1,2,3,4,5,6], true), 3);

  // Semaine dense en intense : Seuil mardi(1), Fractionné jeudi(3). Une
  // 3e séance intense à recaser doit éviter lundi(0, collé à mardi),
  // mercredi(2, collé aux deux), vendredi(4, collé à jeudi) -> ne reste
  // que samedi(5) ou dimanche(6).
  const week2 = [{dayIndex:1, pace_zone:"threshold"}, {dayIndex:3, pace_zone:"interval"}];
  assertEqual("findRescheduleDay : séance intense évite les jours collés à une autre intense", findRescheduleDay({pace_zone:"threshold"}, week2, [0,1,2,3,4,5,6], false), 5);

  // Semaine extrême (cas limite, 4 séances intenses déjà casées un jour sur
  // deux) : chaque jour libre restant (1,3,5) est collé à une intense des
  // deux côtés -> aucun jour sûr, sans priorité = abandon (null).
  const week3 = [{dayIndex:0, pace_zone:"threshold"}, {dayIndex:2, pace_zone:"interval"}, {dayIndex:4, pace_zone:"threshold"}, {dayIndex:6, pace_zone:"interval"}];
  assertEqual("findRescheduleDay : aucun jour sûr, pas prioritaire -> abandon (null)", findRescheduleDay({pace_zone:"interval"}, week3, [0,1,2,3,4,5,6], false), null);
  // Même cas mais séance de qualité (prioritaire) -> retente en assouplissant,
  // prend le premier jour libre malgré tout plutôt que d'abandonner.
  assertEqual("findRescheduleDay : aucun jour sûr, mais prioritaire -> assoupli, pas d'abandon", findRescheduleDay({pace_zone:"interval"}, week3, [0,1,2,3,4,5,6], true), 1);

  // Aucun jour disponible du tout -> abandon, même prioritaire.
  assertEqual("findRescheduleDay : aucun jour disponible -> abandon même prioritaire", findRescheduleDay({pace_zone:"easy"}, [], [], true), null);
}

// --- detectEfficiencyImprovement (4.3.e, recalibrage) ---
{
  // Vraie progression : 7'00/km (420s) à FC150 -> 6'30/km (390s) à FC150.
  // Ratio 2.8 -> 2.6 (environ -7,1%, au-delà du seuil de 5%), allure
  // réellement plus rapide -> détecté.
  const baseline1 = [{allure:420, fc:150}, {allure:420, fc:150}];
  const recent1 = [{allure:390, fc:150}, {allure:390, fc:150}];
  assertEqual("detectEfficiencyImprovement : vraie progression (allure + ratio) -> true", detectEfficiencyImprovement(recent1, baseline1), true);

  // Faux positif à écarter : même allure (420), mais FC monte à 160 ->
  // ratio baisse (2.8 -> 2.625, -6,25%) mais l'allure n'a PAS progressé ->
  // ne doit jamais être détecté comme un progrès (fatigue/chaleur possible).
  const recent2 = [{allure:420, fc:160}, {allure:420, fc:160}];
  assertEqual("detectEfficiencyImprovement : FC qui monte pour la même allure -> false (pas un vrai progrès)", detectEfficiencyImprovement(recent2, baseline1), false);

  // Amélioration réelle mais sous le seuil de 5% -> pas détecté.
  const recent3 = [{allure:410, fc:150}, {allure:410, fc:150}]; // ratio 2.733, ~2.4% mieux seulement
  assertEqual("detectEfficiencyImprovement : amélioration sous le seuil de 5% -> false", detectEfficiencyImprovement(recent3, baseline1), false);

  // Pas assez de données (1 séance) dans une des deux fenêtres -> false.
  assertEqual("detectEfficiencyImprovement : pas assez de séances récentes -> false", detectEfficiencyImprovement([{allure:390,fc:150}], baseline1), false);
  assertEqual("detectEfficiencyImprovement : pas assez de séances de référence -> false", detectEfficiencyImprovement(recent1, [{allure:420,fc:150}]), false);
}

// ---------- Lot 3 : carte « Vérifions N sorties » (D109) ----------
{
  const day = (i) => Date.UTC(2026, 0, 1) + i*86400000;
  const run = (i, dist, pace, extra) => ({ id:"r"+i, ts:day(i), appleType:"Running", type:"EF", dist, durationSec:dist*pace, blocks:0, typeChecked:false, ...(extra||{}) });
  // un coureur qui progresse régulièrement (8'30 → 7'35) : rien de douteux, alors qu'une moyenne sur l'année marquerait la fin « rapide »
  const prog = Array.from({ length:12 }, (_, i) => run(i, 7, 510 - i*5));
  assertEqual("à vérifier : une progression régulière ne déclenche rien", doubtfulRuns(prog), []);
  const base = Array.from({ length:8 }, (_, i) => run(i, 8, 420));   // 7'00 habituel
  const race = run(10, 10.0, 355);                 // 10 km à 5'55
  const tempo = run(11, 8, 370);                   // 6'10, 88 % de l'habitude
  const short = run(12, 1.5, 450);
  const mid = run(13, 8, 390);                     // 6'30 : 93 %, pas assez rapide pour être douteux
  const out = doubtfulRuns([...base, race, tempo, short, mid]);
  assertEqual("à vérifier : la plus récente d'abord ; course (distance de course), seuil, très courte", out.map(d => [d.id, d.reason, d.race, d.suggestion]), [["r12","courte",false,"Récup"],["r11","rapide",false,"Seuil"],["r10","rapide",true,"Course"]]);
  assertEqual("à vérifier : allure habituelle = médiane des sorties précédentes", Math.round(out[2].refPace), 420);
  assertEqual("à vérifier : une sortie déjà vérifiée n'est plus proposée", doubtfulRuns([...base, { ...race, typeChecked:true }]).length, 0);
  assertEqual("à vérifier : un type choisi par l'utilisateur (Course, Seuil, Fractionné, Récup) n'est pas proposé", doubtfulRuns([...base, { ...race, type:"Course" }, { ...tempo, type:"Seuil" }, { ...short, type:"Récup" }]).length, 0);
  assertEqual("à vérifier : une « Long » rapide l'est aussi (10 km de Leïla resté Long)", doubtfulRuns([...base, { ...race, type:"Long" }]).map(d => d.suggestion), ["Course"]);
  assertEqual("à vérifier : séance à blocs de la montre jamais proposée comme rapide", doubtfulRuns([...base, { ...tempo, blocks:6 }]).length, 0);
  assertEqual("à vérifier : moins de 4 sorties avant, pas de référence (sauf très courte)", doubtfulRuns([run(0, 8, 420), run(1, 8, 420), run(2, 10, 340), run(3, 1.2, 420)]).map(d => d.id), ["r3"]);
  assertEqual("à vérifier : marche et séances saisies à la main ignorées", doubtfulRuns([...base, { ...race, appleType:"Walking" }, { ...short, appleType:"manual" }]).length, 0);
  assertEqual("à vérifier : moins de 300 m (montre lancée par erreur) ignoré", doubtfulRuns([...base, run(14, 0.15, 400), run(15, 0.29, 400), run(16, 0.3, 400)]).map(d => d.id), ["r16"]);
  assertEqual("à vérifier : distance ou durée manquante ignorée, liste vide sans erreur", [doubtfulRuns([...base, { ...race, dist:0 }, { ...tempo, durationSec:0 }]).length, doubtfulRuns(null).length], [0, 0]);
}

// --- classifyRunType ---
{
  // Réutilise le pattern fractionné déjà validé ci-dessus.
  function mkIntervalSeries2(cyclePeriod, amplitude, totalDur){
    const pts=[];
    for(let t=0;t<=totalDur;t+=15){
      const phase=(t%cyclePeriod)/cyclePeriod;
      pts.push({t, hr: Math.round(155 + Math.sin(phase*2*Math.PI-Math.PI/2)*amplitude)});
    }
    return pts;
  }
  const fractionneSeries = mkIntervalSeries2(250, 25, 2000);
  assertEqual("classifyRunType : pattern fractionné -> Fractionné", classifyRunType(8, fractionneSeries, 191, 60).type, "Fractionné");
  assertEqual("classifyRunType : priorité Fractionné avant Long (même >10km)", classifyRunType(15, fractionneSeries, 191, 60).type, "Fractionné");

  // 30min à 90% FC max (zone 4) : Seuil, même sous 10km.
  const seuilSeries = [];
  for(let t=0;t<=1800;t+=15) seuilSeries.push({t, hr:172});
  assertEqual("classifyRunType : zones 3-5 majoritaires -> Seuil", classifyRunType(6, seuilSeries, 191, 60).type, "Seuil");

  // >10km, sans données FC -> Long malgré tout (pas besoin de FC pour cette règle).
  assertEqual("classifyRunType : distance >10km sans FC -> Long", classifyRunType(12, null, 191, 60).type, "Long");

  // 30min à 145bpm (zone 2) : EF qualitatif.
  const efCleanSeries = [];
  for(let t=0;t<=1800;t+=15) efCleanSeries.push({t, hr:145});
  const efClean = classifyRunType(6, efCleanSeries, 191, 60);
  assertEqual("classifyRunType : zones 1-2 majoritaires -> EF qualitatif", [efClean.type, efClean.qualitatif], ["EF", true]);

  // Mélange zone 2 (55%) / zone 4 (45%) : ni Seuil (<=50% en 3-5) ni EF propre (<70% en 1-2).
  const efMessySeries = [];
  for(let t=0;t<=1100;t+=15) efMessySeries.push({t, hr:145});
  for(let t=1115;t<=2000;t+=15) efMessySeries.push({t, hr:170});
  const efMessy = classifyRunType(6, efMessySeries, 191, 60);
  assertEqual("classifyRunType : séance hétérogène -> EF non qualitatif", [efMessy.type, efMessy.qualitatif], ["EF", false]);

  // Pas de données FC du tout -> EF, mais qualitatif inconnu (null), pas false.
  const efUnknown = classifyRunType(6, null, 191, 60);
  assertEqual("classifyRunType : pas de FC -> EF, qualitatif inconnu (null)", [efUnknown.type, efUnknown.qualitatif], ["EF", null]);
}
