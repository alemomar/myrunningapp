<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MyRunningApp</title>
<!-- PWA : permet d'ajouter l'app à l'écran d'accueil iOS/Android, ouverture
     en plein écran sans barre de navigateur (2026-09-20). -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyRunningApp">
<!-- Polices servies par l'app elle-même (web/fonts, ~15 Ko chacune, jeu latin) : pas de connexion
     à un serveur tiers à l'ouverture. On précharge la plus utilisée (Barlow 400) ; font-display:swap
     affiche tout de suite le texte avec la police du système, puis bascule sur Barlow.
     À ajouter quand les titres passeront en Condensed (S4) : préchargement de barlow-condensed-700. -->
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
/* Jetons du design gelé (journal v48, docs/design/tokens.css). Thème sombre seul.
   Si tokens.css change, reporter le changement ici : l'app n'a qu'un fichier de style. */
:root{
  /* Fonds et surfaces */
  --bg:#0C0D0F;
  --surface:#17191C;
  --surface-sunken:#0F1113;
  --surface-raised:#1B1E21;
  --surface-control:#22252A;
  --line:#26292E;
  --line-field:#2A2E33;
  --line-empty:#33373D;
  --grabber:#3A4047;
  /* Texte */
  --text:#F2F3F0;
  --text-2:#C9CCD0;
  --text-3:#A3A7AD;
  --text-muted:#8B8F96;
  --text-faint:#5A6068;
  --on-accent:#0C0D0F;
  /* Couleurs de rôle : citron = action principale / EF / progrès ; blanc = réglages et sélections ; violet = attention */
  --accent:#C6F432;
  --accent-soft:rgba(198,244,50,.12);
  --select:#F2F3F0;
  --select-soft:rgba(242,243,240,.07);
  --attention:oklch(0.72 0.17 300);
  --attention-bg:oklch(0.72 0.17 300 / .10);
  --attention-bg-strong:oklch(0.72 0.17 300 / .16);
  --attention-line:oklch(0.72 0.17 300 / .40);
  /* Données (graphiques) */
  --data-cyan:oklch(0.85 0.13 200);
  --data-coral:oklch(0.7 0.19 25);
  --data-heart:oklch(0.62 0.22 25);
  --data-neutral:#8B8F96;
  /* Types de séance */
  --type-ef:#C6F432;
  --type-long:oklch(0.8 0.12 160);
  --type-fractionne:oklch(0.62 0.13 45);
  --type-seuil:oklch(0.74 0.11 80);
  --type-course:oklch(0.62 0.22 25);
  --type-recup:oklch(0.86 0.01 250);
  --type-marche:oklch(0.74 0.05 70);
  --type-renfo:oklch(0.72 0.14 250);
  --type-souple:oklch(0.75 0.13 330);
  --type-etirements:oklch(0.82 0.09 350);
  --type-autre:#8B8F96;
  /* Typographie */
  --font-display:"Barlow Condensed",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --font-text:"Barlow",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  /* Arrondis */
  --r-xs:10px; --r-sm:12px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-sheet:26px; --r-pill:999px;
  /* Tailles */
  --tap-min:44px; --btn-h:48px; --field-h:48px; --chip-h:36px;
  /* Ombres et animations */
  --shadow-sheet:0 -10px 40px rgba(0,0,0,.5);
  --shadow-lift:0 14px 30px rgba(0,0,0,.6);
  --ease:cubic-bezier(.2,.8,.2,1);
  --t-fast:200ms;

  /* Anciens noms, gardés le temps de la refonte pour que l'existant se recolore
     d'un coup. À supprimer quand les écrans auront migré (tranches S4 à S11). */
  --card:var(--surface);
  --card-2:var(--surface-control);
  --border:var(--line);
  --text-dim:var(--text-3);
  --accent-dim:var(--accent-soft);
  --radius-lg:var(--r-xl);
  --radius-md:var(--r-md);
  --radius-sm:var(--r-xs);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-text);
  min-height:100vh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font-family:inherit}
::selection{background:var(--accent);color:var(--on-accent)}

/* ---------- Auth ---------- */
#authView{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  max-width:360px;margin:0 auto;padding:32px 24px;
}
.auth-icon{
  width:72px;height:72px;border-radius:22px;margin:0 auto 20px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(198,244,50,0.25);
}
#authView h1{font-size:26px;font-weight:700;text-align:center;letter-spacing:-.4px}
#authView .tagline{text-align:center;color:var(--text-dim);font-size:14px;margin-top:6px;margin-bottom:32px}
.field{
  display:flex;align-items:center;gap:10px;
  background:var(--surface-sunken);border:1px solid var(--line-field);border-radius:var(--r-md);
  min-height:var(--field-h);padding:12px 16px;margin-bottom:12px;transition:border-color var(--t-fast);
}
.field:focus-within{border-color:var(--select)}
.field svg{flex-shrink:0;color:var(--text-faint)}
.field input{
  flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;
}
.field input::placeholder{color:var(--text-faint)}
.goal-level-cards{display:flex;gap:6px}
.goal-level-card{flex:1;padding:7px 6px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.goal-level-card.active{border-color:var(--select);background:var(--select-soft)}
.goal-level-card .lbl{font-size:12px;font-weight:600}
.goal-level-card .sub{font-size:9px;color:var(--text-dim);margin-top:1px;line-height:1.2}
.goal-slot-switch{display:flex;gap:6px;margin-bottom:0}
.goal-sticky-header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:10px;padding-bottom:10px;margin-top:-10px}
.goal-sticky-header .card{padding:10px 12px;margin-bottom:8px}
.goal-sticky-header .stitle{margin-bottom:8px}
.goal-slot-btn{flex:1;padding:7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:border-color .15s,background .15s,color .15s}
.goal-slot-btn.active-principal{border-color:var(--select);background:var(--select-soft);color:var(--select)}
.goal-slot-btn.active-secondaire{border-color:var(--select);background:var(--select-soft);color:var(--select)}
.goal-principal-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal-principal-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);cursor:pointer;transition:border-color .15s,background .15s}
.goal-principal-card.active{border-color:var(--select);background:var(--select-soft)}
.goal-principal-card .icon-wrap{width:32px;height:32px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);transition:color .15s,background .15s}
.goal-principal-card.active .icon-wrap{color:var(--select);background:var(--select-soft)}
.goal-principal-card .lbl{font-size:12.5px;font-weight:600;line-height:1.25}
@media (prefers-reduced-motion: no-preference){
  .goal-principal-card.active .icon-wrap{animation:goalIconPop .4s cubic-bezier(.34,1.56,.64,1)}
  .goal-principal-card.active .icon-wrap svg{animation:goalIconFloat 2.4s ease-in-out infinite}
}
@keyframes goalIconPop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes goalIconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pace-stepper{display:flex;align-items:center;gap:12px}
.pace-stepper button{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-control);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.pace-stepper .val{font-weight:700;font-size:15px;min-width:64px;text-align:center}
.time-input{width:44px;background:var(--surface-sunken);border:1px solid var(--line-field);border-radius:var(--r-xs);color:var(--text);font-size:14px;text-align:center;padding:8px 0}
/* Icône native du sélecteur de date invisible sur fond sombre (icône noire
   par défaut) sans ce filtre — l'utilisateur ne voyait pas qu'un calendrier
   était cliquable et pensait devoir saisir la date au clavier. */
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8);cursor:pointer}
.btn-primary{
  width:100%;min-height:var(--btn-h);padding:0 20px;border-radius:24px;border:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;cursor:pointer;
  margin-top:6px;transition:transform .1s, opacity .15s;
}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:.5}
/* Confirmation animée après un "Enregistrer" — un simple changement de texte
   passe inaperçu (bug remonté : "on a l'impression que le bouton ne
   fonctionne pas"), un vrai mouvement (pop avec rebond) se voit. Reste
   affichée (pas de disparition) : le message est le signal, pas une nuisance. */
.save-confirm{display:flex;align-items:center;justify-content:center;gap:6px;width:fit-content;margin:8px auto 0;min-height:16px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--accent)}
.save-confirm:not(:empty){min-height:26px;padding:0 12px;background:var(--accent-soft)}
@media (prefers-reduced-motion: no-preference){
  .save-confirm.show{animation:saveConfirmPop .5s cubic-bezier(.34,1.56,.64,1)}
}
@keyframes saveConfirmPop{
  0%{opacity:0;transform:translateY(2px) scale(0.85)}
  60%{opacity:1;transform:scale(1.08)}
  100%{opacity:1;transform:scale(1)}
}
/* ---------- Éléments dynamiques (CDC v2, 4.11) ----------
   Toutes les animations sont déclarées dans ce bloc "no-preference" : si
   l'appareil demande de réduire les animations, rien ne bouge et les
   valeurs finales s'affichent directement (4.11.a). */
@media (prefers-reduced-motion: no-preference){
  #content.view-in{animation:viewIn .2s ease-out}
  .expand-in{animation:expandIn .2s ease-out}
  .chip-pop{animation:chipPop .25s cubic-bezier(.34,1.56,.64,1)}
  .week-dot-today{animation:todayPulse 2.6s ease-in-out infinite}
  .check-draw path{stroke-dasharray:24;stroke-dashoffset:24;animation:checkDraw .4s ease-out .1s forwards}
}
@media (prefers-reduced-motion: no-preference){
  .fill-in{animation:fillIn .8s ease-out both}
  .marker-slide{animation:markerSlide .8s cubic-bezier(.22,1,.36,1) both}
}
@keyframes fillIn{from{clip-path:inset(0 100% 0 0 round 5px)}to{clip-path:inset(0 0 0 0 round 5px)}}
@keyframes markerSlide{from{left:0%}to{left:var(--pos)}}
[data-countup]{font-variant-numeric:tabular-nums}
.celebrate-card{position:relative;overflow:hidden}
.celebrate-card .spark{position:absolute;top:26px;left:30px;width:6px;height:6px;border-radius:50%;opacity:0}
@media (prefers-reduced-motion: no-preference){
  .celebrate-card.play{animation:celebratePop .5s cubic-bezier(.34,1.56,.64,1) both}
  .celebrate-card.play .spark{animation:sparkOut .9s ease-out .25s both}
}
@keyframes celebratePop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes sparkOut{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes expandIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes chipPop{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes todayPulse{0%,100%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}50%{box-shadow:0 0 0 3px var(--bg),0 0 0 7px rgba(245,245,247,.3)}}
@keyframes checkDraw{to{stroke-dashoffset:0}}
#authError{color:var(--text-2);font-size:13px;margin-top:12px;text-align:center;min-height:16px;line-height:1.4}
#authSwitch{margin-top:22px;font-size:13px;color:var(--accent);text-align:center;cursor:pointer;font-weight:500}

/* ---------- App shell ---------- */
#appView{display:none;max-width:640px;margin:0 auto}
@media (min-width:700px){
  #appView{max-width:960px}
}
.topbar{
  padding:calc(env(safe-area-inset-top) + 18px) 20px 8px;
}
.topbar-title{font-size:28px;font-weight:700;letter-spacing:-.6px}
.topbar-title span{color:var(--accent)}

/* ---------- KPI ring + grid ---------- */
.hero{padding:4px 20px 18px;display:flex;align-items:center;gap:20px}
.ring-wrap{position:relative;width:108px;height:108px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-label{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-label .val{font-size:19px;font-weight:700}
.ring-label .unit{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.hero-rings-row{display:flex;justify-content:space-between;gap:8px}
.ring-wrap-sm{position:relative;width:90px;height:90px;flex-shrink:0}
.ring-wrap-sm svg{transform:rotate(-90deg)}
.ring-label-sm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label-sm .val{font-size:17px;font-weight:700}
.ring-label-sm .unit{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.ring-caption{font-size:11px;color:var(--text-dim);text-align:center}
.hero-stats{flex:1;display:flex;flex-direction:column;gap:10px}
.hero-stat{display:flex;justify-content:space-between;align-items:baseline}
.hero-stat .lbl{font-size:13px;color:var(--text-dim)}
.hero-stat .v{font-size:15px;font-weight:600}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 20px 20px}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px;display:flex;flex-direction:column;gap:8px;
  /* Sans ça, une grille à 3 colonnes (voir kpisHTML) déborde à droite :
     par défaut une cellule de grille ne rétrécit jamais sous la largeur de
     son contenu le plus long (ex: "Allure dernier mois" sur une ligne),
     même si ça dépasse largement sa part de 1fr — d'où la dernière carte
     coupée à droite alors que la marge de gauche reste correcte. */
  min-width:0;
}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-icon{
  width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
}
.kpi-val{font-size:19px;font-weight:700;letter-spacing:-.3px}
.kpi-lbl{font-size:11px;color:var(--text-dim)}

/* ---------- Bottom nav ---------- */
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;justify-content:space-around;
  background:rgba(20,20,22,0.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-faint);cursor:pointer;
  padding:4px 6px;flex:1;min-width:0;
}
.tab-btn svg{width:20px;height:20px}
.tab-btn span{font-size:9px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab-btn.active{color:var(--accent)}

/* ---------- Content cards ---------- */
#content{padding:0 20px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:14px;
}
.tutorial-modal-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.tutorial-modal-card{max-width:340px;width:100%;margin-bottom:0;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.stitle{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase}
.chart-hint{font-size:12px;color:var(--text-faint);margin-top:-8px;margin-bottom:12px}

.card-row{display:flex;flex-direction:column}
@media (min-width:700px){
  .card-row{flex-direction:row;gap:14px}
  .card-row>.card{flex:1;min-width:0}
}

.session-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.session-row:last-child{border-bottom:none}
.session-dot{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.session-main{flex:1;min-width:0}
.session-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.session-sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.session-right{text-align:right;flex-shrink:0}
.session-pace{font-size:14px;font-weight:700;color:var(--accent)}
.session-hr{font-size:11px;color:var(--text-dim);margin-top:2px}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.type-select{background:var(--surface-sunken);border:1px solid var(--line-field);color:var(--text);border-radius:var(--r-xs);padding:5px 6px;font-size:12px;font-weight:600;font-family:inherit;width:100%}
.toggle{position:relative;width:42px;height:25px;flex-shrink:0}
.toggle input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.toggle .track{position:absolute;inset:0;background:var(--surface-control);border-radius:13px;transition:background var(--t-fast)}
.toggle .thumb{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--text-3);transition:transform var(--t-fast),background var(--t-fast)}
.toggle input:checked ~ .track{background:var(--select)}
.toggle input:checked ~ .thumb{background:var(--on-accent)}
.toggle input:checked ~ .thumb{transform:translateX(17px)}

.manage-row{padding:14px 0;border-bottom:1px solid var(--border)}
.manage-row:last-child{border-bottom:none}
.manage-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.manage-date{font-size:14px;font-weight:600;flex:1}
.toggle-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.toggle-col span{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.delete-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--card-2);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.delete-btn:hover{background:var(--surface-control);color:var(--text);border-color:var(--line-field)}
.manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-left:48px}
.manage-field{display:flex;flex-direction:column;gap:4px}
.field-lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.field-val{font-size:13px;font-weight:600}
.field-sub{font-size:10px;color:var(--text-faint)}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px}
.flt{display:inline-flex;align-items:center;min-height:var(--chip-h);padding:0 14px;border-radius:var(--r-pill);font-size:13px;cursor:pointer;background:var(--surface-sunken);color:var(--text-3);border:1px solid var(--line-field);font-weight:500;white-space:nowrap}
.flt.active{background:var(--select);border-color:var(--select);color:var(--on-accent);font-weight:600}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-state svg{color:var(--text-faint);margin-bottom:14px}
.empty-state .title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-state .sub{font-size:13px;line-height:1.5}


.loading{display:flex;justify-content:center;padding:60px 0}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--card-2);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.soon-card{text-align:center;padding:44px 22px}
.soon-card svg{color:var(--text-faint);margin-bottom:16px}
.soon-badge{display:inline-block;background:var(--accent-dim);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:12px}
.soon-card h3{font-size:17px;font-weight:700;margin-bottom:8px}
.soon-card p{font-size:13px;color:var(--text-dim);line-height:1.6;max-width:320px;margin:0 auto}

.pain-row{padding:10px 0;border-bottom:1px solid var(--border)}
.pain-row:last-child{border-bottom:none}
.pain-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pain-row-top .lbl{font-size:13px;color:var(--text)}
.pain-row-top .val{font-size:13px;font-weight:700;min-width:20px;text-align:right}
.pain-row input[type="range"],.zone-row input[type="range"]{width:100%;accent-color:var(--select);height:20px}
.scale-ticks{display:flex;justify-content:space-between;margin-top:1px}
.scale-ticks span{font-size:9px;color:var(--text-faint);width:12px;text-align:center;font-variant-numeric:tabular-nums}
.pain-scale{display:flex;justify-content:space-between;gap:10px;margin-top:2px}
.pain-scale span{font-size:10px;color:var(--text-faint);line-height:1.3;max-width:47%}
.body-map-wrap{display:flex;gap:16px;align-items:flex-start;margin-top:4px}
.body-svg{flex-shrink:0}
/* Téléphone : la silhouette (257 px fixes) ne laisse pas de place au panneau
   de détail à côté d'elle (il ne restait qu'une trentaine de pixels, curseurs
   coupés) -> le panneau passe dessous, pleine largeur. */
@media (max-width:560px){
  .body-map-wrap{flex-direction:column;align-items:center;gap:10px}
  .zone-rows{width:100%;align-self:stretch;padding-top:0;grid-template-columns:1fr}
}
.body-svg .zone{cursor:pointer;transition:opacity .15s,filter .15s}
.body-svg .zone:hover{opacity:.8}
.body-svg .zone.active{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 4px #fff)}
.zone-rows{flex:1;min-width:0;padding-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(max(150px,32%),1fr));gap:0 16px;align-content:start}
.zone-placeholder{grid-column:1/-1;font-size:12px;color:var(--text-faint);padding:10px 0}
.zone-row{padding:4px 0;border-bottom:1px solid var(--border)}
.session-pick{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.session-pick:last-child{border-bottom:none}
.session-pick .rated{color:var(--accent);font-size:11px;font-weight:600}
.month-sep{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text);padding:18px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.month-sep:first-child{padding-top:0}

/* Programme : calendrier semaine (colonnes) / mois (empilement de
   plateaux-semaine, un par semaine du mois affiché) — les 7 jours
   tiennent toujours sans swipe horizontal (colonnes à largeur égale,
   `.prog-board` ne scrolle plus). Drag and drop d'une séance déclenché
   par un appui long (~0,5s), volontairement PAS en drag-and-drop HTML5
   natif (dragstart/dragover) : ce dernier ne fonctionne pas de façon
   fiable au doigt sur mobile/Safari, or l'usage principal de l'app est
   la PWA iPhone. Implémenté avec les Pointer Events (unifie souris/
   tactile), voir progDragStart/Move/End.
   .prog-card-mini.draggable (uniquement les cartes séance, pas les cases
   "Repos") a `touch-action:none` STATIQUE (pas posé en JS à l'armement) :
   Safari iOS décide dès le premier contact si le doigt peut déclencher un
   scroll natif, et l'imposer plus tard en JS n'a aucun effet sur le geste
   déjà en cours — sans ça, dès que le doigt bouge vers un autre jour, iOS
   bascule en scroll natif et annule le pointeur (pointercancel), donc la
   carte s'arme mais ne se déplace jamais. */
.prog-board{display:flex;gap:3px}
.prog-daycol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:4px 1px;border:1px solid transparent;transition:background .15s,border-color .15s}
.prog-daycol.outmonth{opacity:0.35}
.prog-daycol.selected{background:var(--card-2)}
.prog-daycol.dragover{background:var(--accent-dim);border-color:var(--accent)}
.prog-daycol-hdr{font-size:9px;color:var(--text-dim);text-align:center;text-transform:uppercase;line-height:1.3;margin-bottom:4px}
.prog-daycol-hdr b{display:block;font-size:13px;font-weight:700;color:var(--text)}
.prog-daycol.today .prog-daycol-hdr b{color:var(--accent)}
.prog-card-mini{width:100%;min-height:46px;box-sizing:border-box;border-radius:9px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 1px;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.prog-card-mini.draggable{touch-action:none}
.prog-card-mini + .prog-card-mini{margin-top:4px}
.prog-card-mini.rest{background:var(--card-2);color:var(--text-dim);font-size:9px;border-style:dashed}
.prog-card-mini-lbl{font-size:8px;font-weight:600;color:var(--text);text-align:center;line-height:1.2}
.prog-card-mini-check{position:absolute;top:2px;right:3px;font-size:9px;color:var(--accent);font-weight:700}
.prog-card-mini.prog-armed{transform:scale(1.12);box-shadow:0 8px 20px rgba(0,0,0,0.35);z-index:5}
.prog-ghost{position:fixed;z-index:999;pointer-events:none;opacity:0.92;transform:scale(1.12);box-shadow:0 10px 24px rgba(0,0,0,0.4);border-radius:9px;box-sizing:border-box}
.prog-week-label{font-size:11px;font-weight:600;color:var(--text-dim);margin:14px 0 6px}
.prog-week-label:first-child{margin-top:0}
.account-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.account-row:last-child{border-bottom:none}
.account-row .lbl{font-size:13px;color:var(--text-dim)}
.account-row .v{font-size:13px;font-weight:600}
.btn-secondary{
  width:100%;min-height:var(--btn-h);padding:0 20px;border-radius:24px;border:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-control);color:var(--text);font-weight:600;font-size:15px;cursor:pointer;
}
.btn-danger{color:var(--text-3);background:none;border:none;font-size:14px;font-weight:500;cursor:pointer;padding:12px 0}

/* ---------- Dernière séance (hero, repliable) ---------- */
.last-run-card{
  background:linear-gradient(160deg,var(--card) 0%,var(--card-2) 100%);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px 20px;margin-bottom:14px;position:relative;overflow:hidden;
}
.last-run-card.expanded{padding-bottom:20px}
.last-run-eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.last-run-head{display:flex;align-items:center;gap:12px;margin-top:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.last-run-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.last-run-title{font-size:17px;font-weight:700}
.last-run-sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.last-run-collapsed-km{font-size:15px;font-weight:700;flex-shrink:0}
.last-run-chevron{color:var(--text-faint);flex-shrink:0;transition:transform .2s}
.last-run-card.expanded .last-run-chevron{transform:rotate(180deg)}

.last-run-body{display:flex;flex-direction:column;gap:16px;margin-top:16px}
@media (min-width:700px){
  .last-run-body{flex-direction:row}
  .last-run-left{flex:1.2;min-width:0}
  .last-run-right{flex:1;min-width:0}
}
.last-run-right{display:flex;flex-direction:column;gap:8px;justify-content:center}
.last-run-stat-row{background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);padding:9px 14px}
.last-run-stat-row .l{font-size:11px;color:var(--text-dim)}
.last-run-stat-row .v{font-size:17px;font-weight:700;letter-spacing:-.2px;margin-top:1px}
.last-run-stat-row .cmp{font-size:10px;color:var(--text-faint);margin-top:3px}

/* Célébration : entrée en pop + éclats qui partent de l'icône. Ne joue
   qu'une fois par ouverture du dashboard (voir renderContent), jamais si
   l'utilisateur préfère moins d'animation. */
@media (prefers-reduced-motion: no-preference){
  .last-run-card.celebrate{animation:lastRunPop .5s cubic-bezier(.34,1.56,.64,1) both}
  .last-run-card.celebrate .last-run-icon::before,
  .last-run-card.celebrate .last-run-icon::after{
    content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);
    top:50%;left:50%;opacity:0;animation:lastRunSpark .9s ease-out .25s both;
  }
  .last-run-card.celebrate .last-run-icon::after{background:#ffd60a;animation:lastRunSpark2 .9s ease-out .35s both}
}
@keyframes lastRunPop{
  0%{opacity:0;transform:scale(.94) translateY(6px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes lastRunSpark{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + 34px),calc(-50% - 28px)) scale(0)}
}
@keyframes lastRunSpark2{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% - 30px),calc(-50% - 20px)) scale(0)}
}
.sheet-back{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box}
.sheet-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.sheet-input{background:var(--surface-sunken);border:1px solid var(--line-field);border-radius:var(--r-sm);color:var(--text);font-size:16px;min-height:var(--tap-min);padding:9px 12px;font-family:inherit;box-sizing:border-box}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Graphiques : même police que le texte (par défaut Chart.js prend Helvetica).
if(window.Chart){ Chart.defaults.font.family = getComputedStyle(document.documentElement).getPropertyValue("--font-text").trim() || "sans-serif"; }

// Couleurs par type (D24, design v48). Écrites en hexadécimal, équivalents exacts des
// --type-* du design (oklch) : plusieurs gabarits ajoutent un suffixe de transparence
// (`${c}22`), ce qui ne marche qu'avec une couleur hexadécimale.
// Yoga, Mobilité, Pilates, Kiné partagent --type-souple ; Souplesse (renommé Étirements en S2).
const TC={
  EF:"#C6F432", Long:"#71D6A3", "Fractionné":"#C56A3E", "Seuil":"#CFA354", "Récup":"#CCD2D7", Course:"#EE343B",
  Marche:"#C0A689", Renfo:"#59AAF8", Yoga:"#DC8FD5", "Mobilité":"#DC8FD5", "Souplesse":"#F1ACCC",
  "Kiné":"#DC8FD5", Pilates:"#DC8FD5", Other:"#8B8F96"
};
const TICON={
  EF:"runner", Long:"route", "Fractionné":"bolt", "Seuil":"flame", "Récup":"runner", Course:"flag",
  Marche:"walk", Renfo:"dumbbell", Yoga:"yoga", "Mobilité":"stretch", "Souplesse":"bend",
  "Kiné":"care", Pilates:"ring", Other:"activity"
};
const TYPE_OPTIONS=["EF","Long","Fractionné","Seuil","Récup","Course","Marche","Renfo","Yoga","Mobilité","Souplesse","Kiné","Pilates","Other"];
// Sous-ensemble de TYPE_OPTIONS proposé pour PLANIFIER une séance (bouton
// "+ Ajouter") — Marche et Récup retirés à la demande : ce ne sont pas des
// séances qu'on planifie à l'avance dans ce contexte. TYPE_OPTIONS reste
// inchangé pour Séances (classer une activité réellement synchronisée).
const PROGRAM_TYPE_OPTIONS = TYPE_OPTIONS.filter(t=>t!=="Marche" && t!=="Récup");
const MONTHS=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];

const ICONS = {
  sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>`,

  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>`,

  target: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>`,

  heart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,

  dumbbell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="9" width="4" height="6" rx="1"/><rect x="19" y="9" width="4" height="6" rx="1"/><line x1="5" y1="12" x2="19" y2="12"/><rect x="7" y="7" width="2" height="10" rx="1"/><rect x="15" y="7" width="2" height="10" rx="1"/></svg>`,

  activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
  walk: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M13 6v5"/><path d="M13 11l-3 3"/><path d="M13 11l3 7"/><path d="M13 8l4 2"/><path d="M10 9l-2 2"/></svg>`,

function mapRow(r){
  const d=new Date(r.start_date);
  const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0");
  return {
    id:r.id,
    date:`${dd}/${mm}`,
    // Date complète (avec année) conservée à part : `date` (dd/mm) seul ne
    // suffit pas pour reconstruire une année fiable au-delà de l'année en
    // cours — voir dateFromRun().
    fullDate:d,
    label:`${dd} ${MONTHS[d.getMonth()]}`,
    time:d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
    type:r.type||"Other",
    appleType:r.apple_type||null,
    lieu:r.lieu||"",
    dist:Number(r.distance_km)||0,
    dur:fmtDur(r.duration_sec),
    durationSec:Number(r.duration_sec)||0,
    allure:r.distance_km>0?Math.round(r.duration_sec/r.distance_km):null,
    fc:r.avg_hr||null,
    peakHr:r.peak_hr||null,
    pw:r.avg_power||null,
    cad:r.avg_cadence||null,
    cal:r.calories||null,
    effort:r.effort||null,
    notes:r.notes||undefined,
    includeInStats: r.include_in_stats !== false,
    legsFocused: r.legs_focused === null || r.legs_focused === undefined ? null : !!r.legs_focused,
    painRatings: r.pain_ratings || null,
    hrSeries: r.hr_series || null,
    paceSeries: r.pace_series || null,
    lapMarkers: r.lap_markers || null,
    fracWorkManual: r.frac_work_manual || null,
    fracRecoveryManual: r.frac_recovery_manual || null,
  };
}

// Le dernier onglet consulté est mémorisé en local (par appareil) pour
// qu'un rechargement de page reste sur place plutôt que de repartir sur
// le Dashboard à chaque fois. Identifié par une clé stable (pas un index
// numérique dans TABS) : un index se serait décalé silencieusement vers
// le mauvais onglet le jour où TABS serait réordonné (ex: Programme passé
// en 2e position) — déjà arrivé une fois, corrigé une bonne fois pour
// toutes. OLD_TAB_INDEX_TO_KEY migre l'ancien format (index numérique,
// utilisateurs existants) vers la clé correspondante à l'ORDRE D'ORIGINE
// des onglets, pas leur position actuelle.
// 3.c : Dashboard, Séances et Ressenti sont fusionnés dans "progression" ;
// 3.d : Objectifs et Mon compte sont fusionnés dans "profil" (deux sections).
// Les anciennes clés mémorisées sur l'appareil y redirigent, vers la bonne
// section pour objectifs/compte.
const VALID_TAB_KEYS = ["aujourdhui","programme","progression","profil"];
const LEGACY_TAB_KEYS = { dashboard:"progression", ressenti:"progression", seances:"progression", objectifs:"profil", compte:"profil" };
const OLD_TAB_INDEX_TO_KEY = ["dashboard","ressenti","objectifs","seances","compte","programme"];
const PROFIL_SECTIONS = ["objectifs","compte"];
let profilSection = "objectifs";
function setProfilSectionState(section){
  profilSection = section;
  try{ localStorage.setItem("mra_profilSection", section); }catch(e){}
}
function resolveTabKey(saved){
  let key = saved;
  const idx = Number(saved);
  if(!VALID_TAB_KEYS.includes(key) && !LEGACY_TAB_KEYS[key] && Number.isInteger(idx) && OLD_TAB_INDEX_TO_KEY[idx]) key = OLD_TAB_INDEX_TO_KEY[idx];
  if(PROFIL_SECTIONS.includes(key)) profilSection = key;
  if(LEGACY_TAB_KEYS[key]) key = LEGACY_TAB_KEYS[key];
  return VALID_TAB_KEYS.includes(key) ? key : null;
}
function initialActiveTab(){
  try{
    const savedSection = localStorage.getItem("mra_profilSection");
    if(PROFIL_SECTIONS.includes(savedSection)) profilSection = savedSection;
    const saved = localStorage.getItem("mra_activeTab");
    if(saved==null) return "aujourdhui";
    return resolveTabKey(saved) || "aujourdhui";
  }catch(e){ return "aujourdhui"; }
}
function persistActiveTab(){
  try{ localStorage.setItem("mra_activeTab", activeTab); }catch(e){}
}

async function loadData() {
  const { data, error } = await supa.from("runs").select("*").order("start_date", { ascending: true });
  if (error) { alert("Erreur de chargement : " + error.message); return; }
  RUNS = (data || []).map(mapRow);
  runningRuns = RUNS.filter(r=>r.includeInStats);
  efRuns = runningRuns.filter(r=>r.type==="EF");
  fracRuns = runningRuns.filter(r=>r.type==="Fractionné");

  const { data: { user } } = await supa.auth.getUser();
  userEmail = user?.email || "";

  // .maybeSingle() échoue (silencieusement si on ne vérifie pas l'erreur) dès
  // que la requête matche PLUS d'une ligne — ex: un doublon de profil pour ce
  // user_id. Sans ce garde-fou, tout le profil retombe à vide (profile
  // devient undefined) et ça donne l'impression que rien n'a jamais été
  // enregistré, alors que les écritures individuelles fonctionnent très bien.
  const { data: profile, error: profileError } = await supa.from("profiles").select("sync_since_date, goals, max_hr, resting_hr, resting_hr_updated_at, resting_hr_is_manual, vo2_max, vo2_max_updated_at, vo2_max_is_manual, avatar_url, pseudo, age, gender, cities, dashboard_period, program_settings, onboarding_completed_at, suspended_zones").maybeSingle();
  if(profileError){
    console.error("Erreur de chargement du profil :", profileError);
    alert("Erreur de chargement du profil : "+profileError.message+"\n\nTes réglages (Mon compte, Objectifs) risquent d'apparaître vides même s'ils sont bien enregistrés. Contacte-moi avec ce message.");
  }
  syncSinceDate = profile?.sync_since_date || null;
  goals = migrateGoals(profile?.goals || {});
  avatarUrl = profile?.avatar_url || null;
  maxHr = profile?.max_hr || null;
  restingHr = profile?.resting_hr || null;
  restingHrUpdatedAt = profile?.resting_hr_updated_at || null;
  restingHrIsManual = !!profile?.resting_hr_is_manual;
  vo2Max = profile?.vo2_max || null;
  vo2MaxUpdatedAt = profile?.vo2_max_updated_at || null;
  vo2MaxIsManual = !!profile?.vo2_max_is_manual;
  pseudo = profile?.pseudo || "";
  age = profile?.age || null;
  gender = profile?.gender || "";
  cities = profile?.cities || [];
  dashboardPeriod = profile?.dashboard_period || "monthly";
  programSettings = profile?.program_settings || {};
  onboardingCompletedAt = profile?.onboarding_completed_at || null;
  suspendedZones = Array.isArray(profile?.suspended_zones) ? profile.suspended_zones : [];

  const { data: plannedData, error: plannedError } = await supa.from("planned_sessions").select("*").order("planned_date", { ascending: true });
  if(plannedError){
    console.error("Erreur de chargement du programme :", plannedError);
  }
  plannedSessions = plannedData || [];
}

// Formule 220-âge par défaut : plus fiable que le pic FC observé en
// entraînement, qui sous-estime presque toujours la vraie FC max (on ne
// l'atteint qu'à l'effort quasi maximal, rarement en footing).
function estimatedMaxHr(){
  if(age) return 220 - age;
  const peaks = runningRuns.map(r=>r.peakHr).filter(Boolean);
  return peaks.length ? Math.max(...peaks) : null;
}

// Wrappers centralisant la gestion d'erreur réseau : sans ça, un upsert qui
// échoue silencieusement donne l'impression que rien n'est enregistré (cause
// du bug remonté sur Mon compte — plus jamais de write non vérifié).
// Anime la confirmation de sauvegarde (voir .save-confirm) : relance
// l'animation à chaque appel même si l'élément l'a déjà jouée récemment.
function flashSaved(elId, text="Enregistré"){
  const el = document.getElementById(elId);
  if(!el) return;
  el.innerHTML = `<svg class="check-draw" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>${escHtml(text)}`;
  el.classList.remove("show");
  void el.offsetWidth; // force le reflow pour relancer l'animation CSS

// getUser() peut renvoyer { user: null } (session expirée, cookie perdu...)
// sans lever d'erreur — sans ce garde-fou, "user.id" plante silencieusement
// AVANT même d'atteindre l'upsert, donc avant que la moindre alerte
// d'erreur puisse se déclencher : ça a l'air de marcher, rien n'est
// enregistré, et rien ne le signale (cause probable du bug "ça n'enregistre
// rien" remonté sur Mon compte).
async function upsertProfile(fields){
  const { data: { user }, error: authError } = await supa.auth.getUser();
  if(authError || !user){ alert("Session expirée — recharge la page et reconnecte-toi."); return false; }
  const { error } = await supa.from("profiles").upsert({ user_id: user.id, ...fields });
  if(error) alert("Erreur d'enregistrement : "+error.message);
  return !error;
}
async function updateRun(id, fields){
  const { error } = await supa.from("runs").update(fields).eq("id", id);
  if(error) alert("Erreur d'enregistrement : "+error.message);
  return !error;
}

// Semaines restantes avant la course, affichées en direct sous la date.
function weeksUntilText(dateStr){
  if(!dateStr) return "";
  const diffDays = Math.ceil((new Date(dateStr) - new Date())/86400000);
  if(diffDays<0) return "Date déjà passée";
  const weeks = Math.ceil(diffDays/7);
  return weeks===0 ? "C'est cette semaine !" : `Il te reste ${weeks} semaine${weeks>1?"s":""}`;
}
window.updateWeeksUntil = () => {

  if(out) out.textContent = weeksUntilText(document.getElementById("goal_dateCible")?.value);
};

// resauvegardé — aucune perte de données.
function migrateGoals(g){
  if(g.principal || g.secondaire) return g;
  const {niveau, autre, ...rest} = g;
  return { principal: rest, secondaire: {}, niveau, autre };
}

// au clic/à la saisie, comme le tronc commun, plutôt que de dépendre d'un
// bouton "Enregistrer" éloigné en bas de page.
window.selectChip = (field, value) => {
  // Le type d'objectif pilote quels blocs s'affichent (voir
  // OBJECTIF_BLOCKS) — un simple show/hide ciblé ne suffit plus comme
  // avant (juste le bloc course) : on écrit direct dans `goals` et on

  // bloc blessure / "Ta situation actuelle" se mettent à jour ensemble.
  // Les autres champs pas encore enregistrés de cet objectif repartent
  // de la dernière valeur sauvegardée — acceptable vu qu'un changement de
  // type change aussi ce qui est pertinent de toute façon.
  if(field==="objectifPrincipal"){
    captureSharedFields();
    goals[activeGoalSlot] = Object.assign({}, goals[activeGoalSlot], {objectifPrincipal: value});
    renderContent();
    saveGoals();
    return;
  }
  const hidden = document.getElementById("goal_"+field);
  if(hidden) hidden.value = value;
  const group = document.querySelector(`[data-chipgroup="${field}"]`);
  if(group) group.querySelectorAll("[data-value]").forEach(el=>{
    el.classList.toggle("active", el.dataset.value===value);
  });
  if(field==="distanceCourse"){ updateRacePaceGoal(); updatePbPaceGoal(); }
  if(field==="pbExistant"){
    const block = document.getElementById("pbTimeBlock");
    if(block) block.style.display = (value==="Oui") ? "" : "none";
  }
  if(field==="objectifChrono"){
    const block = document.getElementById("chronoBlock");

  }
  if(field==="vmaConnue"){
    const block = document.getElementById("vmaBlock");
    if(block) block.style.display = (value==="Oui") ? "" : "none";
    const hint = document.getElementById("vmaNonHint");

// Temps visé et allure visée se calculent l'un à partir de l'autre (avec
// la distance choisie juste au-dessus) — seul le temps est enregistré
// (goal_tempsH/M/S), l'allure n'est qu'une vue pratique dessus.
function updateRacePaceGoal(){
  const dist = document.getElementById("goal_distanceCourse")?.value;
  const km = RACE_DISTANCES_KM[dist];
  const h = parseInt(document.getElementById("goal_tempsH")?.value,10)||0;
  const m = parseInt(document.getElementById("goal_tempsM")?.value,10)||0;
  const totalSec = h*3600+m*60;
  const disp = document.getElementById("raceAllureVisee_display");
  const hidden = document.getElementById("goal_raceAllureVisee");
  if(!disp) return;
  if(km && totalSec>0){
    const pace = Math.round(totalSec/km);
    disp.textContent = fmtA(pace);
    if(hidden) hidden.value = pace;
  } else {
    disp.textContent = "—";
    if(hidden) hidden.value = "";
  }
}
window.updateRacePaceGoal = updateRacePaceGoal;

// Sens inverse : ajuster l'allure visée (stepper ±5s/km) recalcule le
// temps visé (h/min, arrondi à la minute — pas de secondes à afficher)
// à partir de la distance choisie.
window.adjustRaceAllureGoal = (delta) => {
  const km = RACE_DISTANCES_KM[document.getElementById("goal_distanceCourse")?.value];
  if(!km) return;
  const hidden = document.getElementById("goal_raceAllureVisee");
  let pace = parseInt(hidden?.value, 10);
  if(!pace){
    const h = parseInt(document.getElementById("goal_tempsH")?.value,10)||0;
    const m = parseInt(document.getElementById("goal_tempsM")?.value,10)||0;
    const totalSec = h*3600+m*60;
    pace = totalSec>0 ? Math.round(totalSec/km) : 300;
  }
  pace = Math.max(120, Math.min(900, pace+delta));
  if(hidden) hidden.value = pace;
  const disp = document.getElementById("raceAllureVisee_display");
  if(disp) disp.textContent = fmtA(pace);
  const totalMin = Math.round(pace*km/60);
  const hEl = document.getElementById("goal_tempsH"), mEl = document.getElementById("goal_tempsM");
  if(hEl) hEl.value = Math.floor(totalMin/60) || "";
  if(mEl) mEl.value = (totalMin%60) || "";
  saveGoals();
};

window.uploadAvatar = async (input) => {

  avatarUrl = bustedUrl;

};
// Un seul bouton "Enregistrer" pour toute la page Mon compte (Profil, FC max,
// FC repos, VO2 max) — plusieurs boutons séparés prêtaient à confusion
// (facile de n'en cliquer qu'un et de croire que tout était enregistré).
// Une seule requête, un seul point de confirmation/erreur.
// FC repos/VO2 max : pré-remplis avec la valeur actuelle (utile pour la voir),
// mais resaisir la page pour une tout autre raison (ex: changer son pseudo)
// ne doit jamais figer une valeur auto-synchronisée comme "manuelle" — d'où
// la comparaison à data-original (valeur affichée à l'ouverture) plutôt que
// "le champ contient un chiffre". Seul un vrai changement de valeur marque
// le champ manuel (ou le repasse en auto si l'utilisateur le vide).
function manualFieldUpdate(inputId, currentIsManual, currentValue, currentUpdatedAt, parse){
  const input = document.getElementById(inputId);
  const val = input.value;
  const changed = val !== input.dataset.original;
  if(!changed) return { num: currentValue, isManual: currentIsManual, updatedAt: currentUpdatedAt };
  const num = val ? parse(val) : null;
  return { num, isManual: !!num, updatedAt: num ? new Date().toISOString() : null };
}

  const pseudoVal = document.getElementById("profPseudo").value;
  const ageVal = parseInt(document.getElementById("profAge").value, 10) || null;
  const genderVal = document.getElementById("profGender").value;
  const citiesVal = document.getElementById("profCities").value.split(",").map(s=>s.trim()).filter(Boolean);
  // FC max : champ jamais pré-rempli avec l'estimation (220-âge), donc vide
  // ici veut toujours dire "laisse le calcul automatique s'appliquer" — pas
  // besoin de comparer à une valeur d'origine comme pour FC repos/VO2 max.
  const maxHrVal = document.getElementById("maxHrInput").value;
  const maxHrNum = maxHrVal ? parseInt(maxHrVal, 10) : null;
  const rhr = manualFieldUpdate("restingHrInput", restingHrIsManual, restingHr, restingHrUpdatedAt, v=>parseInt(v,10));
  const vo2 = manualFieldUpdate("vo2MaxInput", vo2MaxIsManual, vo2Max, vo2MaxUpdatedAt, v=>parseFloat(v));

  const ok = await upsertProfile({
    pseudo: pseudoVal, age: ageVal, gender: genderVal, cities: citiesVal,

    vo2_max: vo2.num, vo2_max_updated_at: vo2.updatedAt, vo2_max_is_manual: vo2.isManual,
  });
  if(!ok) return;
  pseudo = pseudoVal; age = ageVal; gender = genderVal; cities = citiesVal;
  maxHr = maxHrNum;
  restingHr = rhr.num; restingHrUpdatedAt = rhr.updatedAt; restingHrIsManual = rhr.isManual;

window.saveManualRun = async () => {
  const f = manualRunForm;
  if(!f || f.saving) return;
  const showError = (msg) => { f.error = msg; const el = document.getElementById("mrError"); if(el) el.textContent = msg; };
  const todayStr = localDateStr(new Date());
  const { errors, warnings } = validateManualRun(f, todayStr);
  if(errors.length){ showError(errors.join(" ")); return; }
  const dup = findLikelyDuplicateRun(
    RUNS.map(r=>({ id:r.id, date:localDateStr(dateFromRun(r)), type:r.type, durationSec:r.durationSec })),
    { date:f.date, type:f.type, durationSec:Number(f.durationMin)*60 });
  if(dup && !confirm("Une séance du même type existe déjà ce jour-là (peut-être synchronisée depuis ta montre) : c'est peut-être la même. L'ajouter quand même ?")) return;
  for(const w of warnings){ if(!confirm(w)) return; }
  f.saving = true;
  const saveBtn = document.getElementById("mrSave"); if(saveBtn) saveBtn.disabled = true;
  const { data:{user} } = await supa.auth.getUser();
  if(!user){ f.saving = false; showError("Session expirée : reconnecte-toi."); return; }
  const { data, error } = await supa.from("runs").insert(manualRunRow(f, user.id, new Date())).select("id").single();
  if(error){
    f.saving = false; if(saveBtn) saveBtn.disabled = false;
    showError(error.code==="23505" ? "Une séance existe déjà à cette minute : change l'heure de départ." : "Erreur d'enregistrement : "+error.message);
    return;
  }
  const newId = data.id, sessionId = f.sessionId;
  if(sessionId) await supa.from("planned_sessions").update({status:"done", linked_run_id:newId, updated_at:new Date().toISOString()}).eq("id", sessionId);
  closeManualRun();
  await loadData();
  const planned = sessionId ? plannedSessions.find(p=>p.id===sessionId) : null;
  if(planned && planned.generation_reason==="guided_test"){
    const run = RUNS.find(r=>r.id===newId);
    if(run) await applyGuidedTestResult(run);
  }
  await runProgramMaintenance(); // rapproche aussi les autres séances prévues du même jour
  const run = RUNS.find(r=>r.id===newId);
  if(run && run.includeInStats) goRateSession(newId); else renderContent();
};

function lsJson(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)||"null") ?? fallback; }catch(e){ return fallback; } }

async function mergeManualIntoSynced(manualId, syncedId){
  const m = RUNS.find(r=>r.id===manualId), s = RUNS.find(r=>r.id===syncedId);
  if(!m || !s) return false;
  const patch = mergedRunPatch(m, s);
  if(Object.keys(patch).length){
    const { error } = await supa.from("runs").update(patch).eq("id", syncedId);
    if(error) return false;
  }
  // Le lien avec la séance prévue passe sur la course de la montre avant de
  // supprimer la saisie (sinon la séance perdrait son lien).
  await supa.from("planned_sessions").update({ linked_run_id:syncedId, updated_at:new Date().toISOString() }).eq("linked_run_id", manualId);
  const { error } = await supa.from("runs").delete().eq("id", manualId);
  if(error) return false;
  lsSetJson("mra_mergeNotices", [...lsJson("mra_mergeNotices", []), { label:m.label }].slice(-5));
  return true;

  let changed = false;
  for(const pair of auto){ if(await mergeManualIntoSynced(pair.manualId, pair.syncedId)) changed = true; }
  if(changed) await loadData();
  return changed;
}

// Préremplissage d'une séance pas encore notée : reprend les critères

// varient peu d'une séance à l'autre, pas la peine de les ressaisir. Les
// zones du corps, elles, repartent toujours à 0 : une douleur est
// ponctuelle, reprendre une ancienne valeur obligerait à "désactiver" une
// zone qui ne fait plus mal plutôt que de juste noter ce qui fait mal
// maintenant. Une séance déjà notée garde ses propres valeurs telles
// quelles (pas de préremplissage, on affiche ce qui a vraiment été noté).

  const last = lastKnownRatings();

// Copie défensive : certains appelants font des calculs style
// `new Date(dateFromRun(r)).setDate(...)` — ne jamais renvoyer la même
// instance de Date que celle stockée sur la séance, pour ne pas la muter.
function dateFromRun(r){ return new Date(r.fullDate); }

function periodStats(period){
  const now=new Date();
  const start = period==="weekly"
    ? (()=>{ const d=new Date(now); d.setDate(now.getDate()-7); return d; })()
    : new Date(now.getFullYear(), now.getMonth(), 1);
  const runs = runningRuns.filter(r=>dateFromRun(r)>=start && r.dist>0);
  const dist = runs.reduce((a,r)=>a+r.dist,0);
  const time = runs.reduce((a,r)=>{const[h,m,s]=r.dur.split(":").map(Number);return a+(r.dur.split(":").length===3?h*3600+m*60+s:h*60+m);},0);
  const withPace = runs.filter(r=>r.allure);
  const avgPace = withPace.length ? Math.round(withPace.reduce((a,r)=>a+r.allure,0)/withPace.length) : null;
  const longMax = runs.length ? Math.max(...runs.map(r=>r.dist)) : 0;
  const withHr = runs.filter(r=>r.fc);
  const avgFc = withHr.length ? Math.round(withHr.reduce((a,r)=>a+r.fc,0)/withHr.length) : null;
  return { runs, dist, time, avgPace, longMax, avgFc };
}

// Repères "où tu en es" pour l'onglet Objectifs (voir situationStats) :
// des fenêtres glissantes plutôt que le mois calendaire de periodStats,
// pour ne pas donner un chiffre tronqué en tout début de mois.
function recentWeeklyFrequency(){
  const start = new Date(); start.setDate(start.getDate()-28);
  const recent = runningRuns.filter(r=>dateFromRun(r)>=start);
  return recent.length ? Math.round(recent.length/4*10)/10 : null;
}
function recentEfPace(){
  const recent = efRuns.filter(r=>r.allure).slice(-5);
  return recent.length ? Math.round(recent.reduce((a,r)=>a+r.allure,0)/recent.length) : null;
}
function recentIntensiveFrequency(){
  const start = new Date(); start.setDate(start.getDate()-28);
  const recent = runningRuns.filter(r=>dateFromRun(r)>=start && (r.type==="Fractionné"||r.type==="Seuil"));
  return recent.length ? Math.round(recent.length/4*10)/10 : null;
}
function daysSinceLastRun(){
  if(!runningRuns.length) return null;
  return Math.floor((new Date() - dateFromRun(runningRuns[runningRuns.length-1]))/86400000);
}
function recentMonthlyVolume(){
  const start = new Date(); start.setMonth(start.getMonth()-3);
  const recent = runningRuns.filter(r=>dateFromRun(r)>=start && r.dist>0);
  return recent.length ? Math.round(recent.reduce((a,r)=>a+r.dist,0)/3) : null;
}
// Repères chiffrés propres à l'objectif choisi, affichés en lecture seule
// juste après le type d'objectif — pour situer la cible qu'on va demander
// par rapport à la réalité plutôt que de viser dans le vide. Un seul bloc
// dédié plutôt que des repères éparpillés dans chaque champ : plus facile
// à scanner, et ça reste vrai si on ajoute d'autres repères plus tard.
function situationStats(objectifType){
  const na = "pas encore assez de données";
  switch(objectifType){
    // Pas de bloc pour "Préparer une course" ni "Améliorer mon allure" :
    // le temps/allure visés (ou l'allure cible juste en dessous) suffisent
    // déjà, pas la peine d'un second bloc à côté.
    case "Courir plus régulièrement": {
      const f = recentWeeklyFrequency();
      return [["Fréquence actuelle (4 dernières semaines)", f!=null?f+" séance(s)/semaine":na]];
    }
    case "Reprendre après une pause/blessure": {
      const d = daysSinceLastRun();
      return [["Dernière séance", d!=null?(d===0?"Aujourd'hui":d+" jour(s)"):"Aucune séance enregistrée"]];
    }
    case "Rester en forme": {
      const vol = recentMonthlyVolume(), f = recentWeeklyFrequency();
      return [
        ["Volume moyen (3 derniers mois)", vol!=null?vol+" km/mois":na],
        ["Fréquence actuelle (4 dernières semaines)", f!=null?f+" séance(s)/semaine":na],
      ];
    }
    default: return [];
  }
}

// 3 anneaux d'objectifs, toujours MENSUELS par choix explicite — indépendants
// du bascule semaine/mois qui pilote le reste du dashboard (ce sont des
// objectifs du mois, pas une vue par période). L'objectif "Séances" vient du
// champ "Séances visées / semaine" (onglet Objectifs), mensualisé ×4.33
// (nombre moyen de semaines par mois) plutôt que juste ×4, pour ne pas sous-
// estimer légèrement l'objectif réel.
function ringSmHTML(val, goal, color, valLabel, unitLabel, caption){
  const pct = goal ? Math.min(1, val/goal) : 0;
  const R=38, C=2*Math.PI*R;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div class="ring-wrap-sm">
      <svg width="90" height="90" viewBox="0 0 90 90">
        <circle cx="45" cy="45" r="${R}" fill="none" stroke="var(--card-2)" stroke-width="8"/>
        <circle cx="45" cy="45" r="${R}" fill="none" stroke="${color}" stroke-width="8"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" stroke-linecap="round"/>
      </svg>
      <div class="ring-label-sm">
        <div class="val">${valLabel}</div>
        <div class="unit">${unitLabel}</div>
      </div>
    </div>
    <div class="ring-caption">${caption}</div>
  </div>`;
}
// Carte "Dernière séance" tout en haut du dashboard : premier truc vu à
// l'ouverture. Repliée par défaut (juste date + km, voir lastRunExpanded) —
// dépliée au clic, en deux colonnes (graph+zones FC à gauche, stats à
// droite) plutôt qu'empilée, pour prendre moins de place. L'allure
// n'apparaît qu'une fois : allure moyenne pour une séance classique, ou
// Allure Work/Récup pour un fractionné avec assez de données — jamais les
// deux (c'était le doublon signalé). `celebrate` n'est vrai qu'au tout
// premier rendu du dashboard depuis l'ouverture de l'app (voir
// renderContent) — l'animation ne doit pas rejouer à chaque re-render.
function lastRunCardHTML(lastRun, effMaxHr, effRestingHr, celebrate){
  const c = TC[lastRun.type]||TC.Other;
  const expanded = lastRunExpanded;
  const km = lastRun.dist>0 ? lastRun.dist.toFixed(2)+" km" : "—";

  const intervalPaces = lastRun.type==="Fractionné" ? getIntervalPaces(lastRun) : null;
  const showWorkRecovery = intervalPaces && (intervalPaces.manual || intervalPaces.workCount>=2);

  // Comparatif "par rapport à d'habitude" : moyenne des séances du même
  // type sur les 30 derniers jours (séance actuelle exclue) — un chiffre
  // isolé ne dit rien sans repère récent. Pas de comparatif si c'est la
  // seule séance de ce type ce dernier mois.
  const avgOf = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const monthAgo = new Date(); monthAgo.setDate(monthAgo.getDate()-30);
  const sameTypeLastMonth = runningRuns.filter(r => r.type===lastRun.type && r.id!==lastRun.id && dateFromRun(r)>=monthAgo);
  const avgKm = avgOf(sameTypeLastMonth.filter(r=>r.dist>0).map(r=>r.dist));
  const avgDurSec = avgOf(sameTypeLastMonth.map(r=>r.durationSec));
  const avgAllure = avgOf(sameTypeLastMonth.filter(r=>r.allure).map(r=>r.allure));
  const fracPacesLastMonth = sameTypeLastMonth.map(r=>getIntervalPaces(r)).filter(ip=>ip && (ip.manual || ip.workCount>=2));
  const avgWork = avgOf(fracPacesLastMonth.map(ip=>ip.work));
  const avgRecovery = avgOf(fracPacesLastMonth.filter(ip=>ip.recovery).map(ip=>ip.recovery));
  const cmp = v => v==null?null:`Moyenne dernier mois : ${v}`;

  const statRows = [
    ["km", km, cmp(avgKm?avgKm.toFixed(2)+" km":null)],
    ["Durée", lastRun.dur, cmp(avgDurSec?fmtDur(Math.round(avgDurSec)):null)],
    ...(showWorkRecovery
      ? [
          [`Allure Work${intervalPaces.manual?"":` (${intervalPaces.workCount})`}`, fmtA(intervalPaces.work)+"/km", cmp(avgWork?fmtA(Math.round(avgWork))+"/km":null)],
          ...(intervalPaces.recovery ? [[`Allure Récup${intervalPaces.manual?"":` (${intervalPaces.recoveryCount})`}`, fmtA(intervalPaces.recovery)+"/km", cmp(avgRecovery?fmtA(Math.round(avgRecovery))+"/km":null)]] : []),
        ]
      : [["Allure", lastRun.dist>0?fmtA(lastRun.allure)+"/km":"—", cmp(avgAllure?fmtA(Math.round(avgAllure))+"/km":null)]]
    ),
  ];

  const hasHr = lastRun.hrSeries && lastRun.hrSeries.length>1;
  let leftHTML;
  if(!hasHr){
    leftHTML = `<div style="font-size:12px;color:var(--text-dim);padding:8px 0">Pas de détail FC pour cette séance.</div>`;
  } else if(!effMaxHr){
    leftHTML = `<div style="font-size:12px;color:var(--text-dim);padding:8px 0">Renseigne ta FC max (Mon compte) pour voir les zones.</div>`;
  } else {
    const {secs, defs} = computeHrZoneSeconds(lastRun.hrSeries, effMaxHr, effRestingHr);
    const total = secs.reduce((a,b)=>a+b,0)||1;
    leftHTML = `<div style="position:relative;width:100%;height:120px"><canvas id="cHr_${lastRun.id}"></canvas></div>
      <div style="margin-top:10px">
        ${defs.map((d,i)=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">
            <span style="width:52px;color:${d.color}">${d.label}</span>
            <div style="flex:1;height:6px;border-radius:3px;background:var(--card-2);overflow:hidden">
              <div style="width:${Math.round(secs[i]/total*100)}%;height:100%;background:${d.color}"></div>
            </div>
            <span style="width:48px;text-align:right;color:var(--text-dim)">${fmtDur(secs[i])}</span>
          </div>`).join("")}
      </div>`;
  }

  return `<div class="last-run-card${celebrate?" celebrate":""}${expanded?" expanded":""}">
    <div class="last-run-eyebrow">${icon("sparkle",12)} Dernière séance</div>
    <div class="last-run-head" onclick="toggleLastRunExpanded()">
      <div class="last-run-icon" style="background:${c}22;color:${c}">${icon(TICON[lastRun.type]||"activity",22)}</div>
      <div style="flex:1;min-width:0">
        <div class="last-run-title">${lastRun.label} · ${lastRun.time}</div>
        <div class="last-run-sub"><span style="color:${c};font-weight:600">${lastRun.type}</span></div>
      </div>
      ${!expanded?`<div class="last-run-collapsed-km">${km}</div>`:""}
      <div class="last-run-chevron">${icon("chevronDown",16)}</div>
    </div>
    ${expanded?`<div class="last-run-body">
      <div class="last-run-left">${leftHTML}</div>
      <div class="last-run-right">
        ${statRows.map(([l,v,cmp])=>`<div class="last-run-stat-row"><div class="l">${l}</div><div class="v">${v}</div>${cmp?`<div class="cmp">${cmp}</div>`:""}</div>`).join("")}
      </div>
    </div>`:""}
  </div>`;
}

// Indicateurs en tête de Progression (4.9.a) : efficience cardiaque,
// régularité, volume et charge, chacun en une phrase claire (voir
// efficiencyTrend / regularitySummary / volumeComparison, logic.js).
function progressIndicatorsHTML(){
  const todayStr = localDateStr(new Date());
  const ds = (r) => localDateStr(dateFromRun(r));
  const eff = efficiencyTrend(efRuns.map(r=>({date:ds(r), allure:r.allure, fc:r.fc})), todayStr);
  const reg = regularitySummary(runningRuns.map(ds), todayStr);
  const vol = volumeComparison(runningRuns.map(r=>({date:ds(r), distKm:r.dist||0})), todayStr);
  const { acwr } = computeProgramInputs();
  const gauge = chargeEntrainementGauge(acwr);
  const effValue = eff.status==="mieux" ? countUpHTML(eff.pct,"pct","ind_eff",{sign:"+"}) : eff.status==="moins" ? countUpHTML(eff.pct,"pct","ind_eff",{sign:"−"}) : { stable:"Stable", insuffisant:"—" }[eff.status];
  const effColor = { mieux:"var(--accent)", moins:"var(--attention)", stable:"var(--text)", insuffisant:"var(--text-faint)" }[eff.status];
  const row = (label, value, color, phrase, first) => `<div style="padding:12px 0;${first?"":"border-top:1px solid var(--border)"}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <span style="font-size:12px;color:var(--text-dim)">${label}</span>
      <span style="font-size:20px;font-weight:700;color:${color}">${value}</span>
    </div>
    <div style="font-size:12px;line-height:1.45;margin-top:4px;color:var(--text-dim)">${phrase}</div>
  </div>`;
  const fmtKm = (n) => n.toLocaleString("fr-FR")+" km";
  return `<div class="card">
    <div class="stitle">Tes indicateurs</div>
    ${row("Efficience cardiaque", effValue, effColor, efficiencyPhrase(eff), true)}
    ${row("Régularité", reg.status==="ok" ? countUpHTML(reg.weeksWithRun,"frac","ind_reg",{total:reg.totalWeeks}) : "—", reg.status==="ok" ? "var(--text)" : "var(--text-faint)", regularityPhrase(reg))}
    ${row("Volume", countUpHTML(vol.last28,"km","ind_vol"), "var(--text)", `Sur les 28 derniers jours. Les 28 jours d'avant : ${fmtKm(vol.prev28)}.`)}
    <div style="border-top:1px solid var(--border)">${chargeGaugeHTML(gauge, acwr)}</div>
  </div>`;
}
function heroHTML(){
  const monthS = periodStats("monthly");
  // Séances/semaine et km/mois sont partagés (tronc commun), peu importe
  // l'objectif principal/secondaire actif — voir "Ton profil coureur" dans
  // l'onglet Objectifs.
  const kmGoal = goals.kmMensuel ? Number(goals.kmMensuel) : null;
  const weeklySessionGoal = goals.frequence ? Number(goals.frequence) : null;
  const sessionGoal = weeklySessionGoal ? Math.round(weeklySessionGoal*4.33) : null;

  return `<div class="hero" style="flex-direction:column;align-items:stretch">
    <div class="hero-rings-row">
      ${ringSmHTML(monthS.dist, kmGoal, "#C6F432", monthS.dist.toFixed(0), kmGoal?`/${kmGoal}km`:"km", "Km ce mois")}
      ${ringSmHTML(monthS.runs.length, sessionGoal, "#0a84ff", String(monthS.runs.length), sessionGoal?`/${sessionGoal}`:"séances", "Séances ce mois")}
      ${ringSmHTML(monthS.time||0, null, "#ffd60a", Math.floor((monthS.time||0)/3600)+"h"+String(Math.round(((monthS.time||0)%3600)/60)).padStart(2,"0"), "", "Temps de course")}
    </div>
    ${(!kmGoal||!sessionGoal)?`<div class="chart-hint" style="margin-top:10px;margin-bottom:0">Objectifs incomplets — <a href="#" onclick="setTab('objectifs');return false" style="color:var(--accent)">renseigne-les dans Profil › Objectifs</a> pour voir ta progression.</div>`:""}
  </div>`;
}

function kpisHTML(){
  const period = dashboardPeriod;
  const s = periodStats(period);
  const periodLbl = period==="weekly" ? "(semaine)" : "(mois)";
  const now=new Date();
  const yearStart=new Date(now.getFullYear(),0,1);
  // Toutes séances incluses dans les stats (include_in_stats), tous types
  // confondus — pas seulement les courses. Voir migration_002 pour la règle
  // d'inclusion par défaut (EF/Long/Fractionné/Récup/Course), modifiable par
  // séance via le toggle "Inclure dans les stats".
  const yearDist = runningRuns.filter(r=>dateFromRun(r)>=yearStart && r.dist>0).reduce((a,r)=>a+r.dist,0);
  const avgOf = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : null;

  const today=new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const inWindow = (runs, daysStart, daysEnd) => {
    const from=new Date(today); from.setDate(today.getDate()-daysEnd);
    const to=new Date(today); to.setDate(today.getDate()-daysStart);
    return runs.filter(r=>dateFromRun(r)>=from && dateFromRun(r)<=to);
  };

  // Ancienneté (date de la 1ère séance valide + nb de jours écoulés depuis)
  // utilisée pour choisir le découpage temporel dans adaptivePaceCompare.
  function spanFromRuns(runs, valueFn){
    const pts = runs.map(r=>({d:dateFromRun(r), v:valueFn(r)})).filter(p=>p.v!=null);
    if(pts.length===0) return null;
    const earliest = new Date(Math.min(...pts.map(p=>p.d.getTime())));
    return { earliest, spanDays: Math.floor((today-earliest)/86400000) };
  }
  // Nombre et taille des fenêtres adaptés à l'ancienneté réelle des données
  // plutôt que des fenêtres fixes (qui restent vides pour un nouvel
  // utilisateur et ne veulent plus rien dire après plusieurs années).
  // `valueFn` extrait la valeur à comparer (allure EF, allure de travail en
  // fractionné...) — la fonction reste agnostique du type de séance.
  // `refSpan` (optionnel) : force le découpage à suivre l'ancienneté d'un
  // AUTRE historique (ex: le Fractionné suit l'ancienneté du EF) — la date
  // de la 1ère séance *catégorisée* Fractionné n'a pas de sens en soi,
  // c'est juste la date à laquelle l'utilisateur a commencé à étiqueter ses
  // séances, pas depuis quand il court vraiment.
  // Renvoie un nombre variable de points (1 à 3) : plus il y a d'historique,
  // plus la tendance se découpe finement.
  function adaptivePaceCompare(runs, valueFn, refSpan){
    const pts = runs.map(r=>({d:dateFromRun(r), v:valueFn(r)})).filter(p=>p.v!=null);
    if(pts.length===0) return null;
    const span = refSpan || spanFromRuns(runs, valueFn);
    const { earliest, spanDays } = span;
    const inRange = (from,to) => pts.filter(p=>p.d>=from && p.d<=to).map(p=>p.v);
    const plusDays = (base,n) => { const d=new Date(base); d.setDate(d.getDate()+n); return d; };
    const daysAgo = n => plusDays(today,-n);

    if(spanDays < 21){
      return { tooNew:true, current: avgOf(pts.map(p=>p.v)) };
    }
    if(spanDays < 60){
      return { tooNew:false, points:[
        {label:"2 premières semaines", value:avgOf(inRange(earliest, plusDays(earliest,14)))},
        {label:"7 derniers jours", value:avgOf(inRange(daysAgo(7), today))},
      ]};
    }
    if(spanDays < 180){
      return { tooNew:false, points:[
        {label:"1er mois", value:avgOf(inRange(earliest, plusDays(earliest,30)))},
        {label:"4 dernières semaines", value:avgOf(inRange(daysAgo(28), today))},
      ]};
    }
    // 6 mois+ : 3 fenêtres glissantes accolées, ancrées à aujourd'hui plutôt
    // qu'au début des données — donne une vraie tendance en 3 points.
    return { tooNew:false, points:[
      {label:"il y a 3 à 6 mois", value:avgOf(inRange(daysAgo(180), daysAgo(90)))},
      {label:"il y a 1 à 3 mois", value:avgOf(inRange(daysAgo(90), daysAgo(30)))},
      {label:"dernier mois", value:avgOf(inRange(daysAgo(30), today))},
    ]};
  }
  // Cartes KPI générées à partir d'une comparaison adaptative : 1 carte "en
  // cours de collecte" tant qu'il y a moins de 3 semaines de recul, sinon
  // 2 ou 3 cartes selon l'ancienneté. `colors` va du plus ancien au plus
  // récent ; la dernière carte (la plus récente) utilise l'icône "bolt".
  function adaptivePaceCards(compare, tooNewLabel, colors){
    if(!compare) return [["—", tooNewLabel, "trend", "#8e8e93"]];
    if(compare.tooNew) return [[compare.current?fmtA(compare.current)+"/km":"—", tooNewLabel, "trend", colors[colors.length-1]]];
    return compare.points.map((p,i)=>[
      p.value?fmtA(p.value)+"/km":"—", "Allure "+p.label,
      i===compare.points.length-1?"bolt":"trend",
      colors[i],
    ]);
  }
  const efSpan = spanFromRuns(efRuns, r=>r.allure);
  const efCompare = adaptivePaceCompare(efRuns, r=>r.allure, efSpan);
  const fracCompare = adaptivePaceCompare(fracRuns, r=>{ const ip=getIntervalPaces(r); return ip&&ip.work?ip.work:null; }, efSpan);

  const longRunsAll = runningRuns.filter(r=>r.type==="Long");
  const avgFcLong = avgOf(longRunsAll.filter(r=>r.fc).map(r=>r.fc));
  const avgFcEf = avgOf(efRuns.filter(r=>r.fc).map(r=>r.fc));
  const avgFcFracWork = avgOf(fracRuns.filter(r=>r.paceSeries && r.hrSeries).map(r=>computeWorkAvgHr(r.paceSeries, r.hrSeries)).filter(v=>v!=null));

  // Regroupées par type de donnée plutôt qu'en une seule grille mélangée.
  const groups=[
    ["Volume",[
      [yearDist.toFixed(2)+" km","Distance annuelle","route","#C6F432"],
      [s.longMax?s.longMax.toFixed(2)+" km":"—","Plus longue sortie "+periodLbl,"flame","#ff453a"],
    ]],
    ["Allure EF",
      adaptivePaceCards(efCompare, "Allure moyenne (encore peu de recul)", ["#ff9f0a","#bf5af2","#0a84ff"]),
    ],
    ["Allure Fractionné",
      adaptivePaceCards(fracCompare, "Allure moyenne (encore peu de recul)", ["#ff375f","#ffd60a","#C6F432"]),
    ],
    ["Cardio",[
      [maxHr?maxHr+" bpm":"—","FC max","heart","#ff375f"],
      [avgFcEf?avgFcEf+" bpm":"—","FC moy. EF","heart","#C6F432"],
      [avgFcLong?avgFcLong+" bpm":"—","FC moy. Long","heart","#0a84ff"],
      [avgFcFracWork?avgFcFracWork+" bpm":"—","FC moy. Work Fractionné","heart","#ff9f0a"],
    ]],
  ];
  // Les blocs Allure (EF/Fractionné) affichent une valeur "X'XX/km" plus
  // longue que les autres KPI (distance, bpm...) — taille réduite pour
  // qu'elle tienne sans être compressée dans la carte.
  return groups.map(([label,items])=>`
    <div class="stitle" style="padding:0 20px;margin-bottom:8px">${label}</div>
    <div class="kpi-grid" style="margin-top:-6px${items.length===3?';grid-template-columns:repeat(3,1fr)':''}">${items.map(([v,l,ic,c])=>`
      <div class="kpi"${items.length===1?' style="grid-column:1/-1"':''}>
        <div class="kpi-top">
          <div class="kpi-icon" style="background:${c}22;color:${c}">${icon(ic,15)}</div>
        </div>
        <div class="kpi-val"${label.startsWith("Allure")?' style="font-size:16px"':''}>${v}</div>
        <div class="kpi-lbl">${l}</div>
      </div>`).join("")}</div>`).join("");
}

    <button class="tab-btn${t.key===activeTab?" active":""}" onclick="setTab('${t.key}')">

const prefersReducedMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
// Rejoue le fondu d'arrivée du contenu (changement d'onglet ou de section).
function playViewTransition(){
  const el = document.getElementById("content");
  if(!el || prefersReducedMotion()) return;
  el.classList.remove("view-in"); void el.offsetWidth; el.classList.add("view-in");
}
// Petit rebond d'un bouton qu'on vient de choisir (retour visuel à la notation).
function popChip(btn){
  if(!btn || prefersReducedMotion()) return;
  btn.classList.remove("chip-pop"); void btn.offsetWidth; btn.classList.add("chip-pop");
}
// Compteurs (4.11.c) et remplissages (4.11.d) : joués à l'apparition de
// l'écran, pas à chaque redessin du contenu (sinon clignotement). Ces
// mémoires sont vidées à chaque changement d'onglet, pour rejouer l'entrée.
let countedValues = {}, animatedOnce = new Set();
function playOnce(key){ if(animatedOnce.has(key)) return false; animatedOnce.add(key); return !prefersReducedMotion(); }
function countUpHTML(value, format, key, opts){
  const o = opts || {};
  return `<span data-countup="${value}" data-cu-format="${format}" data-cu-key="${key}"${o.sign?` data-cu-sign="${o.sign}"`:""}${o.total!=null?` data-cu-total="${o.total}"`:""}>${formatCountUp(value, format, o)}</span>`;
}
function runCountUps(){
  document.querySelectorAll("[data-countup]").forEach(el=>{
    const to = Number(el.dataset.countup), key = el.dataset.cuKey;
    const opts = { sign: el.dataset.cuSign, total: el.dataset.cuTotal };
    const from = countedValues[key];
    countedValues[key] = to;
    if(prefersReducedMotion() || from===to) return;
    const start = from===undefined ? 0 : from;
    const t0 = performance.now(), dur = 700;
    const step = (now) => {
      if(!el.isConnected) return;
      const p = Math.min(1, (now-t0)/dur), eased = 1-Math.pow(1-p, 3);
      el.textContent = formatCountUp(start+(to-start)*eased, el.dataset.cuFormat, opts);
      if(p<1) requestAnimationFrame(step); else el.textContent = formatCountUp(to, el.dataset.cuFormat, opts);
    };
    el.textContent = formatCountUp(start, el.dataset.cuFormat, opts);
    requestAnimationFrame(step);
    // Filet de sécurité : le navigateur suspend requestAnimationFrame quand la
    // page n'est pas visible ; la valeur finale doit s'afficher quoi qu'il arrive.
    setTimeout(()=>{ if(el.isConnected) el.textContent = formatCountUp(to, el.dataset.cuFormat, opts); }, dur+150);
  });
}
// Clé de l'élément qu'on vient d'ouvrir : lui seul joue l'animation
// d'ouverture, pas tous ceux qui étaient déjà ouverts (le contenu est
// redessiné en entier à chaque clic).
let justOpenedKey = null;
window.setTab=i=>{
  destroyCharts();
