<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MyRunningApp</title>
<!-- PWA : permet d'ajouter l'app à l'écran d'accueil iOS/Android, ouverture
     en plein écran sans barre de navigateur (2026-09-20). -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0C0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyRunningApp">
<!-- Polices servies par l'app elle-même (web/fonts, ~15 Ko chacune, jeu latin) : pas de connexion
     à un serveur tiers à l'ouverture. On précharge la plus utilisée (Barlow 400) ; font-display:swap
     affiche tout de suite le texte avec la police du système, puis bascule sur Barlow.
     Barlow Condensed 700 (titres de page) est préchargée aussi : elle sert dès le premier écran. -->
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
/* Jetons du design gelé (journal v48, docs/design/tokens.css). Thème sombre seul.
   Si tokens.css change, reporter le changement ici : l'app n'a qu'un fichier de style. */
:root{
  /* Fonds et surfaces */
  --bg:#0C0D0F;
  --surface:#17191C;
  --surface-sunken:#0F1113;
  --surface-raised:#1B1E21;
  --surface-control:#22252A;
  --line:#26292E;
  --line-field:#2A2E33;
  --line-empty:#33373D;
  --grabber:#3A4047;
  /* Texte */
  --text:#F2F3F0;
  --text-2:#C9CCD0;
  --text-3:#A3A7AD;
  --text-muted:#8B8F96;
  --text-faint:#5A6068;
  --on-accent:#0C0D0F;
  /* Couleurs de rôle : citron = action principale / EF / progrès ; blanc = réglages et sélections ; violet = attention */
  --accent:#C6F432;
  --accent-soft:rgba(198,244,50,.12);
  --select:#F2F3F0;
  --select-soft:rgba(242,243,240,.07);
  --attention:oklch(0.72 0.17 300);
  --attention-bg:oklch(0.72 0.17 300 / .10);
  --attention-bg-strong:oklch(0.72 0.17 300 / .16);
  --attention-line:oklch(0.72 0.17 300 / .40);
  --danger:#E6786F;
  --danger-bg:rgba(230,120,111,.14);   /* rouge léger, réservé aux suppressions (D92) */
  /* Données (graphiques) */
  --data-cyan:oklch(0.85 0.13 200);
  --data-coral:oklch(0.7 0.19 25);
  --data-heart:oklch(0.62 0.22 25);
  --data-neutral:#8B8F96;
  /* Types de séance */
  --type-ef:#C6F432;
  --type-long:oklch(0.8 0.12 160);
  --type-fractionne:oklch(0.62 0.13 45);
  --type-seuil:oklch(0.74 0.11 80);
  --type-course:oklch(0.62 0.22 25);
  --type-recup:oklch(0.86 0.01 250);
  --type-marche:oklch(0.74 0.05 70);
  --type-renfo:oklch(0.72 0.14 250);
  --type-souple:oklch(0.75 0.13 330);
  --type-etirements:oklch(0.82 0.09 350);
  --type-autre:#8B8F96;
  /* Typographie */
  --font-display:"Barlow Condensed",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --font-text:"Barlow",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  /* Arrondis */
  --r-xs:10px; --r-sm:12px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-sheet:26px; --r-pill:999px;
  /* Tailles */
  --tap-min:44px; --btn-h:48px; --field-h:48px; --chip-h:36px;
  /* Ombres et animations */
  --shadow-sheet:0 -10px 40px rgba(0,0,0,.5);
  --shadow-lift:0 14px 30px rgba(0,0,0,.6);
  --ease:cubic-bezier(.2,.8,.2,1);
  --t-fast:200ms;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-text);
  min-height:100vh;
  padding-bottom:110px; /* le contenu ne passe pas sous le menu flottant */
}
button,input,select,textarea{font-family:inherit}
::selection{background:var(--accent);color:var(--on-accent)}

/* ---------- Auth ---------- */
#authView{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  max-width:360px;margin:0 auto;padding:32px 24px;
}
.auth-logo{display:block;width:220px;max-width:70%;height:auto;margin:0 auto 18px}
#authView .tagline{text-align:center;color:var(--text-3);font-size:14px;margin-top:6px;margin-bottom:32px}
.field{
  display:flex;align-items:center;gap:10px;
  background:var(--surface-sunken);border:1px solid var(--line-field);border-radius:var(--r-md);
  min-height:var(--field-h);padding:12px 16px;margin-bottom:12px;transition:border-color var(--t-fast);
}
.field:focus-within{border-color:var(--select)}
.field svg{flex-shrink:0;color:var(--text-faint)}
.field input{
  flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px;
}
.field input::placeholder{color:var(--text-faint)}
.goal-level-cards{display:flex;gap:6px}
.goal-level-card{flex:1;padding:7px 6px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.goal-level-card.active{border-color:var(--select);background:var(--select-soft)}
.goal-level-card .lbl{font-size:12px;font-weight:600}
.goal-level-card .sub{font-size:9px;color:var(--text-3);margin-top:1px;line-height:1.2}
.goal-principal-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal-principal-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.goal-principal-card.active{border-color:var(--select);background:var(--select-soft)}
.goal-principal-card .icon-wrap{width:32px;height:32px;border-radius:50%;background:var(--surface-control);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-3);transition:color .15s,background .15s}
.goal-principal-card.active .icon-wrap{color:var(--select);background:var(--select-soft)}
.goal-principal-card .lbl{font-size:12.5px;font-weight:600;line-height:1.25}
@media (prefers-reduced-motion: no-preference){
  .goal-principal-card.active .icon-wrap{animation:goalIconPop .4s cubic-bezier(.34,1.56,.64,1)}
  .goal-principal-card.active .icon-wrap svg{animation:goalIconFloat 2.4s ease-in-out infinite}
}
@keyframes goalIconPop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes goalIconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pace-stepper{display:flex;align-items:center;gap:12px}
.pace-stepper button{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-control);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.pace-stepper .val{font-weight:700;font-size:15px;min-width:64px;text-align:center}
.time-input{width:44px;background:var(--surface-sunken);border:1px solid var(--line-field);border-radius:var(--r-xs);color:var(--text);font-size:14px;text-align:center;padding:8px 0}
/* Icône native du sélecteur de date invisible sur fond sombre (icône noire
   par défaut) sans ce filtre — l'utilisateur ne voyait pas qu'un calendrier
   était cliquable et pensait devoir saisir la date au clavier. */
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8);cursor:pointer}
.btn-primary{
  width:100%;min-height:var(--btn-h);padding:0 20px;border-radius:24px;border:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;cursor:pointer;
  margin-top:6px;transition:transform .1s, opacity .15s;
}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:.5}
/* Confirmation animée après un "Enregistrer" — un simple changement de texte
   passe inaperçu (bug remonté : "on a l'impression que le bouton ne
   fonctionne pas"), un vrai mouvement (pop avec rebond) se voit. Reste
   affichée (pas de disparition) : le message est le signal, pas une nuisance. */
.save-confirm{display:flex;align-items:center;justify-content:center;gap:6px;width:fit-content;margin:8px auto 0;min-height:16px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--accent)}
.save-confirm:not(:empty){min-height:26px;padding:0 12px;background:var(--accent-soft)}
@media (prefers-reduced-motion: no-preference){
  .save-confirm.show{animation:saveConfirmPop .5s cubic-bezier(.34,1.56,.64,1)}
}
@keyframes saveConfirmPop{
  0%{opacity:0;transform:translateY(2px) scale(0.85)}
  60%{opacity:1;transform:scale(1.08)}
  100%{opacity:1;transform:scale(1)}
}
/* ---------- Éléments dynamiques (CDC v2, 4.11) ----------
   Toutes les animations sont déclarées dans ce bloc "no-preference" : si
   l'appareil demande de réduire les animations, rien ne bouge et les
   valeurs finales s'affichent directement (4.11.a). */
@media (prefers-reduced-motion: no-preference){
  #content.view-in{animation:viewIn .2s ease-out}
  .expand-in{animation:expandIn .2s ease-out}
  .chip-pop{animation:chipPop .25s cubic-bezier(.34,1.56,.64,1)}
  .week-dot-today{animation:todayPulse 2.6s ease-in-out infinite}
  .check-draw path{stroke-dasharray:24;stroke-dashoffset:24;animation:checkDraw .4s ease-out .1s forwards}
}
@media (prefers-reduced-motion: no-preference){
  .fill-in{animation:fillIn .8s ease-out both}
  .marker-slide{animation:markerSlide .8s cubic-bezier(.22,1,.36,1) both}
}
@keyframes fillIn{from{clip-path:inset(0 100% 0 0 round 5px)}to{clip-path:inset(0 0 0 0 round 5px)}}
@keyframes markerSlide{from{left:0%}to{left:var(--pos)}}
[data-countup]{font-variant-numeric:tabular-nums}
.celebrate-card{position:relative;overflow:hidden}
.celebrate-card .spark{position:absolute;top:26px;left:30px;width:6px;height:6px;border-radius:50%;opacity:0}
@media (prefers-reduced-motion: no-preference){
  .celebrate-card.play{animation:celebratePop .5s cubic-bezier(.34,1.56,.64,1) both}
  .celebrate-card.play .spark{animation:sparkOut .9s ease-out .25s both}
}
@keyframes celebratePop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes sparkOut{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes expandIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes chipPop{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes todayPulse{0%,100%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}50%{box-shadow:0 0 0 3px var(--bg),0 0 0 7px rgba(245,245,247,.3)}}
@keyframes checkDraw{to{stroke-dashoffset:0}}
/* ---------- Première connexion (D99 à D101) : étapes de l'inscription et écran « Installe l'app » ---------- */
#authError{color:var(--text-2);font-size:13px;margin-top:12px;text-align:center;min-height:16px;line-height:1.4}
#authNotice{color:var(--accent);font-size:13px;margin-top:12px;text-align:center;line-height:1.4}
#authNotice:empty{display:none}
#authBody .auth-h{font:700 28px/1.05 var(--font-display);text-transform:uppercase;text-align:center;margin:0 0 10px;text-wrap:balance}
#authBody .auth-p{font-size:14px;line-height:1.45;color:var(--text-3);text-align:center;margin:0 0 20px;text-wrap:pretty}
#authBody .auth-p b{color:var(--text);font-weight:600;overflow-wrap:anywhere}
.auth-hint{font-size:12.5px;color:var(--text-muted);margin:-4px 0 6px 4px}
.field.otp input{text-align:center;font:700 30px var(--font-display);letter-spacing:.32em;padding-left:.32em;min-width:0}
.auth-link{display:block;margin:16px auto 0;padding:6px 10px;border:none;background:none;color:var(--accent);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:center}
.auth-link.quiet{color:var(--text-3);font-weight:500;margin-top:8px}
.auth-link:disabled{color:var(--text-faint);cursor:default}
#installView .on-screen{padding-left:24px;padding-right:24px}
#installView .on-logo{padding-top:24px}
.in-steps{display:flex;flex-direction:column;gap:10px}
.in-step{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line-field)}
.in-step .ic{width:44px;height:44px;border-radius:var(--r-sm);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-sunken);color:var(--text)}
.in-step .k{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.in-step b{display:block;font-size:15.5px;font-weight:600;line-height:1.25}
.in-step small{display:block;margin-top:3px;font-size:13px;line-height:1.4;color:var(--text-3)}

/* ---------- App shell ---------- */
#appView{display:none;max-width:640px;margin:0 auto}
@media (min-width:700px){
  #appView{max-width:960px}
}
.topbar{
  padding:calc(env(safe-area-inset-top) + 18px) 20px 8px;
}
.topbar-title{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.1;text-transform:uppercase}

/* ---------- Menu du bas : pilule flottante, onglet actif en pilule citron avec son nom (design 1b) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:30px;z-index:10;padding:0 20px;pointer-events:none}
.tabs-bar{
  position:relative;pointer-events:auto;max-width:480px;margin:0 auto;height:64px;padding:0 9px;
  display:flex;justify-content:space-between;align-items:center;
  border-radius:32px;border:1px solid rgba(255,255,255,.06);
  background:rgba(30,33,37,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.tab-pill{position:absolute;top:8px;left:0;height:46px;width:0;border-radius:23px;background:var(--accent);pointer-events:none;
  transition:left 220ms var(--ease),width 220ms var(--ease)}
.tab-pill.no-anim{transition:none}
.tab-btn{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;
  height:46px;min-width:52px;padding:0;border:none;border-radius:23px;background:none;
  color:var(--text-muted);cursor:pointer;
}
.tab-icon{position:relative;display:flex}
.tab-icon svg{width:22px;height:22px}
.tab-label{display:none;font-size:15px;font-weight:600;white-space:nowrap}
.tab-btn.active{color:var(--on-accent);padding:0 16px 0 13px}
.tab-btn.active .tab-label{display:inline}
.tab-dot{position:absolute;top:-4px;right:-5px;width:8px;height:8px;border-radius:50%;background:var(--attention);box-shadow:0 0 0 2px #1E2125}
@media (prefers-reduced-motion: no-preference){
  .tab-btn.active .tab-label{animation:tabLabelIn 120ms ease-out}
}
@keyframes tabLabelIn{from{opacity:0}to{opacity:1}}

/* ---------- Content cards ---------- */
#content{padding:0 20px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:18px;margin-bottom:14px;
}
.stitle{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase}
.chart-hint{font-size:12px;color:var(--text-faint);margin-top:-8px;margin-bottom:12px}

.card-row{display:flex;flex-direction:column}
@media (min-width:700px){
  .card-row{flex-direction:row;gap:14px}
  .card-row>.card{flex:1;min-width:0}
}

.session-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.session-row:last-child{border-bottom:none}
.session-main{flex:1;min-width:0}
.session-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.session-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.session-right{text-align:right;flex-shrink:0}
.session-pace{font-size:14px;font-weight:700;color:var(--accent)}
.session-hr{font-size:11px;color:var(--text-3);margin-top:2px}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.toggle{position:relative;width:42px;height:25px;flex-shrink:0}
.toggle input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.toggle .track{position:absolute;inset:0;background:var(--surface-control);border-radius:13px;transition:background var(--t-fast)}
.toggle .thumb{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--text-3);transition:transform var(--t-fast),background var(--t-fast)}
.toggle input:checked ~ .track{background:var(--select)}
.toggle input:checked ~ .thumb{background:var(--on-accent)}
.toggle input:checked ~ .thumb{transform:translateX(17px)}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px}
.flt{display:inline-flex;align-items:center;min-height:var(--chip-h);padding:0 14px;border-radius:var(--r-pill);font-size:13px;cursor:pointer;background:var(--surface-sunken);color:var(--text-3);border:1px solid var(--line-field);font-weight:500;white-space:nowrap}
.flt.active{background:var(--select);border-color:var(--select);color:var(--on-accent);font-weight:600}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty-state svg{color:var(--text-faint);margin-bottom:14px}
.empty-state .title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-state .sub{font-size:13px;line-height:1.5}


.loading{display:flex;justify-content:center;padding:60px 0}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-control);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.soon-card{text-align:center;padding:44px 22px}
.soon-card svg{color:var(--text-faint);margin-bottom:16px}
.soon-badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:12px}
.soon-card h3{font-size:17px;font-weight:700;margin-bottom:8px}
.soon-card p{font-size:13px;color:var(--text-3);line-height:1.6;max-width:320px;margin:0 auto}


/* Programme : calendrier semaine (colonnes) / mois (empilement de
   plateaux-semaine, un par semaine du mois affiché) — les 7 jours
   tiennent toujours sans swipe horizontal (colonnes à largeur égale,
   la vue ne scrolle pas). Drag and drop d'une séance déclenché
   par un appui long (0,4 s), volontairement PAS en drag-and-drop HTML5
   natif (dragstart/dragover) : ce dernier ne fonctionne pas de façon
   fiable au doigt sur mobile/Safari, or l'usage principal de l'app est
   la PWA iPhone. Implémenté avec les Pointer Events (unifie souris/
   tactile), voir progDragStart/Move/End.
   .wk-tile.draggable (uniquement les tuiles de séance prévue, pas les
   jours de repos) a `touch-action:none` STATIQUE (pas posé en JS à l'armement) :
   Safari iOS décide dès le premier contact si le doigt peut déclencher un
   scroll natif, et l'imposer plus tard en JS n'a aucun effet sur le geste
   déjà en cours — sans ça, dès que le doigt bouge vers un autre jour, iOS
   bascule en scroll natif et annule le pointeur (pointercancel), donc la
   carte s'arme mais ne se déplace jamais. */
.account-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.account-row:last-child{border-bottom:none}
.account-row .lbl{font-size:13px;color:var(--text-3)}
.account-row .v{font-size:13px;font-weight:600}
.btn-secondary{
  width:100%;min-height:var(--btn-h);padding:0 20px;border-radius:24px;border:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-control);color:var(--text);font-weight:600;font-size:15px;cursor:pointer;
}
.btn-danger{color:var(--text-3);background:none;border:none;font-size:14px;font-weight:500;cursor:pointer;padding:12px 0}

/* ---------- Aujourd'hui : bandeau coach, alerte douleur forte, carte « Hier » ---------- */
.coach{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 14px 10px 10px;margin-bottom:14px;border:none;border-radius:var(--r-lg);background:var(--surface);color:var(--text-2);font-family:inherit;font-size:14px;line-height:1.4;text-align:left;cursor:pointer}
.coach-dot{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.coach-chev{margin-left:auto;flex:none;color:var(--text-muted);display:flex}
.pain-alert{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:12px 14px 12px 12px;margin-bottom:14px;border:none;border-radius:var(--r-lg);background:var(--attention-bg);color:var(--text);font-family:inherit;font-size:14px;line-height:1.4;text-align:left;cursor:pointer}
.pain-alert .coach-dot{background:var(--attention)}
.hier-card .hier-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hier-card .hier-icon{flex:none;width:32px;height:32px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.hier-card .hier-title{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;text-transform:uppercase;margin-bottom:4px}
.hier-card .hier-value{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.1;color:var(--accent);margin-bottom:4px}
.hier-card .hier-before{font-size:13px;color:var(--text-muted);margin-bottom:12px}
/* Petits confettis de la carte « Hier » pour un record d'allure (A2) : une dizaine de pièces, 1,5 s, aucune avec « réduire les animations » */
.hier-card{position:relative;overflow:hidden}
.hier-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hier-conf i{position:absolute;top:-12px;width:5px;height:9px;border-radius:1px;opacity:0}
@media (prefers-reduced-motion: no-preference){ .hier-conf i{animation:confFall 1.5s ease-out forwards} }
@keyframes confFall{0%{opacity:.9;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(150px) rotate(280deg)}}
/* Célébration plein écran (S9, journal 10b-4) */
.cel{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.cel-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.cel-btns{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion: no-preference){ .cel{animation:sheetFade var(--t-step,280ms) ease-out} }
/* ---------- Carte de séance (design 2d, V1 à V7) ---------- */
.session-card{position:relative;margin-bottom:14px;padding:18px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl)}
.sc-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sc-icon{flex:none;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sc-overline{flex:1;min-width:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-done{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);font-size:13.5px;font-weight:600}
.menu-wrap{position:relative;flex:none}
.sc-menu{position:relative;width:36px;height:36px;border:none;border-radius:50%;background:none;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sc-menu::after{content:"";position:absolute;inset:-4px}
.menu-pop{position:absolute;right:0;top:40px;z-index:20;min-width:220px;padding:6px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-lift)}
.menu-pop button{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:none;border-radius:10px;background:none;color:var(--text);font-family:inherit;font-size:15px;text-align:left;cursor:pointer}
.menu-pop button.danger{color:var(--danger)}
.menu-pop button:active{background:var(--surface-control)}
.sc-title{font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.15;text-transform:uppercase}
.sc-sub{font-size:14px;color:var(--text-muted);margin-top:2px}
.sc-src{display:inline-block;margin-top:8px;padding:2px 10px;border:1px solid var(--line-field);border-radius:var(--r-pill);font-size:12px;color:var(--text-muted)}
.sc-metrics{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:14px 0}
.sc-big .n,.sc-big .u{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;text-transform:uppercase}
.sc-big .u{margin-left:6px}
.sc-big .note{margin-top:4px;font-size:13.5px;color:var(--text-muted)}
.sc-tiles{display:flex;gap:8px;flex:1;min-width:150px}
.sc-tile{flex:1;min-width:0;padding:8px 12px;border-radius:var(--r-md);background:var(--surface-sunken)}
.sc-tile .l{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.sc-tile .l i{flex:none;width:8px;height:8px;border-radius:2px}
.sc-tile .v{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-tile .v.t{font-size:18px;line-height:1.35}
.sc-tiles2{display:flex;gap:8px;margin:-2px 0 14px}
.sc-bar{display:flex;height:14px;gap:2px;margin:0 0 14px}
.sc-bar>div{border-radius:4px}
.sc-coach{display:flex;gap:10px;font-size:14px;line-height:1.5;color:var(--text-2)}
.sc-coach>svg{flex:none;margin-top:3px;color:var(--accent)}
.sc-coach .chart-hint{margin:6px 0 0;font-size:14px;color:var(--text-2)}
.sc-coach strong{color:var(--text)}
.sc-sep{height:1px;margin:16px 0 14px;background:var(--line)}
.sc-late{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:14px;font-weight:600;color:var(--attention)}
.btn-outline{display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--btn-h);padding:0 20px;border:1.5px solid var(--accent);border-radius:24px;background:none;color:var(--accent);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.ex-row{position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.ex-row img{flex:none;width:56px;height:56px;border-radius:12px;background:var(--surface-sunken)}
.ex-row .nm{font-size:15px;font-weight:600;line-height:1.25}
.ex-row .fm{margin-top:2px;font-size:13px;color:var(--text-muted)}
.ex-row .menu-wrap{margin-left:auto}
.ex-detail-img{display:block;width:200px;height:200px;margin:0 auto 14px;border-radius:var(--r-lg);background:var(--surface-sunken)}
.ex-detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ex-detail-meta span{padding:5px 12px;border-radius:var(--r-pill);background:var(--surface-sunken);border:1px solid var(--line-field);font-size:13px;color:var(--text-2)}
.ex-detail ul{margin:0 0 12px;padding-left:18px;font-size:14.5px;line-height:1.55}
.ex-nav{display:flex;gap:8px;margin-top:12px}
.ex-pick{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ex-pick img{flex:none;width:56px;height:56px;border-radius:12px;background:var(--surface-sunken)}
.ex-pick .go{flex:none;width:auto;min-height:40px;padding:0 16px;margin-left:auto}
.toast{display:flex;align-items:center;gap:10px}
.toast.has-action{gap:14px;pointer-events:auto}
.toast-action{padding:4px;border:none;background:none;color:var(--on-accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
/* ---------- Ta semaine (design 3c) ---------- */
.wk-stats{display:flex;gap:12px;margin:12px 0 18px}
.wk-stat{flex:1;min-width:0}
.wk-num{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase}
.wk-lbl{margin-top:2px;font-size:12.5px;color:var(--text-2)}
.wk-last{margin-top:3px;font-size:11.5px;color:var(--text-muted)}
.wk-days{display:flex;gap:4px;margin-bottom:14px}
.wk-day{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;border:none;background:none;color:inherit;font-family:inherit;cursor:pointer}
.wk-letter{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;color:var(--text-muted)}
.wk-day.today .wk-letter{box-shadow:0 0 0 1.5px var(--select);color:var(--select);font-weight:700}
.wk-tile{position:relative;width:100%;max-width:44px;height:44px;border:1.5px solid transparent;border-radius:12px;display:flex;align-items:center;justify-content:center}
.wk-tile.fait{color:var(--on-accent)}
.wk-tile.prevu{background:var(--surface-sunken)}
.wk-tile.manque{border-style:dashed;border-color:var(--attention)}
.wk-tile.repos{border-style:dashed;border-color:var(--line-field)}
.wk-bang{position:absolute;top:-6px;left:-6px;width:16px;height:16px;border-radius:50%;background:var(--attention);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wk-plus{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1}
.wk-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:14px;font-size:12.5px;color:var(--text-2)}
.wk-legend i{display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:4px;vertical-align:-2px;box-sizing:border-box}
.wk-legend .plus{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-right:6px;border-radius:50%;background:var(--text-muted);color:var(--on-accent);font-size:11px;font-weight:700;line-height:1;vertical-align:-2px}
.wk-msg{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-bottom:6px;border-radius:var(--r-md);background:var(--surface-sunken);font-size:14px;line-height:1.45;color:var(--text-2)}
.wk-msg>svg{flex:none;margin-top:2px;color:var(--accent)}
.wk-msg .bang{flex:none;width:20px;height:20px;border-radius:50%;background:var(--attention);color:var(--on-accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wk-charge{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;width:100%;min-height:52px;margin-top:12px;padding:12px 0 0;border:none;border-top:1px solid var(--line);background:none;color:inherit;font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.wk-charge .r{display:flex;align-items:center;gap:6px;margin-left:auto}
/* ---------- Programme : en-tête, calendrier semaine / mois, petites cartes (design 8, V5) ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.page-action{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:none;border-radius:var(--r-pill);background:var(--surface-control);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg{display:flex;padding:3px;margin:0 0 14px;border-radius:var(--r-pill);background:var(--surface)}
.seg button{flex:1;height:34px;border:none;border-radius:var(--r-pill);background:none;color:var(--text-muted);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button.active{background:var(--select);color:var(--on-accent)}
.pg-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pg-arrow{width:40px;height:40px;border:none;border-radius:12px;background:var(--surface-control);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pg-range{font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase;text-align:center;flex:1;padding:0 8px}
.pg-letters{display:flex;gap:4px;margin-bottom:2px}
.pg-letters span{flex:1;text-align:center;font-size:12.5px;color:var(--text-muted)}
.pg-row{display:flex;gap:4px}
.pg-month .pg-row{margin-bottom:8px}
.prog-daycol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:3px 0;border:2px solid transparent;border-radius:14px;cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast)}
.prog-daycol .pg-letter{font-size:12.5px;color:var(--text-muted)}
.prog-daycol .pg-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--text-muted)}
.prog-daycol.today .pg-num{box-shadow:0 0 0 1.5px var(--select);color:var(--select);font-weight:700}
.prog-daycol.selected{background:var(--select-soft)}
.prog-daycol.out{opacity:.4}
.prog-daycol .wk-tile{touch-action:pan-y;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.prog-daycol .wk-tile.draggable{touch-action:none}
.pg-month .wk-tile{max-width:36px;height:36px;border-radius:10px}
.pg-month .wk-tile .wk-bang{top:-5px;left:-5px;width:14px;height:14px;font-size:10px}
.pg-month .wk-tile .wk-plus{top:-5px;right:-5px;width:15px;height:15px;font-size:12px}
.prog-daycol.dragover{background:var(--select-soft);border-color:var(--select)}
.prog-daycol.origin .wk-tile{background:none !important;border:1.5px dashed #5A6068 !important;color:transparent !important}
.prog-daycol.origin .wk-tile>*{visibility:hidden}
.prog-ghost{position:fixed;z-index:999;pointer-events:none;transform:scale(1.08) rotate(-6deg);box-shadow:var(--shadow-lift);border-radius:12px}
.pg-help{margin:12px 0 0;font-size:13.5px;color:var(--text-2);text-align:center}
.pg-day-title{margin:16px 2px 10px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.sv5{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:12px 14px;border:none;border-radius:var(--r-lg);background:var(--surface);color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.sv5 .ic{flex:none;width:36px;height:36px;border:1.5px solid;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sv5.fait .ic{border-color:transparent;color:var(--on-accent)}
.sv5 .st{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.sv5.late .st{color:var(--attention)}
.sv5 .tt{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.15;text-transform:uppercase}
.sv5 .chev{margin-left:auto;flex:none;color:var(--text-muted);display:flex}
.pg-rest{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface);color:var(--text-2);font-size:14px}
.pg-add{flex:none;width:44px;height:44px;border:none;border-radius:50%;background:var(--surface-control);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet .session-card{margin:0;padding:4px 0 0;background:none;border:none}
/* ---------- Feuilles Ajouter / Modifier la séance (design 8) ---------- */
.psheet .l{display:block;margin:14px 0 6px;font-size:12.5px;color:var(--text-2)}
.psheet .sheet-input{width:100%;min-height:var(--field-h);border-radius:var(--r-md)}
.psheet textarea.sheet-input{min-height:72px;resize:vertical;font-family:inherit}
.ps-pills{display:flex;flex-wrap:wrap;gap:8px}
.ps-pills .flt i{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:3px}
.ps-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ps-grid>*{min-width:0}
.psheet input[type="date"]{display:block;min-width:0;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;text-align:left}
.ps-unit{display:flex;align-items:center;gap:8px}
.ps-unit span{color:var(--text-muted);font-size:14px;white-space:nowrap}
.ps-pace{display:flex;align-items:center;gap:6px}
.ps-pace .sheet-input{text-align:center;min-width:0}
.ps-err{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--text)}
.link-danger{color:var(--danger)!important}
.link-gray{display:block;width:100%;margin-top:6px;padding:14px 12px;border:none;background:none;color:var(--text-3);font-family:inherit;font-size:14.5px;cursor:pointer}
/* ---------- Bannières et alertes de Programme (design 9a) ---------- */
.alert-card{margin-bottom:14px;padding:16px;border:1px solid var(--attention-line);border-radius:var(--r-xl);background:var(--attention-bg)}
.alert-card.strong{border-color:var(--attention);background:var(--attention-bg-strong)}
.al-head{display:flex;gap:12px;margin-bottom:12px}
.al-ic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--attention);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.al-title{font-size:15px;font-weight:600;line-height:1.3}
.al-text{margin-top:4px;font-size:13px;line-height:1.45;color:var(--text-2)}
.al-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;margin-bottom:8px;padding:0 14px;border:none;border-radius:var(--r-sm);background:var(--surface-sunken);color:var(--text);font-family:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.al-row .chev{flex:none;display:flex;color:var(--text-muted)}
.al-shift{margin-bottom:8px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-sunken)}
.al-shift .t{margin-bottom:10px;font-size:14.5px}
.al-step{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.al-step button{flex:none;width:36px;height:36px;border:none;border-radius:var(--r-xs);background:var(--surface-control);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.al-step .v{font-family:var(--font-display);font-weight:700;font-size:22px}
.al-step .v small{font-family:var(--font-text);font-weight:400;font-size:14px;color:var(--text-2)}
.al-note{margin-top:4px;font-size:12px;line-height:1.45;color:var(--text-muted)}
.al-more{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;margin:-4px 0 14px;padding:0 14px;border:none;border-radius:var(--r-md);background:var(--surface);color:var(--text-2);font-family:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.al-more i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--attention)}
.al-more .chev{margin-left:auto;display:flex;color:var(--text-muted)}
.al-info{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:14px;padding:6px 6px 6px 14px;border-radius:var(--r-md);background:var(--surface);color:var(--text-2);font-size:13.5px}
.al-info>svg{flex:none;color:var(--text-muted)}
.al-need{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:14px;padding:14px;border-radius:var(--r-md);background:var(--surface);color:var(--text-2);font-size:14px;line-height:1.5}
.al-need .ttl{display:flex;gap:10px;align-items:flex-start}
.al-need .ttl>svg{flex:none;margin-top:2px;color:var(--text-muted)}
.al-info .x{margin-left:auto;flex:none;width:36px;height:36px;border:none;background:none;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
/* Progression (S6) : carte objectif + anneaux, tuiles, chiffres clés, records, jauge de charge */
.pg-card{background:var(--surface);border-radius:var(--r-xl);padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.pg-over{font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase}
.pg-obj-top{display:flex;justify-content:space-between;align-items:center}
.pg-badge{height:22px;padding:0 8px;border-radius:11px;border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:600;display:flex;align-items:center}
.pg-obj-title{font:700 24px/1.1 var(--font-display);text-transform:uppercase}
.pg-block{display:flex;flex-direction:column;gap:6px;min-height:40px;justify-content:center}
.pg-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pg-bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pg-sub{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--text-muted)}
.pg-sub b{color:var(--text);font-weight:600}
.pg-sep{height:1px;background:var(--line)}
.pg-pace{display:flex;align-items:baseline;gap:10px;font:700 22px/1 var(--font-display)}
.pg-pace .a{color:var(--text-2)}
.pg-pace .b{color:var(--accent)}
.pg-pace svg{color:var(--text-muted);align-self:center}
.pg-pace small{font:500 12px var(--font-text);color:var(--text-muted)}
.pg-dots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pg-dots i{height:14px;border-radius:4px;background:var(--accent)}
.pg-dots i.off{background:none;box-shadow:inset 0 0 0 1.5px var(--line-empty)}
.pg-rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-ring{display:flex;align-items:center;gap:10px;min-width:0}
.pg-ring svg{flex:none;transform:rotate(-90deg)}
.pg-ring .v{font:700 20px/1 var(--font-display);text-transform:uppercase}
.pg-ring .s{font-size:11.5px;color:var(--text-muted)}
.pg-h2{font:700 18px/1 var(--font-display);text-transform:uppercase;color:var(--text-2);padding:8px 4px 10px}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pg-tile{position:relative;background:var(--surface);border:none;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;color:inherit;font:inherit}
.pg-chev{position:absolute;top:12px;right:12px;color:var(--text-faint);display:flex}
.pg-tile:has(.pg-chev) .pg-over{padding-right:20px}
.pg-key .pg-chev{top:auto;bottom:12px}
button.pg-tile{cursor:pointer}
.pg-tile .big{font:700 26px/1.05 var(--font-display);text-transform:uppercase}
.pg-coach{display:flex;gap:6px;font-size:12.5px;line-height:1.35;color:var(--text-2)}
.pg-coach svg{color:var(--accent);margin-top:3px;flex:none}
.pg-chg-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pg-chg-row .z{font:700 20px/1.05 var(--font-display);text-transform:uppercase}
.pg-chg-row .n{font:700 22px/1 var(--font-display)}
.pg-mini{position:relative;display:flex;gap:2px;height:6px}
.pg-mini i{display:block;height:100%}
.pg-mini i:first-child{border-radius:3px 1px 1px 3px}
.pg-mini i:nth-child(2){border-radius:1px}
.pg-mini i:nth-child(3){border-radius:1px 3px 3px 1px}
.pg-mark{position:absolute;top:-3px;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--surface)}
.pg-key{position:relative;background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;min-width:0}
button.pg-key{display:block;width:100%;border:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.pg-key .big{font:700 24px/1.1 var(--font-display);text-transform:uppercase;margin-top:4px}
.pg-key .big.none{color:var(--text-faint)}
.pg-key .u{font-size:12px;color:var(--text-muted)}
.pg-rec-head{display:flex;justify-content:space-between;align-items:center}
.pg-rec-head svg{color:var(--accent)}
.pg-rec-row{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;border:none;border-top:1px solid var(--surface-control);background:none;color:inherit;font:inherit;text-align:left;width:100%;padding:0}
button.pg-rec-row{cursor:pointer}
.pg-rec-row .k{font:700 18px var(--font-display);text-transform:uppercase}
.pg-rec-row .d{font-size:12.5px;color:var(--text-muted)}
.pg-rec-row .t{font:700 20px var(--font-display)}
.pg-rec-row .t.none{color:var(--text-faint)}
.pg-rec-sub{display:flex;flex-direction:column;gap:2px}
.pg-rec-note{font-size:12px;color:var(--text-muted)}
@media (max-width:370px){
  .pg-ring .v,.pg-chg-row .z{font-size:17px}
  .pg-chg-row .n{font-size:19px}
}
/* Feuille de la jauge de charge (4c) */
.cg-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.cg-top .btns{display:flex;gap:8px;align-items:center}
.cg-info{width:36px;height:36px;border:none;border-radius:50%;background:var(--line-field);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cg-zone{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:18px}
.cg-zone .z{font:700 28px/1.05 var(--font-display);text-transform:uppercase}
.cg-zone .n{font:700 28px/1 var(--font-display);flex:none}
.cg-bar{position:relative;display:flex;gap:3px;height:8px}
.cg-bar i{display:block;height:100%}
.cg-bar i:first-child{border-radius:4px 2px 2px 4px}
.cg-bar i:nth-child(2){border-radius:2px}
.cg-bar i:nth-child(3){border-radius:2px 4px 4px 2px}
.cg-mark{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--surface-raised)}
.cg-ticks{position:relative;height:16px;margin-top:6px;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.cg-ticks span{position:absolute;transform:translateX(-50%)}
.cg-curve{position:relative;height:80px;margin-top:18px}
.cg-curve .band{position:absolute;left:0;right:0;background:rgba(198,244,50,.08);border-top:1px dashed rgba(198,244,50,.35);border-bottom:1px dashed rgba(198,244,50,.35)}
.cg-curve svg{position:absolute;inset:0;overflow:visible}
.cg-curve .dot{position:absolute;width:10px;height:10px;margin:-5px -5px 0 0;border-radius:50%;box-shadow:0 0 0 3px var(--surface-raised)}
.cg-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-top:6px}
.cg-coach{display:flex;gap:8px;font-size:14px;line-height:1.4;color:var(--text-2);margin-top:16px}
.cg-coach svg{color:var(--accent);margin-top:3px;flex:none}
.cg-text{font-size:14px;line-height:1.45;color:var(--text-2)}
.cg-levels{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);background:var(--surface-sunken);margin:14px 0}
.cg-levels div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;color:var(--text-2)}
.cg-levels i{width:10px;height:10px;border-radius:3px;flex:none;margin-top:4px}
.cg-levels b{color:var(--text)}
.cg-src{font-size:12px;color:var(--text-muted);margin-top:10px}
@media (prefers-reduced-motion: no-preference){
  .pg-bar.anim>i{animation:pgBar .8s ease-out both}
  .pg-ring.anim circle.fg{animation:ringFill .8s ease-out both}
  .cg-bar.anim .cg-mark{animation:cgMark .6s ease-out both}
  .cg-curve.anim .reveal{animation:cgReveal .6s ease-out both}
}
@keyframes pgBar{from{width:0}}
@keyframes ringFill{from{stroke-dasharray:0 100}}
@keyframes cgMark{from{left:0}}
@keyframes cgReveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* Feuille de détail d'une séance (S7, design 7s) et Détail cardio V2 */
.rs-card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;margin:14px 0}
.rs-card .sc-metrics{margin:0}
.rs-field{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.rs-field .l{font-size:12.5px;color:var(--text-2)}
.rs-select{position:relative}
.rs-select select{appearance:none;-webkit-appearance:none;width:100%;height:48px;padding:0 40px 0 36px;border-radius:var(--r-md);background:var(--surface-sunken);border:1px solid var(--line-field);color:var(--text);font:inherit;font-size:16px;cursor:pointer}
.rs-select i{position:absolute;left:14px;top:19px;width:10px;height:10px;border-radius:3px;pointer-events:none}
.rs-select svg{position:absolute;right:14px;top:16px;color:var(--text-muted);pointer-events:none}
.rs-hint{font-size:12px;color:var(--text-muted)}
.rs-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;margin-top:14px;padding-top:6px;border-top:1px solid var(--line)}
.rs-row .t{font-size:14.5px}
.rs-row .h{font-size:12px;color:var(--text-muted);margin-top:2px}
.rs-record{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-size:14.5px;font-weight:600;margin-top:14px}
.rs-record svg{color:var(--accent);flex:none}
.rs-legs{display:flex;gap:8px;margin-top:6px}
.rs-actions{margin-top:16px}
.cd-row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 4px;margin-top:10px;border:none;border-top:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.cd-row .chev{color:var(--text-muted);display:flex}
.cd-row .cd-label{display:flex;align-items:center;gap:8px}
.cd-row .cd-heart{color:var(--data-coral);display:flex}
.cd-row .tag{margin-left:auto;margin-right:8px;font-size:11.5px;color:var(--attention)}
.cd-card{display:flex;flex-direction:column;gap:14px;padding:4px 0 6px}
.cd-curve svg{display:block;overflow:visible}
.cd-curve text{fill:var(--text-muted);font-size:10.5px;font-family:var(--font-text);font-variant-numeric:tabular-nums}
.cd-zone{display:grid;grid-template-columns:54px 1fr 54px;gap:10px;align-items:center;font-size:12.5px}
.cd-zone .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cd-zone .bar i{display:block;height:100%}
.cd-zone .z{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.cd-zone .z i{width:8px;height:8px;border-radius:50%;flex:none}
.cd-zone .t{text-align:right;color:var(--text-muted);font-variant-numeric:tabular-nums}
.cd-pace{display:flex;gap:18px}
.cd-pace .k{font-size:11px;color:var(--text-muted)}
.cd-pace .v{font:700 20px var(--font-display)}
.cd-note{font-size:12px;color:var(--text-muted);line-height:1.45}
.cd-flag{padding:10px 12px;border-radius:var(--r-sm);background:var(--attention-bg);box-shadow:inset 0 0 0 1px var(--attention-line);font-size:12.5px;line-height:1.4}
.cd-flag button{margin-top:8px}
.confirm-back{position:fixed;inset:0;z-index:320;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-card{width:100%;max-width:420px;background:#24272B;border-radius:var(--r-xl);padding:18px 16px 14px;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;gap:14px}
.confirm-card h2{font:700 20px/1.15 var(--font-display);text-transform:uppercase}
.confirm-card p{font-size:14px;line-height:1.4;color:var(--text-2)}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm-btns button{height:44px;border:none;border-radius:22px;color:var(--text);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;background:var(--surface-control)}
.confirm-btns button.go{background:#3A3D42}
.confirm-btns button.go.danger{background:var(--danger-bg);color:var(--danger)}
/* Feuille de ressenti (S7, design 7a) */
.rt-block{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.rt-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.rt-top b{font:700 17px var(--font-display);color:var(--text)}
.rt-top b.none{color:var(--text-faint)}
.rt-ends{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--text-muted)}
.rt-range{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:none;cursor:pointer;--p:0%}
.rt-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--select) var(--p),var(--line-field) var(--p))}
.rt-range::-moz-range-track{height:6px;border-radius:3px;background:var(--line-field)}
.rt-range::-moz-range-progress{height:6px;border-radius:3px;background:var(--select)}
.rt-range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:var(--select);border:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.rt-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--select);border:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.rt-range:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.rt-pills{display:flex;flex-wrap:wrap;gap:8px}
.rt-pill{min-width:44px;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line-field);background:var(--surface-sunken);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rt-pill[aria-pressed="true"]{background:var(--select);border-color:var(--select);color:var(--on-accent)}
.rt-sep{height:1px;background:var(--line);margin:18px 0 14px}
.rt-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-sunken);border-radius:var(--r-sm);padding:3px;margin:10px 0}
.rt-seg button{height:36px;border:none;border-radius:9px;background:none;color:var(--text-muted);font:inherit;font-size:14px;cursor:pointer}
.rt-seg button[aria-pressed="true"]{background:var(--select);color:var(--on-accent);font-weight:600}
.rt-body{display:flex;justify-content:center}
.rt-body svg{display:block;width:100%;max-height:300px}
.rt-body .zone{cursor:pointer}
.rt-cap{font-size:12.5px;color:var(--text-muted);text-align:center;margin:8px 0 2px}
.rt-legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--text-2);margin:6px 0 12px}
.rt-legend span{display:flex;align-items:center;gap:6px}
.rt-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.rt-zone{background:var(--surface-sunken);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.rt-zone .hd{display:flex;justify-content:space-between;align-items:center}
.rt-zone .nm{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.rt-zone .nm i{width:10px;height:10px;border-radius:50%}
.rt-zone .x{border:none;background:none;color:var(--text-muted);cursor:pointer;display:flex;padding:6px}
.rt-err{font-size:13px;font-weight:600;min-height:0;margin-top:12px}
/* Saisie à la main (S7, N1) et cartes de rattachement / fusion (N2, N5) */
.ms-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-sunken);font-size:13.5px;color:var(--text-2);margin-bottom:6px}
.ms-link svg{color:var(--accent);flex:none}
.ms-alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-lg);background:var(--attention-bg);box-shadow:inset 0 0 0 1px var(--attention-line);font-size:14px;line-height:1.4;margin-top:12px}
.ms-alert svg{color:var(--attention);flex:none;margin-top:1px}
.btn-ghost{width:100%;height:48px;margin-top:6px;border:none;border-radius:24px;background:none;color:var(--text-2);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.ac-card{background:var(--surface);border-radius:var(--r-xl);padding:18px 16px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:14px}
.ac-head{display:flex;align-items:center;gap:10px}
.ac-head .ic{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ac-title{font:700 23px/1.15 var(--font-display);text-transform:uppercase}
.ac-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ac-tile{background:var(--surface-sunken);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.ac-tile .k{font-size:11px;color:var(--text-muted);text-transform:uppercase}
.ac-tile .v{font:700 22px var(--font-display);text-transform:uppercase}
.ac-opts{display:flex;flex-direction:column;gap:8px}
.ac-opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:var(--r-md);background:var(--surface-sunken);box-shadow:inset 0 0 0 1.5px transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.ac-opt[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ac-opt .rd{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--text-faint);display:flex;align-items:center;justify-content:center;flex:none}
.ac-opt[aria-checked="true"] .rd{box-shadow:inset 0 0 0 2px var(--accent)}
.ac-opt[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ac-opt .n{font-size:15px;font-weight:600}
.ac-opt .d{font-size:12.5px;color:var(--text-muted)}
.ac-notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);font-size:13.5px;line-height:1.4;color:var(--text-2);margin-bottom:14px}
.ac-notice>svg{color:var(--text-muted);flex:none;margin-top:1px}
.ac-notice span{flex:1}
.ac-notice button{border:none;background:none;color:var(--text-muted);cursor:pointer;padding:0;display:flex;flex:none}
.ac-ask{background:var(--surface);border-radius:var(--r-xl);padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.ac-ask .q{font-size:15px;font-weight:600}
.ac-ask p{font-size:14px;line-height:1.45;color:var(--text-2)}
.ac-pair{display:flex;gap:8px}
.ac-pair>div{flex:1;background:var(--surface-sunken);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ac-pair .k{font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.ac-pair .v{font:700 19px var(--font-display)}
.ac-pair .s{font-size:12px;color:var(--text-3)}
.ac-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac-btns button{height:44px;border:none;border-radius:22px;background:var(--surface-control);color:var(--text);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.ac-btns button.main{background:var(--select);color:var(--on-accent)}
/* Profil (S11, design 12b) */
.pf-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:24px;background:var(--surface);margin-bottom:16px}
.pf-seg button{height:40px;border:none;border-radius:20px;background:none;color:var(--text-3);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.pf-seg button[aria-pressed="true"]{background:var(--select);color:var(--on-accent)}
.pf-over{padding:0 4px;margin-bottom:8px}
.pf-obj{width:100%;border:none;text-align:left;color:inherit;font:inherit;background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;cursor:pointer}
.pf-obj .top{display:flex;align-items:center;gap:10px}
.pf-obj .ic{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.pf-obj .t{font:700 20px/1.1 var(--font-display);text-transform:uppercase}
.pf-obj .s{font-size:13px;color:var(--text-3)}
.pf-obj .chev{margin-left:auto;color:var(--text-faint);display:flex}
.pf-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pf-tiles>div{background:var(--surface-sunken);border-radius:12px;padding:8px 10px;min-width:0}
.pf-tiles .k{font-size:11px;color:var(--text-muted)}
.pf-tiles .v{font:700 18px var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-add{width:100%;height:52px;border-radius:var(--r-lg);border:1px dashed var(--line-empty);background:none;color:var(--text-2);font:inherit;font-size:15px;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.pf-card{background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.pf-title{font:700 20px var(--font-display);text-transform:uppercase}
.pf-card.sm .pf-title{font-size:18px}
.pf-group{display:flex;flex-direction:column;gap:10px}
.pf-lbl{font-size:13.5px;color:var(--text-2)}
.pf-nums{display:grid;gap:6px}

.hs-filters{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.hs-filters .seg{flex:1;margin:0;padding:3px;border-radius:var(--r-sm);background:var(--surface-sunken);gap:4px}
.hs-filters .seg button{height:34px;border-radius:9px;font-size:13px}
.hs-type{position:relative;flex:none}
.hs-type select{appearance:none;-webkit-appearance:none;height:40px;padding:0 30px 0 12px;border-radius:var(--r-sm);background:var(--surface-sunken);border:1px solid var(--line-field);color:var(--text);font:inherit;font-size:13px;cursor:pointer;max-width:130px}
.hs-type svg{position:absolute;right:10px;top:13px;color:var(--text-muted);pointer-events:none}
.hs-card{background:var(--surface);border-radius:var(--r-xl);padding:12px 16px 8px;margin-bottom:12px}
.hs-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px}
.hs-head .t{font:700 17px var(--font-display);text-transform:uppercase}
.hs-head .s{font-size:12.5px;color:var(--text-muted)}
.hs-over{font-size:11px;letter-spacing:.14em;color:var(--text-muted);padding:6px 4px 8px;text-transform:uppercase}
.hs-month{background:var(--surface);border-radius:var(--r-xl);padding:6px 16px 10px;margin-bottom:12px}
.hs-mh{display:flex;justify-content:space-between;align-items:center;min-height:44px;width:100%;padding:0 4px;border:none;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.hs-mh .t{display:flex;align-items:center;gap:8px;font:700 18px var(--font-display);text-transform:uppercase}
.hs-mh .t svg{color:var(--text-muted)}
.hs-mh .s{font-size:12.5px;color:var(--text-muted)}
.hs-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:60px;padding:6px 0;width:100%;border:none;border-top:1px solid var(--surface-control);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.hs-row .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.hs-row .mid{min-width:0;display:flex;flex-direction:column;gap:1px}
.hs-row .l1{display:flex;align-items:center;gap:8px}
.hs-row .l1 b{font-size:15px;font-weight:600}
.hs-row .l1 span{font-size:12.5px;color:var(--text-muted)}
.hs-row .l2{font-size:12.5px;color:var(--text-2)}
.hs-row .rec{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);margin-top:2px}
.hs-row .man{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-muted)}
.hs-row .end{display:flex;align-items:center;gap:6px;color:var(--text-faint)}
.hs-pill{height:22px;min-width:22px;padding:0 7px;border-radius:11px;box-sizing:border-box;background:var(--line);color:var(--text-2);font:600 11.5px/22px var(--font-text);text-align:center}
.hs-pill.high{background:var(--attention);color:var(--on-accent)}
.hs-pill.todo{background:none;box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);padding:0 8px;display:flex;align-items:center}
.hs-empty{font-size:13px;color:var(--text-muted);padding:14px 4px}
@media (prefers-reduced-motion: no-preference){ .hs-mbody{animation:expandIn .2s ease-out} }
/* Graphiques de Progression (S6.3, design 6) */
.pc{gap:22px;padding:20px 16px 18px}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
/* Menu d'année des graphiques par mois (D94) */
.pc-year{position:relative;margin-left:auto;flex:none}
.pc-year-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border:1px solid var(--line-field);border-radius:16px;background:var(--surface-control);color:var(--text-2);font:inherit;font-size:13px;cursor:pointer}
.pc-year-pop{position:absolute;right:0;top:36px;z-index:25;min-width:180px;padding:6px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-lift)}
.pc-year-pop button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:40px;padding:0 12px;border:none;border-radius:10px;background:none;color:var(--text);font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.pc-year-pop button[aria-selected="true"]{color:var(--accent)}
.pc-year-pop button:active{background:var(--surface-control)}
.pc-title{display:flex;align-items:center;gap:8px;padding-top:4px}
.pc-title .heart{color:var(--data-coral);display:flex}
.pc-prog{text-align:right;flex:none}
.pc-prog .v{font:700 26px/1 var(--font-display);text-transform:uppercase;color:var(--accent)}
.pc-prog .v.muted{color:var(--text-muted)}
.pc-prog .s{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.pc-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-sunken);border-radius:var(--r-sm);padding:3px}
.pc-seg button{height:34px;border:none;border-radius:9px;background:none;color:var(--text-muted);font:inherit;font-size:13px;cursor:pointer}
.pc-seg button[aria-pressed="true"]{background:var(--select);color:var(--on-accent);font-weight:600}
.pc-coach{display:flex;gap:8px;font-size:14px;line-height:1.4;color:var(--text-2)}
.pc-coach svg{color:var(--accent);margin-top:3px;flex:none}
.pc-plot svg{display:block;overflow:visible}
.pc-plot svg .gl{stroke:var(--line);stroke-width:1}
.pc-plot svg text{fill:var(--text-muted);font-size:10.5px;font-family:var(--font-text);font-variant-numeric:tabular-nums}
.pc-plot svg .bub rect,.pc-plot svg .bub path{fill:var(--select)}
.pc-plot svg .bub text{fill:var(--on-accent);font-size:12px}
.pc-plot svg .bub{cursor:pointer}
.pc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text-muted);margin-top:-8px}
.pc-legend span{display:inline-flex;align-items:center;gap:6px}
.pc-legend i{display:inline-block;flex:none}
.pc-legend .dot{width:8px;height:8px;border-radius:50%}
.pc-legend .dia{width:8px;height:8px;transform:rotate(45deg)}
.pc-legend .sq{width:9px;height:9px;border-radius:2px}
.pc-legend .ln{width:16px;height:0;border-top:1.5px dashed var(--text-3)}
.pc-slider{position:relative;height:28px;touch-action:none;cursor:pointer;outline:none}
.pc-slider:focus-visible .handle{box-shadow:0 0 0 3px var(--accent)}
.pc-slider .track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.pc-slider .tk{position:absolute;top:9px;width:3px;height:10px;margin-left:-1.5px;border-radius:1px;background:var(--text-faint)}
.pc-slider.dense .tk{width:2px;margin-left:-1px}
.pc-slider .tk.race{top:8px;height:12px;background:var(--type-course)}
.pc-slider .handle{position:absolute;top:0;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--select);box-shadow:0 0 0 4px rgba(198,244,50,.25)}
.pc-slider .handle::after{content:"";position:absolute;inset:-8px}
.pc-nav{display:flex;align-items:center;gap:8px;margin-top:6px}
.pc-nav button{width:44px;height:44px;flex:none;border:none;border-radius:50%;background:var(--surface-control);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pc-nav .txt{font-size:12.5px;line-height:1.35;color:var(--text-muted)}
.pc-wait{background:none;border:1px dashed var(--line-empty);gap:10px}
.pc-wait .big{font:700 22px/1.1 var(--font-display);text-transform:uppercase;color:var(--text-faint)}
.pc-wait p{font-size:13.5px;line-height:1.45;color:var(--text-3)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: no-preference){
  .pc-plot.anim.time svg{animation:cgReveal .6s ease-out both}
  .pc-plot.anim .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barRise .4s ease-out both;animation-delay:calc(var(--i) * 40ms)}
  .pc-slider .handle{transition:left .15s ease-out}
  .pc-title .heart svg,.cd-row .cd-heart svg{animation:heartBeat 1.6s ease-in-out infinite}
}
@keyframes barRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes heartBeat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.18)}20%{transform:scale(1)}30%{transform:scale(1.18)}}
.sheet-back{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface-raised);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box;box-shadow:var(--shadow-sheet)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--grabber);margin:0 auto 14px}
/* Fermer en tirant vers le bas (D96) : on prend la poignée ou la ligne du titre ; la fenêtre suit le doigt */
.sheet{position:relative}
.sheet-grab{position:absolute;left:0;right:0;top:0;height:30px;touch-action:none;z-index:3}
.sheet-head{touch-action:none}
.sheet.dragging{user-select:none;-webkit-user-select:none}
.sheet.settle{transition:transform .22s ease-out}
@media (prefers-reduced-motion: reduce){.sheet.settle{transition:none}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet-overline{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.sheet-title{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1;text-transform:uppercase}
.sheet-close{position:relative;flex-shrink:0;width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-control);color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sheet-close::after{content:"";position:absolute;inset:-4px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:sheetUp var(--t-step,280ms) var(--ease)}
  .sheet-back{animation:sheetFade var(--t-step,280ms) ease-out}
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}

/* Message en bas (toast) : blanc sur le fond sombre, 3 s ; remplace peu à peu les fenêtres du
   navigateur (alert) — voir toast() ; généralisé en S12. */
#toastRoot{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:400;padding:0 16px}
.toast{background:var(--select);color:var(--on-accent);border-radius:var(--r-pill);padding:12px 20px;font-size:14.5px;font-weight:600;box-shadow:var(--shadow-lift);max-width:420px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity var(--t-fast),transform var(--t-fast)}
.toast.show{opacity:1;transform:none}

/* Réduire les animations : rien ne bouge, les valeurs finales s'affichent directement. */
@media (prefers-reduced-motion: reduce){
  :root{--t-fast:0ms;--t-step:0ms}
  *,*::before,*::after{animation:none !important;transition:none !important}
}
.sheet-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
/* Dans une feuille, un champ = libellé au-dessus, saisie de 48 px dessous (pas de boîte dans une boîte). */
.sheet .field{flex-direction:column;align-items:stretch;gap:6px;background:none;border:none;padding:0;min-height:0}
.sheet .field input.sheet-input{flex:none;background:var(--surface-sunken);border:1px solid var(--line-field);border-radius:var(--r-md);padding:9px 14px;outline:none;transition:border-color var(--t-fast)}
.sheet .field input.sheet-input:focus{border-color:var(--select)}
.sheet-input{background:var(--surface-sunken);border:1px solid var(--line-field);border-radius:var(--r-sm);color:var(--text);font-size:16px;min-height:var(--tap-min);padding:9px 12px;font-family:inherit;box-sizing:border-box}
</style>
