// Carte de séance (design 2d, V1 à V7). Même carte sur Aujourd'hui et, pour le jour choisi, dans Programme.
// États : prévue, faite (reçue d'Apple Santé ou saisie à la main : chiffres réels + détail cardio replié),
// en retard (« Pas encore reçue d'Apple Santé » + « J'ai fait cette séance »).
let openSessionMenu = null;
window.toggleSessionMenu = (id) => { openSessionMenu = openSessionMenu===id ? null : id; renderContent(); };
window.closeSessionMenu = () => { openSessionMenu = null; openExMenu = null; };
// Toucher ailleurs referme les menus « … » et « ⋮ ».
document.addEventListener("click", (e) => {
  if((openSessionMenu || openExMenu) && !e.target.closest(".menu-wrap")){ openSessionMenu = null; openExMenu = null; renderContent(); }
});
// Valeur d'une tuile : chiffres et unités en majuscules (« 45 MIN »), texte tel quel (« Élastique »).
function scTile(label, value, color){
  const v = String(value), isText = /[a-zA-ZÀ-ÿ]{4,}/.test(v.replace(/\b(min|km)\b/gi,""));
  return `<div class="sc-tile"><div class="l">${color?`<i style="background:${color}"></i>`:""}${escHtml(label)}</div><div class="v${isText?" t":""}">${escHtml(isText ? v : v.toUpperCase())}</div></div>`;
}
function scMetricsHTML(big, tiles){
  if(!big && !tiles.length) return "";
  return `<div class="sc-metrics">${big?`<div class="sc-big"><span class="n">${escHtml(big.value)}</span><span class="u">${escHtml(big.unit)}</span>${big.note?`<div class="note">${escHtml(big.note)}</div>`:""}</div>`:""}${tiles.length?`<div class="sc-tiles">${tiles.join("")}</div>`:""}</div>`;
}
function sessionMenuHTML(session, todayStr){
  const items = [];
  if(session.planned_date<=todayStr) items.push(["J'ai fait cette séance", `openManualRun('${session.id}')`, ""]);
  items.push(["Modifier la séance", `openEditSheet('${session.id}')`, ""]);
  if(session.pace_zone && session.pace_zone!=="easy") items.push(["Remplacer par une EF", `replaceWithEasy('${session.id}')`, ""]);
  items.push(["Supprimer la séance", `askDeleteSession('${session.id}')`, "danger"]);
  const open = openSessionMenu===session.id;
  return `<div class="menu-wrap"><button type="button" class="sc-menu" aria-label="Plus d'actions" aria-haspopup="menu" aria-expanded="${open}" onclick="toggleSessionMenu('${session.id}')">${icon("more",20)}</button>
    ${open?`<div class="menu-pop" role="menu">${items.map(([label,call,cls])=>`<button type="button" role="menuitem" class="${cls}" onclick="closeSessionMenu();renderContent();${call}">${escHtml(label)}</button>`).join("")}</div>`:""}</div>`;
}
function programSessionCardHTML(session, date){
  const todayStr = localDateStr(new Date());
  const state = sessionCardState(session, todayStr);
  const c = TC[session.type]||TC.Other;
  const run = state==="done" && session.linked_run_id ? RUNS.find(r=>r.id===session.linked_run_id) : null;
  const dayTxt = session.planned_date===todayStr ? "Aujourd'hui" : dayLabelShort(new Date(session.planned_date+"T00:00:00"));
  const { title, subtitle } = sessionDisplayTitle(session);
  const isCouchSession = session.generation_reason==="beginner_plan" || session.generation_reason==="guided_test";
  const exercises = state!=="done" && session.description ? exercisesInDescription(session.description) : [];
  let metrics = "";
  if(state==="done"){
    if(run){
      const big = run.dist>0 ? { value:run.dist.toFixed(1).replace(".",","), unit:"km", note: session.target_distance_km ? `prévu ${String(session.target_distance_km).replace(".",",")} km` : "" }
        : { value:String(Math.round(run.durationSec/60)), unit:"min", note:"" };
      const tiles = [scTile("Durée", run.dur)];
      if(run.dist>0 && run.allure) tiles.push(scTile("Allure /km", fmtA(run.allure)));
      metrics = scMetricsHTML(big, tiles);
    }
  } else {
    const h = sessionHeadline(session, sessionStructureSegments(session));
    const tiles = h.tiles.map(t=>scTile(t.label, t.value));
    h.structure.forEach(t=>tiles.push(scTile(STRUCTURE_STYLE[t.type].label, `${t.minutes} min`, STRUCTURE_STYLE[t.type].color)));
    if(exercises.length){
      tiles.push(scTile("Exercices", exercises.length));
      const mats = [...new Set(exercises.map(e=>e.materiel).filter(m=>m && m!=="Aucun"))];
      if(mats.length) tiles.push(scTile("Matériel", mats.length===1 ? mats[0] : `${mats.length} objets`));
    }
    metrics = scMetricsHTML(h.big, tiles);
  }
  const effMaxHr = maxHr || estimatedMaxHr();
  const detailCardio = run ? cardioDetailBlockHTML(run, effMaxHr, restingHr || null) : "";
  const coach = state==="done" ? "" : `<div class="sc-coach">${icon("sparkle",16)}<div>${session.rationale||""}${programPaceExplanationHTML(session)}</div></div>`;
  const body = state==="done" ? "" : `${sessionStructureBarHTML(session)}${coach}
    ${session.description?`<div class="sc-sep"></div>
      <div class="stitle" style="margin-bottom:6px">${isCouchSession?"Déroulé de la séance":"Exercices"}${session.target_duration_min?` · environ ${Math.round(session.target_duration_min)} min`:""}</div>
      ${exerciseListHTML(session.description, session)}`:""}
    ${learnMoreHTML(session)}`;
  const late = state==="late" ? `<div class="sc-late">${icon("alert",16)}Pas encore reçue d'Apple Santé</div>
    <button type="button" class="btn-outline" onclick="openManualRun('${session.id}')">J'ai fait cette séance</button>` : "";
  return `<div class="session-card" id="sc_${session.id}">
    <div class="sc-head">
      <div class="sc-icon" style="background:${c}22;color:${c}">${icon(TICON[session.type]||"activity",18)}</div>
      <div class="sc-overline">${escHtml(dayTxt)}${run&&run.time?" · "+escHtml(run.time):""}</div>
      ${state==="done" ? `<span class="sc-done">${icon("check",14)} Fait</span>` : sessionMenuHTML(session, todayStr)}
    </div>
    <div class="sc-title">${escHtml(title)}</div>
    ${subtitle?`<div class="sc-sub">${escHtml(subtitle)}</div>`:""}
    ${run && run.appleType===MANUAL_RUN_MARKER ? `<span class="sc-src">Saisie à la main</span>` : ""}
    ${state==="done" ? "" : ""}
    ${metrics || (state==="done" ? "" : `<div style="height:12px"></div>`)}
    ${detailCardio}
    ${body}${late}
  </div>`;
}

// Tuile d'un jour : classe de statut, style (couleur du type) et contenu (icône, « ! », « + »). Partagée par
// « Ta semaine » (Aujourd'hui) et le calendrier de Programme. Couleur = type, plein = fait, contour = prévu,
// pointillés violets + « ! » = à replacer, pointillés gris = repos, « + » = 2e séance.
function dayTileParts(day){
  const m = day.main, sec = day.second;
  const c = m ? (TC[m.type]||TC.Other) : null;
  let style = "";
  if(m && m.status==="fait") style = `background:${c};`;
  else if(m && m.status==="prevu") style = `border-color:${c};color:${c};`;
  else if(m && m.status==="manque") style = `color:${c};`;
  const bang = m && m.status==="manque" ? `<span class="wk-bang" aria-hidden="true">!</span>` : "";
  let plus = "";
  if(sec){
    const sc = TC[sec.type]||TC.Other;
    plus = sec.status==="fait"
      ? `<span class="wk-plus" style="background:${sc};color:var(--on-accent)" aria-hidden="true">+</span>`
      : `<span class="wk-plus" style="background:var(--surface-sunken);border:1.5px solid ${sc};color:${sc}" aria-hidden="true">+</span>`;
  }
  return { cls: m ? m.status : "repos", style, inner: (m ? icon(TICON[m.type]||"activity",18) : "") + bang + plus };
}
function dayAriaLabel(day){
  const d = new Date(day.date+"T00:00:00");
  const base = d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"});
  const m = day.main, sec = day.second;
  return `${base}${day.isToday?", aujourd'hui":""}, ${m ? `${sessionTypeLabel(m.type)} ${WEEK_STATUS_LABEL[m.status]}` : "repos"}${sec ? `, 2e séance ${sessionTypeLabel(sec.type)} ${WEEK_STATUS_LABEL[sec.status]}` : ""}`;
}

// ---------- Programme : calendrier semaine et mois (design 8a, 8b) ----------
// Une colonne par jour : lettre (semaine), numéro (halo blanc aujourd'hui), tuile. Toucher un jour affiche ses
// séances dessous. Glisser-déposer (vue semaine) : appui long sur une tuile de séance prévue (voir progDragStart).
function programDayModels(dates){
  const todayStr = localDateStr(new Date());
  const runs = runningRuns.map(r=>({ date:localDateStr(dateFromRun(r)), distKm:r.dist||0, durationSec:r.durationSec||0, type:r.type }));
  return dates.map(d=>dayTileModel(d, plannedSessions, runs, todayStr));
}
function programDayColHTML(day, i, month){
  const parts = dayTileParts(day);
  const sess = day.mainId ? plannedSessions.find(p=>p.id===day.mainId) : null;
  const draggable = !month && !!sess && sess.status==="planned";
  const num = new Date(day.date+"T00:00:00").getDate();
  const selected = programSelectedDate===day.date;
  return `<div class="prog-daycol${day.isToday?" today":""}${selected?" selected":""}${month && !month.inMonth?" out":""}" data-date="${day.date}" role="button" tabindex="0" aria-label="${escHtml(dayAriaLabel(day))}" onclick="progSelectDay('${day.date}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();progSelectDay('${day.date}')}">
    ${month?"":`<span class="pg-letter">${WEEK_LETTERS[i]}</span>`}
    <span class="pg-num">${num}</span>
    <span class="wk-tile ${parts.cls}${draggable?" draggable":""}" style="${parts.style}"${draggable?` onpointerdown="progDragStart(event,'${sess.id}')"`:""}>${parts.inner}</span>
  </div>`;
}
function programNavHeaderHTML(label){
  return `<div class="pg-nav">
    <button type="button" class="pg-arrow" aria-label="${programViewMode==="week"?"Semaine précédente":"Mois précédent"}" onclick="programNavWeek(-1)">${icon("chevronLeft",20)}</button>
    <span class="pg-range">${escHtml(label)}</span>
    <button type="button" class="pg-arrow" aria-label="${programViewMode==="week"?"Semaine suivante":"Mois suivant"}" onclick="programNavWeek(1)">${icon("chevronRight",20)}</button>
  </div>`;
}
const PROGRAM_LEGEND = `<div class="wk-legend" style="margin:12px 0 0">
  <span><i style="background:var(--text-muted)"></i>fait</span>
  <span><i style="border:1.5px solid var(--text-muted)"></i>prévu</span>
  <span style="color:var(--attention)"><i style="border:1.5px dashed var(--attention)"></i>à replacer</span>
  <span><i style="border:1.5px dashed var(--line-field)"></i>repos</span>
</div>`;
function programCalendarHTML(){
  if(programViewMode==="week"){
    const monday = addDays(mondayOf(new Date()), programWeekOffset*7);
    const weekSessions = plannedSessions.filter(p=>p.week_start_date===localDateStr(monday) && (p.status==="planned"||p.status==="done"));
    const actualRunning = weekSessions.filter(p=>p.pace_zone).length;
    const actualCross = weekSessions.filter(p=>!p.pace_zone).length;
    const complete = actualRunning>=(Number(goals.frequence)||3) && actualCross>=(Number(goals.frequenceAutre)||0);
    const genLabel = (actualRunning===0 && actualCross===0) ? "Générer cette semaine" : "Compléter cette semaine";
    const dates = Array.from({length:7},(_,i)=>localDateStr(addDays(monday,i)));
    if(programSelectedDate===null && dates.includes(localDateStr(new Date()))) programSelectedDate = localDateStr(new Date());
    const fmt = d => d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    return `<div class="card">
      ${programNavHeaderHTML(`${fmt(monday)} – ${fmt(addDays(monday,6))}`)}
      <div class="pg-row">${programDayModels(dates).map((d,i)=>programDayColHTML(d,i,null)).join("")}</div>
      ${PROGRAM_LEGEND}
      <div class="pg-help" id="pgHelp" style="display:none"></div>
      ${complete?"":`<button class="btn-primary" style="margin-top:14px" onclick="generateProgram(new Date('${monday.toISOString()}'))">${genLabel}</button>`}
    </div>`;
  }
  const monthDate = new Date(); monthDate.setDate(1); monthDate.setMonth(monthDate.getMonth()+programWeekOffset);
  const today = new Date();
  if(programSelectedDate===null && monthDate.getFullYear()===today.getFullYear() && monthDate.getMonth()===today.getMonth()) programSelectedDate = localDateStr(today);
  const monthLabel = monthDate.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const weeks = monthWeeks(monthDate.getFullYear(), monthDate.getMonth());
  return `<div class="card pg-month">
    ${programNavHeaderHTML(monthLabel)}
    <div class="pg-letters">${WEEK_LETTERS.map(l=>`<span>${l}</span>`).join("")}</div>
    ${weeks.map(w=>`<div class="pg-row">${programDayModels(w.map(x=>x.date)).map((d,i)=>programDayColHTML(d,i,w[i])).join("")}</div>`).join("")}
    ${PROGRAM_LEGEND}
  </div>`;
}

// Jour choisi : une petite carte par séance (V5 : icône pleine si faite, type et distance, chevron) ; toucher
// une carte ouvre la carte complète en feuille, sur le même modèle qu'Aujourd'hui. Les séances « à replacer »
// y figurent (D6). Une course sans séance prévue y figure aussi (elle ouvre l'historique).
let sessionSheetId = null;
function programSelectedDayPanelHTML(){
  if(!programSelectedDate) return "";
  const todayStr = localDateStr(new Date());
  const date = new Date(programSelectedDate+"T00:00:00");
  const sessions = plannedSessions.filter(p=>p.planned_date===programSelectedDate && ["planned","done","missed"].includes(p.status))
    .sort((a,b)=>(sessionCategory(b)==="run"?1:0)-(sessionCategory(a)==="run"?1:0));
  const lonely = runningRuns.filter(r=>localDateStr(dateFromRun(r))===programSelectedDate && !runIsLinked(r.id));
  const stLabel = { done:"Faite", planned:"Prévue", late:"À replacer" };
  const cards = sessions.map(s=>{
    const state = sessionCardState(s, todayStr);
    const c = TC[s.type]||TC.Other;
    const cls = state==="done" ? "fait" : state==="late" ? "late" : "prevu";
    const icStyle = state==="done" ? `background:${c}` : state==="late" ? `border-style:dashed;border-color:var(--attention);color:${c}` : `border-color:${c};color:${c}`;
    return `<button type="button" class="sv5 ${cls}" onclick="openSessionSheet('${s.id}')">
      <span class="ic" style="${icStyle}">${icon(TICON[s.type]||"activity",18)}</span>
      <span><div class="st">${stLabel[state]}</div><div class="tt">${escHtml(sessionSmallTitle(s))}</div></span>
      <span class="chev">${icon("chevronRight",18)}</span>
    </button>`;
  }).concat(lonely.map(r=>{
    const c = TC[r.type]||TC.Other;
    return `<button type="button" class="sv5 fait" onclick="openRunSheet('${r.id}')">
      <span class="ic" style="background:${c}">${icon(TICON[r.type]||"activity",18)}</span>
      <span><div class="st">Faite</div><div class="tt">${escHtml(sessionTypeLabel(r.type))}${r.dist>0?" · "+String(r.dist.toFixed(1)).replace(".",",")+" km":""}</div></span>
      <span class="chev">${icon("chevronRight",18)}</span>
    </button>`;
  }));
  return `<div class="pg-day-title">${escHtml(dayLabelShort(date))}${programSelectedDate===todayStr?" · aujourd'hui":""}</div>
    ${cards.length ? cards.join("") : `<div class="pg-rest"><span>Repos — aucune séance planifiée.</span><button type="button" class="pg-add" aria-label="Ajouter une séance" onclick="openAddSheet('${programSelectedDate}')">${icon("plus",20)}</button></div>`}`;
}
window.openSessionSheet = (id) => { sessionSheetId = id; refreshSheet(); };
window.closeSessionSheet = () => { sessionSheetId = null; closeSessionMenu(); refreshSheet(); };
function renderSessionSheet(){
  const root = document.getElementById("sheetRoot");
  const s = sessionSheetId && plannedSessions.find(p=>p.id===sessionSheetId);

  root.innerHTML = `<div class="sheet-back" onclick="if(event.target===this)closeSessionSheet()"><div class="sheet" role="dialog" aria-modal="true" aria-label="${escHtml(sessionDisplayTitle(s).title)}">

// Une seule feuille à l'écran, par priorité : saisie à la main, ressenti, exercice, ajout/modification, jauge, détail d'une séance, objectif, niveau, nouvelles allures, carte de séance.
function refreshSheet(){
  const root = document.getElementById("sheetRoot");
  if(!root) return;

// ---------- Feuilles « Ajouter » et « Modifier la séance » (design 8, D47) ----------
// Type en pastilles, date, puis pour une course distance, allure, durée (deux remplis, la 3e se calcule dans
// les deux sens : voir solveRunTriplet), notes seulement pour une séance ajoutée à la main (A8). Pas de champ
// « Rappel ». Changer la date déplace la séance (même règle de cohabitation que le glisser-déposer).
let programSheet = null; // { mode:"add"|"edit", sessionId, form, order, error }
const PS_RUN_TYPES = ["EF","Long","Fractionné","Seuil","Course"];
function psPaceParts(sec){ return sec>0 ? [String(Math.floor(sec/60)), String(Math.round(sec%60))] : ["",""]; }
window.openAddSheet = (dateStr) => {
  sessionSheetId = null; closeSessionMenu();
  const d = (typeof dateStr==="string" && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) ? dateStr : (programSelectedDate || localDateStr(new Date()));
  programSheet = { mode:"add", sessionId:null, order:[], error:"", form:{ type:"EF", date:d, distKm:"", paceMin:"", paceSec:"", durationMin:"", notes:"" } };
  refreshSheet();
};
window.openEditSheet = (id) => {
  const s = plannedSessions.find(p=>p.id===id);
  if(!s) return;
  sessionSheetId = null; closeSessionMenu();
  const [pm, ps] = psPaceParts(Number(s.target_pace_sec_per_km)||0);
  let dur = Number(s.target_duration_min)||0;
  if(!dur && s.target_distance_km && s.target_pace_sec_per_km) dur = Math.round(s.target_distance_km*s.target_pace_sec_per_km/60);
  programSheet = { mode:"edit", sessionId:id, order:[], error:"", form:{ type:s.type, date:s.planned_date,
    distKm: s.target_distance_km ? String(s.target_distance_km).replace(".",",") : "", paceMin:pm, paceSec:ps,
    durationMin: dur ? String(Math.round(dur)) : "", notes: s.source==="manual_add" ? (s.description||"") : "" } };
  refreshSheet();
};
window.closeProgramSheet = () => { programSheet = null; refreshSheet(); };
window.psSetType = (t) => { if(!programSheet) return; programSheet.form.type = t; programSheet.error = ""; refreshSheet(); };
window.psField = (name, value) => {
  const st = programSheet;
  if(!st) return;
  const f = st.form;
  f[name] = value;
  const triplet = { distKm:"distKm", paceMin:"paceSecKm", paceSec:"paceSecKm", durationMin:"durationMin" }[name];
  if(!triplet || String(value).trim()==="") return;
  st.order = st.order.filter(k=>k!==triplet).concat(triplet);
  const out = solveRunTriplet({ distKm:String(f.distKm).replace(",","."), paceSecKm:(Number(f.paceMin)||0)*60+(Number(f.paceSec)||0), durationMin:f.durationMin }, st.order);
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
  if(out.computed==="distKm"){ f.distKm = String(out.distKm).replace(".",","); set("ps_distKm", f.distKm); }
  else if(out.computed==="durationMin"){ f.durationMin = String(out.durationMin); set("ps_durationMin", f.durationMin); }
  else if(out.computed==="paceSecKm"){ const [pm,ps] = psPaceParts(out.paceSecKm); f.paceMin = pm; f.paceSec = ps; set("ps_paceMin", pm); set("ps_paceSec", ps); }
};
function renderProgramSheet(){
  const st = programSheet;
  const root = document.getElementById("sheetRoot");
  if(!st) return false;
  const f = st.form;
  const s = st.mode==="edit" ? plannedSessions.find(p=>p.id===st.sessionId) : null;
  if(st.mode==="edit" && !s){ programSheet = null; return false; }
  const isRun = PS_RUN_TYPES.includes(f.type);
  const showNotes = st.mode==="add" || (s && s.source==="manual_add");
  const d = new Date(f.date+"T00:00:00");
  const overline = st.mode==="edit" ? `${isNaN(d) ? "" : dayLabelShort(d)} · prévue` : "Programme";
  const pills = PROGRAM_TYPE_OPTIONS.map(t=>`<button type="button" class="flt${t===f.type?" active":""}" onclick="psSetType('${t}')" aria-pressed="${t===f.type}"><i style="background:${TC[t]||TC.Other}"></i>${escHtml(sessionTypeLabel(t))}</button>`).join("");
  const dur = `<div><label class="l" for="ps_durationMin">Durée</label><div class="ps-unit"><input class="sheet-input" id="ps_durationMin" type="number" inputmode="numeric" min="0" step="1" value="${escHtml(f.durationMin)}" oninput="psField('durationMin',this.value)"><span>min</span></div></div>`;
  const runFields = `<div class="ps-grid">
      <div><label class="l" for="ps_distKm">Distance</label><div class="ps-unit"><input class="sheet-input" id="ps_distKm" type="text" inputmode="decimal" value="${escHtml(f.distKm)}" oninput="psField('distKm',this.value)"><span>km</span></div></div>
      <div><label class="l" for="ps_paceMin">Allure</label><div class="ps-pace"><input class="sheet-input" id="ps_paceMin" type="number" inputmode="numeric" min="0" max="59" value="${escHtml(f.paceMin)}" aria-label="Allure, minutes" oninput="psField('paceMin',this.value)"><span>'</span><input class="sheet-input" id="ps_paceSec" type="number" inputmode="numeric" min="0" max="59" value="${escHtml(f.paceSec)}" aria-label="Allure, secondes" oninput="psField('paceSec',this.value)"><span style="color:var(--text-muted);font-size:13px;white-space:nowrap">&quot;/km</span></div></div>
      ${dur}
    </div>`;
  root.innerHTML = `<div class="sheet-back" onclick="if(event.target===this)closeProgramSheet()"><div class="sheet psheet" role="dialog" aria-modal="true" aria-label="${st.mode==="edit"?"Modifier la séance":"Ajouter une séance"}">
    ${sheetHeadHTML(st.mode==="edit" ? "Modifier la séance" : "Ajouter une séance", "closeProgramSheet()", overline)}
    <span class="l" style="margin-top:4px">Type</span>
    <div class="ps-pills">${pills}</div>
    <label class="l" for="ps_date">Date</label>
    <input class="sheet-input" id="ps_date" type="date" value="${escHtml(f.date)}" oninput="psField('date',this.value)">
    ${isRun ? runFields : `<div class="ps-grid" style="grid-template-columns:1fr">${dur}</div>`}
    ${showNotes ? `<label class="l" for="ps_notes">Notes <span style="color:var(--text-muted)">(facultatif)</span></label><textarea class="sheet-input" id="ps_notes" oninput="psField('notes',this.value)">${escHtml(f.notes)}</textarea>` : ""}
    <div class="ps-err" id="psError" role="alert">${escHtml(st.error||"")}</div>
    <button type="button" class="btn-primary" style="margin-top:16px" onclick="saveProgramSheet()" ${st.saving?"disabled":""}>${st.mode==="edit" ? "Enregistrer" : "Ajouter au programme"}</button>
    ${st.mode==="edit" ? `<button type="button" class="link-gray link-danger" onclick="deleteSessionFromSheet('${st.sessionId}')">Supprimer la séance</button>` : ""}
  </div></div>`;
  return true;
}
window.deleteSessionFromSheet = (id) => askDeleteSession(id);
window.saveProgramSheet = async () => {
  const st = programSheet;
  if(!st || st.saving) return;
  const f = st.form;
  const isRun = PS_RUN_TYPES.includes(f.type);
  const dist = Number(String(f.distKm).replace(",","."))||0;
  const pace = (Number(f.paceMin)||0)*60 + (Number(f.paceSec)||0);
  const dur = Number(f.durationMin)||0;
  const fail = (msg) => { st.error = msg; const el = document.getElementById("psError"); if(el) el.textContent = msg; };
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||"")) return fail("Choisis la date de la séance.");
  if(isRun && dist>250) return fail("Plus de 250 km : vérifie la distance.");
  if(dur>720) return fail("Plus de 12 heures : vérifie la durée.");
  const s = st.mode==="edit" ? plannedSessions.find(p=>p.id===st.sessionId) : null;
  const typeChanged = !!s && f.type!==s.type;
  // Cohabitation (A1) : une course accepte une séance légère, jamais une 2e course ni du renfo avec une course.
  const probe = { type:f.type, pace_zone: s && !typeChanged ? s.pace_zone : null };
  const clash = plannedSessions.some(p=>p.id!==st.sessionId && p.planned_date===f.date && (p.status==="planned"||p.status==="done") && !sessionsCanShareDay(probe, p));
  if(clash){ if(navigator.vibrate) navigator.vibrate([30,40,30]); toast(SAME_DAY_REFUSAL, { ms:6000, icon:"undo" }); return; }
  st.saving = true;
  const now = new Date().toISOString();
  const monday = localDateStr(mondayOf(new Date(f.date+"T00:00:00")));
  let error;
  if(st.mode==="add"){
    const { data:{user} } = await supa.auth.getUser();
    if(!user){ st.saving = false; return fail("Tu n'es plus connecté."); }
    const row = { user_id:user.id, planned_date:f.date, week_start_date:monday, type:f.type, pace_zone:null, title:f.type,
      description: (f.notes||"").trim() || null,
      target_distance_km: isRun && dist>0 ? dist : null, target_pace_sec_per_km: isRun && pace>0 ? pace : null,
      target_duration_min: dur>0 ? dur : null, rationale:"Ajoutée manuellement.", status:"planned", source:"manual_add" };
    ({ error } = await supa.from("planned_sessions").insert(row));
  } else {
    const patch = { source: s.source==="manual_add" ? "manual_add" : "manual_edit", updated_at:now };
    if(typeChanged){
      patch.type = f.type; patch.title = f.type; patch.pace_zone = null;
      patch.rationale = CROSS_TRAINING_RATIONALE[f.type] || `Séance de ${sessionTypeLabel(f.type)}, modifiée manuellement.`;
    }
    patch.target_distance_km = isRun && dist>0 ? dist : null;
    patch.target_pace_sec_per_km = isRun && pace>0 ? pace : null;
    patch.target_duration_min = dur>0 ? dur : null;
    if(s.source==="manual_add") patch.description = (f.notes||"").trim() || null;
    if(f.date!==s.planned_date){ patch.planned_date = f.date; patch.week_start_date = monday; }
    ({ error } = await supa.from("planned_sessions").update(patch).eq("id", st.sessionId));
  }
  st.saving = false;
  if(error){ fail("Pas enregistré, vérifie ta connexion."); return; }
  programSheet = null;
  await loadData(); renderContent(); refreshSheet();
  toast(st.mode==="add" ? "Séance ajoutée au programme." : "Séance enregistrée.");
  warnIfDayBeforeRun(f.date, f.type);
};

// Entretien du programme (CDC 4.8, Q1) : rapprochement course ↔ séance prévue,
// puis ajustement léger et génération des semaines à venir. Lancé à
// l'ouverture de l'app, quel que soit l'onglet affiché (sinon Aujourd'hui
// montrerait un programme périmé tant que Programme n'est pas ouvert), et
// aussi à chaque affichage de Programme (rattrapage si le profil n'était pas
// prêt). Le rapprochement passe AVANT l'ajustement : une séance déjà courue
// aujourd'hui ne doit pas être allégée comme si elle restait à faire. Un seul
// passage à la fois ; rien en arrière-plan, rien hors de l'ouverture de l'app.
let programMaintenancePromise = null;
function runProgramMaintenance(){
  if(!onboardingCompletedAt) return Promise.resolve();
  if(programMaintenancePromise) return programMaintenancePromise;
  programMaintenancePromise = (async()=>{
    try{
      if(await mergeManualRuns()) renderContent();
      await reconcilePlannedSessions();
      await applyProgramAdjustments();
    }catch(e){
      console.error("Entretien du programme :", e);
    }finally{
      programMaintenancePromise = null;
    }
  })();
  return programMaintenancePromise;
}

// ---------- Test guidé de 20 minutes (4.1.e) ----------
// Planifie la séance test au premier jour disponible à partir de demain
// (jours indisponibles exclus). `silent` : pas d'alerte (appel depuis le parcours).
window.scheduleGuidedTest = async (silent) => {
  const { data:{user} } = await supa.auth.getUser();
  if(!user) return;
  const unavailable = (goals.joursIndisponibles ? goals.joursIndisponibles.split(",") : []).map(Number);
  let date = addDays(new Date(), 1);
  for(let i=0; i<7 && unavailable.includes((date.getDay()+6)%7); i++) date = addDays(date, 1);
  const t = guidedTestSession();
  const { error } = await supa.from("planned_sessions").insert({
    user_id:user.id, planned_date: localDateStr(date), week_start_date: localDateStr(mondayOf(date)),
    type:"EF", pace_zone:"easy", title:t.title, description:t.description, target_duration_min:t.durationMin,
    rationale:t.rationale, status:"planned", source:"generated", generation_reason:"guided_test",
  });
  if(error){ if(!silent) toastRetry("Pas enregistré, vérifie ta connexion.", ()=>scheduleGuidedTest()); return; }
  if(programSettings?.guidedTest?.lastFailure){
    const ps = { ...programSettings, guidedTest:{ status:"pending" } };
    if(await upsertProfile({ program_settings: ps })) programSettings = ps;
  }
  await loadData(); renderContent();
};
// Quand la séance test est validée par une vraie course : son résultat
// devient le temps de référence, puis le programme complet est généré.
async function applyGuidedTestResult(run){
  const ev = evaluateGuidedTestRun(run.dist, run.durationSec);
  if(!ev.ok){
    const ps = { ...programSettings, guidedTest:{ status:"pending", lastFailure:ev.reason } };
    if(await upsertProfile({ program_settings: ps })) programSettings = ps;
    return;
  }
  const newRef = { source:"test", distanceKm:ev.refDistanceKm, timeSec:ev.refTimeSec, date:localDateStr(dateFromRun(run)) };
  const oldRef = runnerProfile();
  const guidedTest = { status:"done", distanceKm:ev.refDistanceKm, durationSec:ev.refTimeSec };
  // Un nouveau test qui change l'allure facile d'au moins 5 s/km : on propose (carte, puis feuille « Tes nouvelles allures »),
  // rien n'est appliqué avant le choix (D72). Premier test, ou écart faible : on enregistre et le programme se construit.
  if(oldRef && newPaceProposal(oldRef, newRef)){
    const ps = { ...programSettings, guidedTest, pendingLevel:newRef };
    if(await upsertProfile({ program_settings: ps })) programSettings = ps;
    return;
  }
  const ps = { ...programSettings, refDistanceKm:newRef.distanceKm, refTimeSec:newRef.timeSec, refDate:newRef.date, refSource:"test", guidedTest };
  delete ps.refDateApprox; delete ps.pendingLevel;
  if(!(await upsertProfile({ program_settings: ps }))) return;
  programSettings = ps;
  if(oldRef) await repaceFutureSessions();
  programAdjustmentChecked = false; await applyProgramAdjustments();
}
window.dismissGuidedTestSeen = () => {
  try{ localStorage.setItem("mra_guidedTestSeen","1"); }catch(e){}
  renderContent();
};

// ---------- Parcours de démarrage (S10, journal 11b ; D58, D59, D61) ----------
// Plein écran : retour en chevron, barre en 5 segments, un seul bouton citron en bas. 0 Bienvenue, 1 Objectif, 2 Niveau
// (l'écran « Ton niveau »), 3 Disponibilités, 4 Récapitulatif ; une fois le programme créé, 5 Connecte tes courses.
// [libellé affiché, clé utilisée dans les données] — même ordre que ONBOARDING_DUREE_OPTIONS ([libellé, valeur]).
const ONB_RACES = [["5 km","5km"],["10 km","10km"],["15 km","15km"],["Semi-marathon","Semi"],["Marathon","Marathon"]];
let onbConnect = false;   // étape 5 : le programme est créé, le parcours est enregistré, on propose de connecter les courses
const onbToday = () => localDateStr(new Date());
function onbInit(){
  const principal = goals?.principal || {};
  const detected = detectLevelFromHistory(
    runningRuns.map(r=>({ date: dateFromRun(r), distanceKm: r.dist||0 })), new Date());
  const chronoKm = programSettings?.refDistanceKm;
  const chronoKey = Object.keys(RACE_DISTANCES_KM).find(k=>RACE_DISTANCES_KM[k]===chronoKm) || "";
  const refSec = programSettings?.refTimeSec || 0;
  onb = {
    step: 0,
    objectif: principal.objectifPrincipal && principal.objectifPrincipal!=="Autre" ? principal.objectifPrincipal : "",
    distanceCourse: principal.distanceCourse || "",
    dateCible: principal.dateCible || "",
    dateChoice: null,            // « first » (première date possible prise), « keep » (date un peu serrée gardée), « none » (sans date)
    detected,
    niveau: detected || goals?.niveau || "",
    niveauManual: false,
    frequenceHistorique: "",
    dureeMax: null,
    chronoMode: refSec ? "known" : "",   // « known » : « Je connais un chrono récent » ; « unknown » : « Je ne sais pas » (test guidé plus tard)
    chronoDistance: chronoKey,
    chronoH: refSec ? String(Math.floor(refSec/3600)) : "",
    chronoM: refSec ? String(Math.floor((refSec%3600)/60)) : "",
    chronoS: refSec ? String(refSec%60) : "",
    frequence: Number(goals?.frequence) || 3,
    joursIndisponibles: (goals?.joursIndisponibles ? goals.joursIndisponibles.split(",").map(Number) : []),
    reality: levelReality(),
    saving: false, _anim: null,
  };
}
function onbChronoSec(){
  const h = parseInt(onb.chronoH,10)||0, m = parseInt(onb.chronoM,10)||0, sec = parseInt(onb.chronoS,10)||0;
  return h*3600+m*60+sec;
}
function onbBeginner(){ return isBeginnerPlanEligible(onb.niveau, onb.frequenceHistorique, onb.dureeMax); }
// Chrono saisi à l'étape 2 : mêmes garde-fous que « Ton niveau » (temps possible, avertissement « trop rapide »).
function onbChronoCheck(){
  return levelChronoCheck({ distanceKm:RACE_DISTANCES_KM[onb.chronoDistance]||0, h:onb.chronoH, m:onb.chronoM, s:onb.chronoS, month:onbToday().slice(0,7) }, onbToday(), onb.reality);
}
function onbChronoKnown(){ return onb.chronoMode==="known" && !onbBeginner(); }
function onbPatch(){
  const known = onbChronoKnown();
  return onboardingProfilePatch({
    objectif:onb.objectif, distanceCourse:onb.distanceCourse, dateCible:onb.dateCible, niveau:onb.niveau,
    frequenceHistorique:onb.frequenceHistorique, dureeMax:onb.dureeMax, frequence:onb.frequence, joursIndisponibles:onb.joursIndisponibles,
    chronoDistance:known ? onb.chronoDistance : "", chronoSec:known ? onbChronoSec() : 0,
  }, goals, programSettings, RACE_DISTANCES_KM, beginnerPlanStartMonday(onbToday()), onbToday());
}
function onbRecomputeLevel(){
  if(onb.detected || onb.niveauManual) return;
  if(!onb.frequenceHistorique || onb.dureeMax==null) return;
  onb.niveau = classifyLevelFromQuestionnaire(onb.frequenceHistorique, onb.dureeMax);
}
// Date de course jugée avec le niveau connu ; sans niveau, comme un coureur non confirmé (la durée minimale est la même
// pour Débutant et Intermédiaire, seul « Confirmé » la réduit : on ne prévient donc jamais à tort).
function onbDateModel(){
  if(onb.objectif!=="Préparer une course" || !onb.distanceCourse || !onb.dateCible) return null;
  return dateCheckModel(onb.distanceCourse, onb.niveau || onb.detected || "", onb.dateCible, onbToday());
}
function onbCanContinue(){
  if(onb.saving) return false;
  if(onb.step===1){
    if(!onb.objectif) return false;
    if(onb.objectif!=="Préparer une course") return true;
    return !!onb.distanceCourse && !dateStepBlocked(onbDateModel(), onb.dateChoice);
  }
  if(onb.step===2){
    if(!onb.niveau) return false;
    if(!onb.detected && (!onb.frequenceHistorique || onb.dureeMax==null)) return false;
    return !onbChronoKnown() || onbChronoCheck().ok;
  }
  if(onb.step===4) return !dateStepBlocked(onbDateModel(), onb.dateChoice);
  return true;
}
window.onbSet = (key, value) => {
  onb[key] = value;
  if(key==="niveau") onb.niveauManual = true;
  if(key==="frequenceHistorique" || key==="dureeMax") onbRecomputeLevel();
  if(key==="distanceCourse" || key==="dateCible") onb.dateChoice = null;
  renderApp();
};
window.onbSetField = (key, value) => { onb[key] = value; };
// Saisie du chrono : on ne redessine pas les champs (le clavier resterait coupé), seulement l'avertissement et le bouton.
window.onbChronoInput = (key, value) => {
  onb[key] = String(value).replace(/\D/g,"").slice(0,2);
  onbRefreshChrono();
};
function onbRefreshChrono(){
  const chk = onbChronoCheck(), msg = document.getElementById("onbChronoMsg");
  if(msg) msg.innerHTML = chk.tooFast ? `<div class="ms-alert" role="status">${icon("alert",16)}<span>Vérifie ce temps : il est bien plus rapide que ce que tu cours en ce moment.</span></div>` : "";
  document.querySelectorAll(".on-chrono .lv-times .pf-row").forEach(el=>el.classList.toggle("warn", chk.tooFast));
  onbRefreshNext();
}
function onbRefreshNext(){
  const btn = document.getElementById("onbNext");
  if(btn) btn.classList.toggle("off", !onbCanContinue());
}
window.onbToggleDay = (i) => {
  onb.joursIndisponibles = onb.joursIndisponibles.includes(i) ? onb.joursIndisponibles.filter(d=>d!==i) : [...onb.joursIndisponibles, i];
  renderApp();
};
window.onbGo = (delta) => {
  if(delta>0 && !onbCanContinue()) return;
  onb._anim = delta>0 ? "fwd" : "back";
  onb.step = Math.max(0, Math.min(4, onb.step+delta));
  renderApp();
};
// « Garder cette date », « Prendre le … », « Sans date » : réponses aux états « Date un peu serrée » et « Date trop proche ».
window.onbDateChoice = (choice) => {
  const model = onbDateModel();
  if(choice==="first" && model && model.firstDate) onb.dateCible = model.firstDate;
  if(choice==="none") onb.dateCible = "";
  onb.dateChoice = choice;
  renderApp();
};
window.onbFocusDate = () => { const el = document.getElementById("onbDate"); if(el){ el.focus(); try{ el.showPicker && el.showPicker(); }catch(e){} } };
window.restartOnboarding = () => {
  onbPreviousCompletedAt = onboardingCompletedAt;
  onb = null; onbRestarting = true; onboardingCompletedAt = null;
  renderApp();
};
window.cancelOnboarding = () => {
  onboardingCompletedAt = onbPreviousCompletedAt || new Date().toISOString();
  onb = null; onbRestarting = false; onbConnect = false;
  renderApp();
};

// --- écrans ---
const onbChipsHTML = (options, current, handler) => `<div class="pf-chips">${options.map(o=>{
  const [label, value] = Array.isArray(o) ? o : [o, o];
  return `<button type="button" class="pf-chip${current===value?" active":""}" aria-pressed="${current===value}" onclick="${handler}(${JSON.stringify(value).replace(/"/g,"&quot;")})">${escHtml(label)}</button>`;
}).join("")}</div>`;
const onbLevelBoxesHTML = () => `<div class="lv-levels" role="group" aria-label="Niveau">${NIVEAUX.map(([lbl,sub])=>`<button type="button" aria-pressed="${onb.niveau===lbl}" onclick="onbSet('niveau','${lbl}')"><div class="n">${lbl}</div><div class="s">${escHtml(sub)}</div></button>`).join("")}</div>`;
const onbInfoHTML = (html) => `<div class="lv-info" style="margin-top:0">${icon("info",16)}<span>${html}</span></div>`;
// Cadre d'un écran : barre du haut (retour, 5 segments, « N / 5 »), titre, corps, un seul bouton citron en bas.
// `o` : { step, title, sub, body, next:{label, call, off, hint}, secondary:{label, call}, back }
function onbScreenHTML(o){
  const anim = onb._anim ? ` anim-${onb._anim}` : ""; onb._anim = null;
  const top = o.step>=1 ? `<div class="on-top">
      ${o.back===false ? `<span class="on-back"></span>` : `<button type="button" class="on-back" aria-label="Retour" onclick="onbGo(-1)">${icon("chevronLeft",22)}</button>`}
      <div class="on-bar" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="${o.step}">${[1,2,3,4,5].map(i=>`<i class="${i<=o.step?"on":""}${i===o.step?" now":""}"></i>`).join("")}</div>
      <span class="on-count">${o.step} / 5</span></div>` : "";
  const foot = `<div class="on-foot">
      <button type="button" class="btn-primary on-next${o.next.off?" off":""}" id="onbNext" onclick="${o.next.call}">${o.next.label}</button>
      ${o.next.hint ? `<div class="on-hint">${o.next.hint}</div>` : ""}
      ${o.secondary ? `<button type="button" class="btn-secondary on-second" onclick="${o.secondary.call}">${o.secondary.label}</button>` : ""}
      ${onbRestarting && o.step<5 ? `<button type="button" class="on-cancel" onclick="cancelOnboarding()">Annuler et revenir à l'app</button>` : ""}
    </div>`;
  return `<div class="on-screen${anim}${o.step===0?" welcome":""}">${top}
    ${o.hero||""}
    <div class="on-head"><div class="on-title">${o.title}</div>${o.sub?`<div class="on-sub">${o.sub}</div>`:""}</div>
    <div class="on-body">${o.body||""}</div>${foot}</div>`;
}
function onbDateBlockHTML(model){
  if(!model || model.status==="ok" || onb.dateChoice==="first" || onb.dateChoice==="none") return "";
  const c = onb.dateChoice;
  if(model.status==="compresse"){
    return `<div class="on-warn" role="status"><div class="hd">${icon("calendarClock",18)}<b>${escHtml(model.title)}</b></div><div class="tx">${escHtml(model.text)}</div>
      <div class="pf-chips"><button type="button" class="pf-chip" onclick="onbFocusDate()">Choisir une autre date</button>
      <button type="button" class="pf-chip${c==="keep"?" active":""}" aria-pressed="${c==="keep"}" onclick="onbDateChoice('keep')">Garder cette date</button></div></div>`;
  }
  return `<div class="on-warn strong" role="status"><div class="hd">${icon("calendarClock",18)}<b>${escHtml(model.title)}</b></div><div class="tx">${escHtml(model.text)}</div>
    <div class="first">Première date possible : <b>le ${model.firstDateFr}</b></div>
    <div class="pf-chips"><button type="button" class="pf-chip${c===null?" active":""}" onclick="onbDateChoice('first')">Prendre le ${model.firstDateFr}</button>
    <button type="button" class="pf-chip" onclick="onbFocusDate()">Une autre date</button>
    <button type="button" class="pf-chip" onclick="onbDateChoice('none')">Sans date</button></div></div>`;
}
function onbStepObjectif(){
  const tiles = OBJECTIF_ICONS.map(([label,ic])=>`<button type="button" class="on-tile${label===onb.objectif?" sel":""}" aria-pressed="${label===onb.objectif}" onclick="onbSet('objectif','${label}')"><span class="ic">${icon(ic,18)}</span><span class="t">${label}</span></button>`).join("");
  let course = "", hint = "";
  if(onb.objectif==="Préparer une course"){
    const model = onbDateModel(), warn = model && model.status!=="ok" && onb.dateChoice!=="first" && onb.dateChoice!=="none";
    course = `<div class="on-group"><div class="on-lbl">Quelle distance ?</div>${onbChipsHTML(ONB_RACES, onb.distanceCourse, "onbSet.bind(null,'distanceCourse')")}</div>
      <div class="on-group"><div class="on-lbl">À quelle date ? (facultatif)</div>
        <label class="on-date${warn?" warn":""}"><input type="date" id="onbDate" value="${onb.dateCible}" aria-label="Date de la course" onchange="onbSet('dateCible', this.value)"><span class="ic">${icon("calendar",18)}</span></label>
        <div class="on-hint" style="text-align:left">${escHtml(weeksUntilText(onb.dateCible))}</div></div>
      ${onbDateBlockHTML(model)}`;
    hint = model && model.status==="extreme" && onb.dateChoice===null ? "Choisis une date possible, ou « Sans date », pour continuer." : "";
  }
  return onbScreenHTML({ step:1, title:"Quel est ton objectif ?", sub:"Choisis ce qui te motive le plus en ce moment. Tu pourras en ajouter un second plus tard dans Profil.",
    body:`<div class="on-tiles">${tiles}</div>${course}`, next:{ label:"Continuer", call:"onbGo(1)", off:!onbCanContinue(), hint } });
}
function onbStepNiveau(){
  const beginner = onbBeginner(), known = onbChronoKnown();
  let body = "";
  if(onb.detected){
    body += onbInfoHTML(`On a regardé tes courses des 8 dernières semaines : ton niveau semble être <strong>${onb.detected}</strong>. Tu peux le corriger si ça ne te ressemble pas.`);
  } else {
    body += `<div class="on-group"><div class="on-lbl">Tu cours à quelle fréquence en ce moment ?</div>${onbChipsHTML(QUESTIONNAIRE_FREQUENCE_OPTIONS, onb.frequenceHistorique, "onbSet.bind(null,'frequenceHistorique')")}</div>
      <div class="on-group"><div class="on-lbl">Combien de temps peux-tu courir sans t'arrêter ?</div>${onbChipsHTML(ONBOARDING_DUREE_OPTIONS, onb.dureeMax, "onbSet.bind(null,'dureeMax')")}</div>`;
  }
  if(!beginner){
    const box = (field, unit, label, ph) => `<div class="pf-row stack"><input type="text" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="${label}" placeholder="${ph}" value="${escHtml(onb[field])}" oninput="onbChronoInput('${field}', this.value)"><span class="u">${unit}</span></div>`;
    const chk = known ? onbChronoCheck() : null;
    const fields = known ? `<div class="on-chrono">${onbChipsHTML(ONB_RACES, onb.chronoDistance, "onbSet.bind(null,'chronoDistance')")}
        <div class="lv-times">${box("chronoH","h","Heures","0")}${box("chronoM","min","Minutes","00")}${box("chronoS","s","Secondes","00")}</div>
        <div id="onbChronoMsg">${chk.tooFast ? `<div class="ms-alert" role="status">${icon("alert",16)}<span>Vérifie ce temps : il est bien plus rapide que ce que tu cours en ce moment.</span></div>` : ""}</div></div>` : "";
    body += `<div class="on-group"><div class="on-lbl">Un chrono récent ?</div><div class="on-opts">
      <button type="button" class="on-opt${known?" sel":""}" aria-pressed="${known}" onclick="onbSet('chronoMode','known')"><span class="ic">${icon("timer",18)}</span><span><b>Je connais un chrono récent</b><small>un temps approximatif suffit</small></span></button>${fields}
      <button type="button" class="on-opt${onb.chronoMode==="unknown"?" sel":""}" aria-pressed="${onb.chronoMode==="unknown"}" onclick="onbSet('chronoMode','unknown')"><span class="ic">${icon("help",18)}</span><span><b>Je ne sais pas</b><small>test guidé de 20 min, à faire plus tard</small></span></button>
    </div></div>`;
  }
  if(onb.niveau) body += `<div class="on-group"><div class="on-lbl">${onb.detected ? "Ton niveau" : "Ton niveau estimé : tu peux le corriger"}</div>${onbLevelBoxesHTML()}</div>`;
  if(!onb.detected) body += onbInfoHTML("Si tu n'as jamais couru, on te proposera une alternance de marche et de course pour démarrer en douceur (le programme « Couch to 5K » du NHS, le service de santé britannique).");
  if(beginner) body += onbInfoHTML("<strong>Programme marche/course :</strong> pendant 9 semaines, 3 séances par semaine qui alternent marche et course, jusqu'à pouvoir courir 30 minutes d'affilée.");
  return onbScreenHTML({ step:2, title:"Quel est ton niveau ?", sub:onb.detected ? "" : "Quelques questions pour estimer ton niveau, sans test.", body, next:{ label:"Continuer", call:"onbGo(1)", off:!onbCanContinue() } });
}
function onbStepDispos(){
  const beginner = onbBeginner();
  if(beginner && onb.frequence!==3) onb.frequence = 3;
  const nums = ["1","2","3","4","5","6","7"].map(o=>`<button type="button" class="${String(onb.frequence)===o?"active":""}" aria-pressed="${String(onb.frequence)===o}" ${beginner?"disabled":""} onclick="onbSet('frequence',${o})">${o}</button>`).join("");
  const body = `<div class="on-group"><div class="on-lbl">Combien de séances de course par semaine ?</div><div class="pf-nums on-nums n7">${nums}</div>
      <div class="on-hint" style="text-align:left">${beginner ? "Le programme marche/course comporte toujours 3 séances par semaine." : escHtml(FREQUENCE_HINTS[String(onb.frequence)]||"")}</div></div>
    <div class="on-group"><div class="on-lbl">Des jours où tu ne peux jamais courir ?</div><div class="pf-chips">${JOURS_OPTIONS.map((d,i)=>`<button type="button" class="pf-chip${onb.joursIndisponibles.includes(i)?" active":""}" aria-pressed="${onb.joursIndisponibles.includes(i)}" onclick="onbToggleDay(${i})">${d}</button>`).join("")}</div></div>`;
  return onbScreenHTML({ step:3, title:"Tes disponibilités", sub:"On placera tes séances sur les autres jours.", body, next:{ label:"Continuer", call:"onbGo(1)" } });
}
function onbStepRecap(){
  const raceLabel = (ONB_RACES.find(r=>r[1]===onb.distanceCourse)||[])[0];
  const jours = onb.joursIndisponibles.length ? onb.joursIndisponibles.slice().sort((a,b)=>a-b).map(i=>JOURS_OPTIONS[i]).join(", ") : "aucun";
  const row = (lbl, val) => `<div class="on-row"><span class="k">${lbl}</span><span class="v">${escHtml(val)}</span></div>`;
  const needsTest = onbPatch().needsGuidedTest;
  const programme = onbBeginner() ? "Marche/course sur 9 semaines (NHS)" : (needsTest ? "Test de 20 minutes, puis programme personnalisé" : "Programme personnalisé");
  const objectif = onb.objectif + (onb.objectif==="Préparer une course" ? ` · ${raceLabel||""}${onb.dateCible?" · le "+isoToFr(onb.dateCible):""}` : "");
  const body = `<div class="on-rows">${row("Objectif", objectif)}${row("Niveau", onb.niveau)}${row("Séances de course", onb.frequence+" par semaine")}${row("Jours indisponibles", jours)}${row("Programme", programme)}</div>
    ${needsTest ? onbInfoHTML("Comme tu n'as pas de chrono, ta première séance sera un <strong>test de 20 minutes</strong> : la distance que tu parcours nous sert à calculer tes allures. Tu pourras aussi donner un chrono plus tard, dans « Ton niveau ».") : ""}`;
  return onbScreenHTML({ step:4, title:"Voilà ce qu'on a compris", sub:"Tout pourra être modifié dans Profil.", body,
    next:{ label:onb.saving ? "Création de ton programme…" : "Créer mon programme", call:"onbFinish()", off:!onbCanContinue() } });
}
function onbStepConnect(){
  const body = `<div class="on-text">Sans montre, tu pourras aussi les saisir à la main.</div>`;
  return onbScreenHTML({ step:5, back:false, title:"Connecte tes courses", sub:"L'app iOS RunSync envoie tes courses depuis Apple Santé. Elles arrivent ici toutes seules, avec ta fréquence cardiaque.", body,
    next:{ label:"Voir comment", call:"openSyncGuide()" }, secondary:{ label:"Plus tard", call:"onbLeave()" } });
}
// « On prépare ton programme… » (13c) : 4 étapes qui se cochent au fil du vrai travail, avec une courte pause entre deux pour que
// le texte reste lisible (pas d'attente artificielle au-delà).
const ONB_PREP_STEPS = ["Objectif et niveau", "Allures", "Placement dans ta semaine", "4 premières semaines"];
function onbPrepHTML(){
  const done = onb.prepDone||0;
  const items = ONB_PREP_STEPS.map((t,i)=>`<div class="pp-item ${i<done?"done":i===done?"now":""}"><span class="pp-ic">${i<done?icon("check",16):i===done?`<i aria-hidden="true"></i>`:""}</span><span>${t}</span></div>`).join("");
  return `<div class="on-screen"><div class="on-head" style="margin-top:auto"><div class="on-title">On prépare ton programme…</div><div class="on-sub">Ça ne prend que quelques secondes.</div></div>
    <div class="pp-list" role="status">${items}</div><div style="margin-bottom:auto"></div></div>`;
}
function onboardingHTML(){
  if(!onb) onbInit();
  if(onb.saving && onb.prepDone!=null) return onbPrepHTML();
  if(onb.step===0){
    return onbScreenHTML({ step:0, hero:`<div class="on-logo"><img src="logo/logo-vertical-couleur.svg" alt="MyRunningApp" width="168" height="168"></div>`, title:"Bienvenue sur MyRunningApp",
      sub:"En quelques questions, on prépare un programme adapté à toi : ton objectif, ton niveau et tes disponibilités. Ça prend 2 minutes, et tu pourras tout modifier ensuite dans Profil.", next:{ label:"C'est parti", call:"onbGo(1)" } });
  }
  if(onb.step===1) return onbStepObjectif();
  if(onb.step===2) return onbStepNiveau();
  if(onb.step===3) return onbStepDispos();
  if(onb.step===4) return onbStepRecap();
  return onbStepConnect();
}
// Crée le programme : enregistre les réponses, génère la première semaine (ou planifie le test de 20 minutes), puis propose
// de connecter les courses (étape 5), sauf si des courses sont déjà arrivées d'Apple Santé.
window.onbFinish = async function(){
  if(!onbCanContinue()) return;
  onb.saving = true; onb.prepDone = 0; renderApp();
  const pause = () => new Promise(r=>setTimeout(r, 420));
  const tick = async (n) => { onb.prepDone = n; renderApp(); await pause(); };
  const patch = onbPatch();
  const completedAt = new Date().toISOString();
  const ok = await upsertProfile({ goals: patch.goals, program_settings: patch.programSettings, onboarding_completed_at: completedAt });
  if(!ok){ onb.saving = false; onb.prepDone = null; renderApp(); return; }
  goals = patch.goals; programSettings = patch.programSettings; onboardingCompletedAt = completedAt;
  markNewsSeen();                                // un compte neuf n'a pas à apprendre que l'app a changé (D91)
  onbRestarting = false; onbConnect = true;      // l'écran du parcours reste affiché pendant la génération
  await tick(1);                                  // objectif et niveau enregistrés
  try{
    await tick(2);                                // allures : celles de « Ton niveau » (ou le test de 20 minutes à venir)
    if(patch.needsGuidedTest){ await window.scheduleGuidedTest(true); await tick(3); }
    else { await window.generateProgram(mondayOf(new Date()), {silent:true}); await tick(3); }
    if(!patch.needsGuidedTest){ programAdjustmentChecked = false; await applyProgramAdjustments(); }   // les 4 premières semaines
    await tick(4);
  }catch(e){ console.error("Génération initiale :", e); }
  if(receivedRuns().length>0){ onbLeave(); return; }
  onb.saving = false; onb.prepDone = null; onb.step = 5; onb._anim = "fwd";
  renderApp();
};
window.onbLeave = () => {
  onbConnect = false; onb = null; onbRestarting = false;
  activeTab = "aujourdhui"; persistActiveTab();
  renderApp();
};
// Courses arrivées d'Apple Santé (pas celles saisies à la main) : le guide de connexion s'appuie dessus.
function receivedRuns(){ return RUNS.filter(r=>r.appleType && r.appleType!==MANUAL_RUN_MARKER); }

// ---------- Guide « Voir comment » : connecter RunSync (S10, journal 11, élément 13 ; D60) ----------
// 4 étapes dans une feuille, une seule ouverte : installer RunSync, s'y connecter avec le même email, autoriser Apple Santé,
// recevoir les courses. Les trois premières se cochent toutes seules quand on revient dans l'app après les avoir ouvertes ;
// la quatrième interroge régulièrement l'arrivée des premières courses. Ouvert depuis la fin du parcours (étape 5) et depuis
// Mon compte › Synchronisation. L'état est gardé sur l'appareil : si l'app est rechargée pendant qu'on est dans TestFlight ou
// RunSync, le guide se rouvre où on l'avait laissé.
const RUNSYNC_INSTALL_URL = "https://testflight.apple.com/join/vYx5KKUw";   // lien public TestFlight fourni par Omar (groupe « Amis_Testeurs », limite de testeurs fixée dans App Store Connect) ; builds valables jusqu'au 25/12/2026 environ ; à remplacer par le lien App Store à la sortie ; s'il est vide, le bouton l'explique
const RUNSYNC_OPEN_URL = "myrunningapp://";   // schéma déclaré par l'app iOS RunSync (Info.plist)
const SYNC_GUIDE_KEY = "mra_syncGuide";
let syncGuide = null;      // { done:[b,b,b], pending:0|1|2|3, waitStart, received, fromOnb }
let syncPollTimer = null;
function saveSyncGuide(){
  try{ if(syncGuide) localStorage.setItem(SYNC_GUIDE_KEY, JSON.stringify({ open:true, done:syncGuide.done, pending:syncGuide.pending })); else localStorage.removeItem(SYNC_GUIDE_KEY); }catch(e){}
}
const syncWaited = () => syncGuide && syncGuide.waitStart ? (Date.now()-syncGuide.waitStart)/1000 : 0;
// Retour dans l'app après avoir ouvert TestFlight ou RunSync : l'étape correspondante se coche toute seule.
function settleSyncGuide(){
  if(!syncGuide || !syncGuide.pending) return;
  syncGuide.done[syncGuide.pending-1] = true; syncGuide.pending = 0; saveSyncGuide();
}
function syncGuideModelNow(){
  const m = syncGuideModel(syncGuide.done, syncGuide.received, syncWaited());
  if(m.phase==="wait" && !syncGuide.waitStart) syncGuide.waitStart = Date.now();
  return m;
}
window.openSyncGuide = () => {
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SYNC_GUIDE_KEY)||"null"); }catch(e){}
  syncGuide = { done:(saved && saved.done) || [false,false,false], pending:(saved && saved.pending) || 0, waitStart:null, received:receivedRuns().length, fromOnb:onbConnect };
  settleSyncGuide(); saveSyncGuide();
  refreshSheet(); startSyncPoll();
};
// Si l'app a été rechargée pendant le guide (l'utilisateur était dans TestFlight ou RunSync), on le rouvre où il en était.
function resumeSyncGuide(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SYNC_GUIDE_KEY)||"null"); }catch(e){}
  if(!saved || !saved.open || syncGuide) return;
  if(receivedRuns().length>0){ try{ localStorage.removeItem(SYNC_GUIDE_KEY); }catch(e){} return; }
  openSyncGuide();
}
window.closeSyncGuide = (leave) => {
  const fromOnb = syncGuide && syncGuide.fromOnb;
  stopSyncPoll(); syncGuide = null; saveSyncGuide(); refreshSheet();
  if(leave && fromOnb && onbConnect) onbLeave(); else if(!onbConnect) renderContent();
};
function stopSyncPoll(){ if(syncPollTimer){ clearInterval(syncPollTimer); syncPollTimer = null; } }
function startSyncPoll(){ stopSyncPoll(); syncPollTimer = setInterval(syncPollOnce, 4000); }
// À l'étape 4 : combien de courses sont arrivées d'Apple Santé ? (requête légère, sans tout recharger)
async function syncPollOnce(){
  if(!syncGuide){ stopSyncPoll(); return; }
  const m = syncGuideModelNow();
  if(m.connected || m.active<4){ refreshSheet(); return; }
  const { count, error } = await supa.from("runs").select("id", { count:"exact", head:true }).not("apple_type","is",null).neq("apple_type", MANUAL_RUN_MARKER);
  if(error || !syncGuide) return;
  if((count||0)>0 && !syncGuide.received){ syncGuide.received = count; stopSyncPoll(); await loadData(); }
  refreshSheet();
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState==="visible" && syncGuide){ settleSyncGuide(); refreshSheet(); syncPollOnce(); }
});
window.syncInstall = () => {
  if(!RUNSYNC_INSTALL_URL){ toast("Le lien d'installation de RunSync arrive bientôt."); return; }
  syncGuide.pending = 1; saveSyncGuide(); window.open(RUNSYNC_INSTALL_URL, "_blank");
};
window.syncOpenRunSync = (step) => {
  syncGuide.pending = step; saveSyncGuide();
  window.location.href = RUNSYNC_OPEN_URL;
  setTimeout(()=>{ if(document.visibilityState==="visible" && syncGuide && syncGuide.pending===step) toast("RunSync ne s'ouvre pas ? Ouvre-le depuis ton écran d'accueil."); }, 1800);
};
window.syncMarkDone = (step) => { syncGuide.done[step-1] = true; syncGuide.pending = 0; saveSyncGuide(); refreshSheet(); };
window.syncCopyEmail = async () => {
  try{ await navigator.clipboard.writeText(userEmail||""); toast("Email copié."); }catch(e){ toast("Sélectionne l'email pour le copier."); }
};
window.syncRetry = () => { syncGuide.waitStart = Date.now(); refreshSheet(); startSyncPoll(); syncPollOnce(); };
function syncStepBodyHTML(m, n){
  const next = (label, call) => `<button type="button" class="btn-primary" style="min-height:48px" onclick="${call}">${label}</button>`;
  const skip = (step) => `<button type="button" class="sg-skip" onclick="syncMarkDone(${step})">C'est déjà fait</button>`;
  if(n===1) return `<div class="sg-tx">RunSync est une petite app relais : elle récupère tes courses dans Apple Santé et les envoie ici, toute seule.</div>
    <div class="sg-flow"><div class="c">${icon("heart",20)}<span>Apple Santé</span></div><span class="ar">${icon("arrowRight",16)}</span><div class="c">${icon("refresh",20)}<span>RunSync</span></div><span class="ar">${icon("arrowRight",16)}</span><div class="c me">${icon("runner",20)}<span>MyRunningApp</span></div></div>
    <div class="sg-note">${icon("info",16)}<span>Tu n'auras pas besoin de l'ouvrir ensuite : une fois installée, elle travaille en arrière-plan. Tout se passe ici.</span></div>
    ${next(`Installer RunSync ${icon("arrowUpRight",16)}`, "syncInstall()")}${skip(1)}`;
  if(n===2) return `<div class="sg-tx">Dans RunSync, connecte-toi avec <b>le même email et le même mot de passe</b> que dans MyRunningApp.</div>
    <div class="sg-mail"><span>${escHtml(userEmail||"")}</span><button type="button" onclick="syncCopyEmail()">Copier</button></div>
    ${next("Ouvrir RunSync", "syncOpenRunSync(2)")}${skip(2)}`;
  if(n===3) return `<div class="sg-tx">Dans RunSync, touche « Synchroniser mes courses ». Apple te demande l'accès : touche simplement <b>Tout activer</b>, puis Autoriser.</div>
    <div class="sg-apple" aria-hidden="true"><div class="cap">Écran d'Apple</div><div class="r all"><span>Tout activer</span><i></i></div><div class="r"><span>Entraînements</span><i></i></div><div class="r"><span>Fréquence cardiaque</span><i></i></div><div class="r"><span>Distance</span><i></i></div><div class="r"><span>+ Calories, Nombre de pas</span><i></i></div></div>
    ${next("Ouvrir RunSync", "syncOpenRunSync(3)")}
    <div class="sg-note">${icon("info",16)}<span>On ne lit que tes séances de sport. Rien d'autre.</span></div>${skip(3)}`;
  if(m.phase==="ok") return `<div class="sg-tx"><b>${escHtml(m.summary.replace("C'est connecté · ",""))}.</b> Les prochaines arriveront toutes seules.</div>${next("Continuer", "closeSyncGuide(true)")}`;
  if(m.phase==="empty") return `<div class="sg-tx">Rien reçu pour l'instant. Pas grave si tu n'as encore jamais couru avec ta montre ou ton téléphone : ta prochaine course arrivera toute seule.</div>
    <ul class="sg-tips"><li>Ouvre RunSync et touche « Forcer une synchronisation »</li><li>Vérifie l'accès : Réglages → Santé → Accès → RunSync</li></ul>
    <div class="sg-btns"><button type="button" class="btn-secondary" style="min-height:48px" onclick="closeSyncGuide(true)">Continuer sans attendre</button><button type="button" class="btn-secondary" style="min-height:48px" onclick="syncRetry()">Réessayer</button></div>`;
  return `<div class="sg-wait"><div class="spinner" aria-hidden="true"></div><span>Synchronisation de tes courses…</span></div>`;
}
function renderSyncGuide(){
  if(!syncGuide) return false;
  const m = syncGuideModelNow();
  const items = m.steps.map(st => {
    if(st.state==="done") return `<div class="sg-item done"><div class="hd"><span class="n">${icon("check",16)}</span><span class="t">${escHtml(st.title)}</span><span class="f">fait</span></div></div>`;
    if(st.state==="active") return `<div class="sg-item active"><div class="hd"><span class="n">${st.n}</span><span class="t">${escHtml(st.title)}</span></div>${syncStepBodyHTML(m, st.n)}</div>`;
    return `<div class="sg-item"><div class="hd"><span class="n">${st.n}</span><span class="t">${escHtml(st.title)}</span></div></div>`;
  }).join("");
  document.getElementById("sheetRoot").innerHTML = `<div class="sheet-back" onclick="if(event.target===this)closeSyncGuide()"><div class="sheet" role="dialog" aria-modal="true" aria-label="Connecter Apple Santé">
    ${sheetHeadHTML("Connecter Apple Santé", "closeSyncGuide()")}
    <div class="np-intro">4 étapes, environ 2 minutes. On coche chaque étape tout seul quand tu reviens.</div>
    <div class="sg-list">${items}</div>
    ${m.connected ? "" : `<button type="button" class="btn-ghost" onclick="closeSyncGuide(false)">Je le ferai plus tard</button>`}
  </div></div>`;
  return true;
}

supa.auth.getSession().then(({ data }) => {
  if (data.session) boot(); else showAuthEntry();
}).catch(() => showAuthEntry());
</script>
