function hrDetailHTML(r, effMaxHr, effRestingHr){
  if(!r.hrSeries || r.hrSeries.length<2){
    return `<div style="padding:8px 0 14px;font-size:12px;color:var(--text-dim)">Pas de détail FC pour cette séance — resynchronise-la depuis l'app pour le récupérer.</div>`;
  }
  if(!effMaxHr){
    return `<div style="padding:8px 0 14px;font-size:12px;color:var(--text-dim)">Renseigne ta FC max (onglet Mon compte) pour voir la répartition par zones.</div>`;
  }
  const {secs, defs} = computeHrZoneSeconds(r.hrSeries, effMaxHr, effRestingHr);
  const total = secs.reduce((a,b)=>a+b,0)||1;
  const flagFrac = r.type!=="Fractionné" && looksLikeFractionne(r.hrSeries);
  const flagSeuil = !flagFrac && r.type!=="Seuil" && looksLikeSeuil(r.hrSeries, effMaxHr, effRestingHr);
  const intervalPaces = r.type==="Fractionné" ? getIntervalPaces(r) : null;
  return `<div style="padding:8px 0 14px">
    <div style="position:relative;width:100%;height:130px"><canvas id="cHr_${r.id}"></canvas></div>
    <div style="margin-top:12px">
      ${defs.map((d,i)=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">
          <span style="width:52px;color:${d.color}">${d.label}</span>
          <div style="flex:1;height:6px;border-radius:3px;background:var(--card-2);overflow:hidden">
            <div style="width:${Math.round(secs[i]/total*100)}%;height:100%;background:${d.color}"></div>
          </div>
          <span style="width:48px;text-align:right;color:var(--text-dim)">${fmtDur(secs[i])}</span>
        </div>`).join("")}
    </div>
    ${!effRestingHr?`<div style="margin-top:8px;font-size:11px;color:var(--text-dim)">Zones basées sur % de FC max uniquement. Renseigne ta FC de repos (Mon compte) pour matcher exactement l'app Santé.</div>`:""}
    ${intervalPaces && (intervalPaces.manual || intervalPaces.workCount>=2)?`<div style="margin-top:12px;display:flex;gap:16px">
      <div><div style="font-size:11px;color:var(--text-dim)">Allure Work ${intervalPaces.manual?"(manuel)":`(${intervalPaces.workCount})`}</div><div style="font-size:15px;font-weight:700;color:#30d158">${fmtA(intervalPaces.work)}/km</div></div>
      ${intervalPaces.recovery?`<div><div style="font-size:11px;color:var(--text-dim)">Allure Récup ${intervalPaces.manual?"(manuel)":`(${intervalPaces.recoveryCount})`}</div><div style="font-size:15px;font-weight:700;color:#98989f">${fmtA(intervalPaces.recovery)}/km</div></div>`:""}
    </div>`:r.allure?`<div style="margin-top:12px"><div style="font-size:11px;color:var(--text-dim)">Allure moyenne</div><div style="font-size:15px;font-weight:700;color:var(--text)">${fmtA(r.allure)}/km</div></div>`:""}
    ${flagFrac?`<div style="margin-top:10px;padding:8px 10px;background:rgba(255,159,10,0.1);border:1px solid rgba(255,159,10,0.3);border-radius:8px;font-size:12px">
      La FC oscille beaucoup sur cette séance — ça ressemble à un fractionné.
      <div><button class="btn-secondary" style="margin-top:6px" onclick="changeType('${r.id}','Fractionné')">Reclasser en Fractionné</button></div>
    </div>`:""}
    ${flagSeuil?`<div style="margin-top:10px;padding:8px 10px;background:rgba(215,0,21,0.1);border:1px solid rgba(215,0,21,0.3);border-radius:8px;font-size:12px">
      Plus de la moitié de cette séance est passée en zones 3-5 — ça ressemble à du Seuil.
      <div><button class="btn-secondary" style="margin-top:6px" onclick="changeType('${r.id}','Seuil')">Reclasser en Seuil</button></div>
    </div>`:""}
  </div>`;
}

function soonCard(iconName,title,sub){
  return `<div class="card soon-card">
    ${icon(iconName,40)}
    <div class="soon-badge">Bientôt disponible</div>
    <h3>${title}</h3>
    <p>${sub}</p>
  </div>`;
}

// Ligne "gérable" : type modifiable + inclusion dans les stats + question
// jambes pour le renfo + détail FC/zones si disponible (fusion Séances/Cardio).
function manageableRow(r, effMaxHr, effRestingHr){
  const c=TC[r.type]||TC.Other;
  const legsPrompt = r.type==="Renfo" ? `
      <div class="manage-field" style="grid-column:1/-1">
        <span class="field-lbl">Ciblé jambes ?</span>
        <div style="display:flex;gap:8px;margin-top:2px">
          <button class="flt${r.legsFocused===true?" active":""}" onclick="setLegsFocused('${r.id}', true)">Oui</button>
          <button class="flt${r.legsFocused===false?" active":""}" onclick="setLegsFocused('${r.id}', false)">Non</button>
        </div>
      </div>` : "";
  return `<div class="manage-row">
    <div class="manage-top">
      <div class="session-dot" style="background:${c}22;color:${c}">${icon(TICON[r.type]||"activity",18)}</div>
      <div class="manage-date">${r.label}</div>
      <label class="toggle-col" title="Inclure dans le suivi">
        <span>Suivi</span>
        <label class="toggle">
          <input type="checkbox" ${r.includeInStats?"checked":""} onchange="toggleInclude('${r.id}', this.checked)">
          <span class="track"></span><span class="thumb"></span>
        </label>
      </label>
      <button class="delete-btn" title="Supprimer définitivement" onclick="deleteRun('${r.id}', '${r.label}')">${icon("trash",15)}</button>
    </div>
    <div class="manage-grid">
      <div class="manage-field">
        <span class="field-lbl">Type de séance</span>
        <select class="type-select" onchange="changeType('${r.id}', this.value)">
          ${TYPE_OPTIONS.map(t=>`<option value="${t}" ${t===r.type?"selected":""}>${t}</option>`).join("")}
        </select>
        ${r.appleType?`<span class="field-sub">Détecté par Santé : ${r.appleType}</span>`:""}
      </div>
      <div class="manage-field"><span class="field-lbl">Temps d'effort</span><span class="field-val">${r.dur}</span></div>
      ${r.dist>0?`<div class="manage-field"><span class="field-lbl">Distance</span><span class="field-val">${r.dist.toFixed(2)} km</span></div>
      <div class="manage-field"><span class="field-lbl">Allure</span><span class="field-val">${fmtA(r.allure)}/km</span></div>`:""}
      ${legsPrompt}
    </div>
    ${cardioDetailBlockHTML(r, effMaxHr, effRestingHr)}
  </div>`;
}
// Détail FC/zones intégré à la ligne de séance (fusion des anciens onglets
// Séances et Cardio) : n'apparaît que si la séance a des échantillons FC.
function cardioDetailBlockHTML(r, effMaxHr, effRestingHr){
  if(!r.hrSeries || r.hrSeries.length<2) return "";
  const open = openHrDetail.has(r.id);
  const flagFrac = r.type!=="Fractionné" && looksLikeFractionne(r.hrSeries);
  const flagSeuil = !flagFrac && r.type!=="Seuil" && looksLikeSeuil(r.hrSeries, effMaxHr, effRestingHr);
  return `<div class="session-pick" style="margin-top:6px" onclick="toggleHrDetail('${r.id}')">
    <span>${icon(open?"chevronDown":"chevronRight",13)} Détail cardio</span>
    ${flagFrac?`<span class="badge" style="background:#ff9f0a22;color:#ff9f0a">⚠️ Fractionné détecté</span>`:""}
    ${flagSeuil?`<span class="badge" style="background:#d7001522;color:#d70015">Zone haute</span>`:""}
  </div>
  ${open?hrDetailHTML(r, effMaxHr, effRestingHr):""}`;
}

function renderContent(){
  const el=document.getElementById("content");
  const filtered=activeFilter==="Tous"?RUNS:RUNS.filter(r=>r.type===activeFilter);

  if (RUNS.length===0 && activeTab!==4){
    el.innerHTML=`<div class="card">${emptyState("Aucune séance pour l'instant","Première fois ? Ouvre l'app pour choisir depuis quelle date importer, puis synchronise.",true)}</div>`;
    return;
  }

  if(activeTab===0){
    // Dashboard : seul endroit avec l'anneau, les KPIs et les graphiques globaux
    if(runningRuns.length===0){ el.innerHTML=heroHTML()+kpisHTML()+`<div class="card">${emptyState("Aucune séance de course incluse","Va dans Séances pour inclure tes courses dans le suivi.",true)}</div>`; return; }
    const isMonthly = dashboardPeriod==="monthly";
    const vol = isMonthly ? monthlyVol() : weeklyVol();
    const hasFrac = fracRuns.filter(r=>r.allure).length>0;
    const fracExcludedCount = fracRuns.filter(r => !getIntervalPaces(r)).length;
    const lastRun = runningRuns[runningRuns.length-1];
    const effMaxHr = maxHr || estimatedMaxHr();
    const effRestingHr = restingHr || null;
    const celebrate = lastRun && !lastRunCelebrated;
    if(celebrate) lastRunCelebrated = true;
    el.innerHTML=(lastRun?lastRunCardHTML(lastRun, effMaxHr, effRestingHr, celebrate):"")+heroHTML()+kpisHTML()+staleSyncBanner()+painPromptBanner()+`
      <div class="card-row">
        <div class="card"><div class="stitle">Progression allure — EF</div>
          <div class="chart-hint">Points = séances · pointillés = tendance et projection à 2 mois · 🚩 = course</div>
          <div style="position:relative;width:100%;height:180px"><canvas id="cEFmini"></canvas></div>
        </div>
        ${hasFrac?`<div class="card"><div class="stitle">Progression allure — Fractionné</div>
          <div class="chart-hint">Allure des intervalles Work et Récup · pointillés = tendance (Work) et projection à 2 mois</div>
          ${fracExcludedCount>0?`<div class="chart-hint" style="color:#98989f">${fracExcludedCount} séance${fracExcludedCount>1?"s":""} exclue${fracExcludedCount>1?"s":""} du graph (pas assez de données pour calculer Work/Récup)</div>`:""}
          <div style="position:relative;width:100%;height:180px"><canvas id="cFracMini"></canvas></div>
        </div>`:""}
      </div>
      <div class="card"><div class="stitle">Volume ${isMonthly?"mensuel":"hebdomadaire"} (km)</div>
        <div style="position:relative;width:100%;height:180px"><canvas id="cVolMini"></canvas></div>
      </div>`;
    setTimeout(()=>{
      mkPaceTrendChart("cEFmini", efRuns, true, 60);
      if(hasFrac) mkFractionneChart("cFracMini", fracRuns, 60);
      mkChart("cVolMini",{type:"bar",data:{labels:vol.map(r=>r.label),datasets:[{label:"km",data:vol.map(r=>r.dist),backgroundColor:"#30d158",borderRadius:6}]},plugins:[barValueLabelsPlugin],options:{scales:{x:{ticks:{autoSkip:false,maxRotation:45}}},plugins:{tooltip:{callbacks:{label:ctx=>ctx.raw+" km"}}}}});
      if(lastRunExpanded && lastRun && lastRun.hrSeries && lastRun.hrSeries.length>1 && effMaxHr) mkHrCurveChart("cHr_"+lastRun.id, lastRun.hrSeries);
    },50);
  }

  else if(activeTab===3){
    // Séances : fusion Séances + Cardio — plus de doublon entre deux listes
    // cliquables séparées. Charts globaux en haut, détail FC/zones intégré
    // à chaque ligne (au lieu d'une liste "cardio" à part).
    const withHr=efRuns.filter(r=>r.fc);
    const effMaxHr = maxHr || estimatedMaxHr();
    const effRestingHr = restingHr || null;
    const cardioRuns = [...efRuns, ...fracRuns].sort((a,b)=>dateFromRun(b)-dateFromRun(a));
    const monthly = effMaxHr ? monthlyZoneBreakdown(cardioRuns, effMaxHr, effRestingHr).filter(m=>m.secs.reduce((a,b)=>a+b,0)>0) : [];
    const weekly = effMaxHr ? weeklyZoneBreakdown(cardioRuns, effMaxHr, effRestingHr).filter(m=>m.secs.reduce((a,b)=>a+b,0)>0) : [];
    el.innerHTML=`
      ${withHr.length?`<div class="card"><div class="stitle">FC moyenne — EF</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="cFC"></canvas></div>
      </div>`:""}
      ${monthly.length>=2?`<div class="card"><div class="stitle">Répartition des zones par mois</div>
        <div class="chart-hint">% du temps passé dans chaque zone, toutes séances confondues</div>
        <div style="position:relative;width:100%;height:220px"><canvas id="cZoneMonthly"></canvas></div>
      </div>
      <div class="card"><div class="stitle">Volume haute intensité par mois</div>
        <div class="chart-hint">Minutes passées en zones 4-5 (effort soutenu/intense)</div>
        <div style="position:relative;width:100%;height:180px"><canvas id="cHiMonthly"></canvas></div>
      </div>`:""}
      <div class="card-row">
        ${weekly.length>=2?`<div class="card"><div class="stitle">Polarisation hebdo</div>
          <div class="chart-hint">Zones faciles (1-3) vs intenses (4-5), 12 dernières semaines</div>
          <div style="position:relative;width:100%;height:200px"><canvas id="cPolarWeek"></canvas></div>

        ${monthly.length>=2?`<div class="card"><div class="stitle">Polarisation mensuelle</div>
          <div class="chart-hint">Zones faciles (1-3) vs intenses (4-5)</div>
          <div style="position:relative;width:100%;height:200px"><canvas id="cPolarMonth"></canvas></div>
        </div>`:""}

        <div class="filters">${["Tous",...TYPE_OPTIONS.filter(t=>t!=="Other")].map(t=>`<button class="flt${activeFilter===t?" active":""}" onclick="setFilter('${t}')">${t}</button>`).join("")}</div>

      filtered.filter(r=>openHrDetail.has(r.id) && r.hrSeries && r.hrSeries.length>1 && effMaxHr).forEach(r=>{

  }

    const ratedCount = runningRuns.filter(r=>r.painRatings).length;

    };

    el.innerHTML=`
      <div class="card">
        <div class="stitle">Ressenti</div>
        <div class="chart-hint" style="margin-bottom:14px">Note ton ressenti après chaque séance ici, et tes objectifs dans l'onglet Objectifs — l'IA combinera les deux pour te proposer un plan d'entraînement personnalisé.</div>

        <div class="stitle">Tes séances</div>

          const monthHeader = monthKey!==lastMonthKey ? `<div class="month-sep">${monthLabel(r.fullDate)}</div>` : "";

            ${painFormHTML(`sess_${r.id}`, prefillRatings(r.painRatings))}

  else if(activeTab===2){
    const ta = (id,val)=>`<textarea id="${id}" style="width:100%;min-height:80px;background:var(--card-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;padding:12px;resize:vertical">${val||""}</textarea>`;

      <div class="chart-hint" style="margin-top:0">Quelques infos utiles quel que soit l'objectif choisi, à ne renseigner qu'une fois.</div>

      <div class="goal-slot-btn${activeGoalSlot==="secondaire"?" active-secondaire":""}" onclick="selectGoalSlot('secondaire')">Objectif secondaire</div>
    </div>
    </div>

    <div style="${slotColorVars}">
    <div class="card">
      <div class="stitle">${activeGoalSlot==="principal"?"Objectif principal":"Objectif secondaire"}</div>
      <div class="chart-hint">Sert de base au futur plan personnalisé par IA (onglet Ressenti) et conditionne les questions suivantes.</div>
      ${objectifCards(slot.objectifPrincipal)}
      <input type="hidden" id="goal_objectifPrincipal" value="${slot.objectifPrincipal||""}">

      <div id="raceGoalBlock" style="margin-top:14px;display:${isRace?"":"none"}">
        <div class="chart-hint" style="margin-top:0">Distance visée</div>
        ${chipRow("distanceCourse", ["5km","10km","15km","Semi","Marathon","Autre"], slot.distanceCourse)}
        <input type="hidden" id="goal_distanceCourse" value="${slot.distanceCourse||""}">

        <div class="chart-hint" style="margin-top:14px">Terrain de la course</div>
        ${chipRow("terrainCourse", TERRAIN_COURSE_OPTIONS, slot.terrainCourse)}
        <input type="hidden" id="goal_terrainCourse" value="${slot.terrainCourse||""}">

        <div class="field" style="margin-top:14px;margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Date de la course</span>
          <input type="date" id="goal_dateCible" value="${slot.dateCible||""}" oninput="updateWeeksUntil()" style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
        <div class="chart-hint" id="weeksUntilOut" style="margin-top:4px">${weeksUntilText(slot.dateCible)}</div>

        <div class="chart-hint" style="margin-top:10px">As-tu déjà couru cette distance ?</div>
        ${chipRow("pbExistant", ["Oui","Non"], slot.pbExistant)}
        <input type="hidden" id="goal_pbExistant" value="${slot.pbExistant||""}">
        <div id="pbTimeBlock" style="margin-top:10px;display:${slot.pbExistant==="Oui"?"":"none"}">
          <div class="chart-hint" style="margin-top:0">Ton record actuel sur cette distance</div>
          <div style="display:flex;align-items:center;gap:6px">
            <input type="number" min="0" max="99" class="time-input" id="goal_pbH" value="${pbH||""}" placeholder="0">
            <span style="font-size:12px;color:var(--text-dim)">h</span>
            <input type="number" min="0" max="59" class="time-input" id="goal_pbM" value="${pbM||""}" placeholder="0">
            <span style="font-size:12px;color:var(--text-dim)">min</span>
          </div>
        </div>

        <div class="chart-hint" style="margin-top:14px">Type d'objectif</div>
        ${chipRow("objectifChrono", ["Viser un chrono","Juste finir"], slot.objectifChrono)}
        <input type="hidden" id="goal_objectifChrono" value="${slot.objectifChrono||""}">

        <div id="chronoBlock" style="display:${slot.objectifChrono==="Juste finir"?"none":""}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
          <div>
            <div class="chart-hint" style="margin:0 0 6px">Temps visé</div>
            <div style="display:flex;align-items:center;gap:6px">
              <input type="number" min="0" max="99" class="time-input" id="goal_tempsH" value="${tH||""}" placeholder="0" oninput="updateRacePaceGoal()">
              <span style="font-size:12px;color:var(--text-dim)">h</span>
              <input type="number" min="0" max="59" class="time-input" id="goal_tempsM" value="${tM||""}" placeholder="0" oninput="updateRacePaceGoal()">
              <span style="font-size:12px;color:var(--text-dim)">min</span>
            </div>
          </div>
          <div>
            <div class="chart-hint" style="margin:0 0 6px">Allure visée</div>
            <div class="pace-stepper">
              <button type="button" onclick="adjustRaceAllureGoal(-5)">−</button>
              <span class="val" id="raceAllureVisee_display">${racePaceInit?fmtA(racePaceInit):"—"}</span>
              <button type="button" onclick="adjustRaceAllureGoal(5)">+</button>
            </div>
            <input type="hidden" id="goal_raceAllureVisee" value="${racePaceInit||""}">
          </div>
        </div>
        </div>
      </div>
    </div>

    ${stats.length?`<div class="card">
      <div class="stitle">Ta situation actuelle</div>
      ${stats.map(([label,val])=>`<div class="account-row"><span class="lbl">${label}</span><span class="v">${val}</span></div>`).join("")}
    </div>`:""}

    ${blocks.blessure?`<div class="card">
      <div class="stitle">Contexte de la reprise</div>
      <div class="chart-hint" style="margin-top:0">Depuis combien de temps es-tu à l'arrêt ?</div>
      ${chipRow("dureeArret", DUREE_OPTIONS, slot.dureeArret)}
      <input type="hidden" id="goal_dureeArret" value="${slot.dureeArret||""}">
      <div class="chart-hint" style="margin-top:14px">Zone concernée</div>
      ${chipRow("zoneConcernee", ZONE_OPTIONS, slot.zoneConcernee)}
      <input type="hidden" id="goal_zoneConcernee" value="${slot.zoneConcernee||""}">
    </div>`:""}

    ${blocks.rythme?`<div class="card">
      <div class="stitle">Rythme visé</div>
      ${blocks.rythmeHint?`<div class="chart-hint" style="margin-top:0">${blocks.rythmeHint}</div>`:""}
      <div class="chart-hint" style="margin-top:0">Séances de course / semaine</div>
      ${chipRow("frequence", ["1","2","3","4","5","6","7"], slot.frequence)}
      <div class="chart-hint" id="frequenceHint" style="margin-top:6px">${FREQUENCE_HINTS[slot.frequence]||""}</div>
      <input type="hidden" id="goal_frequence" value="${slot.frequence||""}">
      <div class="chart-hint" style="margin-top:14px">Renfo / mobilité / semaine</div>
      <div style="${blocks.rythme==="freqOnly"?"margin-bottom:0":"margin-bottom:12px"}">
        ${chipRow("frequenceAutre", ["0","1","2","3","4","5","6","7"], slot.frequenceAutre)}
      </div>
      <input type="hidden" id="goal_frequenceAutre" value="${slot.frequenceAutre||""}">
      ${blocks.rythme==="full"?`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field" style="margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Km / mois</span>
          <input type="number" min="1" max="1000" id="goal_kmMensuel" value="${slot.kmMensuel||""}" placeholder="ex: 120" oninput="syncKmGoal('mensuel')" style="background:none;border:none;color:var(--text);font-size:13px;flex:1;min-width:0">
        </div>
        <div class="field" style="margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Km / an</span>
          <input type="number" min="1" max="12000" id="goal_kmAnnuel" value="${kmAnnuelInit}" placeholder="ex: 1440" oninput="syncKmGoal('annuel')" style="background:none;border:none;color:var(--text);font-size:13px;flex:1;min-width:0">
        </div>
      </div>`:`<input type="hidden" id="goal_kmMensuel" value="${slot.kmMensuel||""}">`}
    </div>`:`<input type="hidden" id="goal_frequence" value="${slot.frequence||""}"><input type="hidden" id="goal_frequenceAutre" value="${slot.frequenceAutre||""}"><input type="hidden" id="goal_kmMensuel" value="${slot.kmMensuel||""}">`}

    ${blocks.allure?`<div class="card">
      <div class="stitle">Allure cible</div>
      <div class="chart-hint">Optionnel — sert de repère sur les graphs de progression (onglets Dashboard/Séances).</div>
      <div class="field">
        <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Allure EF</span>
        <div class="pace-stepper">
          <button type="button" onclick="adjustPaceGoal('allureEfVisee',-5,360)">−</button>
          <span class="val" id="allureEfVisee_display">${slot.allureEfVisee?fmtA(Number(slot.allureEfVisee)):"—"}</span>
          <button type="button" onclick="adjustPaceGoal('allureEfVisee',5,360)">+</button>
        </div>
      </div>
      <input type="hidden" id="goal_allureEfVisee" value="${slot.allureEfVisee||""}">
      <div class="field" style="margin-bottom:0">
        <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Allure Work (fractionné)</span>
        <div class="pace-stepper">
          <button type="button" onclick="adjustPaceGoal('allureWorkVisee',-5,300)">−</button>
          <span class="val" id="allureWorkVisee_display">${slot.allureWorkVisee?fmtA(Number(slot.allureWorkVisee)):"—"}</span>
          <button type="button" onclick="adjustPaceGoal('allureWorkVisee',5,300)">+</button>
        </div>
      </div>
      <input type="hidden" id="goal_allureWorkVisee" value="${slot.allureWorkVisee||""}">
    </div>`:`<input type="hidden" id="goal_allureEfVisee" value="${slot.allureEfVisee||""}"><input type="hidden" id="goal_allureWorkVisee" value="${slot.allureWorkVisee||""}">`}
    ${!blocks.blessure?`<input type="hidden" id="goal_dureeArret" value="${slot.dureeArret||""}"><input type="hidden" id="goal_zoneConcernee" value="${slot.zoneConcernee||""}">`:""}
    </div>

    <div class="card">
      <div class="stitle">Autre chose à préciser</div>
      <div class="chart-hint" style="margin-top:0">Préférences d'entraînement, contexte particulier...</div>
      ${ta("goal_autre", goals.autre)}
      <button class="btn-primary" style="margin-top:14px" onclick="saveGoals()">Enregistrer</button>
      <div id="goalsSaved" class="save-confirm"></div>
    </div>`;
  }

  else if(activeTab===4){
    const estMaxHr = estimatedMaxHr();
    el.innerHTML=`
      <div class="card">
        <div class="stitle">Profil</div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
          <div style="width:60px;height:60px;border-radius:50%;overflow:hidden;background:var(--card-2);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            ${avatarUrl?`<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover">`:icon("user",26)}
          </div>
          <div>
            <label class="btn-secondary" style="display:inline-block;cursor:pointer">
              Changer la photo
              <input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
            </label>
            <div id="avatarMsg" style="font-size:12px;color:var(--text-dim);margin-top:4px"></div>
          </div>
        </div>
        <div class="account-row"><span class="lbl">Email</span><span class="v">${userEmail||"—"}</span></div>
        <div class="field" style="margin-top:10px">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Pseudo</span>
          <input type="text" id="profPseudo" value="${pseudo}" placeholder="Pour que tes amis te retrouvent" style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
        <div class="field">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Âge</span>
          <input type="number" id="profAge" min="10" max="100" value="${age||""}" style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
        <div class="field">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Genre</span>
          <select id="profGender" style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
            <option value="" ${!gender?"selected":""}>—</option>
            <option value="F" ${gender==='F'?"selected":""}>Femme</option>
            <option value="H" ${gender==='H'?"selected":""}>Homme</option>
            <option value="Autre" ${gender==='Autre'?"selected":""}>Autre</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Villes</span>
          <input type="text" id="profCities" value="${cities.join(', ')}" placeholder="Paris, Rabat..." style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
      </div>

      <div class="card">
        <div class="stitle">Sécurité</div>
        <div class="field">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Nouveau mot de passe</span>
          <input type="password" id="newPassword" placeholder="6 caractères min." style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
        <button class="btn-secondary" onclick="changePassword()">Changer le mot de passe</button>
        <div id="pwMsg" style="font-size:12px;margin-top:8px;text-align:center;min-height:16px"></div>
      </div>

      <div class="card">
        <div class="stitle">Affichage</div>
        <div class="chart-hint">Période affichée par défaut sur le Dashboard.</div>
        <div class="filters" style="margin-bottom:0">
          <button class="flt${dashboardPeriod==='weekly'?" active":""}" onclick="saveDashboardPeriod('weekly')">Hebdomadaire</button>
          <button class="flt${dashboardPeriod==='monthly'?" active":""}" onclick="saveDashboardPeriod('monthly')">Mensuel</button>
        </div>
        <div class="chart-hint" style="margin-top:12px;margin-bottom:0">Thème sombre pour l'instant — mode clair à venir.</div>
      </div>

      <div class="card">
        <div class="stitle">Fréquence cardiaque max</div>
        <div class="chart-hint">Utilisée pour calculer tes zones cardio (onglet Séances). ${maxHr?"Renseignée manuellement.":estMaxHr?`Pré-saisie à <strong style="color:var(--text)">${estMaxHr} bpm</strong> (formule 220 − âge) — corrige-la si tu connais ta vraie FC max, mesurée sur un effort proche du maximum.`:"Renseigne ton âge (ci-dessus) pour une pré-saisie automatique, ou entre directement ta FC max."}</div>
        <div class="field" style="margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">FC max manuelle (bpm)</span>
          <input type="number" id="maxHrInput" min="120" max="230" value="${maxHr||estMaxHr||""}" placeholder="ex: 190" style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
      </div>

      <div class="card">
        <div class="stitle">Fréquence cardiaque de repos</div>
        <div class="chart-hint">${restingHr?`Utilisée avec ta FC max pour calculer des zones cardio identiques à l'app Santé (méthode réserve de FC). ${restingHrIsManual?"Saisie manuellement : ne sera jamais écrasée automatiquement.":`Rafraîchie automatiquement depuis ta Watch une fois par mois${restingHrUpdatedAt?` (dernière maj : ${new Date(restingHrUpdatedAt).toLocaleDateString('fr-FR')})`:""}.`}`:"Récupérée automatiquement depuis ta Watch si elle capte des données au repos. Si tu ne la portes que pendant tes séances, HealthKit n'a rien de fiable à analyser : renseigne-la manuellement ci-dessous, elle ne sera alors plus jamais modifiée automatiquement."}</div>
        <div class="field" style="margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">FC repos (bpm)</span>
          <input type="number" id="restingHrInput" min="30" max="100" value="${restingHr||""}" placeholder="ex: 60" style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
      </div>

      <div class="card">
        <div class="stitle">VO2 max</div>
        <div class="chart-hint">${vo2Max?`Capacité cardio-respiratoire estimée. ${vo2MaxIsManual?"Saisie manuellement : ne sera jamais écrasée automatiquement.":`Rafraîchie automatiquement depuis ta Watch une fois par mois${vo2MaxUpdatedAt?` (dernière maj : ${new Date(vo2MaxUpdatedAt).toLocaleDateString('fr-FR')})`:""}.`}`:"Récupérée automatiquement depuis ta Watch (nécessite des sorties extérieures avec GPS). Sinon, renseigne-la manuellement si tu la connais."}</div>
        <div class="field" style="margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">VO2 max (ml/kg/min)</span>
          <input type="number" id="vo2MaxInput" min="20" max="90" step="0.1" value="${vo2Max||""}" placeholder="ex: 45" style="background:none;border:none;color:var(--text);font-size:13px;flex:1">
        </div>
      </div>

      <div class="card">
        <button class="btn-primary" onclick="saveAccountInfo()">Enregistrer</button>
        <div id="accountSaved" class="save-confirm"></div>
      </div>

      <div class="card">
        <div class="stitle">Synchronisation</div>
        <button class="btn-secondary" onclick="location.href='myrunningapp://sync'">Synchroniser mes courses</button>
        <div class="chart-hint" style="margin-top:10px">Ouvre l'app iOS et lance la sync — fonctionne uniquement depuis Safari sur ton iPhone.</div>
        <div class="field" style="margin-top:6px;margin-bottom:0">
          <span style="font-size:12px;color:var(--text-dim);white-space:nowrap">Importer depuis</span>
          <input type="date" value="${syncSinceDate||""}" style="background:none;border:none;color:var(--text);font-size:13px;flex:1" onchange="saveSyncSinceDate(this.value)">
        </div>
      </div>
      <div class="card">
        <div class="stitle">Export</div>
        <div class="chart-hint">Un backup perso de toutes tes séances, en dehors de Supabase.</div>
        <div style="display:flex;gap:8px">
          <button class="btn-secondary" onclick="exportData('json')">Exporter en JSON</button>
          <button class="btn-secondary" onclick="exportData('csv')">Exporter en CSV</button>
        </div>
      </div>
      <div class="card">
        <button class="btn-danger" onclick="logout()">Déconnexion</button>
      </div>`;
  }
}

async function boot(){
  document.getElementById("authView").style.display="none";
  document.getElementById("appView").style.display="block";
  document.getElementById("content").innerHTML=`<div class="loading"><div class="spinner"></div></div>`;
  await loadData();
  renderTabs();
  renderContent();
}

supa.auth.getSession().then(({ data }) => {
  if (data.session) boot();
});
</script>
</body>
</html>
