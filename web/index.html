// `intenseDist` = distance des séances Fractionné/Seuil de la période —
// sert à colorer les barres du graph Volume selon le niveau d'intensité
// (voir intensityColor), plutôt qu'une seule couleur unie qui ne dit rien
// de la nature de l'effort ce mois-là.
function weeklyVol(){
  const w={};
  runningRuns.forEach(r=>{
    const[d,m]=r.date.split("/").map(Number);
    const dt=new Date(2000,m-1,d),mon=new Date(dt);
    mon.setDate(dt.getDate()-dt.getDay()+(dt.getDay()===0?-6:1));
    const k=mon.getDate()+"/"+(mon.getMonth()+1);
    if(!w[k])w[k]={label:k,dist:0,intenseDist:0};
    w[k].dist=+(w[k].dist+r.dist).toFixed(2);
    if(r.type==="Fractionné"||r.type==="Seuil") w[k].intenseDist=+(w[k].intenseDist+r.dist).toFixed(2);
  });
  return Object.values(w);
}

function monthlyVol(){
  const w={};
  runningRuns.forEach(r=>{
    const d=dateFromRun(r);
    const k=d.getFullYear()*12+d.getMonth();
    if(!w[k])w[k]={label:MONTHS[d.getMonth()],dist:0,intenseDist:0,order:k};
    w[k].dist=+(w[k].dist+r.dist).toFixed(2);
    if(r.type==="Fractionné"||r.type==="Seuil") w[k].intenseDist=+(w[k].intenseDist+r.dist).toFixed(2);
  });
  return Object.values(w).sort((a,b)=>a.order-b.order);
}
// Vert = quasi pas d'intensif, orange = une dose modérée, rouge = grosse
// part de fractionné/seuil sur la période — un simple ratio distance
// intense/distance totale, pas besoin de FC pour que ça marche pour tous.
function intensityColor(r){
  const pct = r.dist ? r.intenseDist/r.dist : 0;
  return pct>=0.3 ? "#ff375f" : pct>=0.12 ? "#ff9f0a" : "#C6F432";
}
// Couleur du volume MENSUEL comparé à l'objectif km/mois (goals.kmMensuel) :
// jaune tant qu'on est loin en dessous, vert dans la cible, orange/rouge en
// cas de dépassement. Gris si aucun objectif n'est renseigné (rien à comparer).
function monthlyGoalColor(dist, kmGoal){
  if(!kmGoal) return "#A3A7AD";
  const pct = dist/kmGoal*100;
  if(pct>150) return "#ff375f";
  if(pct>120) return "#ff9f0a";
  if(pct>=70) return "#C6F432";
  return "#ffd60a";
}

// Points sans ligne reliée + droite de tendance projetée sur 3 mois.
// Rend un emoji sur un mini-canvas pour l'utiliser comme pointStyle Chart.js
// (rendu synchrone, pas de chargement d'image asynchrone nécessaire).
function emojiPointStyle(emoji, size=22){
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.font = `${Math.round(size*0.85)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, size/2, size/2+1);
  return canvas;
}

function mkPaceTrendChart(canvasId, runs, showRaces, projectionDays=90){
  if(!runs.length) return;
  const withPace = runs.filter(r=>r.allure);
  if(!withPace.length) return;
  const first = dateFromRun(withPace[0]);
  const points = withPace.map(r=>({x:Math.round((dateFromRun(r)-first)/86400000), y:r.allure}));
  const {slope,intercept} = linearRegression(points);
  const lastX = points[points.length-1].x;
  const projX = lastX + projectionDays;
  const trend = [{x:0,y:intercept},{x:projX,y:slope*projX+intercept}];
  const dayToLabel = x => { const d=new Date(first); d.setDate(first.getDate()+Math.round(x)); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); };
  const grid="rgba(255,255,255,0.06)",tick="#A3A7AD",tbg="#17191C",tbr="rgba(255,255,255,0.1)",ttx="#F2F3F0";
  const datasets = [
    {type:'scatter', label:'Allure', data:points, backgroundColor:'#C6F432', pointRadius:4},
    {type:'line', label:'Tendance', data:trend, borderColor:'#ff9f0a', borderWidth:2, borderDash:[6,4], pointRadius:0, fill:false},
  ];
  // Une course officielle est un point de repère (vraie perf), pas une donnée
  // d'entraînement : affichée en plus, mais jamais incluse dans la régression.
  const courseRuns = showRaces ? runningRuns.filter(r=>r.type==="Course" && r.allure) : [];
  if(courseRuns.length){
    const coursePoints = courseRuns.map(r=>({x:Math.round((dateFromRun(r)-first)/86400000), y:r.allure, label:r.label}));
    datasets.push({type:'scatter', label:'Course', data:coursePoints, backgroundColor:'#ff453a', pointStyle:coursePoints.map(()=>emojiPointStyle('🚩')), pointRadius:11});
  }
  // Sorties longues : repère visuel (bleu), jamais dans la régression — même
  // logique que les courses, une sortie longue a une dynamique différente
  // d'une séance EF classique et fausserait la tendance.
  const longRuns = showRaces ? runningRuns.filter(r=>r.type==="Long" && r.allure) : [];
  if(longRuns.length){
    const longPoints = longRuns.map(r=>({x:Math.round((dateFromRun(r)-first)/86400000), y:r.allure, label:r.label}));
    datasets.push({type:'scatter', label:'Long', data:longPoints, backgroundColor:'#0a84ff', pointRadius:5});
  }
  const c = new Chart(document.getElementById(canvasId), {
    data: { datasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{backgroundColor:tbg,borderColor:tbr,borderWidth:1,titleColor:ttx,bodyColor:ttx,callbacks:{title:items=>dayToLabel(items[0].parsed.x), label:ctx=>(ctx.dataset.label==='Allure'||ctx.dataset.label==='Long')?ctx.dataset.label+": "+fmtA(ctx.parsed.y):ctx.dataset.label}}},
      scales:{
        x:{type:'linear', ticks:{color:tick,font:{size:10},callback:v=>dayToLabel(v)}, grid:{display:false}},
        y:{reverse:true, ticks:{color:tick,font:{size:10},callback:v=>fmtA(v)}, grid:{color:grid}},
      }
    }
  });
  charts.push(c);
  return c;
}

// Progression allure des séances fractionné : deux séries de points (Work et
// Récup), la tendance/projection étant calculée sur le Work uniquement (c'est
// la métrique de progression qui a du sens, la Récup n'est qu'un repère).
function mkFractionneChart(canvasId, fracRuns, projectionDays=90){
  const withIntervals = fracRuns
    .map(r=>({r, ip: getIntervalPaces(r)}))
    .filter(x=>x.ip);
  if(!withIntervals.length) return;
  const first = dateFromRun(withIntervals[0].r);
  const workPoints = withIntervals.map(({r,ip})=>({x:Math.round((dateFromRun(r)-first)/86400000), y:ip.work}));
  const recoveryPoints = withIntervals.filter(({ip})=>ip.recovery).map(({r,ip})=>({x:Math.round((dateFromRun(r)-first)/86400000), y:ip.recovery}));
  const {slope,intercept} = linearRegression(workPoints);
  const lastX = workPoints[workPoints.length-1].x;
  const projX = lastX + projectionDays;
  const trend = [{x:0,y:intercept},{x:projX,y:slope*projX+intercept}];
  const dayToLabel = x => { const d=new Date(first); d.setDate(first.getDate()+Math.round(x)); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); };
  const grid="rgba(255,255,255,0.06)",tick="#A3A7AD",tbg="#17191C",tbr="rgba(255,255,255,0.1)",ttx="#F2F3F0";
  const datasets = [
    {type:'scatter', label:'Work', data:workPoints, backgroundColor:'#C6F432', pointRadius:5},
    {type:'scatter', label:'Récup', data:recoveryPoints, backgroundColor:'#A3A7AD', pointRadius:5},
    {type:'line', label:'Tendance', data:trend, borderColor:'#ff9f0a', borderWidth:2, borderDash:[6,4], pointRadius:0, fill:false},
  ];
  const c = new Chart(document.getElementById(canvasId), {
    data: { datasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:true, position:'bottom', labels:{color:tick,boxWidth:10,font:{size:10},filter:item=>item.text!=='Tendance'}}, tooltip:{backgroundColor:tbg,borderColor:tbr,borderWidth:1,titleColor:ttx,bodyColor:ttx,callbacks:{title:items=>dayToLabel(items[0].parsed.x), label:ctx=>ctx.dataset.label==='Tendance'?null:ctx.dataset.label+": "+fmtA(ctx.parsed.y)}}},
      scales:{
        x:{type:'linear', ticks:{color:tick,font:{size:10},callback:v=>dayToLabel(v)}, grid:{display:false}},
        y:{reverse:true, ticks:{color:tick,font:{size:10},callback:v=>fmtA(v)}, grid:{color:grid}},
      }
    }
  });
  charts.push(c);
  return c;
}

// Agrège le temps par zone de toutes les séances avec détail FC, groupé par mois calendaire.
function monthlyZoneBreakdown(cardioRuns, effMaxHr, effRestingHr){
  const byMonth = {};
  cardioRuns.filter(r=>r.hrSeries && r.hrSeries.length>1).forEach(r=>{
    const d = dateFromRun(r);
    const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    if(!byMonth[key]) byMonth[key] = {label: d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}), secs:[0,0,0,0,0], sortKey: d.getFullYear()*12+d.getMonth()};
    const {secs} = computeHrZoneSeconds(r.hrSeries, effMaxHr, effRestingHr);
    secs.forEach((s,i)=>byMonth[key].secs[i]+=s);
  });
  return Object.values(byMonth).sort((a,b)=>a.sortKey-b.sortKey);
}

// Rapport allure/FC : allure EF et FC moyenne sur deux axes du même
// graphique — plus parlant qu'une simple courbe de FC isolée pour repérer

  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((ds, i)=>{
      const meta = chart.getDatasetMeta(i);

      meta.data.forEach((bar, idx)=>{
        const val = ds.data[idx];

        ctx.save();
        ctx.fillStyle = '#F2F3F0';
        ctx.font = '600 10px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(val, bar.x, bar.y - 6);

      });
    });
  }
};

// Version courte du nom, affichée sur le schéma (le nom complet reste
// dans la liste à droite une fois la zone touchée) — sans indication
// gauche/droite, déjà donnée par la position de la capsule.
const ZONE_SHORT_LABEL={
  epaules_g:"Épaule", epaules_d:"Épaule",
  dos:"Dos", abdos:"Abdos",
  psoas_g:"Psoas", psoas_d:"Psoas",
  bassin:"Bassin",
  fessiers_g:"Fessier", fessiers_d:"Fessier",
  cuisse_g:"Cuisse", cuisse_d:"Cuisse",
  ischios_g:"Ischio", ischios_d:"Ischio",
  genoux_g:"Genou", genoux_d:"Genou",
  tibias_g:"Tibia", tibias_d:"Tibia",
  mollets_g:"Mollet", mollets_d:"Mollet",
  tendons_g:"Tendon", tendons_d:"Tendon",
  pied_g:"Pied", pied_d:"Pied",
};
// Tête + bras courts, décoratifs (pas des zones). Le tronc/jambes est un
// tracé fermé séparé (sans manches) pour laisser de la place aux capsules
// hors-corps sur les côtés ; les bras ne sont que deux courts traits
// arrondis suggérant les épaules, plutôt qu'un bras entier jusqu'au poignet.
const HEAD_CIRCLE = {cx:128, cy:35, r:22};
const ARM_STUBS = [
  "M105,62 Q81,68 76,84",
  "M151,62 Q176,68 181,84",
];
// Contour du corps (tronc + jambes en un seul tracé fermé, sans manches),
// dessiné par-dessus les capsules pour rester visible quel que soit le
// recouvrement.
const BODY_OUTLINE="M105,59 C101,81 99,115 97,148 C94,173 92,192 89,209 L84,310 L81,346 L76,405 C73,413 70,417 70,421 C70,428 72,432 73,435 L94,437 C96,432 94,423 92,416 L97,346 L100,310 L105,227 C108,213 109,209 111,205 L146,205 C147,209 148,213 151,227 L157,310 L159,346 L165,416 C162,423 161,432 162,437 L184,435 C185,432 186,428 186,421 C186,417 184,413 181,405 L176,346 L173,310 L167,209 C165,192 162,173 159,148 C158,115 155,81 151,59 C142,68 119,68 105,59 Z";
const ZONE_NEUTRAL = "#48484c";
// Moment de la douleur (4.5.c, CDC v2) : champ séparé par zone
// (`${key}_moment`), distinct de l'intensité existante (`${key}`) pour ne
// rien casser côté lecture ailleurs dans l'app (painColor, historique...).
// "Pendant" par défaut — le cas le plus fréquent, modifiable en un clic.
const MOMENT_OPTIONS = [["avant","Avant"],["pendant","Pendant"],["apres","Après"]];
// Étiquette collée sous chaque capsule (nom court, systématique, dedans
// comme dehors) — teinte claire pour rester lisible sur le fond sombre.
function zoneLabelSVG(x, y, text){
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="9" fill="#d1d1d6" style="pointer-events:none">${text}</text>`;
}
// Forme d'une zone : une simple ellipse pour la plupart des zones, sauf
// l'abdos qui reçoit un petit motif "tablette de chocolat" (coutures en
// couleur de fond sur un rectangle arrondi) pour se distinguer d'un coup
// d'œil des autres capsules — toutes identiques sinon. Le remplissage
// (unique classe "zone-fill", même sur plusieurs éléments) est ce que
// bodyZoneSlide recolore au fil du curseur.
function zoneShapeSVG(key, s, fill){
  if(key === "abdos"){
    const x=s.cx-s.rx, y=s.cy-s.ry, w=s.rx*2, h=s.ry*2;
    const seam = (x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#17191C" stroke-width="2"/>`;
    return `<rect class="zone-fill" x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${fill}"/>
      ${seam(s.cx, y+4, s.cx, y+h-4)}
      ${seam(x+4, s.cy-s.ry/3, x+w-4, s.cy-s.ry/3)}
      ${seam(x+4, s.cy+s.ry/3, x+w-4, s.cy+s.ry/3)}`;
  }
  return `<ellipse class="zone-fill" cx="${s.cx}" cy="${s.cy}" rx="${s.rx}" ry="${s.ry}" fill="${fill}"/>`;
}
function bodyMapHTML(prefix, initial){
  // Zones déjà notées (valeur > 0) : leur ligne reste visible d'entrée,
  // pas la peine de retoucher la capsule pour la revoir.
  const revealed = new Set(BODY_ZONES.filter(([key])=>(initial[key] ?? 0) > 0).map(([key])=>key));
  const svgZones = BODY_ZONES.map(([key])=>{
    const v = initial[key] ?? 0;
    const s = BODY_ZONE_CAPS[key];
    const fill = v>0 ? painColor(v) : ZONE_NEUTRAL;
    const zoneLabel = zoneLabelSVG(s.cx, s.cy+s.ry+11, ZONE_SHORT_LABEL[key]);
    return `<g class="zone" id="${prefix}_zone_${key}" onclick="bodyZoneTap('${prefix}','${key}')">${zoneShapeSVG(key,s,fill)}</g>${zoneLabel}`;
  }).join("");
  const rows = BODY_ZONES.map(([key,label])=>{
    const v = initial[key] ?? 0;
    const c = painColor(v);
    const moment = initial[`${key}_moment`] || "pendant";
    return `<div class="zone-row" id="${prefix}_${key}_row" style="display:${revealed.has(key)?"":"none"}">
      <div class="pain-row-top"><span class="lbl">${label}</span><span class="val" id="${prefix}_${key}_v" style="color:${c}">${v}</span></div>
      <input type="range" min="0" max="10" value="${v}" id="${prefix}_${key}" style="accent-color:${c}"
        oninput="bodyZoneSlide('${prefix}','${key}',this.value)">
      ${scaleTicksHTML()}
      <div class="filters" style="margin-top:6px;margin-bottom:0" data-chipgroup="${prefix}_${key}_moment">
        ${MOMENT_OPTIONS.map(([val,lbl])=>`<button type="button" class="flt${moment===val?" active":""}" data-value="${val}" onclick="setZoneMoment('${prefix}','${key}','${val}')">${lbl}</button>`).join("")}
      </div>
      <input type="hidden" id="${prefix}_${key}_moment" value="${moment}">
    </div>`;
  }).join("");
  const decor = [
    `<circle cx="${HEAD_CIRCLE.cx}" cy="${HEAD_CIRCLE.cy}" r="${HEAD_CIRCLE.r}" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>`,
    ...ARM_STUBS.map(d=>`<path d="${d}" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>`),
    `<path d="${BODY_OUTLINE}" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" pointer-events="none"/>`,
  ].join("");
  return `<div class="body-map-wrap">
    <svg class="body-svg" width="257" height="470" viewBox="0 0 257 470">
      ${svgZones}
      ${decor}
    </svg>
    <div class="zone-rows">
      <div class="zone-placeholder" id="${prefix}_zoneph" style="display:${revealed.size?"none":""}">Touche une zone sur le schéma</div>
      ${rows}
    </div>
  </div>`;
}
// Chaque capsule touchée affiche sa ligne définitivement (au lieu de
// remplacer la précédente) : on construit la liste des zones notées au
// fur et à mesure des clics, plutôt que de perdre de vue une zone déjà
// réglée dès qu'on en touche une autre. Seul le halo (zone en cours
// d'édition) se déplace d'un clic à l'autre.
window.setZoneMoment = (prefix, key, val) => {
  document.getElementById(`${prefix}_${key}_moment`).value = val;
  document.querySelectorAll(`[data-chipgroup="${prefix}_${key}_moment"] .flt`).forEach(b=>{ const on = b.dataset.value===val; b.classList.toggle("active", on); if(on) popChip(b); });
};
window.bodyZoneTap = (prefix, key) => {
  const row = document.getElementById(`${prefix}_${key}_row`);
  if(row) row.style.display = "";
  BODY_ZONES.forEach(([k])=>{
    const zone = document.getElementById(`${prefix}_zone_${k}`);
    if(zone) zone.classList.toggle("active", k===key);
  });
  const ph = document.getElementById(`${prefix}_zoneph`);
  if(ph) ph.style.display = "none";
};
window.bodyZoneSlide = (prefix, key, val) => {
  const v = document.getElementById(`${prefix}_${key}_v`);
  const input = document.getElementById(`${prefix}_${key}`);
  const zone = document.getElementById(`${prefix}_zone_${key}`);
  const c = painColor(val);
  if(v){ v.textContent = val; v.style.color = c; }
  if(input) input.style.accentColor = c;
  if(zone){
    const fill = val>0 ? c : ZONE_NEUTRAL;
    zone.querySelectorAll(".zone-fill").forEach(e=>e.setAttribute("fill", fill));
  }
};
// Format court par défaut (4.5.b, CDC v2) : note globale 1-5 + "une
// gêne/douleur ?" (+ RPE, toujours demandé — voir
// shouldShowDetailedRatingForm, logic.js). Le détaillé (fatigue/mental/
// respiration + carte du corps) ne s'affiche que si la note est basse ou
// qu'une gêne est signalée — jamais les deux formats affichés d'un bloc
// comme avant. `updateRatingFormVisibility` bascule juste l'affichage du
// bloc détaillé sans tout re-render, pour ne pas perdre une saisie en
// cours sur un curseur.
function painFormHTML(prefix, initial){
  initial = initial || {};
  const note = initial.note ?? null;
  const gene = initial.gene===true ? true : initial.gene===false ? false : null;
  const showDetailed = shouldShowDetailedRatingForm(note, gene);
  return `
    ${SESSION_RPE.map(([key,label,lo,hi])=>painSliderRow(prefix,key,label,initial,lo,hi)).join("")}
    <div class="pain-row">
      <div class="pain-row-top"><span class="lbl">Note globale de la séance</span></div>
      <div class="filters" style="margin-bottom:0" data-chipgroup="${prefix}_note">
        ${[1,2,3,4,5].map(n=>`<button type="button" class="flt${note===n?" active":""}" data-value="${n}" onclick="setRatingNote('${prefix}',${n})">${n}</button>`).join("")}
      </div>
    </div>
    <div class="pain-row">
      <div class="pain-row-top"><span class="lbl">Une gêne ou une douleur ?</span></div>
      <div class="filters" style="margin-bottom:0" data-chipgroup="${prefix}_gene">
        <button type="button" class="flt${gene===true?" active":""}" data-value="1" onclick="setRatingGene('${prefix}',true)">Oui</button>
        <button type="button" class="flt${gene===false?" active":""}" data-value="0" onclick="setRatingGene('${prefix}',false)">Non</button>
      </div>
    </div>
    <input type="hidden" id="${prefix}_note" value="${note??""}">
    <input type="hidden" id="${prefix}_gene" value="${gene===true?"1":gene===false?"0":""}">
    <div id="${prefix}_detailed" style="display:${showDetailed?"block":"none"}">
      ${WELLBEING_EXTRA.map(([key,label,lo,hi])=>painSliderRow(prefix,key,label,initial,lo,hi)).join("")}
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:14px 0 4px">Douleurs par zone</div>
      ${bodyMapHTML(prefix, initial)}
    </div>
  `;
}
window.setRatingNote = (prefix, n) => {
  document.getElementById(`${prefix}_note`).value = n;
  document.querySelectorAll(`[data-chipgroup="${prefix}_note"] .flt`).forEach(b=>{ const on = Number(b.dataset.value)===n; b.classList.toggle("active", on); if(on) popChip(b); });
  updateRatingFormVisibility(prefix);
};
window.setRatingGene = (prefix, val) => {
  document.getElementById(`${prefix}_gene`).value = val ? "1" : "0";
  document.querySelectorAll(`[data-chipgroup="${prefix}_gene"] .flt`).forEach(b=>{ const on = b.dataset.value===(val?"1":"0"); b.classList.toggle("active", on); if(on) popChip(b); });
  updateRatingFormVisibility(prefix);
};
function updateRatingFormVisibility(prefix){
  const noteVal = document.getElementById(`${prefix}_note`).value;
  const note = noteVal ? parseInt(noteVal,10) : null;
  const geneVal = document.getElementById(`${prefix}_gene`).value;
  const gene = geneVal==="1" ? true : geneVal==="0" ? false : null;
  const el = document.getElementById(`${prefix}_detailed`);
  if(el) el.style.display = shouldShowDetailedRatingForm(note, gene) ? "block" : "none";
}

let openHrDetail = new Set();
// Liste "Toutes les séances" repliée par défaut (date/type/km) : dépliée au
// clic pour voir le détail complet (édition, cardio) — évite une liste très
// longue de cartes toutes ouvertes en permanence.
let openManageRow = new Set();
window.toggleManageRow = (id) => {
  if(openManageRow.has(id)) openManageRow.delete(id);
  else { openManageRow.add(id); justOpenedKey = "mr_"+id; }
  renderContent(); justOpenedKey = null;
};
// Mois repliés par défaut (sauf le plus récent) dans "Toutes les séances" :
// null tant que non initialisé, pour ne calculer le mois le plus récent à
// ouvrir qu'une fois, sans écraser les choix de l'utilisateur aux rendus
// suivants (changement de filtre, ouverture d'une séance...).
let openMonths = null;
window.toggleMonthGroup = (key) => {
  if(openMonths.has(key)) openMonths.delete(key);
  else { openMonths.add(key); justOpenedKey = "mg_"+key; }
  renderContent(); justOpenedKey = null;
};
// Vrai seulement au tout premier rendu du dashboard depuis l'ouverture de
// l'app : l'animation de célébration de la carte "Dernière séance" ne doit
// jouer qu'une fois, pas à chaque re-render (changement de filtre, etc.).
let lastRunCelebrated = false;
// Repliée par défaut (juste date + km) : dépliée au clic pour voir le
// détail complet. Un seul état pour toute la session (une seule carte).
let lastRunExpanded = false;
window.toggleLastRunExpanded = () => {
  lastRunExpanded = !lastRunExpanded;
  renderContent();
};
window.toggleHrDetail = (id) => {
  if(openHrDetail.has(id)) openHrDetail.delete(id);
  else openHrDetail.add(id);
  renderContent();
};

function hrDetailHTML(r, effMaxHr, effRestingHr){
  if(!r.hrSeries || r.hrSeries.length<2){
    return `<div style="padding:8px 0 14px;font-size:12px;color:var(--text-dim)">Pas de détail FC pour cette séance — resynchronise-la depuis l'app pour le récupérer.</div>`;
  }
  if(!effMaxHr){
    return `<div style="padding:8px 0 14px;font-size:12px;color:var(--text-dim)">Renseigne ta FC max (Profil › Mon compte) pour voir la répartition par zones.</div>`;
  }
  const {secs, defs} = computeHrZoneSeconds(r.hrSeries, effMaxHr, effRestingHr);
  const total = secs.reduce((a,b)=>a+b,0)||1;
  const flagFrac = r.type!=="Fractionné" && looksLikeFractionne(r.hrSeries);
  const flagSeuil = !flagFrac && r.type!=="Seuil" && looksLikeSeuil(r.hrSeries, effMaxHr, effRestingHr);
  const intervalPaces = r.type==="Fractionné" ? getIntervalPaces(r) : null;
  return `<div style="padding:8px 0 14px">
    <div style="position:relative;width:100%;height:130px"><canvas id="cHr_${r.id}"></canvas></div>
    <div style="margin-top:12px">
      ${defs.map((d,i)=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">
          <span style="width:52px;color:${d.color}">${d.label}</span>
          <div style="flex:1;height:6px;border-radius:3px;background:var(--card-2);overflow:hidden">
            <div style="width:${Math.round(secs[i]/total*100)}%;height:100%;background:${d.color}"></div>
          </div>
          <span style="width:48px;text-align:right;color:var(--text-dim)">${fmtDur(secs[i])}</span>
        </div>`).join("")}
    </div>
    ${!effRestingHr?`<div style="margin-top:8px;font-size:11px;color:var(--text-dim)">Zones basées sur % de FC max uniquement. Renseigne ta FC de repos (Mon compte) pour matcher exactement l'app Santé.</div>`:""}
    ${intervalPaces && (intervalPaces.manual || intervalPaces.workCount>=2)?`<div style="margin-top:12px;display:flex;gap:16px">
      <div><div style="font-size:11px;color:var(--text-dim)">Allure Work ${intervalPaces.manual?"(manuel)":`(${intervalPaces.workCount})`}</div><div style="font-size:15px;font-weight:700;color:#C6F432">${fmtA(intervalPaces.work)}/km</div></div>
      ${intervalPaces.recovery?`<div><div style="font-size:11px;color:var(--text-dim)">Allure Récup ${intervalPaces.manual?"(manuel)":`(${intervalPaces.recoveryCount})`}</div><div style="font-size:15px;font-weight:700;color:#A3A7AD">${fmtA(intervalPaces.recovery)}/km</div></div>`:""}
    </div>`:r.allure?`<div style="margin-top:12px"><div style="font-size:11px;color:var(--text-dim)">Allure moyenne</div><div style="font-size:15px;font-weight:700;color:var(--text)">${fmtA(r.allure)}/km</div></div>`:""}
    ${flagFrac?`<div style="margin-top:10px;padding:8px 10px;background:var(--attention-bg);border:1px solid var(--attention-line);border-radius:8px;font-size:12px">
      La FC oscille beaucoup sur cette séance — ça ressemble à un fractionné.
      <div><button class="btn-secondary" style="margin-top:6px" onclick="changeType('${r.id}','Fractionné')">Reclasser en Fractionné</button></div>
    </div>`:""}
    ${flagSeuil?`<div style="margin-top:10px;padding:8px 10px;background:rgba(215,0,21,0.1);border:1px solid rgba(215,0,21,0.3);border-radius:8px;font-size:12px">
      Plus de la moitié de cette séance est passée en zones 3-5 — ça ressemble à du Seuil.
      <div><button class="btn-secondary" style="margin-top:6px" onclick="changeType('${r.id}','Seuil')">Reclasser en Seuil</button></div>
    </div>`:""}
  </div>`;
}

function soonCard(iconName,title,sub){
  return `<div class="card soon-card">
    ${icon(iconName,40)}
    <div class="soon-badge">Bientôt disponible</div>
    <h3>${title}</h3>
    <p>${sub}</p>

}

// Ligne "gérable" : type modifiable + inclusion dans les stats + question
// jambes pour le renfo + détail FC/zones si disponible (fusion Séances/Cardio).
function manageableRow(r, effMaxHr, effRestingHr){
  const c=TC[r.type]||TC.Other;
  const legsPrompt = r.type==="Renfo" ? `
      <div class="manage-field" style="grid-column:1/-1">
        <span class="field-lbl">Ciblé jambes ?</span>
        <div style="display:flex;gap:8px;margin-top:2px">
          <button class="flt${r.legsFocused===true?" active":""}" onclick="setLegsFocused('${r.id}', true)">Oui</button>
          <button class="flt${r.legsFocused===false?" active":""}" onclick="setLegsFocused('${r.id}', false)">Non</button>
        </div>
      </div>` : "";
  return `<div class="manage-row">
    <div class="manage-top">
      <div class="session-dot" style="background:${c}22;color:${c}">${icon(TICON[r.type]||"activity",18)}</div>
      <div class="manage-date">${r.label}</div>
      <label class="toggle-col" title="Inclure dans le suivi">
        <span>Suivi</span>
        <label class="toggle">
          <input type="checkbox" ${r.includeInStats?"checked":""} onchange="toggleInclude('${r.id}', this.checked)">
          <span class="track"></span><span class="thumb"></span>
        </label>
      </label>
      <button class="delete-btn" title="Supprimer définitivement" onclick="deleteRun('${r.id}', '${r.label}')">${icon("trash",15)}</button>
    </div>
    <div class="manage-grid">
      <div class="manage-field">
        <span class="field-lbl">Type de séance</span>
        <select class="type-select" onchange="changeType('${r.id}', this.value)">
          ${TYPE_OPTIONS.map(t=>`<option value="${t}" ${t===r.type?"selected":""}>${t}</option>`).join("")}
        </select>
        ${r.appleType?`<span class="field-sub">${r.appleType===MANUAL_RUN_MARKER?"Saisie à la main":"Détecté par Santé : "+r.appleType}</span>`:""}
      </div>
      <div class="manage-field"><span class="field-lbl">Temps d'effort</span><span class="field-val">${r.dur}</span></div>
      ${r.dist>0?`<div class="manage-field"><span class="field-lbl">Distance</span><span class="field-val">${r.dist.toFixed(2)} km</span></div>
      <div class="manage-field"><span class="field-lbl">Allure</span><span class="field-val">${fmtA(r.allure)}/km</span></div>`:""}
      ${legsPrompt}
    </div>
    ${cardioDetailBlockHTML(r, effMaxHr, effRestingHr)}
  </div>`;
}
// Détail FC/zones intégré à la ligne de séance (fusion des anciens onglets
// Séances et Cardio) : n'apparaît que si la séance a des échantillons FC.
function cardioDetailBlockHTML(r, effMaxHr, effRestingHr){
  if(!r.hrSeries || r.hrSeries.length<2) return "";
  const open = openHrDetail.has(r.id);
  const flagFrac = r.type!=="Fractionné" && looksLikeFractionne(r.hrSeries);
  const flagSeuil = !flagFrac && r.type!=="Seuil" && looksLikeSeuil(r.hrSeries, effMaxHr, effRestingHr);
  return `<div class="session-pick" style="margin-top:6px" onclick="toggleHrDetail('${r.id}')">
    <span>${icon(open?"chevronDown":"chevronRight",13)} Détail cardio</span>
    ${flagFrac?`<span class="badge" style="background:var(--attention-bg);color:var(--attention)">⚠️ Fractionné détecté</span>`:""}
    ${flagSeuil?`<span class="badge" style="background:#d7001522;color:#d70015">Zone haute</span>`:""}
  </div>
  ${open?hrDetailHTML(r, effMaxHr, effRestingHr):""}`;
}

/* ============================================================
   Onglet Programme — calendrier de séances généré (moteur en logic.js).
   ============================================================ */

const PACE_ZONE_LABEL = { easy:"Easy", marathon:"Marathon", threshold:"Seuil", interval:"Fractionné", repetition:"Répétition" };
function programProfileSourceLabel(profile){
  if(!profile) return "";
  if(profile.source==="goal_pb") return "ton record personnel renseigné dans Objectifs";
  if(profile.source==="goal_vma") return "ta VMA renseignée dans Objectifs";
  return "ton temps de référence saisi"; // pas "le temps de référence que tu as saisi" : "à partir de le..." est une faute (élision manquante), corrigé en "à partir de ton..."
}
// Explique l'allure visée en langage clair (ZONE_FRIENDLY, logic.js) — pas
// de jargon non expliqué (VDOT, %...), pensé pour un débutant. Complétée
// (4.3.b) par la vraie consigne d'intensité : ressenti + plafond de FC pour
// EF/sortie longue (l'allure n'est qu'indicative), allure + zone FC pour
// Seuil, allure seule pour Fractionné (voir programIntensityGuidance).
function programPaceExplanationHTML(session){
  if(session.generation_reason==="guided_test"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0"><strong style="color:var(--text)">Ressenti : allure soutenue mais régulière.</strong> Pars tranquillement et garde la même allure jusqu'au bout : si tu t'essouffles trop vite, c'est que tu es parti trop fort. Pas d'inquiétude, il n'y a pas de bon ou mauvais résultat.</div>`;
  }
  if(session.generation_reason==="beginner_plan"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0"><strong style="color:var(--text)">Ressenti : cours à un rythme où tu peux encore parler.</strong> Si tu es essoufflé, ralentis ou marche un peu plus longtemps : l'important est de terminer la séance.</div>`;
  }
  const zf = ZONE_FRIENDLY[session.pace_zone];
  if(!zf) return "";
  const profile = resolveRunnerProfile(goals, programSettings, RACE_DISTANCES_KM);
  const srcLabel = programProfileSourceLabel(profile);
  const pareseLabel = srcLabel ? `, calculée à partir de ${srcLabel}` : "";
  const effMaxHr = maxHr || estimatedMaxHr();
  const guidance = programIntensityGuidance(session.pace_zone, effMaxHr, restingHr);
  const paceLine = `Ton allure ${zf.name} correspond à ${zf.what}${pareseLabel}.`;

  if(guidance.mode==="ressenti_plafond"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0">
      <strong style="color:var(--text)">Ressenti : tu dois pouvoir parler sans être essoufflé.</strong>
      Reste sous ${guidance.hrCeiling} bpm. L'allure ${zf.name} affichée n'est qu'indicative${pareseLabel}.
    </div>`;
  }
  if(guidance.mode==="ressenti"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0"><strong style="color:var(--text)">Ressenti : tu dois pouvoir parler sans être essoufflé.</strong> Renseigne ta FC max (Mon compte) pour voir aussi un plafond de FC à ne pas dépasser.</div>`;
  }
  if(guidance.mode==="allure_zone"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0">${paceLine} Vise aussi une FC entre ${guidance.hrRangeMin} et ${guidance.hrRangeMax} bpm — l'effort est assez long pour que ta FC ait le temps de suivre.</div>`;
  }
  return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0">${paceLine}</div>`;
}
function sessionRunType(paceZone){
  if(paceZone==="interval"||paceZone==="repetition") return "Fractionné";
  if(paceZone==="threshold") return "Seuil";
  return "EF";
}
function mondayOf(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  d.setDate(d.getDate() - d.getDay() + (d.getDay()===0?-6:1));
  return d;
}
// `date.toISOString().slice(0,10)` convertit d'abord en UTC — pour
// n'importe quel fuseau en avance sur UTC (Europe/Paris compris), ça
// décale silencieusement la date d'un jour près de minuit. Toujours
// utiliser ce formateur (année/mois/jour EN LOCAL) pour planned_date /
// week_start_date, jamais toISOString() sur une date sans heure.
function localDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDaysStr(base, n){ const d=new Date(base); d.setDate(d.getDate()+n); return localDateStr(d); }
function dayLabelShort(date){ return date.toLocaleDateString('fr-FR',{weekday:'short', day:'numeric', month:'short'}); }

// Regroupe les entrées objectif principal/secondaire + charge récente
// (ACWR) + ressenti récent (douleur répétée, fatigue/mental) en une
// structure hebdo ajustée — utilisé à la fois pour générer une semaine et
// pour décider si la prochaine séance planifiée doit être ajustée.
function computeProgramInputs(){
  const principalType = goals.principal?.objectifPrincipal;
  const secondaireEnabled = goals.secondaireEnabled!==undefined ? !!goals.secondaireEnabled : !!(goals.secondaire?.objectifPrincipal);
  const secondaryType = secondaireEnabled ? goals.secondaire?.objectifPrincipal : null;
  let structure = weeklyStructureForObjective(principalType, secondaryType);
  const loadSessions = runningRuns.filter(r=>r.painRatings?.rpe!=null).map(r=>({ date: dateFromRun(r), durationMin: (r.durationSec||0)/60, rpe: r.painRatings.rpe }));
  const dailySeries = buildDailyLoadSeries(loadSessions);
  const { acwr } = acwrAt(dailySeries, new Date());
  structure = applyAcwrAdjustment(structure, acwr);
  const ratedRuns = runningRuns.filter(r=>r.painRatings);
  const recentRatings = ratedRuns.slice(-2).map(r=>r.painRatings);
  // Palier "Hors ajustement" (4.6.c) : prime sur Petit/Gros pour sa zone, et
  // une zone déjà en pause ne redéclenche plus rien (l'utilisateur a déjà
  // été prévenu et a choisi).
  const suspendedKeys = suspendedZones.map(z=>z.zone);
  const allZoneKeys = BODY_ZONES.map(z=>z[0]).filter(k=>!suspendedKeys.includes(k));
  const urgent = acutePainTrigger(ratedRuns.slice(-3).map(r=>r.painRatings), allZoneKeys);
  const urgentIssue = urgent ? { ...urgent, runId: ratedRuns[ratedRuns.length-1].id } : null;
  const zoneKeys = allZoneKeys.filter(k=>k!==urgent?.zone);
  // painAdaptationTier (4.6.b) remplace l'ancien detectRepeatedPain à seuil
  // fixe (4) : distingue "Petit" (intensité 4-5, ajustement automatique)
  // de "Gros" (intensité >=6, proposé à valider) — les deux paliers
  // restent mutuellement exclusifs (logic.js).
  const painTier = painAdaptationTier(recentRatings, zoneKeys);
  const degraded = detectDegradedWellbeing(recentRatings);
  const chargeGauge = chargeEntrainementGauge(acwr);
  // Phrases pensées pour commencer naturellement après "à cause d'" (voir
  // le rationale "easy" dans logic.js) : pas de jargon (ACWR) exposé tel
  // quel à l'utilisateur.
  let avoidQualityReason = null;
  let painZone = null;
  if(painTier?.tier==="petit"){
    painZone = painTier.zone;
    avoidQualityReason = `une douleur répétée au niveau de ${(BODY_ZONES.find(z=>z[0]===painZone)?.[1]||painZone).toLowerCase()}`;
  }
  else if(structure.reason==="acwr_high" && !chargeGauge.severe) avoidQualityReason = "une charge d'entraînement qui a beaucoup augmenté récemment";
  else if(degraded) avoidQualityReason = "une fatigue ou un état d'esprit plus bas que d'habitude, d'après ta dernière notation";
  // Palier "Gros" (4.6.b) : douleur d'intensité >=6 répétée, OU charge
  // d'entraînement sévère (>1.5, même seuil que la jauge de 4.4) — proposé
  // à l'utilisateur, jamais appliqué automatiquement.
  let grosIssue = null;
  if(painTier?.tier==="gros") grosIssue = { type:"pain", zone:painTier.zone };
  else if(chargeGauge.severe) grosIssue = { type:"charge" };
  return { structure, avoidQualityReason, acwr, painZone, grosIssue, urgentIssue };
}

// Génère et persiste une semaine (lundi `mondayDate`) — n'écrase jamais une
// semaine déjà générée (vérifié par l'appelant). `opts.silent` : pas
// d'alerte/confirmation visuelle, utilisé pour la génération paresseuse
// automatique (semaine courante/suivante à l'ouverture de l'onglet).
// Explique pourquoi CE jour précisément (pas juste pourquoi ce type de
// séance) — complète le rationale déjà produit par le moteur (logic.js).
// Reflète honnêtement l'algo réel : répartition régulière sur les jours
// disponibles + jamais le même jour qu'une autre séance de course.
const DAY_NAMES_FR = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
function dayPlacementNote(dayIndex, isQuality, isCrossTraining){
  const day = DAY_NAMES_FR[dayIndex];
  if(isCrossTraining) return ` Elle est placée le ${day}, un jour sans course et sans course prévue le lendemain, pour éviter de cumuler la fatigue de la course avec celle du renforcement, et pour ne pas arriver à ta prochaine course avec des courbatures.`;
  if(isQuality) return ` Elle est placée le ${day}, l'un de tes jours disponibles pour courir, avec du repos avant et après plutôt que d'enchaîner deux séances difficiles.`;
  return ` Elle est placée le ${day}, répartie avec tes autres sorties pour étaler l'effort sur la semaine plutôt que de tout regrouper.`;
}

// Génère et persiste une semaine — ADDITIF/idempotent : n'écrase ni ne
// duplique jamais ce qui existe déjà, complète seulement ce qui manque
// (course et/ou complémentaire pris séparément). Permet de planifier une
// semaine à l'avance sans attendre qu'elle soit vide, et de rappeler
// "compléter" une semaine qui n'a par exemple que des séances de course
// sans avoir à tout supprimer d'abord.
// Verrou en mémoire par semaine : la génération auto en tâche de fond
// (applyProgramAdjustments, jusqu'à 4 semaines à l'ouverture de l'onglet)
// et un clic manuel peuvent viser la même semaine en même temps — sans ce
// verrou, les deux liraient "rien à compléter" avant que l'un des deux
// n'ait fini d'écrire, et dupliqueraient les séances complémentaires.
let programGenerationInFlight = new Set();
window.generateProgram = async (mondayDate, opts) => {
  opts = opts || {};
  const mondayStr = localDateStr(mondayDate);
  if(programGenerationInFlight.has(mondayStr)) return;
  programGenerationInFlight.add(mondayStr);
  try{
  const profile = resolveRunnerProfile(goals, programSettings, RACE_DISTANCES_KM);
  // Plan marche/course (4.1.d) : pendant ses 9 semaines, il remplace le
  // moteur de course et ne demande aucun temps de référence.
  const couchWeek = programSettings?.beginnerPlan ? couchWeekNumber(programSettings.beginnerPlan.startMonday, mondayStr) : null;
  const isCouch = couchWeek!=null && couchWeek>=1 && couchWeek<=COUCH_WEEKS;
  if(!profile && !isCouch){ if(!opts.silent) alert("Renseigne d'abord un temps de référence (ci-dessus) pour générer ton programme."); return; }
  const existing = plannedSessions.filter(p=>p.week_start_date===mondayStr && (p.status==="planned"||p.status==="done"));
  const dayIndexOf = (dateStr) => Math.round((new Date(dateStr+"T00:00:00") - mondayDate) / 86400000);
  // Jours où une NOUVELLE course ne peut pas aller : course ou renfo déjà
  // là (une séance légère, elle, peut cohabiter, voir sessionsCanShareDay).
  const dayBlockedForRun = existing.filter(p=>!sessionsCanShareDay({pace_zone:"easy"}, p)).map(p=>dayIndexOf(p.planned_date));
  // Comparé au NOMBRE cible (goals.frequence/frequenceAutre), pas juste à
  // "en existe-t-il au moins une" : sinon une seule séance ajoutée à la
  // main (ex: 1 renfo alors que 2/semaine sont visées) faisait croire la
  // semaine "complète" et masquait le bouton pour ajouter le reste.
  const desiredRunning = isCouch ? 3 : (Number(goals.frequence) || 3);
  const desiredCross = Number(goals.frequenceAutre) || 0;
  const actualRunning = existing.filter(p=>p.pace_zone).length;
  const actualCross = existing.filter(p=>!p.pace_zone).length;
  const missingRunning = Math.max(0, desiredRunning - actualRunning);
  const missingCross = Math.max(0, desiredCross - actualCross);
  if(missingRunning<=0 && missingCross<=0){ if(!opts.silent) alert("Cette semaine a déjà un programme complet — supprime une séance si tu veux en régénérer une nouvelle."); return; }

  const { structure, avoidQualityReason } = computeProgramInputs();
  const weeklyKm = goals.kmMensuel ? Number(goals.kmMensuel)/4.33 : 20;
  const unavailable = (goals.joursIndisponibles ? goals.joursIndisponibles.split(",") : []).map(Number);
  // Semaines consécutives -> weekIndex consécutifs (mondayDate est toujours
  // un lundi minuit local, l'écart est exactement 7j en ms) : sert à
  // alterner Seuil/Fractionné d'une semaine sur l'autre, voir
  // qualityZoneForSlot dans logic.js.
  const weekIndex = Math.floor(mondayDate.getTime()/(7*24*3600*1000));
  const { data:{user} } = await supa.auth.getUser();
  if(!user) return;

  let generated = [];
  let runningRows = [];
  if(missingRunning>0){
    const availableDayIndexes = [0,1,2,3,4,5,6].filter(d=>!unavailable.includes(d) && !dayBlockedForRun.includes(d));
    if(isCouch){
      // Cette semaine : pas de séance dans le passé.
      const todayIndex = mondayStr===localDateStr(mondayOf(new Date())) ? dayIndexOf(localDateStr(new Date())) : 0;
      const days = pickSpacedDays(availableDayIndexes.filter(d=>d>=todayIndex), missingRunning);
      generated = days.map(d=>({dayIndex:d}));
      runningRows = couchSessionRows(couchWeek, days, actualRunning+1).map(r => ({
        user_id:user.id,
        planned_date: addDaysStr(mondayDate, r.dayIndex),
        week_start_date: mondayStr,
        type:"EF", pace_zone:"easy",
        title:r.title, description:r.description, target_duration_min:r.durationMin,
        rationale: r.rationale + dayPlacementNote(r.dayIndex, false, false),
        status:"planned", source:"generated", generation_reason:"beginner_plan",
      }));
    } else {
    generated = generateWeekSessions({ profile, structure, weeklyKm, frequency:missingRunning, availableDayIndexes, avoidQualityReason, weekIndex });
    runningRows = generated.map(s => ({
      user_id:user.id,
      planned_date: addDaysStr(mondayDate, s.dayIndex),
      week_start_date: mondayStr,
      type: sessionRunType(s.paceZone),
      pace_zone: s.paceZone,
      title: s.type==="Qualité" ? "Séance qualité" : "Sortie easy",
      target_distance_km: s.distanceKm,
      target_pace_sec_per_km: s.targetPaceSecPerKm,
      rationale: s.rationale + dayPlacementNote(s.dayIndex, s.type==="Qualité", false),
      status:"planned", source:"generated",
      generation_reason: avoidQualityReason ? "pain_repeat_or_wellbeing" : (structure.reason||null),
    }));
    }
  }

  let crossRows = [];
  if(missingCross>0){
    // Séances complémentaires (renfo/mobilité/yoga) : une séance légère
    // peut tomber le même jour qu'une course, jamais le renfo ; jamais non
    // plus la VEILLE d'une course, peu importe son type (retour
    // utilisateur : courbatures/risque de blessure le lendemain). Le
    // dimanche de cette semaine compte aussi s'il précède une course déjà
    // planifiée le lundi suivant.
    const existingRunningDayIndexes = existing.filter(p=>sessionCategory(p)==="run").map(p=>dayIndexOf(p.planned_date));
    const takenCrossDayIndexes = existing.filter(p=>sessionCategory(p)!=="run").map(p=>dayIndexOf(p.planned_date));
    const allRunningDayIndexes = [...existingRunningDayIndexes, ...generated.map(s=>s.dayIndex)];
    const dayBeforeRunning = allRunningDayIndexes.map(d=>d-1).filter(d=>d>=0);
    const nextMondayStr = addDaysStr(mondayDate, 7);
    const hasRunningNextMonday = plannedSessions.some(p=>p.planned_date===nextMondayStr && p.pace_zone && (p.status==="planned"||p.status==="done"));
    const avoidDayIndexes = [...dayBeforeRunning, ...(hasRunningNextMonday ? [6] : [])];
    const crossTraining = generateCrossTrainingSessions(missingCross, allRunningDayIndexes, weekIndex, avoidDayIndexes, takenCrossDayIndexes);
    // Exercices concrets (4.7.c) pour Renfo/Mobilité ; Yoga reste sans liste
    // (pas dans la base d'exercices).
    crossRows = crossTraining.map((s, i) => {
      const strength = buildStrengthSession({
        type: s.type, niveau: goals.niveau, objectif: goals.principal?.objectifPrincipal,
        pausedZoneKeys: suspendedZones.map(z=>z.zone), rotationSeed: weekIndex*3 + i,
      });
      return {
        user_id:user.id,
        planned_date: addDaysStr(mondayDate, s.dayIndex),
        week_start_date: mondayStr,
        type: s.type, pace_zone: null, title: s.type,
        description: strength ? formatExerciseList(strength.exercises) : null,
        target_duration_min: strength ? strength.durationMin : null,
        rationale: s.rationale + dayPlacementNote(s.dayIndex, false, true),
        status:"planned", source:"generated",
      };
    });
  }

  const rows = [...runningRows, ...crossRows];
  if(!rows.length){ if(!opts.silent) alert("On n'a pas encore assez d'informations pour générer ton programme : vérifie tes objectifs et tes disponibilités ci-dessus."); return; }
  const { error } = await supa.from("planned_sessions").insert(rows);
  if(error){ if(!opts.silent) alert("Erreur de génération : "+error.message); return; }
  await loadData();
  if(!opts.silent){ renderContent(); flashSaved("programSaved"); } else { renderContent(); }
  } finally { programGenerationInFlight.delete(mondayStr); }
};

// Séances/semaine et jours indisponibles vivent désormais dans Objectifs
// ("Ton profil coureur", tronc commun) — plus besoin de les redemander ici,
// ce formulaire ne sert plus qu'au repli temps de référence (VDOT) quand

window.toggleEditSession = (id) => {
  openEditForm = openEditForm===id ? null : id;
  renderContent();
};
// Édition manuelle directe (distance/allure) — simple UPDATE comme
// valider/décaler, pas le pattern "supersede" : c'est l'utilisateur qui
// choisit sa propre valeur, ce n'est pas le moteur qui "régénère" pour un
// motif à tracer.
// Types qui ne sont pas une séance de course — sert à avertir (pas
// bloquer) quand l'utilisateur place LUI-MÊME une de ces séances la
// veille d'une course déjà planifiée (retour utilisateur : courbatures/
// risque de blessure le lendemain). Le moteur de génération applique déjà
// cette règle automatiquement, voir avoidDayIndexes dans generateProgram.
const NON_RUNNING_TYPES = ["Renfo","Mobilité","Yoga","Souplesse","Kiné","Pilates","Other"];
function warnIfDayBeforeRun(dateStr, type){
  if(!NON_RUNNING_TYPES.includes(type)) return;
  const nextDateStr = addDaysStr(new Date(dateStr+"T00:00:00"), 1);
  const hasRunNextDay = plannedSessions.some(p=>p.planned_date===nextDateStr && p.pace_zone && (p.status==="planned"||p.status==="done"));
  if(hasRunNextDay) alert("Petit conseil : tu as une course prévue le lendemain de cette séance. Des jambes courbaturées peuvent rendre la course plus difficile, tu peux la déplacer si tu préfères.");
}
window.saveSessionEdit = async (id) => {
  const session = plannedSessions.find(p=>p.id===id);
  const newType = document.getElementById("edit_type_"+id)?.value;
  const distanceKm = parseFloat(document.getElementById("edit_distance_"+id)?.value);
  const paceMin = parseInt(document.getElementById("edit_paceMin_"+id)?.value, 10);
  const paceSec = parseInt(document.getElementById("edit_paceSec_"+id)?.value, 10);
  const reminderTime = document.getElementById("edit_reminderTime_"+id)?.value;
  const patch = { source:"manual_edit", updated_at:new Date().toISOString(), reminder_time: reminderTime || null };
  // Changer le type retire l'allure calculée (pace_zone) : on ne peut pas
  // déduire fiablement une nouvelle zone d'allure à partir d'un simple
  // libellé de type (ex: passer de "Fractionné" à "Renfo") — la séance
  // devient une séance "personnalisée" sans allure algorithmique, comme
  // une séance ajoutée manuellement. La justification affichée ET la
  // distance/allure calculées restent sinon celles de l'ANCIEN type (bug
  // constaté : passer de Mobilité à Renfo gardait le texte "mobilité", et
  // passer d'une course à du yoga gardait sa distance/allure, qui n'ont
  // plus de sens pour ce nouveau type). Pour un nouveau type non-course,
  // on ignore volontairement les champs distance/allure du formulaire
  // (même s'ils affichent encore les anciennes valeurs préremplies) : les
  // lire les aurait réappliquées telles quelles juste en dessous.
  const clearingForNonRunning = !!(newType && session && newType!==session.type && NON_RUNNING_TYPES.includes(newType));
  if(newType && session && newType!==session.type){
    patch.type = newType; patch.title = newType; patch.pace_zone = null;
    patch.rationale = CROSS_TRAINING_RATIONALE[newType] || `Séance de ${newType}, modifiée manuellement.`;
    if(clearingForNonRunning){ patch.target_distance_km = null; patch.target_pace_sec_per_km = null; }
  }
  if(session && newType && newType!==session.type){
    const clash = plannedSessions.some(o=>o.id!==id && o.planned_date===session.planned_date && (o.status==="planned"||o.status==="done") && !sessionsCanShareDay({type:newType, pace_zone:null}, o));
    if(clash){ alert(SAME_DAY_REFUSAL); return; }
  }
  if(session) warnIfDayBeforeRun(session.planned_date, newType||session.type);
  if(!clearingForNonRunning && !isNaN(distanceKm) && distanceKm>0) patch.target_distance_km = distanceKm;
  if(!clearingForNonRunning && (!isNaN(paceMin) || !isNaN(paceSec))){
    const sec = (paceMin||0)*60 + (paceSec||0);
    if(sec>0) patch.target_pace_sec_per_km = sec;
  }
  const { error } = await supa.from("planned_sessions").update(patch).eq("id", id);
  if(error){ alert("Erreur : "+error.message); return; }
  openEditForm = null;
  await loadData(); renderContent();
};
// Retire une séance du calendrier — status='skipped' plutôt qu'un vrai
// DELETE, cohérent avec le reste du Programme (jamais de suppression
// silencieuse ni de perte d'historique, voir le pattern "supersede" de

// sauf le type sont optionnels. Refuse si la nouvelle séance ne peut pas

// course... voir sessionsCanShareDay).
const SAME_DAY_REFUSAL = "On ne peut pas mettre ces deux séances le même jour : une course accepte une séance légère (yoga, mobilité, étirements), mais pas une autre course ni du renfo, pour que tu récupères entre deux efforts.";

    reminder_time: reminderTime || null,

// Une séance planifiée passe automatiquement à "faite" dès qu'une séance
// réelle synchronisée (HealthKit) existe le même jour — inutile de
// demander confirmation à l'utilisateur, la synchro fait foi. Le ressenti
// est déjà proposé ailleurs (bannière séance non notée), pas besoin de le
// redéclencher ici.
async function reconcilePlannedSessions(){
  const matchingRun = (p) => RUNS.find(r=>localDateStr(dateFromRun(r))===p.planned_date && plannedSessionMatchesRun(p, r));
  const todo = plannedSessions.filter(p=>p.status==="planned" && matchingRun(p));
  const missed = detectMissedSessions(plannedSessions, localDateStr(new Date()));
  if(!todo.length && !missed.length) return;
  for(const p of todo){
    const match = matchingRun(p);
    await supa.from("planned_sessions").update({status:"done", linked_run_id:match.id, updated_at:new Date().toISOString()}).eq("id", p.id);
    p.status = "done"; p.linked_run_id = match.id;
    if(p.generation_reason==="guided_test") await applyGuidedTestResult(match);
  }
  // Une séance dans `todo` a forcément une vraie course associée, donc ne
  // peut jamais être aussi dans `missed` (qui exige status==="planned"
  // encore intact au moment du calcul) — mais on filtre quand même par
  // sécurité si l'ordre des deux listes venait à se chevaucher un jour.
  for(const p of missed.filter(m=>!todo.includes(m))){
    await supa.from("planned_sessions").update({status:"missed", updated_at:new Date().toISOString()}).eq("id", p.id);
    p.status = "missed";
  }
  renderContent();
}
// Bannière "séance manquée" (4.3.c) : pas de vraie notification push (voir
// noRecentRunBanner ci-dessus, même limite) — ce bandeau à l'ouverture de
// Programme en fait office. "Réorganiser automatiquement" applique les
// garde-fous de 4.3.d (findRescheduleDay, logic.js) pour recaser la
// séance sur un autre jour sûr de la même semaine, ou l'abandonne si
// aucun jour ne respecte les règles.
function missedSessionsBanner(){
  const missed = plannedSessions.filter(p=>p.status==="missed" && !dismissedMissedIds().includes(p.id));
  if(!missed.length) return "";
  const p = missed[0];
  return `<div class="card" style="border-color:var(--attention-line);background:var(--attention-bg)">
    <div style="font-size:13px;font-weight:600;margin-bottom:4px">Une séance n'a pas pu se faire — ${p.title} du ${new Date(p.planned_date).toLocaleDateString('fr-FR')}</div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">Ça arrive à tout le monde. On peut réorganiser ta semaine pour la replacer, ou tu préfères garder ton plan tel quel ?</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn-secondary" onclick="openManualRun('${p.id}')">Je l'ai faite</button>

// Recase une séance manquée sur un autre jour sûr de la même semaine
// (4.3.d) — jamais le même jour qu'une autre séance, jamais collée à une
// autre séance intense (sauf en dernier recours si elle-même est une
// séance de qualité, cf findRescheduleDay). Si aucun jour ne convient,
// la séance reste "missed" (abandon, comme prévu par le CDC).
window.rescheduleMissedSession = async (id) => {
  const old = plannedSessions.find(p=>p.id===id);
  if(!old) return;
  const monday = new Date(old.week_start_date+"T00:00:00");
  const weekSessions = plannedSessions
    .filter(p=>p.id!==old.id && p.week_start_date===old.week_start_date && (p.status==="planned"||p.status==="done"))
    .map(p=>({ dayIndex: Math.round((new Date(p.planned_date+"T00:00:00")-monday)/86400000), pace_zone: p.pace_zone, type: p.type }));
  const unavailable = (goals.joursIndisponibles ? goals.joursIndisponibles.split(",") : []).map(Number);
  const availableDayIndexes = [0,1,2,3,4,5,6].filter(d=>!unavailable.includes(d));
  const isPriority = isIntensePaceZone(old.pace_zone);
  const day = findRescheduleDay({pace_zone:old.pace_zone, type:old.type}, weekSessions, availableDayIndexes, isPriority);
  if(day==null){
    alert("On n'a pas trouvé de jour pour replacer cette séance sans surcharger ta semaine (pas deux séances intenses de suite, pas deux courses le même jour). Pas de souci : on la laisse de côté cette semaine, ce qui compte c'est de retrouver ton rythme.");
    return;
  }
  const newDateStr = localDateStr(addDays(monday, day));
  const { error } = await supa.from("planned_sessions").update({planned_date:newDateStr, status:"planned", updated_at:new Date().toISOString()}).eq("id", id);
  if(error){ alert("Erreur : "+error.message); return; }
  await loadData(); renderContent();
};

};

// "Gros" juge que continuer à courir n'est pas une bonne idée du tout.
window.replaceSessionWithRenfo = async (id, sig) => {
  const old = plannedSessions.find(p=>p.id===id);
  if(!old) return;
  const { data:{user} } = await supa.auth.getUser();
  const { data: inserted, error: insErr } = await supa.from("planned_sessions").insert({

    type:"Renfo", pace_zone:null,
    title:"Renfo (à la place de la course)",
    rationale:"Cette séance de course a été remplacée par du renfo, le temps de laisser la gêne se calmer. Tu peux la modifier si elle ne te convient pas.",
    status:"planned", source:"manual_edit", generation_reason:"pain_repeat_or_wellbeing",
    replaces_session_id: old.id,
  }).select().single();

  await supa.from("planned_sessions").update({status:"replaced", superseded_by_id:inserted.id, updated_at:new Date().toISOString()}).eq("id", old.id);

// Décale toutes les séances restantes de la semaine (celles à venir,
// statut "planned") de N jours — jamais celles déjà passées/faites.
// Refuse silencieusement (laisse la séance en place) si le nouveau jour
// est déjà occupé, plutôt que d'écraser une autre séance : averti à la
// fin si certaines n'ont pas pu être décalées.
window.shiftWeekByDays = async (weekStartDate, days) => {
  const todayStr = localDateStr(new Date());
  const toShift = plannedSessions.filter(p=>p.week_start_date===weekStartDate && p.status==="planned" && p.planned_date>=todayStr);
  let skipped = 0;
  for(const p of toShift){
    const newDate = localDateStr(addDays(new Date(p.planned_date+"T00:00:00"), days));
    const occupied = plannedSessions.some(o=>o.id!==p.id && o.planned_date===newDate && (o.status==="planned"||o.status==="done") && !sessionsCanShareDay(p, o));
    if(occupied){ skipped++; continue; }
    const newMonday = localDateStr(mondayOf(new Date(newDate+"T00:00:00")));
    await supa.from("planned_sessions").update({planned_date:newDate, week_start_date:newMonday, updated_at:new Date().toISOString()}).eq("id", p.id);
  }
  await loadData(); renderContent();
  if(skipped) alert(`${skipped} séance(s) n'ont pas pu être décalées (jour déjà occupé) — à ajuster toi-même.`);
};
window.shiftWeekFromBanner = async (weekStartDate, sig) => {

// Déplace une séance à une nouvelle date (glisser-déposer) — simple UPDATE
// (pas le pattern "supersede", contrairement à regenerateSession : ici le
// contenu de la séance ne change pas, seule sa date change, donc rien à
// tracer côté contenu). Refuse si le jour cible contient une séance qui ne

window.moveSessionToDate = async (id, newDateStr) => {
  const s = plannedSessions.find(p=>p.id===id);

// Glisser-déposer par appui long (~0,5s), via Pointer Events plutôt que le
// drag-and-drop HTML5 natif — ce dernier n'est pas fiable au doigt sur
// mobile/Safari (usage principal de l'app), voir commentaire CSS .prog-board.
// Un appui court reste un simple tap (progSelectDay, via onclick) : le
// minuteur n'arme le drag qu'après le délai, et un déplacement trop rapide
// avant ce délai annule (c'est un scroll horizontal du calendrier, pas une
// intention de glisser-déposer).
let progDrag = null;
let progSuppressClick = false;
// Le geste est suivi via des listeners posés sur `document` (pointermove/up/
// cancel), PAS via setPointerCapture sur la carte d'origine : sur Safari
// iOS, la capture de pointeur en tactile n'est pas fiable — dès que le
// doigt quitte la carte, les événements peuvent partir vers l'élément situé
// dessous (qui n'a pas de handler), et le drop ne se déclenche alors jamais
// (constaté : la carte s'arme bien après l'appui long, mais rien ne bouge
// ensuite). Des listeners globaux reçoivent le geste quoi qu'il en soit.
function progDragStart(e, id){
  if(e.pointerType==="mouse" && e.button!==0) return;
  if(progDrag) progDragCancel(); // geste précédent mal terminé (rare) : on repart propre
  progDrag = { id, pointerId:e.pointerId, el:e.currentTarget, startX:e.clientX, startY:e.clientY, armed:false, ghost:null, timer:null };
  progDrag.timer = setTimeout(progArmDrag, 500);
  document.addEventListener("pointermove", progDragMove, {passive:false});
  document.addEventListener("pointerup", progDragEnd);
  document.addEventListener("pointercancel", progDragCancel);
}
function progArmDrag(){
  if(!progDrag) return;
  progDrag.armed = true;
  progDrag.el.style.touchAction = "none";
  progDrag.el.classList.add("prog-armed");
  if(navigator.vibrate) navigator.vibrate(12);
  const r = progDrag.el.getBoundingClientRect();
  const ghost = progDrag.el.cloneNode(true);
  ghost.className = progDrag.el.className.replace("prog-armed","") + " prog-ghost";
  ghost.style.width = r.width+"px";
  ghost.style.height = r.height+"px";
  ghost.style.left = r.left+"px";
  ghost.style.top = r.top+"px";
  document.body.appendChild(ghost);
  progDrag.ghost = ghost;
  progDrag.offsetX = progDrag.startX - r.left;
  progDrag.offsetY = progDrag.startY - r.top;
}
function progDragMove(e){
  if(!progDrag || e.pointerId!==progDrag.pointerId) return;
  if(!progDrag.armed){
    if(Math.hypot(e.clientX-progDrag.startX, e.clientY-progDrag.startY) > 12){
      clearTimeout(progDrag.timer);
      progDrag = null;
      document.removeEventListener("pointermove", progDragMove);
      document.removeEventListener("pointerup", progDragEnd);
      document.removeEventListener("pointercancel", progDragCancel);
    }
    return;
  }
  e.preventDefault();
  progDrag.ghost.style.left = (e.clientX - progDrag.offsetX)+"px";
  progDrag.ghost.style.top = (e.clientY - progDrag.offsetY)+"px";
  progDrag.ghost.style.display = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  progDrag.ghost.style.display = "";
  document.querySelectorAll(".prog-daycol.dragover").forEach(c=>c.classList.remove("dragover"));
  const col = under?.closest(".prog-daycol");
  if(col) col.classList.add("dragover");
}
function progDragEnd(e){
  if(!progDrag || e.pointerId!==progDrag.pointerId) return;
  document.removeEventListener("pointermove", progDragMove);
  document.removeEventListener("pointerup", progDragEnd);
  document.removeEventListener("pointercancel", progDragCancel);
  clearTimeout(progDrag.timer);
  if(!progDrag.armed){ progDrag = null; return; }
  progDrag.ghost?.remove();
  document.querySelectorAll(".prog-daycol.dragover").forEach(c=>c.classList.remove("dragover"));
  progDrag.el.classList.remove("prog-armed");
  progDrag.el.style.touchAction = "";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const col = under?.closest(".prog-daycol");
  const targetDate = col?.dataset.date;
  const id = progDrag.id;
  progDrag = null;
  progSuppressClick = true; // évite qu'un clic fantôme après le drop ne rouvre/ferme le panneau
  setTimeout(()=>{ progSuppressClick = false; }, 300);
  if(targetDate) window.moveSessionToDate(id, targetDate);
}
function progDragCancel(e){
  if(!progDrag || (e && e.pointerId!==progDrag.pointerId)) return;
  document.removeEventListener("pointermove", progDragMove);
  document.removeEventListener("pointerup", progDragEnd);
  document.removeEventListener("pointercancel", progDragCancel);
  clearTimeout(progDrag.timer);
  progDrag.ghost?.remove();
  progDrag.el.classList.remove("prog-armed");
  progDrag.el.style.touchAction = "";
  document.querySelectorAll(".prog-daycol.dragover").forEach(c=>c.classList.remove("dragover"));
  progDrag = null;
}
// Remplace une séance par une version ajustée SANS jamais supprimer
// l'ancienne (pattern "supersede", voir migration_019) : l'ancienne passe
// replaced/superseded_by_id, la nouvelle porte replaces_session_id — la
// justification affichée explique toujours pourquoi le changement a eu
// lieu, jamais de suppression silencieuse.
window.regenerateSession = async (id, reason, auto) => {
  const old = plannedSessions.find(p=>p.id===id);
  if(!old) return;
  const profile = resolveRunnerProfile(goals, programSettings, RACE_DISTANCES_KM);
  if(!profile) return;
  const zones = paceZonesFromVdot(computeVdot(profile.distanceKm, profile.timeSec));
  const softer = reason!=="Manque de temps"; // "Manque de temps" raccourcit sans changer d'intensité, les autres motifs basculent en easy
  const newZone = softer ? "easy" : old.pace_zone;
  const { data:{user} } = await supa.auth.getUser();
  const changeDesc = softer ? "remplacée par une version plus facile" : "raccourcie";
  const rationale = auto
    ? `Cette séance a été ${changeDesc} automatiquement, car ${reason}. Tu peux la modifier si elle ne te convient pas.`
    : `Cette séance a été ${changeDesc} à ta demande, car tu avais indiqué : « ${reason} ».`;
  const { data: inserted, error: insErr } = await supa.from("planned_sessions").insert({
    user_id:user.id, planned_date:old.planned_date, week_start_date:old.week_start_date,
    type: sessionRunType(newZone), pace_zone:newZone,
    title: softer ? "Sortie easy (ajustée)" : old.title,
    // 15% de réduction (palier "Petit", CDC v2 4.6.a : 10-20%) — pas 30%
    // comme avant, jugé trop sévère pour un simple ajustement automatique.
    target_distance_km: softer ? Math.round(old.target_distance_km*0.85*10)/10 : Math.round(old.target_distance_km*0.8*10)/10,
    target_pace_sec_per_km: zones[newZone],
    rationale,
    status:"planned", source:"manual_edit", generation_reason:"user_constraint",
    replaces_session_id: old.id,
  }).select().single();
  if(insErr){ alert("Erreur : "+insErr.message); return; }
  await supa.from("planned_sessions").update({status:"replaced", superseded_by_id:inserted.id, updated_at:new Date().toISOString()}).eq("id", old.id);
  await loadData(); renderContent();
};

// Palier "Petit" (CDC v2, 4.6.a) : en plus d'assouplir la séance qualité
// touchée, ajoute une séance de Mobilité ciblée sur la zone douloureuse,
// avec la liste des exercices recommandés (EXERCISE_LIBRARY, logic.js)
// affichée dans sa description. Cherche un jour libre de la semaine avec
// findRescheduleDay (4.3.d) — une Mobilité n'est jamais "intense", donc
// seule la règle "jamais 2 séances le même jour" s'applique ici. Si aucun
// jour ne convient, n'ajoute rien plutôt que de forcer un doublon sur un
// jour déjà pris.
window.addTargetedMobilitySession = async (weekStartDate, zoneKey) => {
  const exercises = exercisesForZone(zoneKey);
  if(!exercises.length) return;
  const monday = new Date(weekStartDate+"T00:00:00");
  const weekSessions = plannedSessions
    .filter(p=>p.week_start_date===weekStartDate && (p.status==="planned"||p.status==="done"))
    .map(p=>({ dayIndex: Math.round((new Date(p.planned_date+"T00:00:00")-monday)/86400000), pace_zone: p.pace_zone, type: p.type }));
  const unavailable = (goals.joursIndisponibles ? goals.joursIndisponibles.split(",") : []).map(Number);
  const availableDayIndexes = [0,1,2,3,4,5,6].filter(d=>!unavailable.includes(d));
  const day = findRescheduleDay({pace_zone:null}, weekSessions, availableDayIndexes, false);
  if(day==null) return;
  const zoneLabel = (ZONE_SHORT_LABEL[zoneKey]||zoneKey).toLowerCase();
  const description = formatExerciseList(exercises);
  const { data:{user} } = await supa.auth.getUser();
  await supa.from("planned_sessions").insert({
    user_id:user.id, planned_date: localDateStr(addDays(monday, day)), week_start_date: weekStartDate,
    type:"Mobilité", pace_zone:null,
    title:`Mobilité ciblée — ${zoneLabel}`,
    description,
    rationale:`Ajoutée automatiquement car une douleur est revenue au niveau de ${zoneLabel} — ces exercices aident à soulager cette zone. Tu peux la modifier ou l'ignorer si elle ne te convient pas.`,
    status:"planned", source:"generated", generation_reason:"pain_repeat_or_wellbeing",
  });
};

// Boucle d'ajustement légère (voir plan) : pas de cron possible dans une
// SPA statique — tout se réévalue à l'ouverture de l'onglet. Génère
// paresseusement les semaines manquantes (courante, et suivante si on est
// dimanche) et ajuste automatiquement la toute prochaine séance planifiée
// si le ressenti récent le justifie — jamais silencieusement : la carte
// affiche toujours la raison, et l'ancienne version reste consultable
// (status='replaced', jamais supprimée).
let programAdjustmentChecked = false;
async function applyProgramAdjustments(){
  if(programAdjustmentChecked) return;
  const profile = resolveRunnerProfile(goals, programSettings, RACE_DISTANCES_KM);
  if(!profile && !beginnerPlanInProgress()) return; // pas encore prêt : on retentera au prochain rendu
  programAdjustmentChecked = true;

  // Les 4 prochaines semaines (courante incluse) sont générées si elles
  // n'ont JAMAIS été touchées (aucune ligne planned_sessions du tout,
  // même "skipped") — sert la vue Mois (qui les affiche toutes en un
  // empilement) et permet de voir/planifier à l'avance sans attendre le
  // dimanche. Ne complète PAS une semaine où l'utilisateur a déjà
  // supprimé une séance : generateProgram compte les séances actives
  // (planned/done) pour décider quoi ajouter, donc une semaine "vidée à la
  // main" redeviendrait automatiquement pleine au prochain chargement si
  // on l'appelait ici (bug constaté : une séance supprimée réapparaissait
  // toute seule). Compléter volontairement reste possible via le bouton
  // "Compléter cette semaine", déclenché explicitement par l'utilisateur.
  const thisMonday = mondayOf(new Date());
  for(let w=0; w<4; w++){
    const monday = addDays(thisMonday, w*7);
    const everTouched = plannedSessions.some(p=>p.week_start_date===localDateStr(monday));
    if(!everTouched) await window.generateProgram(monday, {silent:true});
  }

  const todayStr = localDateStr(new Date());
  // pace_zone truthy uniquement : les séances complémentaires (renfo/
  // mobilité/yoga, pace_zone=null) ne sont pas soumises à l'ajustement
  // ACWR/douleur, qui suppose une allure de course (regenerateSession).
  const next = plannedSessions.filter(p=>p.status==="planned" && p.pace_zone && p.planned_date>=todayStr).sort((a,b)=>a.planned_date.localeCompare(b.planned_date))[0];
  if(!next || next.pace_zone==="easy") return; // rien à assouplir sur une séance déjà easy
  const { avoidQualityReason, painZone } = computeProgramInputs();
  if(avoidQualityReason && next.generation_reason!=="user_constraint" && next.generation_reason!=="pain_repeat_or_wellbeing" && next.generation_reason!=="acwr_high"){
    await window.regenerateSession(next.id, avoidQualityReason, true);
    // Palier "Petit" (4.6.a) : une douleur répétée (contrairement à la
    // fatigue ou l'ACWR haut, qui n'ont pas de zone précise) ajoute aussi
    // une séance de mobilité ciblée sur la zone concernée.
    if(painZone) await window.addTargetedMobilitySession(next.week_start_date, painZone);
  }
}

  const eff = efficiencyCelebration(efRuns.map(r=>({ date:localDateStr(dateFromRun(r)), allure:r.allure, fc:r.fc })), localDateStr(new Date()), lastEff);

  }
  return items.length ? { title, items, runId, effFlag } : null;
}

// première/dernière semaine) restent affichés en estompé mais restent des
// cibles de dépôt valides (ex. déplacer une séance du 30 vers le 1er).
function programMonthStackHTML(monthDate){
  const firstOfMonth = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const lastOfMonth = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0);
  const weeks = [];
  for(let cursor=mondayOf(firstOfMonth); cursor<=lastOfMonth; cursor=addDays(cursor,7)) weeks.push(new Date(cursor));
  return weeks.map(w=>`
    <div class="prog-week-label">Semaine du ${w.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div>
    ${programWeekBoardHTML(w, monthDate)}
  `).join("");
}

  };
  // Marche exclue de cette liste : jamais utilisée nulle part en aval (déjà
  // hors stats par défaut), elle ne fait qu'encombrer l'historique.
  const monthGroups = [];
  filtered.filter(r=>r.type!=="Marche").slice().reverse().forEach(r=>{
    const key = `${r.fullDate.getFullYear()}-${r.fullDate.getMonth()}`;

    if(!group || group.key!==key){
      group = {key, label:monthLabel(r.fullDate), sessions:[]};
      monthGroups.push(group);
    }
    group.sessions.push(r);
  });
  if(openMonths===null) openMonths = new Set(monthGroups.length?[monthGroups[0].key]:[]);
  const ratingBlock = (r) => !r.includeInStats ? "" : `<div style="padding:12px 0 4px;border-top:1px solid var(--border);margin-top:12px">

  return `<div class="card">

    <div class="filters">${["Tous",...TYPE_OPTIONS.filter(t=>t!=="Other" && t!=="Marche")].map(t=>`<button class="flt${activeFilter===t?" active":""}" onclick="setFilter('${t}')">${t}</button>`).join("")}</div>
    ${monthGroups.length?monthGroups.map(g=>{
      const monthOpen = openMonths.has(g.key);
      return `<div class="month-sep" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between" onclick="toggleMonthGroup('${g.key}')">
        <span>${icon(monthOpen?"chevronDown":"chevronRight",12)} ${g.label}</span>

      ${monthOpen?`<div class="${justOpenedKey==="mg_"+g.key?"expand-in":""}">${g.sessions.map(r=>{
        const open = openManageRow.has(r.id);
        return `<div class="session-pick" id="hist_${r.id}" onclick="toggleManageRow('${r.id}')">
          <span>${icon(open?"chevronDown":"chevronRight",13)} ${icon(TICON[r.type]||"activity",13)} ${r.type} · ${r.label}${r.dist>0?" · "+r.dist.toFixed(2)+" km":""}</span>

      }).join("")}</div>`:""}`;
    }).join(""):`<div style="font-size:13px;color:var(--text-dim);padding:12px 0">Aucune séance de ce type</div>`}
  </div>`;
}
