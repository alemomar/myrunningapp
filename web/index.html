function icon(name,size=18){ return ICONS[name].replace("<svg ",`<svg width="${size}" height="${size}" `); }
// En-tête commun des feuilles : sur-titre facultatif, titre Condensed, bouton × de 36 px
// (zone de toucher étendue à 44 px). `closeCall` = code appelé au toucher du ×.
function sheetHeadHTML(title, closeCall, overline){
  return `<div class="sheet-head"><div>${overline?`<div class="sheet-overline">${escHtml(overline)}</div>`:""}<div class="sheet-title">${escHtml(title)}</div></div><button class="sheet-close" type="button" aria-label="Fermer" onclick="${closeCall}">${icon("x",16)}</button></div>`;
}
// Message blanc en bas de l'écran, 3 s. Les erreurs et pannes restent sobres (jamais rouge ni violet).
let toastTimer = null;
// `opts` : { actionLabel, onAction, ms } — ex. « Annuler » pendant 5 s après une suppression.
window.toast = (message, opts) => {
  const root = document.getElementById("toastRoot");
  if(!root) return;
  const o = opts || {};
  root.innerHTML = `<div class="toast${o.actionLabel?" has-action":""}" role="status">${o.icon?icon(o.icon,16):""}<span>${escHtml(message)}</span>${o.actionLabel?`<button type="button" class="toast-action">${escHtml(o.actionLabel)}</button>`:""}</div>`;
  const el = root.firstChild;
  const hide = () => { el.classList.remove("show"); setTimeout(()=>{ if(root.firstChild===el) root.innerHTML=""; }, 250); };
  if(o.actionLabel) el.querySelector(".toast-action").onclick = () => { clearTimeout(toastTimer); hide(); if(o.onAction) o.onAction(); };
  requestAnimationFrame(()=>el.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hide, o.ms || 3000);
};

function mapRow(r){
  const d=new Date(r.start_date);
  const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0");
  return {
    id:r.id,
    date:`${dd}/${mm}`,
    // Date complète (avec année) conservée à part : `date` (dd/mm) seul ne
    // suffit pas pour reconstruire une année fiable au-delà de l'année en
    // cours — voir dateFromRun().
    fullDate:d,
    label:`${dd} ${MONTHS[d.getMonth()]}`,
    time:d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
    type:normalizeSessionType(r.type)||"Other",
    appleType:r.apple_type||null,
    lieu:r.lieu||"",
    dist:Number(r.distance_km)||0,
    dur:fmtDur(r.duration_sec),
    durationSec:Number(r.duration_sec)||0,
    allure:r.distance_km>0?Math.round(r.duration_sec/r.distance_km):null,
    fc:r.avg_hr||null,
    peakHr:r.peak_hr||null,
    pw:r.avg_power||null,
    cad:r.avg_cadence||null,
    cal:r.calories||null,
    effort:r.effort||null,
    notes:r.notes||undefined,
    includeInStats: r.include_in_stats !== false,
    legsFocused: r.legs_focused === null || r.legs_focused === undefined ? null : !!r.legs_focused,
    painRatings: r.pain_ratings || null,
    hrSeries: r.hr_series || null,
    paceSeries: r.pace_series || null,
    lapMarkers: r.lap_markers || null,
    fracWorkManual: r.frac_work_manual || null,
    fracRecoveryManual: r.frac_recovery_manual || null,
  };
}

/* ---------- Auth ---------- */
// Étapes : connexion, création de compte, code reçu par e-mail (confirmation d'adresse, D100), « mot de passe oublié » puis
// nouveau mot de passe (D101). Tout se passe dans l'app : le code se recopie ici, aucun lien à ouvrir dans un navigateur
// (iOS ouvre les liens dans le navigateur par défaut, jamais dans l'app installée, dont la connexion est séparée). Le mot de
// passe tapé reste en mémoire (jamais écrit sur l'appareil) le temps de l'étape « code » : si l'adresse a été confirmée par le
// lien resté dans l'e-mail, l'app se connecte toute seule au retour.
const auth = { step:"signin", email:"", password:"", code:"", notice:"", error:"", busy:false, sentAt:0, verified:false };
const AUTH_ICON_MAIL = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;
const AUTH_ICON_LOCK = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
let authTimer = null;
// Adresse où mène un lien de Supabase : sans elle, Supabase renvoie vers le domaine seul (https://alemomar.github.io/), page 404.
const authRedirectUrl = () => location.origin + location.pathname;
const authAttr = (t) => escHtml(t).replace(/"/g, "&quot;");     // pour value="…" : escHtml ne protège pas les guillemets
function isStandalone(){
  try{ return window.navigator.standalone===true || window.matchMedia("(display-mode: standalone)").matches; }catch(e){ return false; }
}
// Premier écran quand personne n'est connecté : « Installe l'app » (iPhone ou iPad, hors de l'app installée, tant qu'on ne l'a
// pas écarté), sinon la connexion (D99).
const AUTH_PENDING_KEY = "mra_authPending";
function clearAuthPending(){ try{ localStorage.removeItem(AUTH_PENDING_KEY); }catch(e){} }
// Étape « code » ou « mot de passe oublié » écrite à chaque affichage, pour être reprise si l'app est rechargée pendant qu'on lit son e-mail.
function savePendingAuth(){
  try{
    if((auth.step==="code" || auth.step==="reset") && auth.sentAt>0 && validEmail(auth.email)) localStorage.setItem(AUTH_PENDING_KEY, JSON.stringify({ step:auth.step, email:auth.email.trim(), sentAt:auth.sentAt }));
    else localStorage.removeItem(AUTH_PENDING_KEY);
  }catch(e){}
}
function restoreAuthPending(){
  let raw = null; try{ raw = localStorage.getItem(AUTH_PENDING_KEY); }catch(e){}
  const p = pendingAuthFrom(raw, Date.now());
  if(!p){ if(raw) clearAuthPending(); return false; }
  Object.assign(auth, { step:p.step, email:p.email, sentAt:p.sentAt, code:"", password:"", error:"", notice:"", verified:false });
  return true;
}
function showAuthEntry(){
  document.getElementById("appView").style.display = "none";
  let skipped = false; try{ skipped = localStorage.getItem("mra_installSkipped")==="1"; }catch(e){}
  const pending = restoreAuthPending();
  const ctx = detectInstallContext(navigator.userAgent, isStandalone(), navigator.maxTouchPoints);
  if(authEntryView(ctx, skipped, pending)==="install") showInstall(ctx); else showAuth();
}
function installHTML(g){
  const steps = g.steps.map((st,i)=>`<div class="in-step"><span class="ic">${icon(st.icon,22)}</span><div><span class="k">Étape ${i+1}</span><b>${escHtml(st.title)}</b><small>${escHtml(st.hint)}</small></div></div>`).join("");
  const warn = g.inApp ? `<div class="on-warn" role="status"><div class="hd">${icon("alert",18)}<b>Tu es dans le navigateur d'une autre app</b></div><div class="tx">Instagram, Facebook et les autres ne permettent pas d'installer MyRunningApp. Ouvre ce lien dans Safari ou Chrome.</div><div class="pf-chips"><button type="button" class="pf-chip" id="installCopy" onclick="installCopyLink()">Copier le lien</button></div></div>` : "";
  return `<div class="on-screen">
    <div class="on-logo"><img class="auth-logo" src="logo/logo-vertical-couleur.svg" alt="MyRunningApp" width="220" height="136" style="margin-bottom:0"></div>
    <div class="on-head"><div class="on-title">Installe l'app sur ton écran d'accueil</div><div class="on-sub">Elle s'ouvre alors comme une vraie app, en plein écran, et tu y restes connecté.</div></div>
    <div class="on-body">${warn}${g.inApp ? "" : `<div class="in-steps">${steps}</div>`}</div>
    <div class="on-foot">${g.inApp ? "" : `<div class="on-hint">Une fois l'app ajoutée, ouvre-la depuis ton écran d'accueil : c'est là que tu crées ton compte.</div>`}
      <button type="button" class="btn-secondary on-second" onclick="installSkip()">Continuer dans le navigateur</button></div></div>`;
}
function showInstall(ctx){
  document.getElementById("installView").innerHTML = installHTML(installGuide(ctx));
  document.getElementById("installView").style.display = "block";
  document.getElementById("authView").style.display = "none";
}
window.installSkip = () => { try{ localStorage.setItem("mra_installSkipped","1"); }catch(e){} showAuth(); };
window.installCopyLink = async () => {
  const b = document.getElementById("installCopy");
  try{ await navigator.clipboard.writeText(location.href.split("#")[0].split("?")[0]); if(b) b.textContent = "Lien copié"; }
  catch(e){ if(b) b.textContent = "Copie l'adresse dans la barre du navigateur"; }
};
function showAuth(){
  document.getElementById("installView").style.display = "none";
  document.getElementById("authView").style.display = "flex";
  renderAuth();
}
function authEmailField(ac){
  return `<div class="field">${AUTH_ICON_MAIL}<input id="authEmail" type="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Email" aria-label="Adresse e-mail" autocomplete="${ac}" value="${authAttr(auth.email)}" oninput="authSet('email', this.value)" onkeydown="authKey(event)"></div>`;
}
function authPasswordField(ac, ph){
  return `<div class="field">${AUTH_ICON_LOCK}<input id="authPassword" type="password" placeholder="${ph}" aria-label="${ph}" autocomplete="${ac}" value="${authAttr(auth.password)}" oninput="authSet('password', this.value)" onkeydown="authKey(event)"></div>`;
}
function authOtpField(){
  return `<div class="field otp"><input id="authOtp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="one-time-code" placeholder="······" aria-label="Code reçu par e-mail" value="${authAttr(auth.code)}" oninput="authOtpInput(this)" onkeydown="authKey(event)"></div>`;
}
function renderAuth(){
  const body = document.getElementById("authBody"); if(!body) return;
  const st = auth.step, dis = auth.busy ? " disabled" : "";
  const msgs = `<div id="authNotice" role="status">${escHtml(auth.notice)}</div><div id="authError" role="alert">${escHtml(auth.error)}</div>`;
  const btn = (label) => `<button type="button" class="btn-primary" id="authBtn" onclick="authSubmit()"${dis}>${label}</button>`;
  let html;
  if(st==="signin" || st==="signup"){
    const up = st==="signup";
    html = `<div class="tagline">Suis tes courses, simplement.</div>
      ${authEmailField(up?"email":"username")}${authPasswordField(up?"new-password":"current-password", "Mot de passe")}
      ${up ? `<div class="auth-hint">6 caractères minimum.</div>` : ""}
      ${btn(up?"Créer le compte":"Se connecter")}${msgs}

  updateResendLabel(); manageAuthTimer(); savePendingAuth();
  // Le clavier numérique s'ouvre tout de suite sur l'étape « code » ; sinon on ne force rien (pas de clavier au chargement).
  const focusId = (st==="code" || st==="reset") ? (auth.verified ? "authPassword" : "authOtp") : (st==="forgot" && !auth.email ? "authEmail" : "");

function manageAuthTimer(){
  const need = (auth.step==="code" || auth.step==="reset") && resendWait(auth.sentAt, Date.now())>0;
  if(need && !authTimer) authTimer = setInterval(()=>{ updateResendLabel(); if(resendWait(auth.sentAt, Date.now())===0){ clearInterval(authTimer); authTimer = null; } }, 1000);
  if(!need && authTimer){ clearInterval(authTimer); authTimer = null; }
}

window.authGo = (step) => {

async function authDone(){

window.authSubmit = async () => {
  if(auth.busy) return;
  const email = auth.email.trim(), st = auth.step;
  auth.error = ""; auth.notice = "";
  const stop = (text) => { auth.error = text; auth.busy = false; renderAuth(); };
  if((st==="signin" || st==="signup" || st==="forgot") && !validEmail(email)) return stop("Entre une adresse e-mail valide.");
  if(st==="signin"){
    if(!auth.password) return stop("Entre ton mot de passe.");
    auth.busy = true; renderAuth();
    const { error } = await supa.auth.signInWithPassword({ email, password:auth.password });
    auth.busy = false;
    if(!error) return authDone();
    const info = authErrorInfo(error);
    if(info.kind==="not_confirmed"){ Object.assign(auth, { step:"code", code:"", sentAt:0 }); return renderAuth(); }
    return stop(info.text);
  }
  if(st==="signup"){
    if(auth.password.length<6) return stop("Choisis un mot de passe d'au moins 6 caractères.");
    auth.busy = true; renderAuth();
    const { data, error } = await supa.auth.signUp({ email, password:auth.password, options:{ emailRedirectTo:authRedirectUrl() } });
    auth.busy = false;
    const out = signUpOutcome(data, error);
    if(out==="error") return stop(authErrorInfo(error).text);
    if(out==="session") return authDone();          // confirmation par e-mail désactivée côté Supabase
    if(out==="exists"){ Object.assign(auth, { step:"signin", notice:"Un compte existe déjà avec cette adresse : connecte-toi." }); return renderAuth(); }
    Object.assign(auth, { step:"code", code:"", sentAt:Date.now() });
    return renderAuth();
  }
  if(st==="code"){
    if(!otpComplete(auth.code)) return stop("Entre le code reçu par e-mail.");
    auth.busy = true; renderAuth();
    let res = await supa.auth.verifyOtp({ email, token:auth.code, type:"email" });
    if(res.error) res = await supa.auth.verifyOtp({ email, token:auth.code, type:"signup" });
    if(res.error && auth.password){
      // L'adresse a peut-être déjà été confirmée par le lien de l'e-mail : le mot de passe suffit alors.
      const si = await supa.auth.signInWithPassword({ email, password:auth.password });
      if(!si.error) res = si;
    }
    auth.busy = false;
    if(res.error) return stop(authErrorInfo(res.error).text);
    return authDone();
  }
  if(st==="forgot"){
    auth.busy = true; renderAuth();
    const { error } = await supa.auth.resetPasswordForEmail(email);
    auth.busy = false;
    if(error) return stop(authErrorInfo(error).text);
    Object.assign(auth, { step:"reset", code:"", password:"", sentAt:Date.now(), verified:false });
    return renderAuth();
  }
  if(st==="reset"){
    if(!auth.verified && !otpComplete(auth.code)) return stop("Entre le code reçu par e-mail.");
    if(auth.password.length<6) return stop("Choisis un mot de passe d'au moins 6 caractères.");
    auth.busy = true; renderAuth();
    if(!auth.verified){
      const v = await supa.auth.verifyOtp({ email, token:auth.code, type:"recovery" });
      if(v.error) return stop(authErrorInfo(v.error).text);
      auth.verified = true;
    }
    const u = await supa.auth.updateUser({ password:auth.password });
    auth.busy = false;
    if(u.error) return stop(authErrorInfo(u.error).text);       // le code est déjà utilisé : on ne le redemande pas
    await authDone(); toast("Mot de passe changé.");
  }
};
window.authResend = async () => {
  if(auth.busy) return;
  const wait = resendWait(auth.sentAt, Date.now());
  if(wait>0){ auth.error = `Patiente ${wait} secondes avant de redemander un code.`; return renderAuth(); }
  const email = auth.email.trim();
  auth.error = ""; auth.notice = ""; auth.busy = true; renderAuth();
  const { error } = auth.step==="reset" ? await supa.auth.resetPasswordForEmail(email) : await supa.auth.resend({ type:"signup", email, options:{ emailRedirectTo:authRedirectUrl() } });
  auth.busy = false;
  if(error){
    const info = authErrorInfo(error);
    if(info.kind==="wait") auth.sentAt = Date.now() - (RESEND_COOLDOWN_SEC - info.wait)*1000;
    auth.error = info.text; return renderAuth();
  }
  auth.sentAt = Date.now(); auth.notice = "Nouveau code envoyé."; renderAuth();
};

});

// numérique dans TABS) : un index se serait décalé silencieusement vers
// le mauvais onglet le jour où TABS serait réordonné (ex: Programme passé
// en 2e position) — déjà arrivé une fois, corrigé une bonne fois pour
// toutes. OLD_TAB_INDEX_TO_KEY migre l'ancien format (index numérique,
// utilisateurs existants) vers la clé correspondante à l'ORDRE D'ORIGINE
// des onglets, pas leur position actuelle.
// 3.c : Dashboard, Séances et Ressenti sont fusionnés dans "progression" ;

const VALID_TAB_KEYS = ["aujourdhui","programme","progression","profil"];
const LEGACY_TAB_KEYS = { dashboard:"progression", ressenti:"progression", seances:"progression", objectifs:"profil", compte:"profil" };

function resolveTabKey(saved){
  let key = saved;
  const idx = Number(saved);
  if(!VALID_TAB_KEYS.includes(key) && !LEGACY_TAB_KEYS[key] && Number.isInteger(idx) && OLD_TAB_INDEX_TO_KEY[idx]) key = OLD_TAB_INDEX_TO_KEY[idx];
  if(PROFIL_SECTIONS.includes(key)) profilSection = key;
  if(LEGACY_TAB_KEYS[key]) key = LEGACY_TAB_KEYS[key];
  return VALID_TAB_KEYS.includes(key) ? key : null;
}

function flashSaved(elId, text="Enregistré"){
  const el = document.getElementById(elId);

  el.innerHTML = `<svg class="check-draw" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>${escHtml(text)}`;

// enregistré, et rien ne le signale (cause probable du bug "ça n'enregistre

async function upsertProfile(fields){
  const { data: { user }, error: authError } = await supa.auth.getUser();
  if(authError || !user){ toast("Ta session a expiré. Recharge la page et reconnecte-toi.", { actionLabel:"Recharger", onAction:()=>location.reload(), ms:10000 }); return false; }
  const { error } = await supa.from("profiles").upsert({ user_id: user.id, ...fields });
  // Écriture en échec : on la garde pour la rejouer telle quelle, puis on recharge (l'écran n'avait pas été mis à jour).
  if(error) toastRetry("Pas enregistré, vérifie ta connexion.", async ()=>{ if(await upsertProfile(fields)){ await loadData(); renderContent(); toast("Enregistré."); } });
  return !error;
}
async function updateRun(id, fields){
  const { error } = await supa.from("runs").update(fields).eq("id", id);
  if(error) toastRetry("Pas enregistré, vérifie ta connexion.", async ()=>{ if(await updateRun(id, fields)){ await loadData(); renderContent(); toast("Enregistré."); } });
  return !error;
}

// Semaines restantes avant la course, affichées en direct sous la date.
function weeksUntilText(dateStr){
  if(!dateStr) return "";
  const diffDays = Math.ceil((new Date(dateStr) - new Date())/86400000);
  if(diffDays<0) return "Date déjà passée";
  const weeks = Math.ceil(diffDays/7);
  return weeks===0 ? "C'est cette semaine !" : `Il te reste ${weeks} semaine${weeks>1?"s":""}`;
}

function migrateGoals(g){

  if(field==="objectifPrincipal"){
    captureSharedFields();

  });

  if(field==="pbExistant"){

    if(block) block.style.display = (value==="Oui") ? "" : "none";

  if(field==="objectifChrono"){

  if(field==="vmaConnue"){

// Temps visé et allure visée se calculent l'un à partir de l'autre (avec
// la distance choisie juste au-dessus) — seul le temps est enregistré
// (goal_tempsH/M/S), l'allure n'est qu'une vue pratique dessus.
function updateRacePaceGoal(){
  const dist = document.getElementById("goal_distanceCourse")?.value;
  const km = RACE_DISTANCES_KM[dist];
  const h = parseInt(document.getElementById("goal_tempsH")?.value,10)||0;
  const m = parseInt(document.getElementById("goal_tempsM")?.value,10)||0;
  const totalSec = h*3600+m*60;
  const disp = document.getElementById("raceAllureVisee_display");
  const hidden = document.getElementById("goal_raceAllureVisee");
  if(!disp) return;
  if(km && totalSec>0){
    const pace = Math.round(totalSec/km);
    disp.textContent = fmtA(pace);
    if(hidden) hidden.value = pace;
  } else {
    disp.textContent = "—";
    if(hidden) hidden.value = "";
  }
}
window.updateRacePaceGoal = updateRacePaceGoal;

// Sens inverse : ajuster l'allure visée (stepper ±5s/km) recalcule le
// temps visé (h/min, arrondi à la minute — pas de secondes à afficher)
// à partir de la distance choisie.
window.adjustRaceAllureGoal = (delta) => {
  const km = RACE_DISTANCES_KM[document.getElementById("goal_distanceCourse")?.value];
  if(!km) return;
  const hidden = document.getElementById("goal_raceAllureVisee");
  let pace = parseInt(hidden?.value, 10);
  if(!pace){
    const h = parseInt(document.getElementById("goal_tempsH")?.value,10)||0;
    const m = parseInt(document.getElementById("goal_tempsM")?.value,10)||0;
    const totalSec = h*3600+m*60;
    pace = totalSec>0 ? Math.round(totalSec/km) : 300;
  }
  pace = Math.max(120, Math.min(900, pace+delta));
  if(hidden) hidden.value = pace;
  const disp = document.getElementById("raceAllureVisee_display");
  if(disp) disp.textContent = fmtA(pace);
  const totalMin = Math.round(pace*km/60);
  const hEl = document.getElementById("goal_tempsH"), mEl = document.getElementById("goal_tempsM");
  if(hEl) hEl.value = Math.floor(totalMin/60) || "";
  if(mEl) mEl.value = (totalMin%60) || "";
  saveGoals();
};

/* ---------- Saisie à la main d'une séance faite sans montre (chantier 2) ----------
   Deux entrées : "J'ai fait cette séance" (séance prévue ou à replacer) et
   "+ Ajouter une séance réalisée" (historique de Progression). La feuille
   vit dans #sheetRoot, hors de #content : les rendus de l'app (entretien du
   programme, etc.) ne la réinitialisent pas. */
let manualRunForm = null;
const MANUAL_RUN_TYPES = SESSION_TYPES_DONE;
// N1a « J'ai fait cette séance » (séance prévue : date, type, distance et durée préremplis) et N1b « Ajouter une séance
// réalisée » (rien de prérempli). Le ressenti se remplit dans la même feuille (difficulté, gêne ou douleur, carte du corps).
// Un doublon possible ou des chiffres surprenants s'affichent dans la feuille (carte violette) : ils ne bloquent pas.
window.openManualRun = (sessionId) => {
  const todayStr = localDateStr(new Date());
  const s = sessionId ? plannedSessions.find(p=>p.id===sessionId) : null;
  let durationMin = 0;
  if(s && s.target_duration_min) durationMin = Math.round(s.target_duration_min);
  else if(s && s.target_distance_km && s.target_pace_sec_per_km) durationMin = Math.round(s.target_distance_km*s.target_pace_sec_per_km/60);
  manualRunForm = {
    sessionId: s ? s.id : null,

window.saveManualRun = async () => {
  const f = manualRunForm;
  if(!f || f.saving) return;
  const showError = (msg) => { f.error = msg; const el = document.getElementById("mrError"); if(el) el.textContent = msg; };
  const todayStr = localDateStr(new Date());
  const input = manualRunInput(f);
  const { errors } = validateManualRun(input, todayStr);
  if(errors.length){ showError(errors.join(" ")); return; }
  f.saving = true;
  const saveBtn = document.getElementById("mrSave"); if(saveBtn) saveBtn.disabled = true;
  const { data:{user} } = await supa.auth.getUser();
  if(!user){ f.saving = false; if(saveBtn) saveBtn.disabled = false; showError("Tu n'es plus connecté : reconnecte-toi."); return; }
  // Pas d'heure de départ à saisir : on prend l'heure de la saisie (le jour choisi) ; deux saisies à la même seconde se décalent d'une seconde.
  const rated = isRunningRunType(f.type) && f.rating.sliders.rpe!=null;
  const ratings = rated ? buildPainRatings({ sliders:f.rating.sliders, gene:f.rating.gene, zones:f.rating.zones }) : null;
  let data = null, error = null;
  for(let attempt=0; attempt<3; attempt++){
    const row = manualRunRow(input, user.id, new Date(Date.now()+attempt*1000));
    if(ratings) row.pain_ratings = ratings;
    ({ data, error } = await supa.from("runs").insert(row).select("id").single());
    if(!error || error.code!=="23505") break;
  }
  if(error){
    f.saving = false; if(saveBtn) saveBtn.disabled = false;
    showError("Pas enregistrée, vérifie ta connexion.");
    return;
  }
  const newId = data.id, sessionId = f.sessionId;
  if(sessionId) await supa.from("planned_sessions").update({status:"done", linked_run_id:newId, updated_at:new Date().toISOString()}).eq("id", sessionId);
  closeManualRun();
  await loadData();
  const planned = sessionId ? plannedSessions.find(p=>p.id===sessionId) : null;
  if(planned && planned.generation_reason==="guided_test"){
    const run = RUNS.find(r=>r.id===newId);
    if(run) await applyGuidedTestResult(run);
  }
  await runProgramMaintenance(); // rapproche aussi les autres séances prévues du même jour
  renderContent();
  painFollowUpToast(ratings || {}, "Séance enregistrée.");
};

function lsJson(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)||"null") ?? fallback; }catch(e){ return fallback; } }

async function mergeManualIntoSynced(manualId, syncedId){
  const m = RUNS.find(r=>r.id===manualId), s = RUNS.find(r=>r.id===syncedId);
  if(!m || !s) return false;
  const patch = mergedRunPatch(m, s);
  if(Object.keys(patch).length){
    const { error } = await supa.from("runs").update(patch).eq("id", syncedId);
    if(error) return false;
  }
  // Le lien avec la séance prévue passe sur la course de la montre avant de
  // supprimer la saisie (sinon la séance perdrait son lien).
  await supa.from("planned_sessions").update({ linked_run_id:syncedId, updated_at:new Date().toISOString() }).eq("linked_run_id", manualId);
  const { error } = await supa.from("runs").delete().eq("id", manualId);
  if(error) return false;
  lsSetJson("mra_mergeNotices", [...lsJson("mra_mergeNotices", []), { label:m.label }].slice(-5));
  return true;
}

  let changed = false;
  for(const pair of auto){ if(await mergeManualIntoSynced(pair.manualId, pair.syncedId)) changed = true; }
  if(changed) await loadData();
  return changed;
}

// Copie défensive : certains appelants font des calculs style
// `new Date(dateFromRun(r)).setDate(...)` — ne jamais renvoyer la même
// instance de Date que celle stockée sur la séance, pour ne pas la muter.
function dateFromRun(r){ return new Date(r.fullDate); }

function periodStats(period){
  const now=new Date();
  const start = period==="weekly"
    ? (()=>{ const d=new Date(now); d.setDate(now.getDate()-7); return d; })()
    : new Date(now.getFullYear(), now.getMonth(), 1);
  const runs = runningRuns.filter(r=>dateFromRun(r)>=start && r.dist>0);
  const dist = runs.reduce((a,r)=>a+r.dist,0);
  const time = runs.reduce((a,r)=>{const[h,m,s]=r.dur.split(":").map(Number);return a+(r.dur.split(":").length===3?h*3600+m*60+s:h*60+m);},0);
  const withPace = runs.filter(r=>r.allure);
  const avgPace = withPace.length ? Math.round(withPace.reduce((a,r)=>a+r.allure,0)/withPace.length) : null;
  const longMax = runs.length ? Math.max(...runs.map(r=>r.dist)) : 0;
  const withHr = runs.filter(r=>r.fc);
  const avgFc = withHr.length ? Math.round(withHr.reduce((a,r)=>a+r.fc,0)/withHr.length) : null;
  return { runs, dist, time, avgPace, longMax, avgFc };
}

// Repères "où tu en es" pour l'onglet Objectifs (voir situationStats) :
// des fenêtres glissantes plutôt que le mois calendaire de periodStats,
// pour ne pas donner un chiffre tronqué en tout début de mois.
function recentWeeklyFrequency(){
  const start = new Date(); start.setDate(start.getDate()-28);
  const recent = runningRuns.filter(r=>dateFromRun(r)>=start);
  return recent.length ? Math.round(recent.length/4*10)/10 : null;
}
function recentEfPace(){
  const recent = efRuns.filter(r=>r.allure).slice(-5);
  return recent.length ? Math.round(recent.reduce((a,r)=>a+r.allure,0)/recent.length) : null;
}
function recentIntensiveFrequency(){
  const start = new Date(); start.setDate(start.getDate()-28);
  const recent = runningRuns.filter(r=>dateFromRun(r)>=start && (r.type==="Fractionné"||r.type==="Seuil"));
  return recent.length ? Math.round(recent.length/4*10)/10 : null;
}
function daysSinceLastRun(){
  if(!runningRuns.length) return null;
  return Math.floor((new Date() - dateFromRun(runningRuns[runningRuns.length-1]))/86400000);
}
function recentMonthlyVolume(){
  const start = new Date(); start.setMonth(start.getMonth()-3);
  const recent = runningRuns.filter(r=>dateFromRun(r)>=start && r.dist>0);
  return recent.length ? Math.round(recent.reduce((a,r)=>a+r.dist,0)/3) : null;
}
// Repères chiffrés propres à l'objectif choisi, affichés en lecture seule
// juste après le type d'objectif — pour situer la cible qu'on va demander
// par rapport à la réalité plutôt que de viser dans le vide. Un seul bloc
// dédié plutôt que des repères éparpillés dans chaque champ : plus facile
// à scanner, et ça reste vrai si on ajoute d'autres repères plus tard.
function situationStats(objectifType){
  const na = "pas encore assez de données";
  switch(objectifType){
    // Pas de bloc pour "Préparer une course" ni "Améliorer mon allure" :
    // le temps/allure visés (ou l'allure cible juste en dessous) suffisent
    // déjà, pas la peine d'un second bloc à côté.
    case "Courir plus régulièrement": {
      const f = recentWeeklyFrequency();
      return [["Fréquence actuelle (4 dernières semaines)", f!=null?f+" séance(s)/semaine":na]];
    }
    case "Reprendre après une pause/blessure": {
      const d = daysSinceLastRun();
      return [["Dernière séance", d!=null?(d===0?"Aujourd'hui":d+" jour(s)"):"Aucune séance enregistrée"]];
    }
    case "Rester en forme": {
      const vol = recentMonthlyVolume(), f = recentWeeklyFrequency();
      return [
        ["Volume moyen (3 derniers mois)", vol!=null?vol+" km/mois":na],
        ["Fréquence actuelle (4 dernières semaines)", f!=null?f+" séance(s)/semaine":na],
      ];
    }
    default: return [];
  }
}

const fmtKm1 = (v) => Number(v).toLocaleString("fr-FR", { maximumFractionDigits:1 });
function sinceDateText(startMonday){
  const d = parseDay(startMonday);
  return `${d.getDate()===1?"1er":d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;

function ringHTML(color, pct, animate, aria){
  return `<svg width="52" height="52" viewBox="0 0 52 52" role="img" aria-label="${escHtml(aria)}"><circle cx="26" cy="26" r="23" fill="none" stroke="var(--line)" stroke-width="6"/><circle class="fg" cx="26" cy="26" r="23" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="${Math.max(pct, pct>0?1:0)} 100"/></svg>`;

function objectiveCardHTML(){
  const slot = goals.principal || {};
  const type = slot.objectifPrincipal;
  if(!type){
    return `<div class="pg-card"><div class="pg-obj-top"><span class="pg-over">Objectif principal</span></div>
      <div class="pg-obj-title" style="color:var(--text-faint)">Pas encore d'objectif</div>
      <div class="pg-sub"><span>Choisis ce que tu veux atteindre : ton programme et ces chiffres s'y adaptent.</span></div>
      <button type="button" class="btn-secondary" onclick="setTab('objectifs')">Choisir mon objectif</button></div>`;
  }
  const today = new Date(), todayStr = localDateStr(today), todayTs = today.getTime();
  const variant = objectiveVariant(type);
  const start = programStartMonday(plannedSessions);
  const weekNum = programWeekNumber(start, todayStr);
  const since = start && weekNum ? `Semaine ${weekNum} du programme · depuis le ${sinceDateText(start)}` : "";
  const animate = playOnce("prog_objective");
  let title = type.toUpperCase(), block = "";
  if(variant==="race"){
    const dist = (slot.distanceCourse||"").replace(/(\d)km$/, "$1 km");
    const dateTxt = slot.dateCible ? parseDay(slot.dateCible).toLocaleDateString("fr-FR", { weekday:"short", day:"numeric", month:"short" }) : "";
    title = [dist, dateTxt].filter(Boolean).join(" · ") || "Préparer une course";
    const rp = raceProgress(start, slot.dateCible, todayStr);
    if(rp && rp.past) block = `<div class="pg-sub"><span>La date de ta course est passée.</span></div>`;
    else if(rp && rp.totalWeeks) block = `<div class="pg-block"><div class="pg-bar${animate?" anim":""}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${rp.pct}" aria-label="Semaine ${rp.week} sur ${rp.totalWeeks}"><i style="width:${rp.pct}%"></i></div><div class="pg-sub"><span>Semaine ${rp.week} sur ${rp.totalWeeks}</span><span>${rp.daysLeft===0?"Jour J":"J-"+rp.daysLeft}</span></div></div>`;
    else if(rp) block = `<div class="pg-sub"><span>${rp.daysLeft===0?"Jour J":"J-"+rp.daysLeft}</span></div>`;
    else if(since) block = `<div class="pg-sub"><span>${escHtml(since)}</span></div>`;
  } else if(variant==="pace"){
    const efPts = efRuns.filter(r=>r.allure).map(r=>({ ts:dateFromRun(r).getTime(), value:r.allure }));
    const p = efPaceSinceStart(efPts, start, todayTs);
    block = p.status==="ok"
      ? `<div class="pg-block"><div class="pg-pace"><span class="a">${fmtA(Math.round(p.firstAvg))}</span>${icon("arrowRight",16)}<span class="b">${fmtA(Math.round(p.lastAvg))}</span><small>/km en EF</small></div><div class="pg-sub"><span>Départ → 4 dernières semaines${since?" · "+escHtml(since):""}</span></div></div>`
      : `<div class="pg-block"><div class="pg-sub"><span>Pas encore assez de recul pour comparer ton allure EF.${since?" "+escHtml(since)+".":""}</span></div></div>`;
  } else if(variant==="streak"){
    const st = weeklyStreak(runningRuns.map(r=>localDateStr(dateFromRun(r))), todayStr, 8);
    const msg = st.streak>0 ? `<b>${st.streak} semaine${st.streak>1?"s":""} d'affilée</b> avec au moins une course` : "Une course cette semaine pour démarrer ta série";
    block = `<div class="pg-block"><div class="pg-dots" aria-hidden="true">${st.dots.map(d=>`<i class="${d?"":"off"}"></i>`).join("")}</div><div class="pg-sub"><span>${msg}</span>${weekNum?`<span>Sem. ${weekNum}</span>`:""}</div></div>`;
  }
  // Anneaux : km et séances du mois ; pas d'objectif chiffré, pas d'anneau (journal 5).
  const monthS = periodStats("monthly");
  const kmGoal = goals.kmMensuel ? Number(goals.kmMensuel) : null;
  const sessGoal = goals.frequence ? Math.round(Number(goals.frequence)*4.33) : null;
  const kmRing = ringModel(Math.round(monthS.dist*10)/10, kmGoal), sessRing = ringModel(monthS.runs.length, sessGoal);
  const rings = [];
  if(kmRing) rings.push(`<div class="pg-ring${animate?" anim":""}">${ringHTML("var(--accent)", kmRing.pct, animate, `Km ce mois : ${fmtKm1(kmRing.value)} sur ${kmRing.goal}`)}<div><div class="v">${fmtKm1(kmRing.value)} km</div><div class="s">sur ${kmRing.goal} · ce mois</div></div></div>`);
  if(sessRing) rings.push(`<div class="pg-ring${animate?" anim":""}">${ringHTML("var(--data-cyan)", sessRing.pct, animate, `Séances ce mois : ${sessRing.value} sur ${sessRing.goal}`)}<div><div class="v">${sessRing.value} séance${sessRing.value>1?"s":""}</div><div class="s">sur ${sessRing.goal} · ce mois</div></div></div>`);
  return `<div class="pg-card" id="progObjective">
    <div class="pg-obj-top"><span class="pg-over">Objectif principal</span><span class="pg-badge">Principal</span></div>
    <div class="pg-obj-title">${escHtml(title)}</div>
    ${block}
    ${rings.length?`<div class="pg-sep"></div><div class="pg-rings">${rings.join("")}</div>`:""}
  </div>`;
}

// ---------- Graphiques de Progression (S6.3, design 6) : SVG maison ----------
// Courbes dans le temps (allure EF, fractionné, efficience) : période, progression, ligne du coach, curseur qui
// avance de séance en séance, bulle sur le point. Barres par mois (volume, facile / soutenu). Les modèles sont
// recalculés à chaque changement ; seule la zone du dessin et le texte sont redessinés pendant qu'on glisse le curseur.
const progChartState = {};   // clé → { period, index }
const CH_H = 170, CH_L = 34, CH_R = 8, CH_T = 10, CH_B = 148;
const chartW = () => { const c = document.getElementById("content"); return Math.max(240, Math.min(520, (c ? c.clientWidth : 375) - 72)); };
const chartSt = (key) => progChartState[key] || (progChartState[key] = { period:"all", index:null });
const fmtDayFr = (ts) => new Date(ts).toLocaleDateString("fr-FR", { weekday:"short", day:"numeric", month:"short" });
const svgEsc = (t) => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const FRAC_COLOR = "#C56A3E";   // terre battue : équivalent hexadécimal de --type-fractionne

// Bulle au-dessus (ou sous) le point choisi ; reste dans la zone du dessin. `parts` : [{t, b}] (b = en gras).
function chartBubbleSVG(x, y, parts, W, onclick){
  const text = parts.map(p=>p.t).join(""), w = Math.ceil(text.length*6.3)+18, h = 24;
  let bx = Math.min(Math.max(x - w/2, CH_L), W - CH_R - w);
  const above = y - 14 - h >= -2;
  const by = above ? y - 12 - h : y + 12;
  const ax = Math.min(Math.max(x, bx+10), bx+w-10);
  const arrow = above ? `<path d="M${ax-5} ${by+h} l5 5 l5 -5 Z"/>` : `<path d="M${ax-5} ${by} l5 -5 l5 5 Z"/>`;
  return `<g class="bub" aria-hidden="true"${onclick?` onclick="${onclick}"`:""}><rect x="${bx}" y="${by}" width="${w}" height="${h}" rx="8"/>${arrow}<text x="${bx+9}" y="${by+16}">${parts.map(p=>`<tspan${p.b?' font-weight="700"':""}>${svgEsc(p.t)}</tspan>`).join("")}</text></g>`;
}
function chartLegendHTML(items){
  return `<div class="pc-legend">${items.map(i=>`<span>${i}</span>`).join("")}</div>`;
}

// --- Courbes dans le temps ---
// cfg : { title, heart, points:[{ts,value,id,kind}], trendKinds:[...], progress:'pace'|'ratio', yFmt(v,dec), steps, decimals, goalTs, projDays,
//         legend:[html], coachFn(progress,pts), bubbleFn(point)->parts, waitMinPoints, waitText }
function timeChartModel(key, cfg){
  const st = chartSt(key), now = Date.now();
  const all = pointsInPeriod(cfg.points, st.period, now);
  const W = chartW();
  if(all.length < (cfg.waitMinPoints||2)){
    if((cfg.points||[]).length >= (cfg.waitMinPoints||2)) return { key, empty:true, title:cfg.title, heart:cfg.heart, text:"Pas assez de séances sur cette période : choisis une période plus longue." };
    return { key, wait:true, title:cfg.title, text:cfg.waitText, count:all.length };
  }
  const trendPts = all.filter(p=>cfg.trendKinds.includes(p.kind));
  const prog = periodProgress(trendPts, st.period, now);
  const progress = cfg.progress==="ratio" ? ratioProgressText(prog) : paceProgressText(prog);
  const first = all[0].ts, lastPt = all[all.length-1].ts;
  let end = cfg.projDays ? lastPt + cfg.projDays*DAY_MS : lastPt;
  if(cfg.goalTs && cfg.goalTs>lastPt && cfg.goalTs < lastPt + 400*DAY_MS) end = Math.max(end, cfg.goalTs);
  const start = first, endTs = Math.max(end, start + 30*DAY_MS);
  const yd = chartYDomain(all.map(p=>p.value), 0.1);
  const ticks = niceTicks(yd.min, yd.max, 5, cfg.steps).ticks;
  const l = CH_L, r = W - CH_R, pw = r - l;
  const X = (ts) => l + (ts-start)/(endTs-start)*pw;
  const Y = (v) => CH_T + (v-yd.min)/(yd.max-yd.min)*(CH_B-CH_T);   // petit = en haut (plus rapide, plus efficace)
  const nav = all.map(p=>({ id:p.id, kind:p.kind, frac:(X(p.ts)-l)/pw, race:p.kind==="race", p }));
  const dec = cfg.decimals ? axisDecimals(yd.min, yd.max, 5) : 0;
  const trend = trendSegments(trendPts, cfg.projDays||0);
  const svg = (sel) => {
    const g = [];
    ticks.forEach(v=>{ const y = Y(v); g.push(`<line class="gl" x1="${l}" x2="${r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${l-6}" y="${(y+4).toFixed(1)}" text-anchor="end">${cfg.yFmt(v,dec)}</text>`); });
    monthTicks(start, endTs, Math.max(3, Math.floor(pw/50))).forEach(m=>{ g.push(`<text x="${Math.max(X(m.ts), l+12).toFixed(1)}" y="164" text-anchor="middle">${m.label}</text>`); });
    const plot = [];
    if(trend && !cfg.line){
      const x1 = X(trend.fromTs), x2 = X(trend.toTs);
      plot.push(`<line x1="${x1.toFixed(1)}" y1="${Y(trend.fromValue).toFixed(1)}" x2="${x2.toFixed(1)}" y2="${Y(trend.toValue).toFixed(1)}" stroke="#F2F3F0" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>`);
      if(cfg.projDays && trend.projTs>trend.toTs){
        const pe = Math.min(trend.projTs, endTs), pv = trend.toValue + (trend.projValue-trend.toValue)/(trend.projTs-trend.toTs)*(pe-trend.toTs);
        plot.push(`<line x1="${x2.toFixed(1)}" y1="${Y(trend.toValue).toFixed(1)}" x2="${X(pe).toFixed(1)}" y2="${Y(pv).toFixed(1)}" stroke="#F2F3F0" stroke-width="1.5" stroke-dasharray="2 4" opacity=".45"/>`);
      }
    }
    if(cfg.goalTs && cfg.goalTs>=start && cfg.goalTs<=endTs){
      const gx = X(cfg.goalTs).toFixed(1);
      plot.push(`<line x1="${gx}" x2="${gx}" y1="10" y2="148" stroke="#EE343B" stroke-width="1.2" stroke-dasharray="3 3"/><path d="M${gx} 10 l10 4 l-10 4 Z" fill="#EE343B"/>`);
    }
    if(cfg.line){ // efficience : courbe corail, remplie à 7 %
      const pts = all.map(p=>`${X(p.ts).toFixed(1)},${Y(p.value).toFixed(1)}`);
      plot.push(`<polygon points="${X(all[0].ts).toFixed(1)},${CH_B} ${pts.join(" ")} ${X(all[all.length-1].ts).toFixed(1)},${CH_B}" fill="#FF645F" opacity=".07"/><polyline points="${pts.join(" ")}" fill="none" stroke="#FF645F" stroke-width="2" stroke-linejoin="round"/>`);
    }
    all.forEach(p=>{
      const x = X(p.ts).toFixed(1), y = Y(p.value).toFixed(1);
      if(p.kind==="long") plot.push(`<path d="M${x} ${(y-5)} l5 5 l-5 5 l-5 -5 Z" fill="#71D6A3"/>`);
      else if(p.kind==="race") plot.push(`<line x1="${x}" x2="${x}" y1="${(y-4)}" y2="${(y-20)}" stroke="#EE343B" stroke-width="1.6"/><path d="M${x} ${(y-20)} l10 4 l-10 4 Z" fill="#EE343B"/><circle cx="${x}" cy="${y}" r="4.2" fill="#EE343B" style="stroke:var(--surface);stroke-width:1.5"/>`);
      else plot.push(`<circle cx="${x}" cy="${y}" r="${cfg.line?3:3.6}" fill="${p.kind==="frac"?FRAC_COLOR:p.kind==="eff"?"#FF645F":"#C6F432"}"/>`);
    });
    const cur = nav[sel].p, cx = X(cur.ts), cy = Y(cur.value);
    plot.push(`<line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="10" y2="148" stroke="#F2F3F0" stroke-width="1" opacity=".4"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="none" stroke="#F2F3F0" stroke-width="2"/>`);
    return `<svg width="${W}" height="${CH_H}" viewBox="0 0 ${W} ${CH_H}" role="img" aria-label="${svgEsc(cfg.title)}, ${all.length} séances">${g.join("")}<g>${plot.join("")}</g>${chartBubbleSVG(cx, cy, cfg.bubbleFn(cur), W, cur.id?`openHistoryRun('${cur.id}')`:"")}</svg>`;
  };
  return { key, kind:"time", W, title:cfg.title, heart:cfg.heart, progress, since:prog.since, period:true, coach:cfg.coachFn(prog, all), nav, svg, legend:cfg.legend, noun:"Séance",
    srText:(i)=>cfg.bubbleFn(nav[i].p).map(p=>p.t).join("") };
}

// --- Barres par mois ---
// cfg : { title, bars:[{label, ...}], yMax, ticks, yFmt, drawBar(bar,i,geom)->svg, extra(geom)->svg, bubbleFn(bar)->parts, legend, coach }
function barChartModel(key, cfg){
  const W = chartW(), l = CH_L, r = W - CH_R, pw = r - l, n = cfg.bars.length;
  const slot = pw/n, bw = Math.min(30, slot*0.62);
  const Y = (v) => CH_B - v/cfg.yMax*(CH_B-CH_T);
  const cx = (i) => l + slot*(i+0.5);
  const nav = cfg.bars.map((b,i)=>({ id:null, frac:(cx(i)-l)/pw, race:false, bar:b }));
  const svg = (sel) => {
    const g = [];
    cfg.ticks.forEach(v=>{ const y = Y(v); g.push(`<line class="gl" x1="${l}" x2="${r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${l-6}" y="${(y+4).toFixed(1)}" text-anchor="end">${cfg.yFmt(v)}</text>`); });
    const geom = { l, r, W, Y, cx, bw, slot };
    const every = slot < 30 ? 2 : 1;
    const bars = cfg.bars.map((b,i)=>`<g class="bar" style="--i:${i}">${cfg.drawBar(b, i, geom)}</g>${i%every===(n-1)%every ? svgText(cx(i), 164, b.label) : ""}`).join("");
    const b = cfg.bars[sel], bx = cx(sel), by = Y(b.top!=null?b.top:b.value||0);   // b.flag : pastille « ! » au-dessus de la barre

function chartPointer(e){
  const el = chartDrag.el, rect = el.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX-rect.left)/rect.width));
  const m = CHART_BUILDERS[chartDrag.key]();
  if(!m || !m.nav) return;
  let best = 0;
  m.nav.forEach((n,i)=>{ if(Math.abs(n.frac-frac) < Math.abs(m.nav[best].frac-frac)) best = i; });
  if(chartSel(m)!==best) selectChart(chartDrag.key, best);
}

function historyScreenHTML(){

async function deleteRunNow(id){
  // Une séance prévue liée à cette course repasse « à faire » / « à replacer » (sinon elle resterait « faite » sans course derrière).
  const linked = plannedSessions.filter(p=>p.linked_run_id===id && p.status==="done");
  const { error } = await supa.from("runs").delete().eq("id", id);
  if(error){ toast("Pas supprimée, vérifie ta connexion."); return false; }
  const todayStr = localDateStr(new Date());
  for(const p of linked){
    await supa.from("planned_sessions").update({status:plannedStatusAfterRunDeleted(p, todayStr), linked_run_id:null, updated_at:new Date().toISOString()}).eq("id", p.id);
  }
  await refreshAfterEdit();
  return true;
}
window.confirmDeleteRun = async () => {
  if(!runSheet) return;
  const id = runSheet.id;
  if(!(await deleteRunNow(id))) return;
  runSheet = null; refreshSheet();

};

// ---------- Feuille de ressenti (design 7a), la même partout ----------
// Quatre curseurs toujours visibles (difficulté perçue, fatigue, mental, respiration), puis « Une gêne ou une douleur ? ».
// Avec « Oui », la carte du corps s'ouvre : silhouette devant / derrière, fiche de la zone touchée (intensité, avant / pendant / après).
// Le même formulaire sert dans la saisie à la main (difficulté + gêne seulement) : l'état vit dans ratingSheet ou dans manualRunForm.rating.
let ratingSheet = null; // { id, ...état }
const RATING_SLIDERS = [
  { key:"rpe", label:"Difficulté perçue", lo:"Repos total", hi:"Effort maximal" },
  { key:"fatigue", label:"Fatigue générale", lo:"Plein d'énergie", hi:"Complètement épuisé" },
  { key:"mental", label:"Mental", lo:"Bien dans ma tête, motivé", hi:"Difficile de me motiver" },
  { key:"respiration", label:"Respiration", lo:"Je respire très facilement", hi:"Beaucoup de difficulté à respirer" },
];
const MOMENT_CHOICES = [["avant","Avant"],["pendant","Pendant"],["apres","Après"]];
const curRating = () => (typeof manualRunForm!=="undefined" && manualRunForm) ? manualRunForm.rating : ratingSheet;
// État du formulaire : reprend la notation existante, sinon fatigue / mental / respiration de la dernière séance notée ; la difficulté
// n'est jamais préremplie (propre à chaque séance).
function newRatingState(painRatings){
  const base = prefillRatings(painRatings);
  const zones = {};
  BODY_ZONE_KEYS.forEach(k=>{ zones[k] = { value:Number(base[k])||0, moments:zoneMoments(base[k+"_moment"]) }; });
  const sliders = {};
  RATING_SLIDERS.forEach(sl=>{ sliders[sl.key] = base[sl.key]!=null ? Number(base[sl.key]) : (sl.key==="rpe" ? null : 0); });
  return { sliders, gene: base.gene===true ? true : base.gene===false ? false : null, zones, view:"front", sel:null };
}
window.openRatingSheet = (id) => {
  const r = RUNS.find(x=>x.id===id);
  if(!r) return;
  ratingSheet = { id, ...newRatingState(r.painRatings), saving:false, error:"" };
  refreshSheet();
};
window.closeRatingSheet = () => { ratingSheet = null; refreshSheet(); };
const ratingClearError = () => { const st = curRating(); if(st) st.error = ""; const er = document.getElementById("rtError"); if(er) er.textContent = ""; };
window.ratingSlide = (key, v) => {
  const st = curRating(); if(!st) return;
  st.sliders[key] = Number(v);
  const val = document.getElementById("rt_v_"+key), inp = document.getElementById("rt_"+key);
  if(val){ val.textContent = v; val.classList.remove("none"); }
  if(inp) inp.style.setProperty("--p", (Number(v)/10*100)+"%");
  ratingClearError();
};
window.ratingGene = (v) => { const st = curRating(); if(st){ st.gene = v; if(!v) st.sel = null; refreshSheet(); } };
window.ratingView = (v) => { const st = curRating(); if(st){ st.view = v; st.sel = null; refreshSheet(); } };
window.ratingZone = (key) => { const st = curRating(); if(st){ st.sel = key; refreshSheet(); } };
window.ratingZoneClose = () => { const st = curRating(); if(st){ st.sel = null; refreshSheet(); } };
window.ratingZoneSlide = (v) => {
  const st = curRating(); if(!st || !st.sel) return;
  const z = st.zones[st.sel], hadMoment = z.moments.length>0; z.value = Number(v);
  if(z.value>0 && !hadMoment) z.moments = ["pendant"];
  const val = document.getElementById("rt_zv"), inp = document.getElementById("rt_zone");
  if(val) val.textContent = v;
  if(inp) inp.style.setProperty("--p", (Number(v)/10*100)+"%");
  const f = zoneFill(z.value), el = document.querySelector(`#rtBody [data-zone="${st.sel}"] ellipse.vis`);
  if(el){ el.setAttribute("fill", f.fill); el.setAttribute("fill-opacity", f.opacity); el.setAttribute("stroke", z.value>0 ? f.stroke : "#4A4F55"); }
  const dot = document.getElementById("rt_zdot"); if(dot) dot.style.background = z.value>0 ? f.fill : "var(--text-faint)";
  ratingClearError();
  if(z.value>0 && !hadMoment){ document.querySelectorAll("#rt_moments .rt-pill").forEach(b=>b.setAttribute("aria-pressed", b.textContent==="Pendant")); }
};
window.ratingMoment = (m) => {
  const st = curRating(); if(!st || !st.sel) return;
  const z = st.zones[st.sel], i = z.moments.indexOf(m);
  if(i>=0) z.moments.splice(i,1); else z.moments.push(m);
  document.querySelectorAll("#rt_moments .rt-pill").forEach(b=>{ const k = (MOMENT_CHOICES.find(x=>x[1]===b.textContent)||[])[0]; b.setAttribute("aria-pressed", z.moments.includes(k)); });
};
function ratingBodySVG(st){
  const base = `<circle cx="100" cy="24" r="16" fill="#22252A"/><rect x="68" y="44" width="64" height="104" rx="26" fill="#22252A"/><rect x="44" y="52" width="18" height="96" rx="9" fill="#22252A"/><rect x="138" y="52" width="18" height="96" rx="9" fill="#22252A"/><rect x="68" y="140" width="28" height="154" rx="14" fill="#22252A"/><rect x="104" y="140" width="28" height="154" rx="14" fill="#22252A"/>`;
  const zones = BODY_VIEWS[st.view].map(([key,cx,cy,rx,ry])=>{
    const v = st.zones[key].value, f = zoneFill(v), sel = st.sel===key;
    return `<g class="zone" data-zone="${key}" role="button" tabindex="0" aria-label="${escHtml(ZONE_FULL_NAMES[key])}${v>0?", intensité "+v:""}" onclick="ratingZone('${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ratingZone('${key}')}">
      <ellipse class="vis" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f.fill}" fill-opacity="${f.opacity}" stroke="${v>0?f.stroke:"#4A4F55"}" stroke-width="${sel?2.5:1.5}"/>
      <circle cx="${cx}" cy="${cy}" r="${Math.max(rx,ry)+7}" fill="transparent"/></g>`;
  }).join("");
  return `<svg viewBox="0 0 200 300" role="group" aria-label="Carte du corps, vue de ${st.view==="front"?"devant":"derrière"}">${base}${zones}</svg>`;
}
// Curseurs, question « gêne ou douleur », carte du corps. `full` : les 4 curseurs (feuille 7a) ou seulement la difficulté (saisie à la main).
function ratingFormHTML(st, full){
  const sliders = RATING_SLIDERS.filter(sl=>full || sl.key==="rpe").map(sl=>{
    const v = st.sliders[sl.key], none = v==null;
    return `<div class="rt-block"><div class="rt-top"><label for="rt_${sl.key}">${sl.label}</label><b id="rt_v_${sl.key}"${none?' class="none"':""}>${none?"—":v}</b></div>
      <input type="range" class="rt-range" id="rt_${sl.key}" min="0" max="10" step="1" value="${none?0:v}" style="--p:${none?0:v*10}%" oninput="ratingSlide('${sl.key}', this.value)" aria-valuetext="${none?"pas encore choisie":v+" sur 10"}">
      <div class="rt-ends"><span>0 · ${sl.lo}</span><span style="text-align:right">10 · ${sl.hi}</span></div></div>`;
  }).join("");
  const gene = `<div class="rt-block"><div class="rt-top"><span>Une gêne ou une douleur ?</span></div><div class="rt-pills">
      <button type="button" class="rt-pill" aria-pressed="${st.gene===true}" onclick="ratingGene(true)">Oui</button>
      <button type="button" class="rt-pill" aria-pressed="${st.gene===false}" onclick="ratingGene(false)">Non</button></div></div>`;
  let body = "";
  if(st.gene===true){
    const sel = st.sel ? st.zones[st.sel] : null, f = sel ? zoneFill(sel.value) : null;
    const card = sel ? `<div class="rt-zone"><div class="hd"><div class="nm"><i id="rt_zdot" style="background:${sel.value>0?f.fill:"var(--text-faint)"}"></i>${escHtml(ZONE_FULL_NAMES[st.sel])}</div><button type="button" class="x" aria-label="Fermer la fiche" onclick="ratingZoneClose()">${icon("x",16)}</button></div>
      <div class="rt-block" style="margin-top:0"><div class="rt-top"><label for="rt_zone">Intensité</label><b id="rt_zv">${sel.value}</b></div>
        <input type="range" class="rt-range" id="rt_zone" min="0" max="10" step="1" value="${sel.value}" style="--p:${sel.value*10}%" oninput="ratingZoneSlide(this.value)">
        <div class="rt-ends"><span>0 · Aucune gêne</span><span>10 · Très intense</span></div></div>
      <div class="rt-block" style="margin-top:0"><span style="font-size:12.5px;color:var(--text-2)">Quand ?</span><div class="rt-pills" id="rt_moments">${MOMENT_CHOICES.map(([k,l])=>`<button type="button" class="rt-pill" aria-pressed="${sel.moments.includes(k)}" onclick="ratingMoment('${k}')">${l}</button>`).join("")}</div></div></div>` : "";
    body = `<div class="rt-sep"></div><div class="pg-over">Où as-tu mal ?</div>
      <div class="rt-seg" role="group" aria-label="Vue"><button type="button" aria-pressed="${st.view==="front"}" onclick="ratingView('front')">Devant</button><button type="button" aria-pressed="${st.view==="back"}" onclick="ratingView('back')">Derrière</button></div>
      <div class="rt-body" id="rtBody">${ratingBodySVG(st)}</div>
      <div class="rt-cap">Touche une zone. Gauche / droite = les tiennes.</div>
      <div class="rt-legend"><span><i style="background:#F2F3F0;opacity:.6"></i>1 à 5 : blanc</span><span><i style="background:var(--attention)"></i>6 et plus : violet (alerte)</span></div>${card}`;
  }
  return sliders + gene + body;
}
function renderRatingSheet(){
  const root = document.getElementById("sheetRoot");
  const st = ratingSheet;
  if(!st) return false;
  const r = RUNS.find(x=>x.id===st.id);
  if(!r){ ratingSheet = null; return false; }

  root.innerHTML = `<div class="sheet-back" onclick="if(event.target===this)closeRatingSheet()"><div class="sheet" role="dialog" aria-modal="true" aria-label="Ton ressenti">
    ${sheetHeadHTML("Ton ressenti", "closeRatingSheet()", overline)}
    ${ratingFormHTML(st, true)}
    <div class="rt-err" id="rtError" role="alert">${escHtml(st.error)}</div>
    <button type="button" class="btn-primary" style="margin-top:14px" ${st.saving?"disabled":""} onclick="saveRating()">Enregistrer</button>
  </div></div>`;

// Après l'enregistrement d'une douleur de 6 ou plus : proposition d'adapter le programme (R6).
function painFollowUpToast(ratings, extra){
  if(maxZoneIntensity(ratings)>=6) toast("On te propose d'adapter ton programme.", { actionLabel:"Voir", onAction:()=>{ closeRunSheet(); setTab("programme"); }, ms:8000 });
  else toast(extra || "Ressenti enregistré.");
}
window.saveRating = async () => {
  const st = ratingSheet;
  if(!st || st.saving) return;
  const r = RUNS.find(x=>x.id===st.id);
  const fail = (m) => { st.error = m; const el = document.getElementById("rtError"); if(el) el.textContent = m; };
  if(st.sliders.rpe==null) return fail("Indique d'abord la difficulté perçue de cette séance.");
  if(st.gene===null) return fail("Réponds à « Une gêne ou une douleur ? » : Oui ou Non.");
  st.saving = true;
  const ratings = buildPainRatings({ sliders:st.sliders, gene:st.gene, zones:st.zones }, r && r.painRatings);
  const ok = await updateRun(st.id, { pain_ratings: ratings });
  st.saving = false;
  if(!ok) return;
  ratingSheet = null;
  await refreshAfterEdit(); refreshSheet();
  painFollowUpToast(ratings);
};

// ---------- Profil : Objectifs et Mon compte (S11, design 12b) ----------
// Chaque champ s'enregistre seul : un badge « Enregistré » apparaît 2 s sous le champ modifié (D64), plus de bouton « Enregistrer ».
let lastEdited = null;
["click","input","change"].forEach(ev=>document.addEventListener(ev, (e)=>{ if(e.target && e.target.closest && e.target.closest("#content, #sheetRoot")) lastEdited = e.target; }, true));
let savedTimers = new WeakMap();
function flashFieldSaved(from){
  const el = from || lastEdited;
  const group = el && el.closest ? el.closest(".pf-group") : null;
  const slot = group ? group.querySelector(".pf-slot") : null;
  if(!slot){ flashSaved("goalsSaved"); return; }
  slot.innerHTML = `<span class="pf-saved" role="status">${icon("check",13)}Enregistré</span>`;
  clearTimeout(savedTimers.get(slot));
  savedTimers.set(slot, setTimeout(()=>{ slot.innerHTML = ""; }, 2000));
}
function objectiveSummaryHTML(slotKey){
  const slot = goals[slotKey] || {}, type = slot.objectifPrincipal;
  const over = slotKey==="principal" ? "Objectif principal" : "Objectif secondaire";
  if(!type) return `<div class="pg-over pf-over">${over}</div><button type="button" class="pf-obj" onclick="openObjectiveSheet('${slotKey}')"><div class="top"><div class="ic">${icon("flag",18)}</div><div><div class="t" style="color:var(--text-3)">Choisir mon objectif</div><div class="s">Ton programme s'adapte à ce que tu veux atteindre.</div></div><span class="chev">${icon("chevronRight",16)}</span></div></button>`;
  const ic = (OBJECTIF_ICONS.find(x=>x[0]===type)||[])[1] || "flag";

// Les vraies sorties faciles des 8 dernières semaines : sert au garde-fou « temps trop rapide » (D76, point 4).
function levelReality(){
  const from = Date.now() - 8*7*86400000;
  const maxEff = maxHr || estimatedMaxHr();
  const runs = runningRuns.filter(r=>r.type==="EF" && dateFromRun(r).getTime()>=from)
    .map(r=>({ ts:dateFromRun(r).getTime(), type:r.type, distKm:r.dist||0, paceSecKm:r.allure||0, qualitatif:efQualitatif(r.hrSeries, maxEff, restingHr||null) }));
  return easyPaceReality(runs, Date.now());
}

window.levelFormInput = (field, value) => {
  const st = levelSheet; if(!st) return;
  st.form[field] = field==="month" ? value : String(value).replace(/\D/g,"").slice(0,2);
  st.error = "";
  const chk = levelChronoCheck({ distanceKm:st.form.distanceKm, h:st.form.h, m:st.form.m, s:st.form.s, month:st.form.month }, localDateStr(new Date()), st.reality);
  const dyn = levelChronoDynamic(chk), set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set("lvWarn", dyn.warn); set("lvNote", dyn.note); set("lvErr", "");
  const go = document.getElementById("lvGo"); if(go) go.textContent = dyn.btn;
  document.querySelectorAll(".lv-times .pf-row").forEach(el=>el.classList.toggle("warn", chk.tooFast));

window.levelChronoSubmit = async () => {
  const st = levelSheet; if(!st || st.saving) return;
  const f = st.form;
  const chk = levelChronoCheck({ distanceKm:f.distanceKm, h:f.h, m:f.m, s:f.s, month:f.month }, localDateStr(new Date()), st.reality);
  if(chk.stale) return planGuidedTestFromLevel();
  if(!chk.ok){
    st.error = chk.errors.distance || chk.errors.time || chk.errors.month || "";
    const el = document.getElementById("lvErr"); if(el) el.textContent = st.error;
    return;
  }
  st.saving = true;
  const ok = await finishLevelChange({ source:"chrono", distanceKm:chk.distanceKm, timeSec:chk.timeSec, date:chk.date });
  if(!ok && levelSheet){ levelSheet.saving = false; }
};
// Enregistre un nouveau temps de référence (chrono ou test), met à jour les allures des séances à venir, relance la
// construction du programme. Les séances faites ou choisies à la main ne bougent jamais.
async function applyLevelRef(newRef){
  const ps = { ...programSettings, refDistanceKm:newRef.distanceKm, refTimeSec:newRef.timeSec, refDate:newRef.date, refSource:newRef.source };
  delete ps.refDateApprox; delete ps.pendingLevel;
  if(!(await upsertProfile({ program_settings: ps }))) return false;
  programSettings = ps;
  // Un chrono donné alors qu'un test de 20 minutes était planifié : le test n'a plus d'objet, on le met de côté.
  const plannedTest = newRef.source==="chrono" ? plannedGuidedTest() : null;
  if(plannedTest){
    await supa.from("planned_sessions").update({ status:"replaced", updated_at:new Date().toISOString() }).eq("id", plannedTest.id);
    await loadData();
  }
  await repaceFutureSessions();
  programAdjustmentChecked = false;
  return true;
}
async function repaceFutureSessions(){
  const prof = runnerProfile();
  const zones = prof ? levelPaceZones(prof.distanceKm, prof.timeSec) : null;
  if(!zones) return 0;
  const todo = sessionsToRepace(plannedSessions, localDateStr(new Date())).filter(s=>zones[s.pace_zone] && zones[s.pace_zone]!==Number(s.target_pace_sec_per_km));
  if(!todo.length) return 0;
  const now = new Date().toISOString();
  await Promise.all(todo.map(s=>supa.from("planned_sessions").update({ target_pace_sec_per_km:zones[s.pace_zone], updated_at:now }).eq("id", s.id)));
  await loadData();
  return todo.length;
}
// Après un nouveau chrono : si les allures changent d'au moins 5 s/km, on propose (feuille « Tes nouvelles allures »),
// sinon on enregistre simplement. Premier calcul (aucun ancien temps) : on enregistre et le programme se construit.
async function finishLevelChange(newRef){
  const oldRef = runnerProfile();
  const proposal = oldRef ? newPaceProposal(oldRef, newRef) : null;
  if(proposal){ levelSheet = null; openNewPacesSheet({ oldRef, newRef, proposal }); return true; }
  if(!(await applyLevelRef(newRef))) return false;
  levelSheet = null; refreshSheet(); renderContent(); runProgramMaintenance();
  toast(oldRef ? "Niveau enregistré. Tes allures restent proches des précédentes." : "Allures conseillées calculées. Ton programme se construit.");
  return true;
}

  if(plannedGuidedTest()){ closeLevelSheet(); toast("Ton test de 20 minutes est déjà planifié."); return; }
  levelSheet = null; refreshSheet();
  await scheduleGuidedTest(true);
  const t = plannedGuidedTest();
  toast(t ? `Test de 20 minutes planifié : ${dayLabelShort(new Date(t.planned_date+"T00:00:00"))}.` : "Pas enregistré, vérifie ta connexion.");

window.levelResumePick = (answer) => { if(!levelSheet) return; levelSheet.resumeAnswer = answer; refreshSheet(); };
window.levelResumeContinue = async () => {
  const st = levelSheet, info = levelResumeInfo(goals, programSettings, RACE_DISTANCES_KM);
  if(!st || !info || !st.resumeAnswer) return;
  const patch = levelResumePatch(info, st.resumeAnswer, localDateStr(new Date()));
  if(!patch){ st.view = "main"; refreshSheet(); return; }   // plus de 6 mois ou « je ne sais plus » : nouveau chrono ou test guidé
  let ok = false;
  if(patch.programSettings){
    const ps = { ...programSettings, ...patch.programSettings };
    ok = await upsertProfile({ program_settings: ps });
    if(ok) programSettings = ps;
  } else if(patch.vmaDate){
    const g = { ...goals, [patch.slotKey]: { ...goals[patch.slotKey], vmaDate:patch.vmaDate } };
    ok = await upsertProfile({ goals: g });
    if(ok) goals = g;
  }
  if(!ok) return;
  levelSheet = null; refreshSheet();
  programAdjustmentChecked = false; renderContent(); runProgramMaintenance();
  toast("Merci, ton niveau est enregistré.");
};
window.saveNiveau = async (value) => {

  const prev = programSettings?.programSignature;

// Les séances générées à venir sont mises de côté (statut « replaced », jamais supprimées), puis les semaines concernées
// sont régénérées à partir d'aujourd'hui avec les réglages actuels. Séances faites ou ajoutées à la main : conservées.
async function recalculateProgram(){
  const todayStr = localDateStr(new Date());
  const old = recalculableSessions(plannedSessions, todayStr);
  if(old.length){
    const { error } = await supa.from("planned_sessions").update({ status:"replaced", updated_at:new Date().toISOString() }).in("id", old.map(p=>p.id));
    if(error){ toast("Pas enregistré, vérifie ta connexion."); return false; }
    await loadData();
    for(const week of [...new Set(old.map(p=>p.week_start_date))].sort()) await window.generateProgram(parseDay(week), { silent:true, fromToday:true });
  }
  await saveProgramSignature();
  return true;
}
window.confirmUpdateProgram = async () => {
  const st = updateSheet;
  if(!st || st.saving) return;
  st.saving = true;
  const ok = await recalculateProgram();
  if(!ok){ st.saving = false; return; }
  updateSheet = null; refreshSheet(); renderContent();
  toast("Ton programme est à jour.");
};

// l'écran, pas à chaque redessin du contenu (sinon clignotement). Ces
// mémoires sont vidées à chaque changement d'onglet, pour rejouer l'entrée.
let countedValues = {}, animatedOnce = new Set();
function playOnce(key){ if(animatedOnce.has(key)) return false; animatedOnce.add(key); return !prefersReducedMotion(); }
function countUpHTML(value, format, key, opts){
  const o = opts || {};
  return `<span data-countup="${value}" data-cu-format="${format}" data-cu-key="${key}"${o.sign?` data-cu-sign="${o.sign}"`:""}${o.total!=null?` data-cu-total="${o.total}"`:""}>${formatCountUp(value, format, o)}</span>`;
}
function runCountUps(){
  document.querySelectorAll("[data-countup]").forEach(el=>{
    const to = Number(el.dataset.countup), key = el.dataset.cuKey;
    const opts = { sign: el.dataset.cuSign, total: el.dataset.cuTotal };
    const from = countedValues[key];
    countedValues[key] = to;
    if(prefersReducedMotion() || from===to) return;
    const start = from===undefined ? 0 : from;
    const t0 = performance.now(), dur = 700;
    const step = (now) => {
      if(!el.isConnected) return;
      const p = Math.min(1, (now-t0)/dur), eased = 1-Math.pow(1-p, 3);
      el.textContent = formatCountUp(start+(to-start)*eased, el.dataset.cuFormat, opts);
      if(p<1) requestAnimationFrame(step); else el.textContent = formatCountUp(to, el.dataset.cuFormat, opts);
    };
    el.textContent = formatCountUp(start, el.dataset.cuFormat, opts);
    requestAnimationFrame(step);
    // Filet de sécurité : le navigateur suspend requestAnimationFrame quand la
    // page n'est pas visible ; la valeur finale doit s'afficher quoi qu'il arrive.
    setTimeout(()=>{ if(el.isConnected) el.textContent = formatCountUp(to, el.dataset.cuFormat, opts); }, dur+150);
  });
}

// Agrège le temps par zone de toutes les séances avec détail FC, groupé par mois calendaire.
function monthlyZoneBreakdown(cardioRuns, effMaxHr, effRestingHr){
  const byMonth = {};
  cardioRuns.filter(r=>r.hrSeries && r.hrSeries.length>1).forEach(r=>{
    const d = dateFromRun(r);
    const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    if(!byMonth[key]) byMonth[key] = {label: d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}), secs:[0,0,0,0,0], sortKey: d.getFullYear()*12+d.getMonth()};
    const {secs} = computeHrZoneSeconds(r.hrSeries, effMaxHr, effRestingHr);
    secs.forEach((s,i)=>byMonth[key].secs[i]+=s);
  });
  return Object.values(byMonth).sort((a,b)=>a.sortKey-b.sortKey);
}

// Courbe cardiaque (V2) : trait corail, limite EF (haut de la zone 2) en pointillés cyan. `series` : [{t (s), hr}].
function hrCurveSVG(series, efLimit, W){
  const pts = series.slice().sort((a,b)=>a.t-b.t);
  const H = 130, l = 30, r = W-6, t = 10, b = 108;
  const hrs = pts.map(p=>p.hr);
  let lo = Math.min(...hrs, efLimit||Infinity), hi = Math.max(...hrs, efLimit||-Infinity);
  lo = Math.floor((lo-5)/10)*10; hi = Math.ceil((hi+5)/10)*10;
  const tmax = pts[pts.length-1].t || 1;
  const X = (sec) => l + sec/tmax*(r-l), Y = (hr) => t + (hi-hr)/(hi-lo)*(b-t);
  const ticks = niceTicks(lo, hi, 4, [5,10,20,25,50]).ticks;
  const grid = ticks.map(v=>`<line x1="${l}" x2="${r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#26292E"/><text x="${l-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  const line = pts.map(p=>`${X(p.t).toFixed(1)},${Y(p.hr).toFixed(1)}`).join(" ");
  const area = `${X(pts[0].t).toFixed(1)},${b} ${line} ${X(tmax).toFixed(1)},${b}`;
  const lim = efLimit ? `<line x1="${l}" x2="${r}" y1="${Y(efLimit).toFixed(1)}" y2="${Y(efLimit).toFixed(1)}" stroke="#44E7EF" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${r}" y="${(Y(efLimit)-4).toFixed(1)}" text-anchor="end" style="fill:#44E7EF">limite EF ${efLimit} bpm</text>` : "";
  const xl = [0, tmax/2, tmax].map((sec,i)=>`<text x="${X(sec).toFixed(1)}" y="124" text-anchor="${i===0?"start":i===2?"end":"middle"}">${fmtDur(sec)}</text>`).join("");
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fréquence cardiaque pendant la séance">${grid}<polygon points="${area}" fill="#FF645F" opacity=".08"/><polyline points="${line}" fill="none" stroke="#FF645F" stroke-width="1.8" stroke-linejoin="round"/>${lim}${xl}</svg>`;
}
// Contenu déployé du « Détail cardio » : FC moyenne et maximale, courbe, temps par zone, allures du fractionné, suggestions de type.
function cardioCardHTML(r, effMaxHr, effRestingHr){
  if(!r.hrSeries || r.hrSeries.length<2) return `<div class="cd-note">Pas de détail de fréquence cardiaque pour cette séance.</div>`;
  if(!effMaxHr) return `<div class="cd-note">Renseigne ta FC max (Profil › Mon compte) pour voir la répartition par zones.</div>`;
  const { secs, defs } = computeHrZoneSeconds(r.hrSeries, effMaxHr, effRestingHr);
  const total = secs.reduce((a,b)=>a+b,0)||1;
  const flagFrac = r.type!=="Fractionné" && looksLikeFractionne(r.hrSeries);
  const flagSeuil = !flagFrac && r.type!=="Seuil" && looksLikeSeuil(r.hrSeries, effMaxHr, effRestingHr);
  const ip = r.type==="Fractionné" ? getIntervalPaces(r) : null;
  const W = 320;
  const tiles = r.fc ? `<div class="sc-tiles2" style="margin:0">${scTile("FC moy.", Math.round(r.fc), "var(--data-coral)")}${r.peakHr?scTile("FC max", r.peakHr, "var(--data-coral)"):""}</div>` : "";
  return `<div class="cd-card">
    ${tiles}
    <div class="cd-curve">${hrCurveSVG(r.hrSeries, defs[1].max, W)}</div>
    <div>${defs.map((d,i)=>`<div class="cd-zone"><span class="z"><i style="background:${d.color}"></i>Z${d.zone}</span><div class="bar"><i style="width:${Math.round(secs[i]/total*100)}%;background:${d.color}"></i></div><span class="t">${fmtDur(secs[i])}</span></div>`).join("")}</div>
    ${!effRestingHr ? `<div class="cd-note">Zones calculées avec ta FC max seulement. Renseigne ta FC de repos (Profil › Mon compte) pour coller à l'app Santé.</div>` : ""}
    ${ip && (ip.manual || ip.workCount>=2) ? `<div class="cd-pace"><div><div class="k">Allure travail ${ip.manual?"(manuel)":`(${ip.workCount})`}</div><div class="v" style="color:var(--accent)">${fmtA(ip.work)}/km</div></div>${ip.recovery?`<div><div class="k">Allure récup ${ip.manual?"(manuel)":`(${ip.recoveryCount})`}</div><div class="v" style="color:var(--text-3)">${fmtA(ip.recovery)}/km</div></div>`:""}</div>` : ""}
    ${flagFrac ? `<div class="cd-flag">La FC oscille beaucoup sur cette séance : ça ressemble à un fractionné.<div><button type="button" class="btn-secondary" onclick="changeType('${r.id}','Fractionné')">Reclasser en Fractionné</button></div></div>` : ""}
    ${flagSeuil ? `<div class="cd-flag">Plus de la moitié de cette séance est passée en zones 3 à 5 : ça ressemble à du Seuil.<div><button type="button" class="btn-secondary" onclick="changeType('${r.id}','Seuil')">Reclasser en Seuil</button></div></div>` : ""}
  </div>`;
}
