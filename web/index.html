/* ============================================================
   Onglet Programme — calendrier de séances généré (moteur en logic.js).
   ============================================================ */

const PACE_ZONE_LABEL = { easy:"Easy", marathon:"Marathon", threshold:"Seuil", interval:"Fractionné", repetition:"Répétition" };
// « calculée à partir de ton chrono sur 10 km (47:00) » : d'après quoi les allures sont calculées (« Ton niveau » seulement).
function programProfileSourceLabel(profile){ return levelSourceText(profile); }
// Explique l'allure visée en langage clair (ZONE_FRIENDLY, logic.js) — pas
// de jargon non expliqué (VDOT, %...), pensé pour un débutant. Complétée
// (4.3.b) par la vraie consigne d'intensité : ressenti + plafond de FC pour
// EF/sortie longue (l'allure n'est qu'indicative), allure + zone FC pour
// Seuil, allure seule pour Fractionné (voir programIntensityGuidance).
function programPaceExplanationHTML(session){
  if(session.generation_reason==="guided_test"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0"><strong style="color:var(--text)">Ressenti : allure soutenue mais régulière.</strong> Pars tranquillement et garde la même allure jusqu'au bout : si tu t'essouffles trop vite, c'est que tu es parti trop fort. Pas d'inquiétude, il n'y a pas de bon ou mauvais résultat.</div>`;
  }
  if(session.generation_reason==="beginner_plan"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0"><strong style="color:var(--text)">Ressenti : cours à un rythme où tu peux encore parler.</strong> Si tu es essoufflé, ralentis ou marche un peu plus longtemps : l'important est de terminer la séance.</div>`;
  }
  const zf = ZONE_FRIENDLY[session.pace_zone];
  if(!zf) return "";
  const profile = runnerProfile();
  const srcLabel = programProfileSourceLabel(profile);
  const pareseLabel = srcLabel ? `, calculée à partir de ${srcLabel}` : "";
  const effMaxHr = maxHr || estimatedMaxHr();
  const guidance = programIntensityGuidance(session.pace_zone, effMaxHr, restingHr);
  const paceLine = `Ton allure ${zf.name} correspond à ${zf.what}${pareseLabel}.`;

  if(guidance.mode==="ressenti_plafond"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0">
      <strong style="color:var(--text)">Ressenti : tu dois pouvoir parler sans être essoufflé.</strong>
      Reste sous ${guidance.hrCeiling} bpm. L'allure ${zf.name} affichée n'est qu'indicative${pareseLabel}.
    </div>`;
  }
  if(guidance.mode==="ressenti"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0"><strong style="color:var(--text)">Ressenti : tu dois pouvoir parler sans être essoufflé.</strong> Renseigne ta FC max (Mon compte) pour voir aussi un plafond de FC à ne pas dépasser.</div>`;
  }
  if(guidance.mode==="allure_zone"){
    return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0">${paceLine} Vise aussi une FC entre ${guidance.hrRangeMin} et ${guidance.hrRangeMax} bpm — l'effort est assez long pour que ta FC ait le temps de suivre.</div>`;
  }
  return `<div class="chart-hint" style="margin-top:6px;margin-bottom:0">${paceLine}</div>`;
}
function sessionRunType(paceZone){
  if(paceZone==="interval"||paceZone==="repetition") return "Fractionné";
  if(paceZone==="threshold") return "Seuil";
  return "EF";
}
function mondayOf(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  d.setDate(d.getDate() - d.getDay() + (d.getDay()===0?-6:1));
  return d;
}
// `date.toISOString().slice(0,10)` convertit d'abord en UTC — pour
// n'importe quel fuseau en avance sur UTC (Europe/Paris compris), ça
// décale silencieusement la date d'un jour près de minuit. Toujours
// utiliser ce formateur (année/mois/jour EN LOCAL) pour planned_date /
// week_start_date, jamais toISOString() sur une date sans heure.
function localDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDaysStr(base, n){ const d=new Date(base); d.setDate(d.getDate()+n); return localDateStr(d); }
function dayLabelShort(date){ return date.toLocaleDateString('fr-FR',{weekday:'short', day:'numeric', month:'short'}); }

// Regroupe les entrées objectif principal/secondaire + charge récente
// (ACWR) + ressenti récent (douleur répétée, fatigue/mental) en une
// structure hebdo ajustée — utilisé à la fois pour générer une semaine et
// pour décider si la prochaine séance planifiée doit être ajustée.
// Séances qui comptent dans la charge : celles qui ont un ressenti d'effort (RPE).
function chargeLoadSessions(){
  return runningRuns.filter(r=>r.painRatings?.rpe!=null).map(r=>({ date: dateFromRun(r), durationMin: (r.durationSec||0)/60, rpe: r.painRatings.rpe }));
}
function computeProgramInputs(){
  const principalType = goals.principal?.objectifPrincipal;
  const secondaireEnabled = goals.secondaireEnabled!==undefined ? !!goals.secondaireEnabled : !!(goals.secondaire?.objectifPrincipal);
  const secondaryType = secondaireEnabled ? goals.secondaire?.objectifPrincipal : null;
  let structure = weeklyStructureForObjective(principalType, secondaryType);
  const dailySeries = buildDailyLoadSeries(chargeLoadSessions());
  const { acwr } = acwrAt(dailySeries, new Date());
  structure = applyAcwrAdjustment(structure, acwr);
  const ratedRuns = runningRuns.filter(r=>r.painRatings);
  const recentRatings = ratedRuns.slice(-2).map(r=>r.painRatings);
  // Palier "Hors ajustement" (4.6.c) : prime sur Petit/Gros pour sa zone, et
  // une zone déjà en pause ne redéclenche plus rien (l'utilisateur a déjà
  // été prévenu et a choisi).
  const suspendedKeys = suspendedZones.map(z=>z.zone);
  const allZoneKeys = BODY_ZONES.map(z=>z[0]).filter(k=>!suspendedKeys.includes(k));
  const urgent = acutePainTrigger(ratedRuns.slice(-3).map(r=>r.painRatings), allZoneKeys);
  const urgentIssue = urgent ? { ...urgent, runId: ratedRuns[ratedRuns.length-1].id } : null;
  const zoneKeys = allZoneKeys.filter(k=>k!==urgent?.zone);
  // painAdaptationTier (4.6.b) remplace l'ancien detectRepeatedPain à seuil
  // fixe (4) : distingue "Petit" (intensité 4-5, ajustement automatique)
  // de "Gros" (intensité >=6, proposé à valider) — les deux paliers
  // restent mutuellement exclusifs (logic.js).
  const painTier = painAdaptationTier(recentRatings, zoneKeys);
  const degraded = detectDegradedWellbeing(recentRatings);
  const chargeGauge = chargeEntrainementGauge(acwr);
  // Phrases pensées pour commencer naturellement après "à cause d'" (voir
  // le rationale "easy" dans logic.js) : pas de jargon (ACWR) exposé tel
  // quel à l'utilisateur.
  let avoidQualityReason = null;
  let painZone = null;
  if(painTier?.tier==="petit"){
    painZone = painTier.zone;
    avoidQualityReason = `une douleur répétée au niveau de ${(BODY_ZONES.find(z=>z[0]===painZone)?.[1]||painZone).toLowerCase()}`;
  }
  else if(structure.reason==="acwr_high" && !chargeGauge.severe) avoidQualityReason = "une charge d'entraînement qui a beaucoup augmenté récemment";
  else if(degraded) avoidQualityReason = "une fatigue ou un état d'esprit plus bas que d'habitude, d'après ta dernière notation";
  // Palier "Gros" (4.6.b) : douleur d'intensité >=6 répétée, OU charge
  // d'entraînement sévère (>1.5, même seuil que la jauge de 4.4) — proposé
  // à l'utilisateur, jamais appliqué automatiquement.
  let grosIssue = null;
  if(painTier?.tier==="gros") grosIssue = { type:"pain", zone:painTier.zone };
  else if(chargeGauge.severe) grosIssue = { type:"charge" };
  return { structure, avoidQualityReason, acwr, painZone, grosIssue, urgentIssue };
}

// Génère et persiste une semaine (lundi `mondayDate`) — n'écrase jamais une
// semaine déjà générée (vérifié par l'appelant). `opts.silent` : pas
// d'alerte/confirmation visuelle, utilisé pour la génération paresseuse
// automatique (semaine courante/suivante à l'ouverture de l'onglet).
// Explique pourquoi CE jour précisément (pas juste pourquoi ce type de
// séance) — complète le rationale déjà produit par le moteur (logic.js).
// Reflète honnêtement l'algo réel : répartition régulière sur les jours
// disponibles + jamais le même jour qu'une autre séance de course.
const DAY_NAMES_FR = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
function dayPlacementNote(dayIndex, isQuality, isCrossTraining){
  const day = DAY_NAMES_FR[dayIndex];
  if(isCrossTraining) return ` Elle est placée le ${day}, un jour sans course et sans course prévue le lendemain, pour éviter de cumuler la fatigue de la course avec celle du renforcement, et pour ne pas arriver à ta prochaine course avec des courbatures.`;
  if(isQuality) return ` Elle est placée le ${day}, l'un de tes jours disponibles pour courir, avec du repos avant et après plutôt que d'enchaîner deux séances difficiles.`;
  return ` Elle est placée le ${day}, répartie avec tes autres sorties pour étaler l'effort sur la semaine plutôt que de tout regrouper.`;
}

// Génère et persiste une semaine — ADDITIF/idempotent : n'écrase ni ne
// duplique jamais ce qui existe déjà, complète seulement ce qui manque
// (course et/ou complémentaire pris séparément). Permet de planifier une
// semaine à l'avance sans attendre qu'elle soit vide, et de rappeler
// "compléter" une semaine qui n'a par exemple que des séances de course
// sans avoir à tout supprimer d'abord.
// Verrou en mémoire par semaine : la génération auto en tâche de fond
// (applyProgramAdjustments, jusqu'à 4 semaines à l'ouverture de l'onglet)
// et un clic manuel peuvent viser la même semaine en même temps — sans ce
// verrou, les deux liraient "rien à compléter" avant que l'un des deux
// n'ait fini d'écrire, et dupliqueraient les séances complémentaires.
let programGenerationInFlight = new Set();
// D75 : sans objectif ni disponibilités, pas d'alerte du navigateur, un message discret qui mène au Profil.
function profileMissingToast(){
  toast("Il nous manque ton objectif et tes disponibilités pour construire ta semaine.", { actionLabel:"Compléter mon profil", onAction:()=>setTab("objectifs"), ms:8000 });
}
window.generateProgram = async (mondayDate, opts) => {
  opts = opts || {};
  const mondayStr = localDateStr(mondayDate);
  // Aucune séance générée à venir avant cet appel : celles qu'on crée ici reflètent les réglages actuels (voir programSignature).
  const hadRecalculable = recalculableSessions(plannedSessions, localDateStr(new Date())).length>0;
  if(programGenerationInFlight.has(mondayStr)) return;
  programGenerationInFlight.add(mondayStr);
  try{
  const profile = runnerProfile();
  // Plan marche/course (4.1.d) : pendant ses 9 semaines, il remplace le
  // moteur de course et ne demande aucun temps de référence.
  const couchWeek = programSettings?.beginnerPlan ? couchWeekNumber(programSettings.beginnerPlan.startMonday, mondayStr) : null;
  const isCouch = couchWeek!=null && couchWeek>=1 && couchWeek<=COUCH_WEEKS;
  if(!profile && !isCouch){ if(!opts.silent) profileMissingToast(); return; }
  const existing = plannedSessions.filter(p=>p.week_start_date===mondayStr && (p.status==="planned"||p.status==="done"));
  const dayIndexOf = (dateStr) => Math.round((new Date(dateStr+"T00:00:00") - mondayDate) / 86400000);
  // Jours où une NOUVELLE course ne peut pas aller : course ou renfo déjà
  // là (une séance légère, elle, peut cohabiter, voir sessionsCanShareDay).
  const dayBlockedForRun = existing.filter(p=>!sessionsCanShareDay({pace_zone:"easy"}, p)).map(p=>dayIndexOf(p.planned_date));
  // Comparé au NOMBRE cible (goals.frequence/frequenceAutre), pas juste à
  // "en existe-t-il au moins une" : sinon une seule séance ajoutée à la
  // main (ex: 1 renfo alors que 2/semaine sont visées) faisait croire la
  // semaine "complète" et masquait le bouton pour ajouter le reste.
  const minDayIndex = opts.fromToday && mondayStr===localDateStr(mondayOf(new Date())) ? dayIndexOf(localDateStr(new Date())) : 0;
  const desiredRunning = isCouch ? 3 : (Number(goals.frequence) || 3);
  const desiredCross = Number(goals.frequenceAutre) || 0;
  const actualRunning = existing.filter(p=>p.pace_zone).length;
  const actualCross = existing.filter(p=>!p.pace_zone).length;
  const missingRunning = Math.max(0, desiredRunning - actualRunning);
  const missingCross = Math.max(0, desiredCross - actualCross);
  if(missingRunning<=0 && missingCross<=0){ if(!opts.silent) toast("Cette semaine a déjà un programme complet. Supprime une séance si tu veux en générer une nouvelle."); return; }

  const { structure, avoidQualityReason } = computeProgramInputs();
  const weeklyKm = goals.kmMensuel ? Number(goals.kmMensuel)/4.33 : 20;
  const unavailable = (goals.joursIndisponibles ? goals.joursIndisponibles.split(",") : []).map(Number);
  // Semaines consécutives -> weekIndex consécutifs (mondayDate est toujours
  // un lundi minuit local, l'écart est exactement 7j en ms) : sert à
  // alterner Seuil/Fractionné d'une semaine sur l'autre, voir
  // qualityZoneForSlot dans logic.js.
  const weekIndex = Math.floor(mondayDate.getTime()/(7*24*3600*1000));
  const { data:{user} } = await supa.auth.getUser();
  if(!user) return;

  let generated = [];
  let runningRows = [];
  if(missingRunning>0){
    // `opts.fromToday` (mise à jour du programme) : jamais de séance dans le passé de la semaine en cours.
    const availableDayIndexes = [0,1,2,3,4,5,6].filter(d=>!unavailable.includes(d) && !dayBlockedForRun.includes(d) && d>=minDayIndex);
    if(minDayIndex>0 && !isCouch && !availableDayIndexes.length){ /* plus de jour disponible cette semaine */ }
    else if(isCouch){
      // Cette semaine : pas de séance dans le passé.
      const todayIndex = mondayStr===localDateStr(mondayOf(new Date())) ? dayIndexOf(localDateStr(new Date())) : 0;
      const days = pickSpacedDays(availableDayIndexes.filter(d=>d>=todayIndex), missingRunning);
      generated = days.map(d=>({dayIndex:d}));
      runningRows = couchSessionRows(couchWeek, days, actualRunning+1).map(r => ({
        user_id:user.id,
        planned_date: addDaysStr(mondayDate, r.dayIndex),
        week_start_date: mondayStr,
        type:"EF", pace_zone:"easy",
        title:r.title, description:r.description, target_duration_min:r.durationMin,
        rationale: r.rationale + dayPlacementNote(r.dayIndex, false, false),
        status:"planned", source:"generated", generation_reason:"beginner_plan",
      }));
    } else {
    generated = generateWeekSessions({ profile, structure, weeklyKm, frequency:missingRunning, availableDayIndexes, avoidQualityReason, weekIndex });
    runningRows = generated.map(s => ({
      user_id:user.id,
      planned_date: addDaysStr(mondayDate, s.dayIndex),
      week_start_date: mondayStr,
      type: sessionRunType(s.paceZone),
      pace_zone: s.paceZone,
      title: s.type==="Qualité" ? "Séance qualité" : "Sortie easy",
      target_distance_km: s.distanceKm,
      target_pace_sec_per_km: s.targetPaceSecPerKm,
      rationale: s.rationale + dayPlacementNote(s.dayIndex, s.type==="Qualité", false),
      status:"planned", source:"generated",
      generation_reason: avoidQualityReason ? "pain_repeat_or_wellbeing" : (structure.reason||null),
    }));
    }
  }

  let crossRows = [];
  if(missingCross>0){
    // Séances complémentaires (renfo/mobilité/yoga) : une séance légère
    // peut tomber le même jour qu'une course, jamais le renfo ; jamais non
    // plus la VEILLE d'une course, peu importe son type (retour
    // utilisateur : courbatures/risque de blessure le lendemain). Le
    // dimanche de cette semaine compte aussi s'il précède une course déjà
    // planifiée le lundi suivant.
    const existingRunningDayIndexes = existing.filter(p=>sessionCategory(p)==="run").map(p=>dayIndexOf(p.planned_date));
    const takenCrossDayIndexes = existing.filter(p=>sessionCategory(p)!=="run").map(p=>dayIndexOf(p.planned_date));
    const allRunningDayIndexes = [...existingRunningDayIndexes, ...generated.map(s=>s.dayIndex)];
    const dayBeforeRunning = allRunningDayIndexes.map(d=>d-1).filter(d=>d>=0);
    const nextMondayStr = addDaysStr(mondayDate, 7);
    const hasRunningNextMonday = plannedSessions.some(p=>p.planned_date===nextMondayStr && p.pace_zone && (p.status==="planned"||p.status==="done"));
    const avoidDayIndexes = [...dayBeforeRunning, ...(hasRunningNextMonday ? [6] : []), ...Array.from({length:minDayIndex}, (_,d)=>d)];
    const crossTraining = generateCrossTrainingSessions(missingCross, allRunningDayIndexes, weekIndex, avoidDayIndexes, takenCrossDayIndexes);
    // Exercices concrets (4.7.c) pour Renfo/Mobilité ; Yoga reste sans liste
    // (pas dans la base d'exercices).
    crossRows = crossTraining.map((s, i) => {
      const strength = buildStrengthSession({
        type: s.type, niveau: goals.niveau, objectif: goals.principal?.objectifPrincipal,
        pausedZoneKeys: suspendedZones.map(z=>z.zone), rotationSeed: weekIndex*3 + i,
      });
      return {
        user_id:user.id,
        planned_date: addDaysStr(mondayDate, s.dayIndex),
        week_start_date: mondayStr,
        type: s.type, pace_zone: null, title: s.type,
        description: strength ? formatExerciseList(strength.exercises) : null,
        target_duration_min: strength ? strength.durationMin : null,
        rationale: s.rationale + dayPlacementNote(s.dayIndex, false, true),
        status:"planned", source:"generated",
      };
    });
  }

  const rows = [...runningRows, ...crossRows];
  if(!rows.length){ if(!opts.silent) profileMissingToast(); return; }
  const { error } = await supa.from("planned_sessions").insert(rows);
  if(error){ if(!opts.silent) toast("Ta semaine n'a pas pu être générée, vérifie ta connexion et réessaie."); return; }
  await loadData();
  if(!isCouch && !hadRecalculable) await saveProgramSignature();
  if(!opts.silent){ renderContent(); flashSaved("programSaved"); } else { renderContent(); }
  } finally { programGenerationInFlight.delete(mondayStr); }
};

// Édition manuelle directe (distance/allure) — simple UPDATE comme
// valider/décaler, pas le pattern "supersede" : c'est l'utilisateur qui
// choisit sa propre valeur, ce n'est pas le moteur qui "régénère" pour un
// motif à tracer.
// Types qui ne sont pas une séance de course — sert à avertir (pas
// bloquer) quand l'utilisateur place LUI-MÊME une de ces séances la
// veille d'une course déjà planifiée (retour utilisateur : courbatures/
// risque de blessure le lendemain). Le moteur de génération applique déjà
// cette règle automatiquement, voir avoidDayIndexes dans generateProgram.
const NON_RUNNING_TYPES = ["Renfo","Mobilité","Yoga","Étirements","Kiné","Pilates","Other"];
function warnIfDayBeforeRun(dateStr, type){
  if(!NON_RUNNING_TYPES.includes(type)) return;
  const nextDateStr = addDaysStr(new Date(dateStr+"T00:00:00"), 1);
  const hasRunNextDay = plannedSessions.some(p=>p.planned_date===nextDateStr && p.pace_zone && (p.status==="planned"||p.status==="done"));
  if(hasRunNextDay) toast("Petit conseil : tu as une course prévue le lendemain. Des jambes courbaturées rendent la course plus difficile, tu peux la déplacer si tu préfères.", { ms:6000 });
}
// Retire une séance du calendrier — status='skipped' plutôt qu'un vrai
// DELETE, cohérent avec le reste du Programme (jamais de suppression
// silencieuse ni de perte d'historique, voir le pattern "supersede" de
// regenerateSession). 'skipped' n'apparaît dans aucune vue active
// (programDayColHTML/programMonthCellHTML filtrent sur planned/done), le
// jour redevient donc "Repos".
// La séance est retirée (statut « skipped », rien n'est effacé). Depuis le menu « … » ou la feuille « Modifier », on demande d'abord
// confirmation (carte « Supprimer cette séance ? ») puis un court message « Séance supprimée. » ; depuis une alerte, où le choix est déjà
// explicite, pas de carte : un message de 3,5 s propose « Annuler » (D92).
async function deleteSessionNow(id, opts){
  const before = plannedSessions.find(p=>p.id===id);
  const previous = before ? before.status : "planned";
  const { error } = await supa.from("planned_sessions").update({status:"skipped", updated_at:new Date().toISOString()}).eq("id", id);
  if(error){ toastRetry("Pas enregistré, vérifie ta connexion.", ()=>deleteSessionNow(id, opts)); return; }
  await loadData(); renderContent();
  if(opts && opts.confirmed){ toast("Séance supprimée."); return; }
  toast("Séance retirée du calendrier.", { actionLabel:"Annuler", ms:3500, onAction: async () => {
    const { error:e2 } = await supa.from("planned_sessions").update({status:previous, updated_at:new Date().toISOString()}).eq("id", id);
    if(e2){ toast("Pas rétablie, vérifie ta connexion."); return; }
    await loadData(); renderContent();
  } });
}
window.deleteSession = (id) => deleteSessionNow(id, {});
let sessionDelete = null;   // { id } : carte de confirmation ouverte
window.askDeleteSession = (id) => { if(!plannedSessions.find(p=>p.id===id)) return; sessionDelete = { id }; renderSessionDeleteConfirm(); };
window.cancelDeleteSession = () => { sessionDelete = null; renderSessionDeleteConfirm(); };
window.confirmDeleteSession = async () => {
  const id = sessionDelete && sessionDelete.id;
  sessionDelete = null; renderSessionDeleteConfirm();
  if(!id) return;
  if(programSheet && programSheet.sessionId===id){ programSheet = null; refreshSheet(); }
  await deleteSessionNow(id, { confirmed:true });
};
function renderSessionDeleteConfirm(){
  const root = document.getElementById("confirmRoot");
  if(!root) return;
  if(!sessionDelete){ root.innerHTML = ""; return; }
  const s = plannedSessions.find(p=>p.id===sessionDelete.id);
  const what = s ? `${sessionSmallTitle(s)} · ${dayLabelShort(new Date(s.planned_date+"T00:00:00"))}` : "Cette séance";
  root.innerHTML = `<div class="confirm-back" onclick="if(event.target===this)cancelDeleteSession()"><div class="confirm-card" role="alertdialog" aria-modal="true" aria-label="Supprimer cette séance ?"><h2>Supprimer cette séance ?</h2><p>${escHtml(what)} sera retirée de ton calendrier.</p><div class="confirm-btns"><button type="button" onclick="cancelDeleteSession()">Annuler</button><button type="button" class="go danger" onclick="confirmDeleteSession()">Supprimer</button></div></div></div>`;
  const first = root.querySelector(".confirm-btns button"); if(first) first.focus();   // le focus est sur « Annuler », l'action sûre
}
document.addEventListener("keydown", (e) => { if(e.key==="Escape" && sessionDelete) cancelDeleteSession(); });
const SAME_DAY_REFUSAL = "On ne peut pas mettre ces deux séances le même jour : une course accepte une séance légère, mais pas une autre course ni du renfo, pour que tu récupères entre deux efforts.";
// Une séance planifiée passe automatiquement à "faite" dès qu'une séance
// réelle synchronisée (HealthKit) existe le même jour — inutile de
// demander confirmation à l'utilisateur, la synchro fait foi. Le ressenti
// est déjà proposé ailleurs (bannière séance non notée), pas besoin de le
// redéclencher ici.
async function reconcilePlannedSessions(){
  const matchingRun = (p) => RUNS.find(r=>localDateStr(dateFromRun(r))===p.planned_date && plannedSessionMatchesRun(p, r));
  const todo = plannedSessions.filter(p=>p.status==="planned" && matchingRun(p));
  const missed = detectMissedSessions(plannedSessions, localDateStr(new Date()));
  if(!todo.length && !missed.length) return;
  for(const p of todo){
    const match = matchingRun(p);
    await supa.from("planned_sessions").update({status:"done", linked_run_id:match.id, updated_at:new Date().toISOString()}).eq("id", p.id);
    p.status = "done"; p.linked_run_id = match.id;
    if(p.generation_reason==="guided_test") await applyGuidedTestResult(match);
  }
  // Une séance dans `todo` a forcément une vraie course associée, donc ne
  // peut jamais être aussi dans `missed` (qui exige status==="planned"
  // encore intact au moment du calcul) — mais on filtre quand même par
  // sécurité si l'ordre des deux listes venait à se chevaucher un jour.
  for(const p of missed.filter(m=>!todo.includes(m))){
    await supa.from("planned_sessions").update({status:"missed", updated_at:new Date().toISOString()}).eq("id", p.id);
    p.status = "missed";
  }
  renderContent();
}
// Bannière "séance manquée" (4.3.c) : pas de vraie notification push (voir
// noRecentRunBanner ci-dessus, même limite) — ce bandeau à l'ouverture de
// Programme en fait office. "Réorganiser automatiquement" applique les
// garde-fous de 4.3.d (findRescheduleDay, logic.js) pour recaser la
// séance sur un autre jour sûr de la même semaine, ou l'abandonne si
// aucun jour ne respecte les règles.
// Recase une séance manquée sur un autre jour sûr de la même semaine
// (4.3.d) — jamais le même jour qu'une autre séance, jamais collée à une
// autre séance intense (sauf en dernier recours si elle-même est une
// séance de qualité, cf findRescheduleDay). Si aucun jour ne convient,
// la séance reste "missed" (abandon, comme prévu par le CDC).
// Jour où replacer une séance ratée : la semaine EN COURS, à partir d'aujourd'hui (jamais dans le passé, ni dans la semaine
// d'origine d'une séance ancienne). Renvoie { date, weekStart } ou null s'il n'y a aucun jour sans surcharger la semaine.
function currentWeekSlotFor(session, excludeId){
  const monday = mondayOf(new Date()), mondayStr = localDateStr(monday);
  const todayIdx = Math.round((new Date(localDateStr(new Date())+"T00:00:00") - monday)/86400000);
  const weekSessions = plannedSessions
    .filter(p=>p.id!==excludeId && p.week_start_date===mondayStr && (p.status==="planned"||p.status==="done"))
    .map(p=>({ dayIndex: Math.round((new Date(p.planned_date+"T00:00:00")-monday)/86400000), pace_zone: p.pace_zone, type: p.type }));
  const unavailable = (goals.joursIndisponibles ? goals.joursIndisponibles.split(",") : []).map(Number);
  const availableDayIndexes = [0,1,2,3,4,5,6].filter(d=>!unavailable.includes(d) && d>=todayIdx);
  const isPriority = isIntensePaceZone(session.pace_zone);
  const day = findRescheduleDay({pace_zone:session.pace_zone, type:session.type}, weekSessions, availableDayIndexes, isPriority);
  return day==null ? null : { date:localDateStr(addDays(monday, day)), weekStart:mondayStr };
}
const NO_FREE_DAY_TOAST = "On n'a pas trouvé de jour pour la replacer sans surcharger ta semaine. Pas de souci : on la laisse de côté, ce qui compte c'est de retrouver ton rythme.";
window.rescheduleMissedSession = async (id) => {
  const old = plannedSessions.find(p=>p.id===id);
  if(!old) return;
  const slot = currentWeekSlotFor(old, old.id);
  if(!slot){ toast(NO_FREE_DAY_TOAST, { ms:6000 }); return; }
  const { error } = await supa.from("planned_sessions").update({planned_date:slot.date, week_start_date:slot.weekStart, status:"planned", updated_at:new Date().toISOString()}).eq("id", id);
  if(error){ toast("Pas enregistré, vérifie ta connexion."); return; }
  await loadData(); renderContent();
};
function dismissedMissedIds(){

}
window.dismissMissedSession = (id) => {

    ids.push(id);

  renderContent();
};

window.suspendZone = async (zoneKey) => {
  if(suspendedZones.some(z=>z.zone===zoneKey)) return;
  const next = [...suspendedZones, { zone: zoneKey, since: new Date().toISOString() }];
  if(!(await upsertProfile({ suspended_zones: next }))) return;
  suspendedZones = next;
  renderContent();
};
window.resumeZone = async (zoneKey) => {
  const next = suspendedZones.filter(z=>z.zone!==zoneKey);
  if(!(await upsertProfile({ suspended_zones: next }))) return;
  suspendedZones = next;
  renderContent();
};
// Alertes de Programme (D7, D51) : une conditions par bannière, partagée entre l'affichage et
// le point violet du menu. L'ordre d'affichage vient de orderProgramAlerts (logic.js).
function urgentAlert(inputs){
  const { urgentIssue } = inputs || computeProgramInputs();
  if(!urgentIssue) return null;
  const sig = `urgent_${urgentIssue.zone}_${urgentIssue.runId}`;
  return dismissedUrgentIds().includes(sig) ? null : { kind:"urgent", sig, issue:urgentIssue };
}
function grosAlert(inputs){
  const { grosIssue } = inputs || computeProgramInputs();
  if(!grosIssue) return null;
  const sig = grosIssue.type==="pain" ? `pain_${grosIssue.zone}` : "charge";
  return dismissedGrosIds().includes(sig) ? null : { kind:"gros", sig, issue:grosIssue };
}
function missedAlert(){
  const missed = missedBannerSessions(plannedSessions, dismissedMissedIds(), localDateStr(new Date()));   // les plus récentes d'abord, 14 jours au plus
  return missed.length ? { kind:"missed", sessions:missed } : null;
}
function programAlerts(){
  const inputs = computeProgramInputs();
  return orderProgramAlerts([urgentAlert(inputs), grosAlert(inputs), missedAlert()]);
}

function alertCardHTML(a){
  const todayStr = localDateStr(new Date());
  const next = plannedSessions.filter(p=>p.status==="planned" && p.pace_zone && p.planned_date>=todayStr).sort((x,y)=>x.planned_date.localeCompare(y.planned_date))[0];
  const card = (ic, title, text, rows, note, strong) => `<div class="alert-card${strong?" strong":""}" role="alert">
    <div class="al-head"><span class="al-ic">${icon(ic,18)}</span><div><div class="al-title">${escHtml(title)}</div>${text?`<div class="al-text">${text}</div>`:""}</div></div>
    ${rows}${note?`<div class="al-note">${escHtml(note)}</div>`:""}
  </div>`;
  if(a.kind==="urgent"){
    const zone = (ZONE_SHORT_LABEL[a.issue.zone]||a.issue.zone).toLowerCase();
    const why = a.issue.reason==="severe" ? "Elle est très forte" : "Elle revient séance après séance";
    const rows = alRow("J'ai compris, mettre cette zone en pause", `suspendZone('${a.issue.zone}')`)
      + (next ? alRow("Supprimer ma prochaine course", `deleteSession('${next.id}')`) + alRow("Remplacer ma prochaine course par du renfo", `replaceSessionWithRenfo('${next.id}','')`) : "")
      + alRow("Je continue quand même", `dismissUrgentPain('${a.sig}')`);
    return card("alert", `Cette douleur au niveau de ${zone} mérite un avis médical.`,
      `${escHtml(why)}. Continuer comme si de rien n'était risque de l'aggraver : on te conseille de consulter un médecin ou un kiné avant de reprendre des efforts qui sollicitent cette zone. Cette application ne pose pas de diagnostic.<br><br>En attendant, on peut mettre cette zone en pause : plus d'exercices de mobilité ou de renfo ciblés dessus. Tu peux aussi continuer si tu le souhaites, c'est ton choix.`, rows, "", true);
  }
  if(a.kind==="gros"){
    const isPain = a.issue.type==="pain";
    const zone = isPain ? (ZONE_SHORT_LABEL[a.issue.zone]||a.issue.zone).toLowerCase() : null;
    const { acwr } = computeProgramInputs();
    const title = isPain ? `Une douleur assez marquée revient au niveau de ${zone}.`
      : `Ta charge d'entraînement a augmenté très vite${acwr!=null ? " : "+Number(acwr).toFixed(2).replace(".",",") : ""}.`;
    const rows = (next ? alRow("Supprimer cette séance", `deleteSessionFromGrosBanner('${next.id}','${a.sig}')`) + alRow("Remplacer par du renfo", `replaceSessionWithRenfo('${next.id}','${a.sig}')`) + alShiftBlock(next.week_start_date, a.sig) : "")
      + alRow("Revoir mon objectif", "goToObjectifs()") + alRow("Ignorer pour l'instant", `dismissGrosAdaptation('${a.sig}')`);
    return card(isPain ? "alert" : "gauge", title, "Ce n'est pas anodin : choisis ce qui te convient le mieux.", rows,
      isPain ? "Si cette gêne persiste, pense à consulter un médecin ou un kiné pour préciser tes gênes et ajuster les exercices." : "", false);
  }
  const p = a.sessions[0];
  const rows = alRow("La replacer cette semaine", `rescheduleMissedSession('${p.id}')`) + alRow("La remplacer par une EF", `replaceWithEasy('${p.id}')`) + alRow("La laisser passer", `dismissMissedSession('${p.id}')`);
  return card("calendarX", missedBannerTitle(p, localDateStr(new Date())), "Ça arrive à tout le monde : choisis ce qui te convient le mieux.", rows, "", false);
}

// "Remplacer par du renfo" : contrairement à la mobilité ciblée du palier
// "Petit" (ajoutée EN PLUS, 4.6.a), ici on REMPLACE la séance de course
// elle-même (pattern "supersede", comme regenerateSession) — le palier
// "Gros" juge que continuer à courir n'est pas une bonne idée du tout.
window.replaceSessionWithRenfo = async (id, sig) => {
  const old = plannedSessions.find(p=>p.id===id);
  if(!old) return;
  const { data:{user} } = await supa.auth.getUser();
  const { data: inserted, error: insErr } = await supa.from("planned_sessions").insert({
    user_id:user.id, planned_date:old.planned_date, week_start_date:old.week_start_date,
    type:"Renfo", pace_zone:null,
    title:"Renfo (à la place de la course)",
    rationale:"Cette séance de course a été remplacée par du renfo, le temps de laisser la gêne se calmer. Tu peux la modifier si elle ne te convient pas.",
    status:"planned", source:"manual_edit", generation_reason:"pain_repeat_or_wellbeing",
    replaces_session_id: old.id,
  }).select().single();
  if(insErr){ toast("Pas enregistré, vérifie ta connexion."); return; }
  await supa.from("planned_sessions").update({status:"replaced", superseded_by_id:inserted.id, updated_at:new Date().toISOString()}).eq("id", old.id);
  if(sig) window.dismissGrosAdaptation(sig);
  else { await loadData(); renderContent(); }
};
// Décale toutes les séances restantes de la semaine (celles à venir,
// statut "planned") de N jours — jamais celles déjà passées/faites.
// Refuse silencieusement (laisse la séance en place) si le nouveau jour
// est déjà occupé, plutôt que d'écraser une autre séance : averti à la
// fin si certaines n'ont pas pu être décalées.
window.shiftWeekByDays = async (weekStartDate, days) => {
  const todayStr = localDateStr(new Date());
  const toShift = plannedSessions.filter(p=>p.week_start_date===weekStartDate && p.status==="planned" && p.planned_date>=todayStr);
  let skipped = 0;
  for(const p of toShift){
    const newDate = localDateStr(addDays(new Date(p.planned_date+"T00:00:00"), days));
    const occupied = plannedSessions.some(o=>o.id!==p.id && o.planned_date===newDate && (o.status==="planned"||o.status==="done") && !sessionsCanShareDay(p, o));
    if(occupied){ skipped++; continue; }
    const newMonday = localDateStr(mondayOf(new Date(newDate+"T00:00:00")));
    await supa.from("planned_sessions").update({planned_date:newDate, week_start_date:newMonday, updated_at:new Date().toISOString()}).eq("id", p.id);
  }
  await loadData(); renderContent();
  if(skipped) toast(`${skipped} séance${skipped>1?"s":""} n'${skipped>1?"ont":"a"} pas pu être décalée${skipped>1?"s":""} (jour déjà occupé) : à ajuster toi-même.`, { ms:6000 });
};

};

// Déplace une séance à une nouvelle date (glisser-déposer) — simple UPDATE
// (pas le pattern "supersede", contrairement à regenerateSession : ici le
// contenu de la séance ne change pas, seule sa date change, donc rien à
// tracer côté contenu). Refuse si le jour cible contient une séance qui ne
// peut pas cohabiter avec celle-ci (voir sessionsCanShareDay).
window.moveSessionToDate = async (id, newDateStr, opts) => {
  const s = plannedSessions.find(p=>p.id===id);
  if(!s || s.planned_date===newDateStr) return;
  const incompatible = plannedSessions.some(p=>p.id!==id && p.planned_date===newDateStr && (p.status==="planned"||p.status==="done") && !sessionsCanShareDay(s, p));
  if(incompatible){
    if(navigator.vibrate) navigator.vibrate([30,40,30]);
    toast(SAME_DAY_REFUSAL, { ms:6000, icon:"undo" });
    return;
  }
  const oldDate = s.planned_date;
  const monday = mondayOf(new Date(newDateStr+"T00:00:00"));
  const { error } = await supa.from("planned_sessions").update({planned_date:newDateStr, week_start_date:localDateStr(monday), updated_at:new Date().toISOString()}).eq("id", id);
  if(error){ toast("Pas enregistré, vérifie ta connexion."); return; }
  await loadData(); renderContent();
  if(opts && opts.silent) return;
  const label = new Date(newDateStr+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long", day:"numeric"});
  toast(`${sessionTypeLabel(s.type)} déplacé au ${label}.`, { actionLabel:"Annuler", ms:3500, onAction: () => window.moveSessionToDate(id, oldDate, { silent:true }) });
};

// Glisser-déposer par appui long (~0,5s), via Pointer Events plutôt que le
// drag-and-drop HTML5 natif — ce dernier n'est pas fiable au doigt sur
// mobile/Safari (usage principal de l'app), voir commentaire CSS .prog-board.
// Un appui court reste un simple tap (progSelectDay, via onclick) : le
// minuteur n'arme le drag qu'après le délai, et un déplacement trop rapide
// avant ce délai annule (c'est un scroll horizontal du calendrier, pas une
// intention de glisser-déposer).
let progDrag = null;
let progSuppressClick = false;
// Le geste est suivi via des listeners posés sur `document` (pointermove/up/
// cancel), PAS via setPointerCapture sur la carte d'origine : sur Safari
// iOS, la capture de pointeur en tactile n'est pas fiable — dès que le
// doigt quitte la carte, les événements peuvent partir vers l'élément situé
// dessous (qui n'a pas de handler), et le drop ne se déclenche alors jamais
// (constaté : la carte s'arme bien après l'appui long, mais rien ne bouge
// ensuite). Des listeners globaux reçoivent le geste quoi qu'il en soit.
function progDragStart(e, id){
  if(e.pointerType==="mouse" && e.button!==0) return;
  if(progDrag) progDragCancel(); // geste précédent mal terminé (rare) : on repart propre
  progDrag = { id, pointerId:e.pointerId, el:e.currentTarget, startX:e.clientX, startY:e.clientY, armed:false, ghost:null, timer:null };
  progDrag.timer = setTimeout(progArmDrag, 400);
  document.addEventListener("pointermove", progDragMove, {passive:false});
  document.addEventListener("pointerup", progDragEnd);
  document.addEventListener("pointercancel", progDragCancel);
}
function progArmDrag(){
  if(!progDrag) return;
  progDrag.armed = true;
  progDrag.el.style.touchAction = "none";
  progDrag.el.classList.add("prog-armed");
  progDrag.col = progDrag.el.closest(".prog-daycol");
  if(progDrag.col) progDrag.col.classList.add("origin");
  if(navigator.vibrate) navigator.vibrate(12);
  const r = progDrag.el.getBoundingClientRect();
  const ghost = progDrag.el.cloneNode(true);
  ghost.className = progDrag.el.className.replace("prog-armed","") + " prog-ghost";
  ghost.style.width = r.width+"px";
  ghost.style.height = r.height+"px";
  ghost.style.left = r.left+"px";
  ghost.style.top = r.top+"px";
  document.body.appendChild(ghost);
  progDrag.ghost = ghost;
  progDrag.offsetX = progDrag.startX - r.left;
  progDrag.offsetY = progDrag.startY - r.top;
}
function progDragMove(e){
  if(!progDrag || e.pointerId!==progDrag.pointerId) return;
  if(!progDrag.armed){
    if(Math.hypot(e.clientX-progDrag.startX, e.clientY-progDrag.startY) > 12){
      clearTimeout(progDrag.timer);
      progDrag = null;
      document.removeEventListener("pointermove", progDragMove);
      document.removeEventListener("pointerup", progDragEnd);
      document.removeEventListener("pointercancel", progDragCancel);
    }
    return;
  }
  e.preventDefault();
  progDrag.ghost.style.left = (e.clientX - progDrag.offsetX)+"px";
  progDrag.ghost.style.top = (e.clientY - progDrag.offsetY)+"px";
  progDrag.ghost.style.display = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  progDrag.ghost.style.display = "";
  document.querySelectorAll(".prog-daycol.dragover").forEach(c=>c.classList.remove("dragover"));
  const col = under?.closest(".prog-daycol");
  if(col && col!==progDrag.col) col.classList.add("dragover");
  const help = document.getElementById("pgHelp");
  if(help){
    if(col && col!==progDrag.col){
      const d = new Date(col.dataset.date+"T00:00:00");
      help.textContent = `Lâche sur ${d.toLocaleDateString("fr-FR",{weekday:"long", day:"numeric"})}…`;
    } else help.textContent = "Fais glisser sur un autre jour";
    help.style.display = "";
  }
}
function progDragEnd(e){
  if(!progDrag || e.pointerId!==progDrag.pointerId) return;
  document.removeEventListener("pointermove", progDragMove);
  document.removeEventListener("pointerup", progDragEnd);
  document.removeEventListener("pointercancel", progDragCancel);
  clearTimeout(progDrag.timer);
  if(!progDrag.armed){ progDrag = null; return; }
  progDrag.ghost?.remove();
  document.querySelectorAll(".prog-daycol.dragover").forEach(c=>c.classList.remove("dragover"));
  document.querySelectorAll(".prog-daycol.origin").forEach(c=>c.classList.remove("origin"));
  const helpEl = document.getElementById("pgHelp"); if(helpEl) helpEl.style.display = "none";
  progDrag.el.classList.remove("prog-armed");
  progDrag.el.style.touchAction = "";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const col = under?.closest(".prog-daycol");
  const targetDate = col?.dataset.date;
  const id = progDrag.id;
  progDrag = null;
  progSuppressClick = true; // évite qu'un clic fantôme après le drop ne rouvre/ferme le panneau
  setTimeout(()=>{ progSuppressClick = false; }, 300);
  if(targetDate) window.moveSessionToDate(id, targetDate);
}
function progDragCancel(e){
  if(!progDrag || (e && e.pointerId!==progDrag.pointerId)) return;
  document.removeEventListener("pointermove", progDragMove);
  document.removeEventListener("pointerup", progDragEnd);
  document.removeEventListener("pointercancel", progDragCancel);
  clearTimeout(progDrag.timer);
  progDrag.ghost?.remove();
  progDrag.el.classList.remove("prog-armed");
  progDrag.el.style.touchAction = "";
  document.querySelectorAll(".prog-daycol.dragover").forEach(c=>c.classList.remove("dragover"));
  document.querySelectorAll(".prog-daycol.origin").forEach(c=>c.classList.remove("origin"));
  const helpCancel = document.getElementById("pgHelp"); if(helpCancel) helpCancel.style.display = "none";
  progDrag = null;
}
// Remplace une séance par une version ajustée SANS jamais supprimer
// l'ancienne (pattern "supersede", voir migration_019) : l'ancienne passe
// replaced/superseded_by_id, la nouvelle porte replaces_session_id — la
// justification affichée explique toujours pourquoi le changement a eu
// lieu, jamais de suppression silencieuse.
window.regenerateSession = async (id, reason, auto) => {
  const old = plannedSessions.find(p=>p.id===id);
  if(!old) return;
  const profile = runnerProfile();
  if(!profile) return;
  const zones = paceZonesFromVdot(computeVdot(profile.distanceKm, profile.timeSec));
  const softer = reason!=="Manque de temps"; // "Manque de temps" raccourcit sans changer d'intensité, les autres motifs basculent en easy
  const newZone = softer ? "easy" : old.pace_zone;
  const { data:{user} } = await supa.auth.getUser();
  const changeDesc = softer ? "remplacée par une version plus facile" : "raccourcie";
  const rationale = auto
    ? `Cette séance a été ${changeDesc} automatiquement, car ${reason}. Tu peux la modifier si elle ne te convient pas.`
    : `Cette séance a été ${changeDesc} à ta demande, car tu avais indiqué : « ${reason} ».`;
  // Une séance ratée (dans le passé) est remplacée dans la semaine en cours, à partir d'aujourd'hui : jamais une séance neuve dans le passé.
  const isPast = old.planned_date < localDateStr(new Date());
  const slot = isPast ? currentWeekSlotFor(old, old.id) : null;
  if(isPast && !slot){ toast(NO_FREE_DAY_TOAST, { ms:6000 }); return; }
  const { data: inserted, error: insErr } = await supa.from("planned_sessions").insert({
    user_id:user.id, planned_date:slot ? slot.date : old.planned_date, week_start_date:slot ? slot.weekStart : old.week_start_date,
    type: sessionRunType(newZone), pace_zone:newZone,
    title: softer ? "Sortie easy (ajustée)" : old.title,
    // 15% de réduction (palier "Petit", CDC v2 4.6.a : 10-20%) — pas 30%
    // comme avant, jugé trop sévère pour un simple ajustement automatique.
    target_distance_km: softer ? Math.round(old.target_distance_km*0.85*10)/10 : Math.round(old.target_distance_km*0.8*10)/10,
    target_pace_sec_per_km: zones[newZone],
    rationale,
    status:"planned", source:"manual_edit", generation_reason:"user_constraint",
    replaces_session_id: old.id,
  }).select().single();
  if(insErr){ toast("Pas enregistré, vérifie ta connexion."); return; }
  await supa.from("planned_sessions").update({status:"replaced", superseded_by_id:inserted.id, updated_at:new Date().toISOString()}).eq("id", old.id);
  await loadData(); renderContent();
};
window.replaceWithEasy = (id) => window.regenerateSession(id, "Remplacer par une séance easy");

// Palier "Petit" (CDC v2, 4.6.a) : en plus d'assouplir la séance qualité
// touchée, ajoute une séance de Mobilité ciblée sur la zone douloureuse,
// avec la liste des exercices recommandés (EXERCISE_LIBRARY, logic.js)
// affichée dans sa description. Cherche un jour libre de la semaine avec
// findRescheduleDay (4.3.d) — une Mobilité n'est jamais "intense", donc
// seule la règle "jamais 2 séances le même jour" s'applique ici. Si aucun
// jour ne convient, n'ajoute rien plutôt que de forcer un doublon sur un
// jour déjà pris.
window.addTargetedMobilitySession = async (weekStartDate, zoneKey) => {
  const exercises = exercisesForZone(zoneKey);
  if(!exercises.length) return;
  const monday = new Date(weekStartDate+"T00:00:00");
  const weekSessions = plannedSessions
    .filter(p=>p.week_start_date===weekStartDate && (p.status==="planned"||p.status==="done"))
    .map(p=>({ dayIndex: Math.round((new Date(p.planned_date+"T00:00:00")-monday)/86400000), pace_zone: p.pace_zone, type: p.type }));
  const unavailable = (goals.joursIndisponibles ? goals.joursIndisponibles.split(",") : []).map(Number);
  const availableDayIndexes = [0,1,2,3,4,5,6].filter(d=>!unavailable.includes(d));
  const day = findRescheduleDay({pace_zone:null}, weekSessions, availableDayIndexes, false);
  if(day==null) return;
  const zoneLabel = (ZONE_SHORT_LABEL[zoneKey]||zoneKey).toLowerCase();
  const description = formatExerciseList(exercises);
  const { data:{user} } = await supa.auth.getUser();
  await supa.from("planned_sessions").insert({
    user_id:user.id, planned_date: localDateStr(addDays(monday, day)), week_start_date: weekStartDate,
    type:"Mobilité", pace_zone:null,
    title:`Mobilité ciblée — ${zoneLabel}`,
    description,
    rationale:`Ajoutée automatiquement car une douleur est revenue au niveau de ${zoneLabel} — ces exercices aident à soulager cette zone. Tu peux la modifier ou l'ignorer si elle ne te convient pas.`,
    status:"planned", source:"generated", generation_reason:"pain_repeat_or_wellbeing",
  });
};

// Boucle d'ajustement légère (voir plan) : pas de cron possible dans une
// SPA statique — tout se réévalue à l'ouverture de l'onglet. Génère
// paresseusement les semaines manquantes (courante, et suivante si on est
// dimanche) et ajuste automatiquement la toute prochaine séance planifiée
// si le ressenti récent le justifie — jamais silencieusement : la carte
// affiche toujours la raison, et l'ancienne version reste consultable
// (status='replaced', jamais supprimée).
let programAdjustmentChecked = false;
async function applyProgramAdjustments(){
  if(programAdjustmentChecked) return;
  const profile = runnerProfile();
  if(!profile && !beginnerPlanInProgress()) return; // pas encore prêt : on retentera au prochain rendu
  programAdjustmentChecked = true;

  // Les 4 prochaines semaines (courante incluse) sont générées si elles
  // n'ont JAMAIS été touchées (aucune ligne planned_sessions du tout,
  // même "skipped") — sert la vue Mois (qui les affiche toutes en un
  // empilement) et permet de voir/planifier à l'avance sans attendre le
  // dimanche. Ne complète PAS une semaine où l'utilisateur a déjà
  // supprimé une séance : generateProgram compte les séances actives
  // (planned/done) pour décider quoi ajouter, donc une semaine "vidée à la
  // main" redeviendrait automatiquement pleine au prochain chargement si
  // on l'appelait ici (bug constaté : une séance supprimée réapparaissait
  // toute seule). Compléter volontairement reste possible via le bouton
  // "Compléter cette semaine", déclenché explicitement par l'utilisateur.
  const thisMonday = mondayOf(new Date());
  for(let w=0; w<4; w++){
    const monday = addDays(thisMonday, w*7);
    const everTouched = plannedSessions.some(p=>p.week_start_date===localDateStr(monday));
    if(!everTouched) await window.generateProgram(monday, {silent:true});
  }
  // Compte existant sans mémoire de ses réglages (avant S8) : on suppose que son programme correspond aux réglages actuels ;
  // à partir de là, tout changement d'objectif, de séances, de renfo, de jours ou de niveau sera signalé (D62).
  if(!programSettings?.programSignature && plannedSessions.some(p=>p.source==="generated" && p.status!=="replaced")) await saveProgramSignature();

  const todayStr = localDateStr(new Date());
  // pace_zone truthy uniquement : les séances complémentaires (renfo/
  // mobilité/yoga, pace_zone=null) ne sont pas soumises à l'ajustement
  // ACWR/douleur, qui suppose une allure de course (regenerateSession).
  const next = plannedSessions.filter(p=>p.status==="planned" && p.pace_zone && p.planned_date>=todayStr).sort((a,b)=>a.planned_date.localeCompare(b.planned_date))[0];
  if(!next || next.pace_zone==="easy") return; // rien à assouplir sur une séance déjà easy
  const { avoidQualityReason, painZone } = computeProgramInputs();
  if(avoidQualityReason && next.generation_reason!=="user_constraint" && next.generation_reason!=="pain_repeat_or_wellbeing" && next.generation_reason!=="acwr_high"){
    await window.regenerateSession(next.id, avoidQualityReason, true);
    // Palier "Petit" (4.6.a) : une douleur répétée (contrairement à la
    // fatigue ou l'ACWR haut, qui n'ont pas de zone précise) ajoute aussi
    // une séance de mobilité ciblée sur la zone concernée.
    if(painZone) await window.addTargetedMobilitySession(next.week_start_date, painZone);
  }
}

// Plan marche/course en cours (semaines 1 à 9, ou pas encore démarré) : pas de temps de référence à demander. Après la
// semaine 9 : graduation (voir beginnerGraduationBannerHTML).
function beginnerPlanInProgress(){
  const plan = programSettings?.beginnerPlan;
  if(!plan) return false;
  return couchWeekNumber(plan.startMonday, localDateStr(mondayOf(new Date()))) <= COUCH_WEEKS;
}
// Sans temps de référence (« Ton niveau »), pas de programme : une carte mène à l'écran « Ton niveau » (S8, D76).
function programNeedLevelHTML(profile){
  if(profile || beginnerPlanInProgress()) return "";
  const resume = levelResumeInfo(goals, programSettings, RACE_DISTANCES_KM), planned = plannedGuidedTest();
  const text = planned ? `Ton test de 20 minutes est planifié ${dayLabelShort(new Date(planned.planned_date+"T00:00:00"))} : ton programme se construira juste après.`
    : resume ? `On utilisait ${levelResumeWhat(resume)} pour calculer tes allures. Dis-nous de quand il date, ou donne-nous un chrono récent.`
    : "Pour construire ton programme, il nous faut ton niveau en course : un chrono récent, ou le test guidé de 20 minutes.";
  return `<div class="al-need" role="status">
    <div class="ttl">${icon("info",18)}<span>${escHtml(text)}</span></div>
    ${planned ? "" : `<button type="button" class="btn-secondary" onclick="openLevelSheet('${resume?"resume":"main"}')">Renseigner mon niveau</button>`}
  </div>`;
}

// Exercices d'une séance (4.7.d, D4, D5) : une ligne par exercice avec sa vignette animée, son format et un
// « ⋮ » (Remplacer, Supprimer de la séance). Toucher la ligne ouvre le détail (feuille V1c). La description est
// enregistrée en texte (voir parseExerciseBlocks, logic.js) ; un changement ne vaut que pour cette séance.
let openExMenu = null;      // "idSéance|numéro" du « ⋮ » ouvert
let exerciseSheet = null;   // { sessionId, index, mode:"detail"|"replace" }
function exerciseListHTML(description, session){
  const found = exercisesInDescription(description);
  if(!found.length) return `<div style="font-size:13px;line-height:1.55;white-space:pre-line">${escHtml(description)}</div>`;
  const editable = !!session && session.status==="planned";
  return found.map((ex,i)=>{
    const key = session ? session.id+"|"+i : "";

    return `<div class="ex-row"${session?` onclick="openExerciseDetail('${session.id}',${i})"`:""}>

}
window.toggleExMenu = (key) => { openExMenu = openExMenu===key ? null : key; renderContent(); };
async function saveSessionDescription(id, description){
  const s = plannedSessions.find(p=>p.id===id);
  if(!s) return false;
  const { error } = await supa.from("planned_sessions").update({ description, updated_at:new Date().toISOString() }).eq("id", id);
  if(error){ toast("Pas enregistré, vérifie ta connexion."); return false; }
  s.description = description;
  return true;
}
window.removeExercise = async (sid, i) => {
  const s = plannedSessions.find(p=>p.id===sid);
  const ex = s && exercisesInDescription(s.description)[i];
  if(!ex) return;
  const before = s.description;
  openExMenu = null;
  if(!(await saveSessionDescription(sid, removeExerciseFromDescription(before, ex.name)))) return;
  closeExerciseSheet(); renderContent();
  toast("Exercice supprimé de la séance", { actionLabel:"Annuler", ms:5000, onAction: async () => { if(await saveSessionDescription(sid, before)) renderContent(); } });
};
window.chooseReplacement = async (sid, i, exId) => {
  const s = plannedSessions.find(p=>p.id===sid);
  const ex = s && exercisesInDescription(s.description)[i];
  const next = EXERCISE_LIBRARY.find(e=>e.id===exId);
  if(!ex || !next) return;
  const before = s.description;
  if(!(await saveSessionDescription(sid, replaceExerciseInDescription(before, ex.name, next)))) return;
  closeExerciseSheet(); renderContent();
  toast("Exercice remplacé", { actionLabel:"Annuler", ms:5000, onAction: async () => { if(await saveSessionDescription(sid, before)) renderContent(); } });
};
window.openExerciseDetail = (sid, i) => { openExMenu = null; exerciseSheet = { sessionId:sid, index:i, mode:"detail" }; renderExerciseSheet(); };
window.openExerciseReplace = (sid, i) => { openExMenu = null; exerciseSheet = { sessionId:sid, index:i, mode:"replace" }; renderExerciseSheet(); renderContent(); };
window.closeExerciseSheet = () => { exerciseSheet = null; refreshSheet(); };
window.exerciseNav = (delta) => {
  if(!exerciseSheet) return;
  const s = plannedSessions.find(p=>p.id===exerciseSheet.sessionId);
  const n = s ? exercisesInDescription(s.description).length : 0;
  exerciseSheet.index = Math.max(0, Math.min(n-1, exerciseSheet.index + delta));
  renderExerciseSheet();
};
function renderExerciseSheet(){

    <ul>${ex.consignes.map(c=>`<li>${escHtml(c)}</li>`).join("")}</ul>
    ${ex.variante ? `<div style="font-size:13.5px;color:var(--text-muted);margin-bottom:12px">${escHtml(ex.variante)}</div>` : ""}
    ${editable ? `<button type="button" class="btn-secondary" onclick="openExerciseReplace('${s.id}',${st.index})">Remplacer</button>
      <button type="button" class="btn-secondary" style="margin-top:8px;${dim}" onclick="removeExercise('${s.id}',${st.index})">Supprimer de la séance</button>` : ""}
    <div class="ex-nav"><button type="button" class="btn-secondary" ${st.index===0?"disabled":""} onclick="exerciseNav(-1)">Précédent</button><button type="button" class="btn-secondary" ${st.index===list.length-1?"disabled":""} onclick="exerciseNav(1)">Suivant</button></div>
  </div></div>`;
}
// "En savoir plus" (4.10.b) : texte long par type de séance, déplié à la

function weekTileHTML(day, i){
  const m = day.main, sec = day.second;
  const c = m ? (TC[m.type]||TC.Other) : null;
  let style = "";
  if(m && m.status==="fait") style = `background:${c};`;
  else if(m && m.status==="prevu") style = `border-color:${c};color:${c};`;
  else if(m && m.status==="manque") style = `color:${c};`;
  const bang = m && m.status==="manque" ? `<span class="wk-bang" aria-hidden="true">!</span>` : "";
  let plus = "";
  if(sec){
    const sc = TC[sec.type]||TC.Other;
    plus = sec.status==="fait"
      ? `<span class="wk-plus" style="background:${sc};color:var(--on-accent)" aria-hidden="true">+</span>`
      : `<span class="wk-plus" style="background:var(--surface-sunken);border:1.5px solid ${sc};color:${sc}" aria-hidden="true">+</span>`;

const GUIDED_TEST_SEEN_KEY = "mra_guidedTestSeen";
function guidedTestSeen(){ try{ return localStorage.getItem(GUIDED_TEST_SEEN_KEY)==="1"; }catch(e){ return false; } }
// Besoin de niveau : « test_done » (confirmation du test), « guided_test » (test à planifier) ou
// « graduation » (plan débutant fini, chrono à renseigner).
function levelResumeWhat(info){ return info.kind==="vma" ? "ta VMA" : info.kind==="record" ? "ton record" : info.fromTest ? "ton test de 20 minutes" : "ton chrono"; }
// S8 : « reprise » (comptes dont les allures reposaient sur un record, une VMA ou un temps sans date : on demande la date)
// et « stale » (le temps de référence a plus de 6 mois : on propose de le mettre à jour, sans arrêter le programme).
function levelNeed(){
  const gt = programSettings?.guidedTest, profile = runnerProfile();
  if(gt && gt.status==="done" && !guidedTestSeen()) return "test_done";
  if(gt && gt.status==="pending" && !profile && !beginnerPlanInProgress() && !plannedGuidedTest()) return "guided_test";
  const plan = programSettings?.beginnerPlan;
  if(plan && !beginnerPlanInProgress() && !profile) return "graduation";
  if(programSettings?.pendingLevel) return "new_paces";
  if(!beginnerPlanInProgress() && levelResumeInfo(goals, programSettings, RACE_DISTANCES_KM)) return "reprise";
  if(profile && profile.stale) return "stale";
  return null;
}
function levelCardHTML(){
  const need = levelNeed();
  if(!need) return "";
  const gt = programSettings?.guidedTest;
  let title, text, action;
  if(need==="test_done"){
    const km = String(gt.distanceKm).replace(".", ",");
    title = "Merci, ton test est analysé !";
    text = `D'après tes ${km} km en ${Math.round(gt.durationSec/60)} minutes, on a calculé tes allures et créé ton programme. Elles s'affineront au fil de tes séances.`;
    action = `<button class="btn-primary" onclick="dismissGuidedTestSeen()">Super</button>`;
  } else if(need==="guided_test"){
    title = gt.lastFailure ? "On refait le test ?" : "Fais le test de 20 minutes";
    text = gt.lastFailure==="duree" ? "Ton dernier test n'a pas pu servir : l'activité enregistrée doit durer entre 15 et 35 minutes (enregistre seulement la partie test de 20 minutes, pas l'échauffement ni la marche)."
      : gt.lastFailure==="distance" ? "Ton dernier test n'a pas pu servir : la distance parcourue est trop courte."
      : "Pour calculer tes allures et créer ton programme, on a besoin de ton niveau en course.";
    action = `<button class="btn-primary" onclick="scheduleGuidedTest()">Planifier mon test</button>`;
  } else if(need==="reprise"){
    const info = levelResumeInfo(goals, programSettings, RACE_DISTANCES_KM);
    title = "Une question sur ton niveau";
    text = `${info.kind==="undated" ? "On se sert de" : "On utilisait"} ${levelResumeWhat(info)} pour calculer tes allures. Seul un effort récent (moins de 6 mois) donne des allures justes : dis-nous de quand il date.`;
    action = `<button class="btn-primary" onclick="openLevelSheet('resume')">Répondre</button>`;
  } else if(need==="new_paces"){
    title = "Tes nouvelles allures sont prêtes";
    text = "Ton nouveau test de 20 minutes donne des allures différentes. Tu choisis de les appliquer ou de garder les anciennes.";
    action = `<button class="btn-primary" onclick="openPendingNewPaces()">Voir mes nouvelles allures</button>`;
  } else if(need==="stale"){
    title = "Mets ton niveau à jour";
    text = "Ton temps de référence date de plus de 6 mois. Refais un chrono ou le test de 20 minutes : tes allures resteront justes.";
    action = `<button class="btn-primary" onclick="openLevelSheet('main')">Mettre à jour mon niveau</button>`;
  } else {
    title = "Bravo, tu as terminé le programme marche/course !";
    text = "Tu cours maintenant 30 minutes d'affilée. Fais un 5 km à ton rythme, puis note ton temps : on s'en servira pour calculer tes allures et créer la suite de ton programme.";
    action = `<button class="btn-primary" onclick="openLevelSheet('chrono')">Renseigner mon chrono</button>`;
  }
  return `<div class="card">
    <div class="stitle" style="margin-bottom:8px">Ton niveau</div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.15;text-transform:uppercase;margin-bottom:6px">${escHtml(title)}</div>
    <div style="font-size:13.5px;line-height:1.5;color:var(--text-2);margin-bottom:12px">${escHtml(text)}</div>
    ${action}
  </div>`;
}

// (voir maybeCelebrate) ; la carte simple (A2) sert pour tous les records et reste ensuite jusqu'à demain.
function celebratedRunIds(){
  try{ return JSON.parse(localStorage.getItem("mra_celebratedRuns")||"[]"); }catch(e){ return []; }
}
function runAsRecord(r){
  const ip = r.type==="Fractionné" ? getIntervalPaces(r) : null;
  // cleanEf (D77) : sortie EF dont le cœur est resté en zones 1 et 2 ; sans données de FC, on ne peut pas l'affirmer.
  const cleanEf = r.type==="EF" && efQualitatif(r.hrSeries, maxHr || estimatedMaxHr(), restingHr || null)===true;
  return { id:r.id, ts:dateFromRun(r).getTime(), type:r.type, distKm:r.dist||0, durationSec:r.durationSec||0, paceSecKm:r.allure||0,
    workPaceSecKm: ip && (ip.manual || ip.workCount>=2) ? ip.work : 0, cleanEf };
}
function hierData(){
  const last = runningRuns[runningRuns.length-1];
  let records = [];
  if(last && shouldCelebrateRun(dateFromRun(last).getTime(), Date.now(), last.id, celebratedRunIds())){
    records = sortRecordsForHier(recordsForRun(runAsRecord(last), runningRuns.map(runAsRecord)));
  }
  let lastEff = null; try{ lastEff = localStorage.getItem("mra_effCelebratedAt"); }catch(e){}
  const eff = efficiencyCelebration(efRuns.map(r=>({ date:localDateStr(dateFromRun(r)), allure:r.allure, fc:r.fc })), localDateStr(new Date()), lastEff);
  const unrated = unratedRecentSession();
  if(!records.length && !eff && !unrated) return null;
  return { run:last, records, eff, unrated:!!unrated };
}

// ---------- Fermer une fenêtre du bas en tirant vers le bas (D96) ----------
// On prend la poignée (haut de la fenêtre) ou la ligne du titre ; la fenêtre suit le doigt et le fond s'éclaircit. Au relâchement,
// à partir d'un quart de la hauteur ou d'un geste rapide, on ferme comme si on avait touché le fond (chaque fenêtre garde sa propre
// fermeture) ; sinon elle revient en place. Avec « réduire les animations », pas de glissement de fin.
(function(){
  const reduced = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const root = document.getElementById("sheetRoot");
  const addGrab = () => root.querySelectorAll(".sheet:not([data-grab])").forEach(sh=>{
    sh.setAttribute("data-grab","1");
    const g = document.createElement("div"); g.className = "sheet-grab"; g.setAttribute("aria-hidden","true");
    sh.insertBefore(g, sh.firstChild);
  });
  if(root) new MutationObserver(addGrab).observe(root, { childList:true, subtree:true });
  let drag = null;
  document.addEventListener("pointerdown", (e) => {
    const sh = e.target.closest && e.target.closest("#sheetRoot .sheet");
    if(!sh || (e.pointerType==="mouse" && e.button!==0)) return;
    const grip = e.target.closest(".sheet-grab") || (e.target.closest(".sheet-head") && !e.target.closest("button,a,input,select,textarea"));
    if(!grip) return;
    drag = { sh, back:sh.closest(".sheet-back"), y0:e.clientY, dy:0, t0:performance.now(), id:e.pointerId, h:sh.getBoundingClientRect().height };
    try{ sh.setPointerCapture(e.pointerId); }catch(_){}
    sh.classList.remove("settle"); sh.classList.add("dragging");
  });
  document.addEventListener("pointermove", (e) => {
    if(!drag || e.pointerId!==drag.id) return;
    drag.dy = Math.max(0, e.clientY - drag.y0);
    drag.sh.style.transform = `translateY(${drag.dy}px)`;
    if(drag.back) drag.back.style.background = `rgba(0,0,0,${(0.6*Math.max(0, 1-drag.dy/drag.h)).toFixed(3)})`;
  });
  const end = (e) => {
    const d = drag;
    if(!d || (e && e.pointerId!==d.id)) return;
    drag = null;
    d.sh.classList.remove("dragging");
    const fast = d.dy>40 && d.dy/Math.max(1, performance.now()-d.t0) > 0.5;      // plus de 0,5 px/ms
    const reset = () => { d.sh.style.transform = ""; if(d.back) d.back.style.background = ""; };
    if(d.dy > d.h*0.25 || fast){
      const closeNow = () => { if(d.back) d.back.click(); };
      if(reduced() || !d.back) closeNow();
      else { d.sh.classList.add("settle"); d.sh.style.transform = `translateY(${d.h}px)`; setTimeout(closeNow, 200); }
    } else { if(!reduced()) d.sh.classList.add("settle"); reset(); }
  };
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
})();

// Une seule fois, à l'ouverture, pour les comptes qui existaient avant la refonte (règle : shouldShowNews, logic.js). Un compte

const NEWS_ID = "refonte-2026-10", NEWS_BEFORE = "2026-10-05", NEWS_SEEN_KEY = "mra_newsSeen";
function newsSeenIds(){ try{ const v = JSON.parse(localStorage.getItem(NEWS_SEEN_KEY)||"[]"); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function markNewsSeen(){ try{ localStorage.setItem(NEWS_SEEN_KEY, JSON.stringify([...new Set([...newsSeenIds(), NEWS_ID])])); }catch(e){} }
let newsSheet = false;
function maybeShowNews(){
  if(newsSheet || onbConnect || !document.getElementById("sheetRoot")) return;
  if(!shouldShowNews(onboardingCompletedAt, onboardingAutoMarked, newsSeenIds(), NEWS_ID, NEWS_BEFORE)) return;
  newsSheet = true; refreshSheet();
}
window.closeNews = () => { newsSheet = false; markNewsSeen(); refreshSheet(); maybeCelebrate(); };
document.addEventListener("keydown", (e) => { if(e.key==="Escape" && newsSheet) closeNews(); });
function renderNewsSheet(){
  if(!newsSheet) return false;
  const m = newsMessage(levelResumeInfo(goals, programSettings, RACE_DISTANCES_KM));
  document.getElementById("sheetRoot").innerHTML = `<div class="sheet-back" onclick="if(event.target===this)closeNews()"><div class="sheet" role="dialog" aria-modal="true" aria-label="${escHtml(m.title)}">
    ${sheetHeadHTML(m.title, "closeNews()")}
    <div class="np-intro">${escHtml(m.text)}</div>
    <button type="button" class="btn-primary" style="margin-top:14px" onclick="closeNews()">Compris</button>
  </div></div>`;
  const first = document.querySelector("#sheetRoot .btn-primary"); if(first) first.focus();
  return true;
}
// ---------- Célébration plein écran (S9, journal 10b-4 ; D55, D56, D57) ----------
// Seulement pour un record de distance (5 km, 10 km, semi, marathon) : s'ouvre une seule fois à l'ouverture de l'app, avec
// le petit bonhomme (record-man.js), puis la carte « Hier » prend le relais. « Plus tard » ferme sans rien noter ;
// avec « réduire les animations », l'écran final s'affiche directement.
const CEL_SHOWN_KEY = "mra_celebShown";
function celebShownIds(){ try{ return JSON.parse(localStorage.getItem(CEL_SHOWN_KEY)||"[]"); }catch(e){ return []; } }
let celebration = null; // { runId, info, unrated }
function maybeCelebrate(){
  if(celebration || newsSheet || !onboardingCompletedAt || !document.getElementById("celebrationRoot")) return;
  const h = hierData();
  if(!h || !h.run || !h.records.length) return;
  const info = celebrationToShow(h.records, h.run.id, celebShownIds());
  if(!info) return;
  try{ localStorage.setItem(CEL_SHOWN_KEY, JSON.stringify([...celebShownIds(), h.run.id].slice(-60))); }catch(e){}
  celebration = { runId:h.run.id, info, unrated:h.unrated };
  renderCelebration();
}
function renderCelebration(){
  const root = document.getElementById("celebrationRoot");
  if(!root) return;
  if(!celebration){ root.innerHTML = ""; return; }
  const { info, unrated } = celebration;
  root.innerHTML = `<div class="cel" role="dialog" aria-modal="true" aria-label="Nouveau record">
    <div class="cel-in">
      <record-man once old="${escHtml(info.oldText)}" new="${escHtml(info.newText)}" distance="${escHtml(info.distanceText)}" gain="${escHtml(info.gainText)}" aria-label="${escHtml(info.ariaLabel)}"></record-man>
      <div class="cel-btns">${unrated
        ? `<button type="button" class="btn-primary" onclick="celebrationRate()">Noter mon ressenti</button><button type="button" class="btn-secondary" onclick="closeCelebration()">Plus tard</button>`
        : `<button type="button" class="btn-primary" onclick="closeCelebration()">Fermer</button>`}</div>
    </div></div>`;
  const first = root.querySelector(".btn-primary"); if(first) first.focus();
}
window.closeCelebration = () => { celebration = null; renderCelebration(); };
document.addEventListener("keydown", (e) => { if(e.key==="Escape" && celebration) closeCelebration(); });
window.celebrationRate = () => { const id = celebration && celebration.runId; closeCelebration(); if(id) goRateSession(id); };
window.dismissHier = (runId, effFlag) => {
  try{
    if(runId){
      const ids = celebratedRunIds(); ids.push(runId); localStorage.setItem("mra_celebratedRuns", JSON.stringify(ids.slice(-60)));
      const list = dismissedPromptIds(); list.push(runId); localStorage.setItem("dismissedPainPrompts", JSON.stringify(list));
    }
    if(effFlag) localStorage.setItem("mra_effCelebratedAt", localDateStr(new Date()));
  }catch(e){}
  renderContent();
};
function todayScreenHTML(){
  const todayStr = localDateStr(new Date());
  const date = new Date(todayStr+"T00:00:00");
  const todaySessions = plannedSessions.filter(p=>p.planned_date===todayStr && (p.status==="planned"||p.status==="done"));
  const hasProgram = plannedSessions.some(p=>p.status==="planned"||p.status==="done");
  let body, framed = true;
  if(todaySessions.length){ body = todaySessions.map(s=>programSessionCardHTML(s,date)).join(""); framed = false; }
  else if(!hasProgram) body = `<div class="ec-row"><div class="ec-ic">${icon("calendarPlus",18)}</div><div class="ec-t">Tu n'as pas encore de programme.</div></div>
    <button class="btn-primary" style="margin-top:14px" onclick="goToProgramme()">Créer mon programme</button>`;
  else if(runningRuns.some(r=>localDateStr(dateFromRun(r))===todayStr)) body = `<div class="chart-hint" style="margin-top:0">Aucune séance n'était planifiée aujourd'hui, mais tu as couru : bravo !</div>`;
  else body = restDayMessageHTML();
  // Une seule carte d'action sous la séance du jour (D11) ; le bandeau coach laisse la place aux
  // rappels de niveau quand la carte « Ton niveau » est déjà affichée (D53).
  const cards = { merge_ask: mergeAskCardHTML(), attach: attachCardHTML(), hier: hierCardHTML(), objectif: objectiveChangedCardHTML(true), niveau: levelCardHTML() };
  const picked = pickTodayActionCard({ merge_ask:!!cards.merge_ask, attach:!!cards.attach, hier:!!cards.hier, objectif:!!cards.objectif, niveau:!!cards.niveau });
  const need = levelNeed();
  const last = runningRuns[runningRuns.length-1];
  const reminder = coachReminder({
    graduation: need==="graduation", guidedTestPending: need==="guided_test", levelCardShown: picked==="niveau",
    daysSinceRun: last ? Math.floor((new Date() - dateFromRun(last)) / 86400000) : null,
  });
  return coachBannerHTML(reminder) + urgentTodayHTML() + mergeNoticeCardHTML() + (framed ? `<div class="card">
    <div class="stitle" style="margin-bottom:8px">Aujourd'hui</div>
    ${body}
  </div>` : body) + (picked ? cards[picked] : "") + weekRecapCardHTML();
