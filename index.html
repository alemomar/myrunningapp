<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0f11;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px 14px 40px}
.hdr{text-align:center;margin-bottom:16px}
.hdr-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a8d96;margin-bottom:4px}
.hdr-title{font-size:22px;font-weight:600;letter-spacing:-.5px}
.hdr-title span{color:#1baf7a}
.hdr-loc{font-size:12px;color:#8a8d96;margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#16181c;border:1px solid #2a2d35;border-radius:12px;padding:12px 14px}
.kpi-val{font-size:20px;font-weight:600;line-height:1}
.kpi-lbl{font-size:10px;color:#8a8d96;text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
.tabs{display:flex;border-bottom:1px solid #2a2d35;margin-bottom:14px;overflow-x:auto}
.tab-btn{padding:9px 11px;font-size:12px;cursor:pointer;color:#8a8d96;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:inherit}
.tab-btn.active{color:#f0f0f0;border-bottom:2px solid #1baf7a}
.card{background:#16181c;border:1px solid #2a2d35;border-radius:12px;padding:16px;margin-bottom:12px}
.stitle{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a8d96;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1e2026}
.row:last-child{border-bottom:none}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px}
.filters{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.flt{padding:4px 11px;border-radius:20px;font-size:11px;cursor:pointer;background:transparent;color:#8a8d96;border:1px solid #2a2d35;font-family:inherit}
.flt.active{background:#1baf7a;color:#fff;border-color:#1baf7a;font-weight:600}
.zone-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:10px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#8a8d96}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.plan-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #1e2026}
.plan-item:last-child{border-bottom:none}
.plan-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.plan-text{font-size:13px;color:#c0c3ca;line-height:1.55}
.plan-text strong{color:#f0f0f0;font-weight:600}
.week-title{font-size:13px;font-weight:600;color:#f0f0f0;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #2a2d35}
.divider{height:1px;background:#2a2d35;margin:14px 0}
.alert{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.5}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-sub">2 Mar → 10 Aoû 2026</div>
  <div class="hdr-title">Running <span>Omar</span></div>
  <div class="hdr-loc">56 séances · Paris, Uccle &amp; Rabat</div>
</div>

<div class="kpi-grid" id="kpis"></div>
<div class="tabs" id="tabs"></div>
<div id="content"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="data/runs.js"></script>
<script>
const TC={EF:"#1baf7a",Long:"#2a78d6","Fractionné":"#eda100","Récup":"#888780",Course:"#e34948",Renfo:"#a855f7","Mobilité":"#06b6d4",Yoga:"#ec4899"};

const fmtA=s=>{if(!s)return"—";const m=Math.floor(s/60),sc=s%60;return m+"'"+String(sc).padStart(2,"0")+"''"};

const efRuns=RUNS.filter(r=>r.type==="EF");
const fracRuns=RUNS.filter(r=>r.type==="Fractionné");
const totalDist=RUNS.reduce((a,r)=>a+r.dist,0).toFixed(1);
const avgPaceEF=Math.round(efRuns.reduce((a,r)=>a+r.allure,0)/efRuns.length);
const longMax=Math.max(...RUNS.filter(r=>r.type==="Long").map(r=>r.dist));

// KM mois en cours (juillet 2026)
const now=new Date(2026,6,18);
const monthlyDist=RUNS.filter(r=>{const[d,m]=r.date.split("/").map(Number);return m===(now.getMonth()+1)&&r.dist>0;}).reduce((a,r)=>a+r.dist,0).toFixed(1);

// Allure EF 4 dernieres semaines
const fourWeeksAgo=new Date(now);fourWeeksAgo.setDate(now.getDate()-28);
const recentEF=efRuns.filter(r=>{const[d,m]=r.date.split("/").map(Number);return new Date(2026,m-1,d)>=fourWeeksAgo;});
const avgPaceRecent=recentEF.length>0?Math.round(recentEF.reduce((a,r)=>a+r.allure,0)/recentEF.length):null;

document.getElementById("kpis").innerHTML=[
  [monthlyDist+" km","Km ce mois (Jul)","#1baf7a"],
  ["43","Séances","#2a78d6"],
  [fmtA(avgPaceEF)+"/km","Allure moy EF (total)","#1baf7a"],
  [avgPaceRecent?fmtA(avgPaceRecent)+"/km":"—","Allure moy EF (4 sem)","#eda100"],
  [totalDist+" km","Distance totale","#2a78d6"],
  [longMax+" km","SL max","#888780"],
].map(([v,l,c])=>`<div class="kpi"><div class="kpi-val" style="color:${c};font-size:17px">${v}</div><div class="kpi-lbl">${l}</div></div>`).join("");

const TABS=["Général","Allure EF","Fractionné","Cardio","Volume","Dernière séance","Plan d'action"];
let activeTab=0,activeFilter="Tous",charts=[];

function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map((t,i)=>`<button class="tab-btn${i===activeTab?" active":""}" onclick="setTab(${i})">${t}</button>`).join("");
}
window.setTab=i=>{destroyCharts();activeTab=i;renderTabs();renderContent();};
window.setFilter=f=>{activeFilter=f;destroyCharts();renderContent();};

function weeklyVol(){
  const w={};
  RUNS.forEach(r=>{
    const[d,m]=r.date.split("/").map(Number);
    const dt=new Date(2026,m-1,d),mon=new Date(dt);
    mon.setDate(dt.getDate()-dt.getDay()+(dt.getDay()===0?-6:1));
    const k=mon.getDate()+"/"+(mon.getMonth()+1);
    if(!w[k])w[k]={label:k,dist:0};
    w[k].dist=+(w[k].dist+r.dist).toFixed(1);
  });
  return Object.values(w);
}

function mkChart(id,cfg){
  const isDark=true;
  const grid="rgba(255,255,255,0.06)",tick="#8a8d96",tbg="#16181c",tbr="rgba(255,255,255,0.1)",ttx="#f0f0f0";
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:tbg,borderColor:tbr,borderWidth:1,titleColor:ttx,bodyColor:ttx}}},cfg.options||{});
  const sc={x:{ticks:{color:tick,font:{size:10}},grid:{color:grid}},y:{ticks:{color:tick,font:{size:10}},grid:{color:grid}}};
  if(!cfg.options.scales)cfg.options.scales=sc;
  else{cfg.options.scales.x=Object.assign({},sc.x,cfg.options.scales.x);cfg.options.scales.y=Object.assign({},sc.y,cfg.options.scales.y);}
  const c=new Chart(document.getElementById(id),cfg);
  charts.push(c);return c;
}

function planItem(icon,color,title,text){
  return`<div class="plan-item"><div class="plan-icon" style="background:${color}">${icon}</div><div class="plan-text"><strong>${title}</strong><br>${text}</div></div>`;
}

function renderContent(){
  const el=document.getElementById("content");
  const filtered=activeFilter==="Tous"?RUNS:RUNS.filter(r=>r.type===activeFilter);
  const last=RUNS[RUNS.length-1];
  const prevEF=efRuns.slice(-2,-1)[0];

  if(activeTab===0){
    el.innerHTML=`<div class="card">
      <div class="stitle">Toutes les séances</div>
      <div class="filters">${["Tous","EF","Long","Fractionné","Récup","Course","Renfo","Mobilité","Yoga"].map(t=>`<button class="flt${activeFilter===t?" active":""}" onclick="setFilter('${t}')">${t}</button>`).join("")}</div>
      ${filtered.slice().reverse().map(r=>`<div class="row">
        <div>
          <span style="font-size:13px;font-weight:600">${r.label}</span>
          <span class="badge" style="background:${TC[r.type]}22;color:${TC[r.type]}">${r.type}</span>
          <div style="font-size:11px;color:#8a8d96;margin-top:3px">${r.lieu} · ${r.dist} km · ${r.dur}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:600;color:#1baf7a">${fmtA(r.allure)}/km</div>
          <div style="font-size:11px;color:#e34948">${r.fc} bpm</div>
        </div>
      </div>`).join("")}
    </div>`;
  }

  else if(activeTab===1){
    el.innerHTML=`
      <div class="card"><div class="stitle">Progression allure — EF</div>
        <div style="font-size:11px;color:#8a8d96;margin-bottom:8px">Axe inversé : bas = rapide</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="cEF"></canvas></div>
      </div>
      <div class="card"><div class="stitle">Efficacité cardio EF (FC ÷ allure×60)</div>
        <div style="font-size:11px;color:#8a8d96;margin-bottom:8px">↑ = même FC, allure plus rapide</div>
        <div style="position:relative;width:100%;height:170px"><canvas id="cEff"></canvas></div>
      </div>`;
    setTimeout(()=>{
      mkChart("cEF",{type:"line",data:{labels:efRuns.map(r=>r.label),datasets:[{label:"Allure",data:efRuns.map(r=>r.allure),borderColor:"#1baf7a",borderWidth:2,pointBackgroundColor:"#1baf7a",pointRadius:3,tension:0.2}]},options:{scales:{y:{reverse:true,ticks:{callback:v=>fmtA(v)}}},plugins:{tooltip:{callbacks:{label:ctx=>"Allure: "+fmtA(ctx.raw)}}}}});
      mkChart("cEff",{type:"line",data:{labels:efRuns.map(r=>r.label),datasets:[{label:"Efficacité",data:efRuns.map(r=>+(r.fc/(r.allure/60)).toFixed(2)),borderColor:"#eda100",borderWidth:2,pointBackgroundColor:"#eda100",pointRadius:3,tension:0.2}]},options:{plugins:{tooltip:{callbacks:{label:ctx=>"Efficacité: "+ctx.raw}}}}});
    },50);
  }

  else if(activeTab===2){
    el.innerHTML=`
      <div class="card"><div class="stitle">Allure work uniquement — fractionnés</div>
        <div style="font-size:11px;color:#8a8d96;margin-bottom:8px">Phases de récup exclues · axe inversé</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="cWork"></canvas></div>
        <div class="leg"><div class="leg-item"><div class="leg-dot" style="background:#eda100"></div>Allure work</div></div>
      </div>
      <div class="card"><div class="stitle">Détail séances fractionné</div>
        ${fracRuns.map(r=>`<div class="row">
          <div><span style="font-size:13px;font-weight:600">${r.label}</span>
          <div style="font-size:11px;color:#8a8d96;margin-top:2px">${r.dist} km · ${r.fc} bpm</div></div>
          <div style="text-align:right">
            <div style="font-size:13px;font-weight:600;color:#eda100">Work ${fmtA(r.work)}</div>
            <div style="font-size:11px;color:#8a8d96">Récup ${r.rec?fmtA(r.rec):"—"}</div>
          </div>
        </div>`).join("")}
      </div>`;
    setTimeout(()=>{
      mkChart("cWork",{type:"line",data:{labels:fracRuns.map(r=>r.label),datasets:[{label:"Work",data:fracRuns.map(r=>r.work),borderColor:"#eda100",borderWidth:2,pointBackgroundColor:"#eda100",pointRadius:4,tension:0.2}]},options:{scales:{y:{reverse:true,ticks:{callback:v=>fmtA(v)}}},plugins:{tooltip:{callbacks:{label:ctx=>"Work: "+fmtA(ctx.raw)}}}}});
    },50);
  }

  else if(activeTab===3){
    el.innerHTML=`
      <div class="card"><div class="stitle">FC moyenne — EF</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="cFC"></canvas></div>
      </div>
      <div class="card"><div class="stitle">Puissance moyenne (W) — EF</div>
        <div style="position:relative;width:100%;height:180px"><canvas id="cPW"></canvas></div>
      </div>`;
    setTimeout(()=>{
      mkChart("cFC",{type:"line",data:{labels:efRuns.map(r=>r.label),datasets:[{label:"FC",data:efRuns.map(r=>r.fc),borderColor:"#e34948",borderWidth:2,pointBackgroundColor:"#e34948",pointRadius:3,tension:0.2}]},options:{scales:{y:{min:128,max:158}},plugins:{annotation:{}}}});
      mkChart("cPW",{type:"line",data:{labels:efRuns.filter(r=>r.pw).map(r=>r.label),datasets:[{label:"Puissance (W)",data:efRuns.filter(r=>r.pw).map(r=>r.pw),borderColor:"#2a78d6",borderWidth:2,pointBackgroundColor:"#2a78d6",pointRadius:3,tension:0.2}]},options:{plugins:{tooltip:{callbacks:{label:ctx=>ctx.raw+"W"}}}}});
    },50);
  }

  else if(activeTab===4){
    const wv=weeklyVol();
    el.innerHTML=`
      <div class="card"><div class="stitle">Volume hebdomadaire (km)</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="cVol"></canvas></div>
      </div>
      <div class="card"><div class="stitle">Records personnels</div>
        ${[["Sortie longue max","12,0 km","10 Mai & 13 Jun"],["Meilleure allure EF","6'42''/km","29 Jun 2026 ✨"],["Meilleure allure work frac","4'26''/km","21 Avr 2026"],["FC EF la plus basse","133 bpm","19 Avr 2026"],["Course officielle","9,99 km · 5'55''/km","07 Jun 2026"]].map(([l,v,d])=>`<div class="row">
          <div style="font-size:13px;color:#c0c3ca">${l}</div>
          <div style="text-align:right"><div style="font-size:13px;font-weight:600;color:#1baf7a">${v}</div><div style="font-size:10px;color:#8a8d96">${d}</div></div>
        </div>`).join("")}
      </div>`;
    setTimeout(()=>{
      mkChart("cVol",{type:"bar",data:{labels:wv.map(r=>r.label),datasets:[{label:"km",data:wv.map(r=>r.dist),backgroundColor:"#1baf7a",borderRadius:4}]},options:{scales:{x:{ticks:{autoSkip:false,maxRotation:45}}},plugins:{tooltip:{callbacks:{label:ctx=>ctx.raw+" km"}}}}});
    },50);
  }

  else if(activeTab===5){
    const lastRun=RUNS.filter(r=>r.dist>0).slice(-1)[0];
    const prevEFrun=efRuns.slice(-2,-1)[0];
    const lastType=lastRun?lastRun.type:'—';
    const lastColor=TC[lastType]||'#1baf7a';
    el.innerHTML=`
      <div style="background:rgba(27,175,122,0.07);border:1px solid rgba(27,175,122,0.2);border-radius:12px;padding:14px;margin-bottom:12px;text-align:center">
        <div style="font-size:10px;color:#8a8d96;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Dernière séance</div>
        <div style="font-size:20px;font-weight:600">${lastRun?lastRun.label+' · ':''}<span style="color:${lastColor}">${lastType}</span></div>
        <div style="font-size:12px;color:#8a8d96;margin-top:4px">${lastRun?lastRun.lieu+' · '+lastRun.dur:''}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px">
        ${[[lastRun.dist+" km","Distance","#2a78d6"],[fmtA(last.allure)+"/km","Allure","#1baf7a"],[lastRun.fc+" bpm","FC moy","#e34948"],[lastRun.dur,"Durée","#eda100"],[lastRun.pw+"W","Puissance","#1baf7a"],[lastRun.cad+" spm","Cadence","#2a78d6"]].map(([v,l,c])=>`<div class="kpi"><div class="kpi-val" style="color:${c}">${v}</div><div class="kpi-lbl">${l}</div></div>`).join("")}
      </div>
      <div class="card"><div class="stitle">Contexte</div>
        ${[["Effort ressenti","Difficile (7/10)","#e34948"],["Jambes au départ","Correctes","#f0f0f0"],["Douleurs","Genoux + Hanches","#eda100"],["Conditions","28°C · fatigue semaine","#f0f0f0"]].map(([l,v,c])=>`<div class="row"><div style="font-size:13px;color:#8a8d96">${l}</div><div style="font-size:13px;font-weight:600;color:${c}">${v}</div></div>`).join("")}
      </div>
      <div class="card"><div class="stitle">Vs EF précédente (${prevEFrun.label})</div>
        ${[["Allure",fmtA(prevEFrun.allure)+"/km",fmtA(last.allure)+"/km",last.allure<prevEFrun.allure],["FC moy",prevEFrun.fc+" bpm",last.fc+" bpm",last.fc<prevEFrun.fc],["Distance",prevEFrun.dist+" km",last.dist+" km",last.dist>prevEFrun.dist],["Puissance",prevEFrun.pw+"W",last.pw+"W",last.pw>prevEFrun.pw]].map(([m,pv,lv,b])=>`<div class="row">
          <div style="font-size:13px;color:#8a8d96">${m}</div>
          <div style="display:flex;gap:12px;align-items:center">
            <div style="font-size:12px;color:#555">${pv}</div>
            <div style="font-size:11px;color:#444">→</div>
            <div style="font-size:13px;font-weight:600;color:${b?"#1baf7a":"#e34948"}">${lv} ${b?"↑":"↓"}</div>
          </div>
        </div>`).join("")}
      </div>
      <div class="card"><div class="stitle">Zones cardio · 5 Jul</div>
        <div class="zone-bar">
          <div style="width:8.6%;background:#2a78d6"></div>
          <div style="width:79.9%;background:#1baf7a"></div>
          <div style="width:10.8%;background:#eda100"></div>
        </div>
        ${[["#2a78d6","Z1 &lt;138 bpm","05:18","8.6%"],["#1baf7a","Z2 139–150 bpm","49:08","79.9%"],["#eda100","Z3 151–162 bpm","06:40","10.8%"]].map(([c,l,t,p])=>`<div class="row">
          <div style="display:flex;align-items:center;gap:8px"><div class="leg-dot" style="background:${c}"></div><span style="font-size:12px;color:#c0c3ca">${l}</span></div>
          <div style="text-align:right"><div style="font-size:12px;font-weight:600;color:${c}">${t}</div><div style="font-size:10px;color:#8a8d96">${p}</div></div>
        </div>`).join("")}
      </div>`;
  }

  else if(activeTab===6){

    const SVG = {
      hipthrust:`<svg viewBox="0 0 120 80" width="110" height="74">
        <!-- sol -->
        <line x1="10" y1="68" x2="110" y2="68" stroke="#2a2d35" stroke-width="2"/>
        <!-- mur/banc -->
        <rect x="8" y="38" width="14" height="30" rx="3" fill="#2a2d35"/>
        <!-- corps allongé dos sur banc -->
        <rect x="18" y="34" width="38" height="10" rx="4" fill="#1baf7a"/>
        <!-- bassin levé -->
        <rect x="52" y="28" width="22" height="10" rx="4" fill="#1baf7a" transform="rotate(-18,63,33)"/>
        <!-- jambe gauche -->
        <line x1="62" y1="36" x2="75" y2="56" stroke="#1baf7a" stroke-width="5" stroke-linecap="round"/>
        <line x1="75" y1="56" x2="85" y2="68" stroke="#1baf7a" stroke-width="5" stroke-linecap="round"/>
        <!-- jambe droite (plus courte car vue côté) -->
        <line x1="58" y1="37" x2="68" y2="55" stroke="#00a06e" stroke-width="4" stroke-linecap="round"/>
        <line x1="68" y1="55" x2="76" y2="68" stroke="#00a06e" stroke-width="4" stroke-linecap="round"/>
        <!-- tête -->
        <circle cx="20" cy="30" r="7" fill="#1baf7a"/>
        <!-- flèche haut -->
        <line x1="95" y1="55" x2="95" y2="30" stroke="#eda100" stroke-width="1.5" stroke-dasharray="3,2"/>
        <polygon points="95,24 91,32 99,32" fill="#eda100"/>
        <text x="97" y="46" font-size="8" fill="#eda100">↑</text>
      </svg>`,

      clamshell:`<svg viewBox="0 0 120 80" width="110" height="74">
        <!-- sol -->
        <line x1="10" y1="70" x2="110" y2="70" stroke="#2a2d35" stroke-width="2"/>
        <!-- corps allongé sur le côté -->
        <ellipse cx="55" cy="52" rx="38" ry="8" fill="#1baf7a" opacity="0.3"/>
        <rect x="18" y="47" width="74" height="10" rx="5" fill="#1baf7a"/>
        <!-- tête -->
        <circle cx="16" cy="44" r="7" fill="#1baf7a"/>
        <!-- jambe basse -->
        <path d="M56,54 Q72,62 88,68" stroke="#1baf7a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- jambe haute ouverte -->
        <path d="M56,50 Q68,36 84,38" stroke="#eda100" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- arc rotation -->
        <path d="M76,50 Q82,44 84,38" stroke="#eda100" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
        <polygon points="84,37 79,41 87,43" fill="#eda100"/>
        <!-- label G -->
        <text x="86" y="34" font-size="9" fill="#eda100" font-weight="bold">G</text>
      </svg>`,

      stepup:`<svg viewBox="0 0 120 90" width="110" height="83">
        <!-- marche -->
        <rect x="30" y="48" width="60" height="22" rx="3" fill="#2a2d35"/>
        <rect x="30" y="46" width="60" height="5" rx="2" fill="#3a3d45"/>
        <!-- sol -->
        <line x1="10" y1="70" x2="30" y2="70" stroke="#2a2d35" stroke-width="2"/>
        <line x1="90" y1="70" x2="110" y2="70" stroke="#2a2d35" stroke-width="2"/>
        <!-- jambe sur marche (gauche) -->
        <line x1="60" y1="46" x2="60" y2="30" stroke="#1baf7a" stroke-width="6" stroke-linecap="round"/>
        <!-- corps droit -->
        <rect x="54" y="18" width="12" height="16" rx="5" fill="#1baf7a"/>
        <!-- tête -->
        <circle cx="60" cy="13" r="7" fill="#1baf7a"/>
        <!-- bras -->
